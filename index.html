  "he": "למודל אין זיכרון בין הודעות מעבר למה שמונח לפניו. שיחה ארוכה נקראת מחדש מההתחלה בכל תור, וכשהיא כבר לא נכנסת, החלקים הישנים ביותר נושרים בשקט.\n\nזה מסביר את רוב ההתנהגויות המסתוריות. חוק שקבעת לפני עשרים הודעות מפסיק להישמר לא כי המודל שינה את דעתו, אלא כי החוק הזה כבר לא בחדר. חזרה על האילוצים החשובים, או התחלה מחדש עם סיכום הדוק, מתקנת יותר מכל ניסוח מחדש."
 },
 "Specificity beats politeness": {
  "en": "A model fills every gap you leave with the most statistically ordinary choice. Vagueness does not produce a question back — it produces a confident guess.\n\nSo the useful prompt reads like a ticket: what is broken, where, what you already tried, what must not change, and how you will know it worked. Almost all of the improvement people attribute to prompt tricks is really just this.",
  "he": "מודל ממלא כל חור שאתה משאיר בבחירה הסטטיסטית הרגילה ביותר. עמימות לא מייצרת שאלה חוזרת — היא מייצרת ניחוש בטוח בעצמו.\n\nאז הפרומפט המועיל נקרא כמו כרטיס עבודה: מה שבור, איפה, מה כבר ניסית, מה אסור שישתנה, ואיך תדע שזה עבד. כמעט כל השיפור שאנשים מייחסים לטריקים של פרומפטים הוא באמת רק זה."
 },
 "State the shape of the answer": {
  "en": "Specifying the output format is the cheapest control you have. It reduces the surface you must read, makes two answers comparable, and quietly forces the model to commit rather than hedge.\n\nAsking for exactly three options is a real constraint. It prevents both the single overconfident answer and the exhausting list of twelve.",
  "he": "הגדרת פורמט הפלט היא השליטה הזולה ביותר שיש לך. היא מקטינה את המשטח שאתה צריך לקרוא, הופכת שתי תשובות להשוואות, ובשקט מכריחה את המודל להתחייב במקום לגדר.\n\nבקשה לשלוש אפשרויות בדיוק היא אילוץ אמיתי. היא מונעת גם את התשובה הבודדת הבטוחה מדי וגם את הרשימה המתישה של שתים-עשרה."
 },
 "Constrain the blast radius": {
  "en": "An agent with file access will do what it believes is helpful, and helpful is a much broader category than correct. Unbounded, it will tidy, rename, upgrade and reorganise.\n\nTwo habits make this safe and cost nothing: work on a branch, and state the files in scope. Then the worst outcome is a change you throw away, not a change you have to find.",
  "he": "סוכן עם גישה לקבצים יעשה את מה שהוא מאמין שמועיל, ומועיל היא קטגוריה הרבה יותר רחבה מנכון. בלי גבולות, הוא יסדר, ישנה שמות, ישדרג ויארגן מחדש.\n\nשני הרגלים הופכים את זה לבטוח ולא עולים כלום: לעבוד על ענף, ולציין את הקבצים בתחום. אז התוצאה הגרועה ביותר היא שינוי שאתה זורק, לא שינוי שאתה צריך לחפש."
 },
 "Ask for the trade-off first": {
  "en": "The most valuable thing a model can give you is not code, it is a map of the decision — what the options are, what each costs, and which one fails badly.\n\nThis also protects you from the failure mode unique to fluent assistants: a plausible implementation of the wrong idea. Code is easy to produce and expensive to unpick, so put the judgement step before it, not after.",
  "he": "הדבר הכי בעל ערך שמודל יכול לתת לך הוא לא קוד, אלא מפה של ההחלטה — מה האפשרויות, מה כל אחת עולה, ואיזו נכשלת קשה.\n\nזה גם מגן עליך ממצב הכשל הייחודי לעוזרים רהוטים: מימוש סביר של הרעיון הלא נכון. קוד קל לייצר ויקר לפרום, אז שים את שלב השיפוט לפניו, לא אחריו."
 },
 "Hallucination": {
  "en": "A model predicts plausible text. Plausible and true overlap most of the time, which is exactly what makes the gap dangerous — the wrong answer arrives in the same tone as the right one.\n\nThe risk is highest wherever the truth is arbitrary rather than derivable: exact flag names, version numbers, pricing, quotas, API field names. Reasoning it can do; remembering a specific string it cannot be trusted on. Check those in the real documentation, every time.",
  "he": "מודל מנבא טקסט סביר. סביר ונכון חופפים רוב הזמן, וזה בדיוק מה שהופך את הפער למסוכן — התשובה השגויה מגיעה באותו טון כמו הנכונה.\n\nהסיכון גבוה ביותר בכל מקום שבו האמת שרירותית ולא נגזרת: שמות דגלים מדויקים, מספרי גרסאות, תמחור, מכסות, שמות שדות ב-API. להסיק הוא יכול; לזכור מחרוזת ספציפית אי אפשר לסמוך עליו. תבדוק את אלה בתיעוד האמיתי, בכל פעם."
 },
 "Make it verify itself": {
  "en": "Shift the burden of proof onto something executable. A failing test written before the fix turns a claim into an experiment with a visible result.\n\nIt also improves the fix. Writing the test forces the problem to be stated precisely, and a precisely stated problem is most of the way to being solved — by a person or a model.",
  "he": "העבר את נטל ההוכחה למשהו שאפשר להריץ. בדיקה שנכשלת ונכתבה לפני התיקון הופכת טענה לניסוי עם תוצאה נראית.\n\nזה גם משפר את התיקון. כתיבת הבדיקה מכריחה לנסח את הבעיה בדיוק, ובעיה מנוסחת בדיוק היא רוב הדרך לפתרון — על ידי אדם או מודל."
 },
 "Small steps over one big ask": {
  "en": "Review capacity, not generation capacity, is the real limit. A model can produce more correct-looking code per minute than any person can meaningfully check.\n\nSo the batch size should be set by what you can actually read, not by what it can produce. Working in small reviewed steps also keeps the context focused, which makes each answer better than the last.",
  "he": "יכולת הסקירה, לא יכולת הייצור, היא המגבלה האמיתית. מודל יכול לייצר יותר קוד שנראה נכון בדקה ממה שאדם יכול לבדוק באופן משמעותי.\n\nאז גודל המנה צריך להיקבע לפי מה שאתה באמת יכול לקרוא, לא לפי מה שהוא יכול לייצר. עבודה בצעדים קטנים שנסקרים גם שומרת את ההקשר ממוקד, מה שהופך כל תשובה לטובה מקודמתה."
 },
 "Read the diff": {
  "en": "A summary is written by the same system that made the change, and it describes intent rather than result. The diff is the result.\n\nThree things to look for every time: something deleted that you did not ask to delete, a new dependency, and a changed default. Those three account for most of the damage that gets through.",
  "he": "סיכום נכתב על ידי אותה מערכת שעשתה את השינוי, והוא מתאר כוונה ולא תוצאה. ה-diff הוא התוצאה.\n\nשלושה דברים לחפש בכל פעם: משהו שנמחק שלא ביקשת למחוק, תלות חדשה, וברירת מחדל שהשתנתה. שלושת אלה אחראים לרוב הנזק שעובר."
 },
 "Prompt injection": {
  "en": "When a model can read the outside world — a page, a repository, a ticket, an email — anything it reads may contain text written to steer it. The model has no reliable way to tell a document apart from an instruction, because both are just text.\n\nTreat it exactly like the injection problem in the Auth module. Content that arrives from outside is data, and the defences are the same in spirit: least privilege, a human confirmation before anything irreversible, and never letting fetched content authorise an action.",
  "he": "כשמודל יכול לקרוא את העולם החיצוני — דף, ריפוזיטורי, תקלה, מייל — כל מה שהוא קורא עלול להכיל טקסט שנכתב כדי לכוון אותו. למודל אין דרך אמינה להבחין בין מסמך להוראה, כי שניהם פשוט טקסט.\n\nתתייחס לזה בדיוק כמו לבעיית ההזרקה במודול ההזדהות. תוכן שמגיע מבחוץ הוא נתונים, וההגנות זהות ברוחן: הרשאות מינימליות, אישור אנושי לפני כל דבר בלתי הפיך, ואף פעם לא לתת לתוכן שנשלף להרשות פעולה."
 },
 "REST vs GraphQL": {
  "en": "REST models the world as resources with addresses: /users/7, /users/7/orders. Each address returns a shape the server decided. It is simple, cacheable by URL, and every tool on earth understands it. The cost is that the client takes what it is given — sometimes too much, sometimes too little, requiring several round trips.\n\nGraphQL flips the control: a single endpoint, and the client sends a query naming exactly the fields it needs, across relationships, in one round trip. That is a real win for a mobile app talking to a sprawling backend with many teams. It is overhead for a small app: you now own a schema, resolvers, a caching story that no longer works by URL, and a new class of performance problems where one innocent query fans out into a thousand database calls.",
  "he": "REST ממדל את העולם כמשאבים עם כתובות: /users/7, /users/7/orders. כל כתובת מחזירה צורה שהשרת החליט עליה. זה פשוט, ניתן לשמירה במטמון לפי כתובת, וכל כלי בעולם מבין אותו. המחיר הוא שהלקוח לוקח מה שנותנים לו — לפעמים יותר מדי, לפעמים פחות מדי, ואז נדרשים כמה סבבים.\n\nGraphQL הופך את השליטה: נקודת קצה אחת, והלקוח שולח שאילתה שמציינת בדיוק את השדות שהוא צריך, לרוחב קשרים, בסבב אחד. זה ניצחון אמיתי לאפליקציית מובייל שמדברת עם backend ענק עם הרבה צוותים. זה עומס מיותר לאפליקציה קטנה: עכשיו יש לך סכמה, resolvers, סיפור מטמון שכבר לא עובד לפי כתובת, ומחלקה חדשה של בעיות ביצועים שבהן שאילתה חפה מפשע מתפצלת לאלף קריאות למסד הנתונים."
 },
 "API spec (OpenAPI)": {
  "en": "An API without a spec lives only in the heads of the people who built it and in whatever the docs page happened to say last year. A spec — OpenAPI is the standard for REST — makes the contract explicit and machine-checkable: every path, every parameter, every response shape, every error code.\n\nOnce it exists, an ecosystem opens up. Documentation renders itself. Client libraries are generated in any language. Requests can be validated against the spec at the door, so a malformed payload never reaches your handler. And for you specifically: an AI given the spec writes correct calls the first time, because it is reading the contract instead of pattern-matching from a blog post about an older version.",
  "he": "API בלי מפרט חי רק בראש של האנשים שבנו אותו ובמה שדף התיעוד במקרה אמר בשנה שעברה. מפרט — OpenAPI הוא התקן ל-REST — הופך את החוזה למפורש ולכזה שמכונה יכולה לבדוק: כל נתיב, כל פרמטר, כל צורת תשובה, כל קוד שגיאה.\n\nברגע שהוא קיים, נפתחת אקוסיסטם. תיעוד מרנדר את עצמו. ספריות לקוח נוצרות בכל שפה. אפשר לאמת בקשות מול המפרט בכניסה, כך שגוף פגום אף פעם לא מגיע למטפל שלך. ובשבילך במיוחד: AI שקיבל את המפרט כותב קריאות נכונות בפעם הראשונה, כי הוא קורא את החוזה במקום להשלים תבניות מפוסט בבלוג על גרסה ישנה."
 },
 "API key vs OAuth app": {
  "en": "An API key is a password for your application. You get it from the provider's dashboard, store it as a secret on your server, and send it with each call. It says \"this is Lior's app\" and the provider bills and rate-limits Lior's app accordingly. It never involves your end users.\n\nOAuth is for acting on behalf of a user at another service. You register an OAuth app and get a client id and secret; when a user clicks \"Connect Google\", they are sent to Google, approve a list of permissions, and Google hands your server a token that works only for that user and only for those permissions. You store that token per user, refresh it when it expires, and can lose it the moment the user revokes access. Same word \"key\", completely different lifecycle.",
  "he": "מפתח API הוא סיסמה לאפליקציה שלך. אתה מקבל אותו מלוח הבקרה של הספק, שומר אותו כסוד בשרת, ושולח אותו עם כל קריאה. הוא אומר ״זו האפליקציה של ליאור״, והספק מחייב ומגביל את האפליקציה של ליאור בהתאם. משתמשי הקצה שלך לא מעורבים בכלל.\n\nOAuth נועד לפעולה בשם משתמש בשירות אחר. אתה רושם אפליקציית OAuth ומקבל client id ו-secret; כשמשתמש לוחץ ״חבר את גוגל״, הוא נשלח לגוגל, מאשר רשימת הרשאות, וגוגל מוסרת לשרת שלך טוקן שעובד רק עבור אותו משתמש ורק עבור אותן הרשאות. אתה שומר את הטוקן הזה לכל משתמש, מרענן אותו כשהוא פג, ויכול לאבד אותו ברגע שהמשתמש מבטל את הגישה. אותה מילה ״מפתח״, מחזור חיים שונה לחלוטין."
 },
 "Pagination": {
  "en": "Lists grow. A response that once carried 40 rows will one day be asked to carry 4 million, and at that point it allocates gigabytes, times out, and takes the database with it. Pagination is the discipline of never returning an unbounded list: the client asks for a page, gets that page plus a way to ask for the next.\n\nThere are two common styles. Offset pagination — ?page=3&size=50 — is easy to understand and lets you jump to page 9, but gets slow deep into the list and duplicates or skips rows when data changes underneath. Cursor pagination hands back an opaque token pointing at the last row you saw; it is stable and fast at any depth, but you can only go forward. Most infinite-scroll feeds are cursors; most admin tables are offsets. Either way: the server decides the maximum page size, not the client.",
  "he": "רשימות גדלות. תשובה שפעם נשאה 40 שורות תתבקש יום אחד לשאת 4 מיליון, ובנקודה הזאת היא מקצה ג׳יגה-בייטים, נתקעת בטיים-אאוט ולוקחת איתה את מסד הנתונים. עימוד הוא המשמעת של לעולם לא להחזיר רשימה בלתי מוגבלת: הלקוח מבקש עמוד, מקבל את העמוד ודרך לבקש את הבא.\n\nיש שני סגנונות נפוצים. עימוד לפי היסט — ?page=3&size=50 — קל להבנה ומאפשר לקפוץ לעמוד 9, אבל מאט עמוק ברשימה ומכפיל או מדלג על שורות כשהנתונים משתנים מתחת. עימוד לפי סמן (cursor) מחזיר טוקן אטום שמצביע על השורה האחרונה שראית; הוא יציב ומהיר בכל עומק, אבל אפשר ללכת רק קדימה. רוב הפידים של גלילה אינסופית הם סמנים; רוב טבלאות האדמין הן היסטים. בכל מקרה: השרת מחליט על גודל העמוד המקסימלי, לא הלקוח."
 },
 "API versioning": {
  "en": "The day a second program depends on your API, you lose the freedom to change it casually. Rename created_at to createdAt and every existing client breaks at once, silently, in production. So the rule becomes: adding is safe, changing or removing is not.\n\nWhen you truly must change a shape, you version. The old contract keeps living at /v1 while /v2 carries the new one, and you announce a date after which v1 stops. Alternatives put the version in a header or let clients pin a date, but the idea is identical: a client that worked yesterday works today. This also applies inside your own product — your mobile app from last month is still installed on someone's phone, and it is a client of your v1.",
  "he": "ביום שתוכנית שנייה נשענת על ה-API שלך, אתה מאבד את החופש לשנות אותו כלאחר יד. תשנה את created_at ל-createdAt וכל לקוח קיים נשבר בבת אחת, בשקט, בפרודקשן. אז הכלל נהיה: להוסיף זה בטוח, לשנות או להסיר זה לא.\n\nכשאתה באמת חייב לשנות צורה, אתה מגרסן. החוזה הישן ממשיך לחיות ב-/v1 בזמן ש-/v2 נושא את החדש, ואתה מכריז על תאריך שאחריו v1 נעצר. חלופות שמות את הגרסה בכותרת או מאפשרות ללקוחות לנעוץ תאריך, אבל הרעיון זהה: לקוח שעבד אתמול עובד היום. זה חל גם בתוך המוצר שלך — אפליקציית המובייל מהחודש שעבר עדיין מותקנת אצל מישהו בטלפון, והיא לקוחה של ה-v1 שלך."
 },
 "Timeouts & retries": {
  "en": "Every call to something outside your process can fail in a way that is worse than an error: it can simply never answer. Without a timeout, the waiting thread, connection and memory are held forever, and under load your whole service quietly stalls while looking healthy. Every outbound call gets a deadline, and the deadline is shorter than your own caller's patience.\n\nRetrying is the natural response to a transient failure, and it is dangerous done naively. Retrying instantly, in a tight loop, against a service that is struggling is how you turn a hiccup into an outage — a thousand clients all retrying at once. So: retry only a small number of times, wait longer between each try (exponential backoff), add randomness so clients do not synchronise (jitter), and only retry operations that are safe to repeat. A GET, yes. A POST that charges a card, only if it carries an idempotency key.",
  "he": "כל קריאה למשהו מחוץ לתהליך שלך יכולה להיכשל בדרך שגרועה משגיאה: היא יכולה פשוט לא לענות לעולם. בלי טיים-אאוט, התהליכון המחכה, החיבור והזיכרון מוחזקים לנצח, ותחת עומס כל השירות שלך נתקע בשקט בזמן שהוא נראה בריא. כל קריאה יוצאת מקבלת מועד סיום, והמועד קצר מהסבלנות של מי שקרא לך.\n\nניסיון חוזר הוא התגובה הטבעית לכשל חולף, והוא מסוכן כשעושים אותו בנאיביות. לנסות שוב מיידית, בלולאה צפופה, מול שירות שמתאמץ — כך הופכים שיהוק להשבתה: אלף לקוחות שכולם מנסים שוב בבת אחת. אז: לנסות שוב מספר קטן של פעמים, לחכות יותר בין כל ניסיון (backoff מעריכי), להוסיף אקראיות כדי שלקוחות לא יסתנכרנו (jitter), ולנסות שוב רק פעולות שבטוח לחזור עליהן. GET — כן. POST שמחייב כרטיס — רק אם הוא נושא מפתח אידמפוטנטיות."
 },
 "SDK vs raw HTTP": {
  "en": "A good SDK is the provider's accumulated knowledge about their own API, packaged: it knows which errors are retryable, how pagination works, how to refresh a token, which headers to send, how to verify a webhook signature. Reimplementing that by hand from the docs means rediscovering each of those lessons at 2am.\n\nRaw HTTP still earns its place. It is how you understand what the SDK actually does, how you debug when the SDK's error message is unhelpful, and the only option when no SDK exists for your language. A healthy habit: read the SDK's source for the one call you depend on most, so you know what is really on the wire. And pin the SDK version — providers ship breaking changes too.",
  "he": "SDK טוב הוא הידע המצטבר של הספק על ה-API של עצמו, ארוז: הוא יודע אילו שגיאות אפשר לנסות שוב, איך העימוד עובד, איך לרענן טוקן, אילו כותרות לשלוח, איך לאמת חתימת webhook. ליישם את זה ידנית מהתיעוד אומר לגלות מחדש כל אחד מהשיעורים האלה בשתיים בלילה.\n\nל-HTTP גולמי עדיין יש מקום. כך אתה מבין מה ה-SDK באמת עושה, כך אתה מדבג כשהודעת השגיאה של ה-SDK לא מועילה, וזו האפשרות היחידה כשאין SDK לשפה שלך. הרגל בריא: תקרא את המקור של ה-SDK עבור הקריאה האחת שאתה נשען עליה יותר מכל, כדי שתדע מה באמת עובר על הקו. ותנעוץ את גרסת ה-SDK — גם ספקים משחררים שינויים שוברים."
 },
 "Sandbox vs live keys": {
  "en": "Payment, email, SMS and identity providers all offer a parallel universe: a test mode where cards are fake, messages go nowhere, and the keys are clearly marked as such. Everything you build should run against that universe until the day you deliberately flip to live.\n\nThe danger is that the two look identical in code. The only difference is a string in an environment variable. So the discipline is structural: live keys never exist on a developer laptop, never appear in a repository, never sit in the same .env as test keys with one commented out. They live in the production secrets store and nowhere else. Many providers also let you restrict a live key — by IP, by permission, by spend limit. Use every restriction they offer.",
  "he": "ספקי תשלומים, מייל, SMS וזהות מציעים כולם יקום מקביל: מצב בדיקה שבו הכרטיסים מזויפים, ההודעות לא הולכות לשום מקום, והמפתחות מסומנים ככאלה בבירור. כל מה שאתה בונה צריך לרוץ מול היקום הזה עד היום שבו אתה מעביר במכוון ל-live.\n\nהסכנה היא שהשניים נראים זהים בקוד. ההבדל היחיד הוא מחרוזת במשתנה סביבה. אז המשמעת היא מבנית: מפתחות חיים לא קיימים לעולם על לפטופ של מפתח, לא מופיעים לעולם במאגר, לא יושבים באותו .env עם מפתחות בדיקה כשאחד מהם בהערה. הם חיים במחסן הסודות של פרודקשן ובשום מקום אחר. ספקים רבים גם מאפשרים להגביל מפתח חי — לפי IP, לפי הרשאה, לפי תקרת הוצאה. תשתמש בכל הגבלה שהם מציעים."
 },
 "Polling vs push": {
  "en": "When you need to know that something happened elsewhere — a payment cleared, a file finished processing, a message arrived — you either keep asking or you arrange to be told. Polling is asking on a timer. It is trivially simple, works from behind any firewall, and has one built-in delay: on average half your polling interval. It also costs a request every tick, forever, whether anything changed or not.\n\nPush comes in two flavours. Webhooks: the other side calls a URL of yours when the event happens, which requires that URL to be public, always up, and able to verify the caller. Persistent connections — WebSockets or server-sent events — keep a line open so the server can speak whenever it likes, at the cost of holding that connection. The honest default for a small product is polling with a sane interval; you graduate to push when the numbers or the latency demand it.",
  "he": "כשאתה צריך לדעת שמשהו קרה במקום אחר — תשלום אושר, קובץ סיים עיבוד, הודעה הגיעה — אתה או ממשיך לשאול או מסדר שיודיעו לך. פולינג הוא לשאול לפי טיימר. הוא פשוט להחריד, עובד מאחורי כל חומת אש, ויש לו עיכוב מובנה אחד: בממוצע חצי ממרווח הפולינג. הוא גם עולה בקשה בכל טיק, לנצח, בין אם משהו השתנה ובין אם לא.\n\nדחיפה באה בשני טעמים. Webhooks: הצד השני קורא לכתובת שלך כשהאירוע קורה, מה שדורש שהכתובת תהיה ציבורית, תמיד למעלה, ומסוגלת לאמת את הקורא. חיבורים קבועים — WebSockets או server-sent events — מחזיקים קו פתוח כדי שהשרת יוכל לדבר מתי שירצה, במחיר של החזקת החיבור. ברירת המחדל הישרה למוצר קטן היא פולינג במרווח הגיוני; אתה מתקדם לדחיפה כשהמספרים או ההשהיה דורשים."
 },
 "DOM": {
  "en": "The HTML your server sends is text. The browser parses that text into a tree of objects — the Document Object Model — and it is this tree, not the text, that gets laid out, painted and clicked. Every JavaScript UI change is a mutation of this tree: add a node, change an attribute, swap a class.\n\nThis explains a family of confusions. \"View source\" shows the original text and can be wildly different from what is on screen after scripts ran. Search engines and AI scrapers may see the text version, not the tree, which is why SPAs worry about rendering on the server. And performance: touching the DOM is comparatively expensive, so frameworks batch their changes and compute the minimal set of mutations. When the screen shows something wrong, the Elements panel showing the live tree is the ground truth.",
  "he": "ה-HTML שהשרת שולח הוא טקסט. הדפדפן מפרסר את הטקסט לעץ של אובייקטים — ה-Document Object Model — והעץ הזה, לא הטקסט, הוא מה שמסודר, מצויר ונלחץ. כל שינוי ממשק ב-JavaScript הוא מוטציה של העץ: להוסיף צומת, לשנות תכונה, להחליף class.\n\nזה מסביר משפחה של בלבולים. ״הצג מקור״ מראה את הטקסט המקורי ויכול להיות שונה בטירוף ממה שעל המסך אחרי שהסקריפטים רצו. מנועי חיפוש וסורקי AI עלולים לראות את גרסת הטקסט, לא את העץ, ולכן SPAs דואגים לרינדור בשרת. וביצועים: לגעת ב-DOM יקר יחסית, ולכן פריימוורקים מקבצים את השינויים שלהם ומחשבים את קבוצת המוטציות המינימלית. כשהמסך מראה משהו שגוי, פאנל Elements שמראה את העץ החי הוא האמת בשטח."
 },
 "CSS & responsive layout": {
  "en": "CSS is a set of rules that match elements and set their appearance, and \"cascading\" means several rules can apply to one element with a defined order of who wins. Modern layout rests on two tools: flexbox for arranging things in one direction, grid for two. Almost every layout you will want is one of those two plus spacing.\n\nResponsive design is the acceptance that you do not control the screen. Instead of fixed pixel widths, you use fluid units, let content wrap, and add media queries — \"below 700px, stack the columns\" — at the points where the layout breaks. Two habits pay off: design for the narrow screen first and widen from there, and test by dragging your browser window narrow every time you touch layout. A page that works at 360px wide rarely has problems at 1440.",
  "he": "CSS הוא אוסף חוקים שמתאימים לאלמנטים וקובעים את המראה שלהם, ו״מדורג״ (cascading) אומר שכמה חוקים יכולים לחול על אלמנט אחד עם סדר מוגדר של מי מנצח. פריסה מודרנית נשענת על שני כלים: flexbox לסידור דברים בכיוון אחד, grid לשניים. כמעט כל פריסה שתרצה היא אחד משני אלה ועוד ריווח.\n\nעיצוב רספונסיבי הוא ההשלמה עם זה שאתה לא שולט במסך. במקום רוחבים קבועים בפיקסלים, אתה משתמש ביחידות זורמות, מאפשר לתוכן לעטוף, ומוסיף media queries — ״מתחת ל-700px, תערום את העמודות״ — בנקודות שבהן הפריסה נשברת. שני הרגלים משתלמים: לעצב למסך הצר קודם ולהרחיב משם, ולבדוק על ידי הצרת חלון הדפדפן בכל פעם שאתה נוגע בפריסה. דף שעובד ברוחב 360px לעתים רחוקות יש לו בעיות ב-1440."
 },
 "The main thread": {
  "en": "A browser tab is, for the purpose of your code, single-threaded. One loop picks up the next task — a click, a timer, a network response, a chunk of your script — runs it to completion, then paints the screen if anything changed, then picks up the next. While your task runs, nothing else does: no clicks register, no animation advances, no text renders.\n\nThis is why a two-second computation feels like a crash, and why the golden number is about 16 milliseconds — the budget per frame at 60 frames per second. Anything heavier must be broken up: split into chunks with awaits between them, deferred to when the browser is idle, or moved entirely to a Web Worker, a separate thread that cannot touch the DOM but can compute all it likes. Network calls are already off the main thread; it is the work you do with the result that blocks.",
  "he": "לשונית דפדפן היא, מבחינת הקוד שלך, חד-תהליכונית. לולאה אחת לוקחת את המשימה הבאה — לחיצה, טיימר, תשובה מהרשת, קטע מהסקריפט שלך — מריצה אותה עד הסוף, ואז מציירת את המסך אם משהו השתנה, ואז לוקחת את הבאה. בזמן שהמשימה שלך רצה, שום דבר אחר לא: לחיצות לא נרשמות, אנימציה לא מתקדמת, טקסט לא מתרנדר.\n\nלכן חישוב של שתי שניות מרגיש כמו קריסה, ולכן המספר הזהוב הוא בערך 16 מילישניות — התקציב לפריים ב-60 פריימים בשנייה. כל דבר כבד יותר חייב להתפרק: לפצל לחתיכות עם await ביניהן, לדחות לזמן שהדפדפן פנוי, או להעביר לגמרי ל-Web Worker — תהליכון נפרד שלא יכול לגעת ב-DOM אבל יכול לחשב כמה שירצה. קריאות רשת כבר מחוץ לתהליכון הראשי; מה שחוסם הוא העבודה שאתה עושה עם התוצאה."
 },
 "Component": {
  "en": "A component bundles a piece of the interface with everything it needs to work: its markup, its styling, its behaviour and the data it expects to receive. A Button, a UserAvatar, a CheckoutForm. You build screens by composing components, the same way you build programs by composing functions.\n\nThe value is the same as with functions: a boundary. Inside the boundary the component can be as complicated as it needs; outside, callers see only its inputs (props) and the events it emits. Change the internals and nothing else breaks. This is also what makes design systems possible — one Button used in 200 places means one fix changes 200 places. The smell to watch for is a component that does everything: 900 lines, 30 pieces of state. Ask the AI to extract the parts that could stand alone.",
  "he": "קומפוננטה אורזת חתיכת ממשק עם כל מה שהיא צריכה כדי לעבוד: המבנה שלה, העיצוב שלה, ההתנהגות שלה והנתונים שהיא מצפה לקבל. Button, UserAvatar, CheckoutForm. אתה בונה מסכים על ידי הרכבת קומפוננטות, כמו שאתה בונה תוכניות על ידי הרכבת פונקציות.\n\nהערך זהה לזה של פונקציות: גבול. בתוך הגבול הקומפוננטה יכולה להיות מסובכת ככל שצריך; מבחוץ, הקוראים רואים רק את הקלטים שלה (props) ואת האירועים שהיא פולטת. תשנה את הפנים ושום דבר אחר לא נשבר. זה גם מה שמאפשר מערכות עיצוב — Button אחד שבשימוש ב-200 מקומות אומר שתיקון אחד משנה 200 מקומות. הריח שצריך לשים לב אליו הוא קומפוננטה שעושה הכל: 900 שורות, 30 חתיכות מצב. תבקש מה-AI לחלץ את החלקים שיכולים לעמוד לבד."
 },
 "Framework (React, Vue, Svelte)": {
  "en": "Without a framework, keeping the screen in sync with your data is manual labour: the cart changed, so find the cart badge and update its number, and the total, and the checkout button's disabled state, and the empty-cart message. Miss one and the screen lies. A UI framework replaces this with a contract: you write a function from data to markup, and the framework re-runs it and patches the DOM whenever the data changes.\n\nReact, Vue and Svelte all offer this contract with different ergonomics and different amounts of runtime; the differences matter far less than the AI's confident opinions suggest. What matters is whether you need the contract at all. A marketing page, a blog, a form that posts and redirects — plain HTML and a little script are lighter, faster and easier to debug. The moment several parts of the screen must reflect the same changing data, the framework starts paying for itself.",
  "he": "בלי פריימוורק, לשמור על המסך מסונכרן עם הנתונים שלך זו עבודה ידנית: העגלה השתנתה, אז תמצא את תג העגלה ותעדכן את המספר שלו, ואת הסכום, ואת מצב ה-disabled של כפתור התשלום, ואת הודעת ״העגלה ריקה״. תפספס אחד והמסך משקר. פריימוורק ממשק מחליף את זה בחוזה: אתה כותב פונקציה מנתונים למבנה, והפריימוורק מריץ אותה מחדש ומתקן את ה-DOM בכל פעם שהנתונים משתנים.\n\nReact, Vue ו-Svelte מציעים כולם את החוזה הזה עם ארגונומיה שונה וכמויות שונות של runtime; ההבדלים חשובים הרבה פחות ממה שהדעות הבטוחות של ה-AI מרמזות. מה שחשוב הוא אם אתה צריך את החוזה בכלל. דף שיווקי, בלוג, טופס ששולח ומפנה — HTML פשוט וקצת סקריפט קלים יותר, מהירים יותר וקלים יותר לדיבוג. ברגע שכמה חלקים במסך צריכים לשקף את אותם נתונים משתנים, הפריימוורק מתחיל להחזיר את ההשקעה."
 },
 "Client state": {
  "en": "Some data lives on the server and is the truth. Some lives only in the browser: which tab is selected, what the user typed but has not submitted, whether the menu is open, what is in the cart before checkout. This is client state, and it is where a surprising share of frontend bugs live, because it is easy to have two copies of it that disagree.\n\nThe rule that fixes most of them: every piece of state has one owner. If two components need it, lift it to their nearest common parent and pass it down. Frameworks add tools for the cases where passing down gets tedious — context, stores — but the principle holds. Separate too the three kinds: server data you cache locally (an order list), UI state (a dropdown is open), and URL state (which page, which filter). Putting filters in the URL is a small habit with large payoff: the back button works and the link can be shared.",
  "he": "חלק מהנתונים חיים בשרת והם האמת. חלק חיים רק בדפדפן: איזו לשונית נבחרה, מה המשתמש הקליד ועוד לא שלח, אם התפריט פתוח, מה בעגלה לפני התשלום. זה מצב בצד הלקוח, ושם גר נתח מפתיע מבאגי הפרונט, כי קל שיהיו שני עותקים שלו שלא מסכימים.\n\nהכלל שמתקן את רובם: לכל חתיכת מצב יש בעלים אחד. אם שתי קומפוננטות צריכות אותה, תרים אותה להורה המשותף הקרוב ביותר ותעביר למטה. פריימוורקים מוסיפים כלים למקרים שבהם ההעברה למטה נהיית מייגעת — context, stores — אבל העיקרון נשאר. תפריד גם בין שלושת הסוגים: נתוני שרת שאתה שומר מקומית (רשימת הזמנות), מצב ממשק (תפריט נפתח פתוח), ומצב כתובת (איזה דף, איזה פילטר). לשים פילטרים בכתובת זה הרגל קטן עם תמורה גדולה: כפתור ״אחורה״ עובד ואפשר לשתף את הקישור."
 },
 "SPA vs SSR vs static": {
  "en": "Three answers to one question: where does the HTML get made? Static: at build time, once, into files a CDN serves in milliseconds — perfect for anything that is the same for everyone. Single-page app: the server sends an almost empty page and JavaScript builds everything in the browser — great for app-like interfaces after login, poor for first load and for anything that must be indexed. Server-side rendering: the server builds each page's HTML per request, so the first paint is fast and complete, then JavaScript takes over for interactivity.\n\nModern frameworks like Next.js, Nuxt and SvelteKit let you choose per page, and that flexibility is exactly why they confuse: a project can be all three at once. The practical question for each page is who sees it and how often it changes. Public and rarely changing: static. Personal and interactive: SPA or SSR. Public and dynamic: SSR with caching. Default to the simplest that fits, because each step right adds a server you have to run.",
  "he": "שלוש תשובות לשאלה אחת: איפה נוצר ה-HTML? סטטי: בזמן הבנייה, פעם אחת, לקבצים ש-CDN מגיש במילישניות — מושלם לכל דבר שזהה לכולם. אפליקציית עמוד יחיד: השרת שולח דף כמעט ריק ו-JavaScript בונה הכל בדפדפן — מעולה לממשקים דמויי אפליקציה אחרי התחברות, גרוע לטעינה ראשונה ולכל דבר שצריך להיות מאונדקס. רינדור בצד השרת: השרת בונה את ה-HTML של כל דף לפי בקשה, אז הציור הראשון מהיר ושלם, ואז JavaScript לוקח פיקוד על האינטראקטיביות.\n\nפריימוורקים מודרניים כמו Next.js, Nuxt ו-SvelteKit מאפשרים לבחור לכל דף, והגמישות הזאת היא בדיוק למה הם מבלבלים: פרויקט יכול להיות כל השלושה בבת אחת. השאלה המעשית לכל דף היא מי רואה אותו וכמה הוא משתנה. ציבורי ומשתנה לעתים רחוקות: סטטי. אישי ואינטראקטיבי: SPA או SSR. ציבורי ודינמי: SSR עם מטמון. ברירת המחדל היא הפשוט ביותר שמתאים, כי כל צעד ימינה מוסיף שרת שאתה צריך להריץ."
 },
 "Bundler & build step": {
  "en": "Browsers understand plain JavaScript, CSS and HTML. You write TypeScript, import from node_modules, use JSX, split code across a hundred files and reference environment variables. The build step is the translation: a bundler resolves every import, compiles what needs compiling, strips what is unused, minifies, adds content hashes to filenames for caching, and emits a small set of files a browser can load directly.\n\nThe build is also where a specific class of production bugs is born. Variables like VITE_API_URL are baked in at build time — set them after the build and they are simply not there. A file that resolved on your case-insensitive Mac fails on a case-sensitive Linux build server. A dependency present locally but missing from package.json builds for you and nobody else. When something works in dev and not in prod, read the build log before reading your code.",
  "he": "דפדפנים מבינים JavaScript, CSS ו-HTML פשוטים. אתה כותב TypeScript, מייבא מ-node_modules, משתמש ב-JSX, מפצל קוד למאה קבצים ומתייחס למשתני סביבה. שלב הבנייה הוא התרגום: באנדלר פותר כל import, מקמפל מה שצריך קימפול, מסיר מה שלא בשימוש, מכווץ, מוסיף hash של התוכן לשמות קבצים לצורך מטמון, ופולט קבוצה קטנה של קבצים שדפדפן יכול לטעון ישירות.\n\nהבנייה היא גם המקום שבו נולדת מחלקה ספציפית של באגי פרודקשן. משתנים כמו VITE_API_URL נאפים בזמן הבנייה — תגדיר אותם אחרי הבנייה והם פשוט לא שם. קובץ שנפתר על המק שלך שלא רגיש לאותיות גדולות/קטנות נכשל על שרת בנייה לינוקס שכן רגיש. תלות שקיימת מקומית אבל חסרה ב-package.json נבנית לך ולאף אחד אחר. כשמשהו עובד בפיתוח ולא בפרודקשן, תקרא את לוג הבנייה לפני שאתה קורא את הקוד שלך."
 },
 "Accessibility (a11y)": {
  "en": "Accessibility is building the page so it works for people who do not use a mouse, cannot see the screen, or see it poorly. Most of it is free if you use HTML as designed: a <button> is focusable, keyboard-operable and announced correctly by a screen reader; a <div onClick> is none of those. A <label> tied to an input tells a blind user what the field is; a placeholder disappears the moment they type.\n\nAI-generated UIs fail this constantly, because they optimise for looking right in a screenshot. The checks are quick: unplug the mouse and Tab through the page — can you reach and operate everything, and can you see where focus is? Run Lighthouse in DevTools and read its accessibility section. Check contrast of text against its background. Beyond decency, in many jurisdictions this is law for commercial sites, and the keyboard-only path is also what makes your E2E tests reliable.",
  "he": "נגישות היא לבנות את הדף כך שיעבוד לאנשים שלא משתמשים בעכבר, לא יכולים לראות את המסך, או רואים אותו גרוע. רוב זה חינם אם משתמשים ב-HTML כפי שתוכנן: <button> ניתן לפוקוס, ניתן להפעלה במקלדת ומוכרז נכון בקורא מסך; <div onClick> הוא אף אחד מאלה. <label> מקושר לשדה אומר למשתמש עיוור מה השדה; placeholder נעלם ברגע שהוא מקליד.\n\nממשקים שנוצרו ב-AI נכשלים בזה כל הזמן, כי הם מיטיבים להיראות נכון בצילום מסך. הבדיקות מהירות: תנתק את העכבר ותעבור על הדף ב-Tab — אתה יכול להגיע להכל ולהפעיל הכל, ואתה רואה איפה הפוקוס? תריץ Lighthouse ב-DevTools ותקרא את קטע הנגישות. תבדוק ניגודיות של טקסט מול הרקע. מעבר להגינות, במדינות רבות זה חוק לאתרים מסחריים, ונתיב המקלדת בלבד הוא גם מה שהופך את בדיקות ה-E2E שלך לאמינות."
 },
 "Forms & validation": {
  "en": "A form has two audiences. The human wants to know immediately that the email is missing an @, before submitting and waiting. Your database wants a guarantee that no row ever contains a malformed email, an impossible quantity or a 40-megabyte name. Client-side validation serves the first; server-side validation serves the second; they are not interchangeable.\n\nThe reason is simple: the client is not yours. Anyone can open DevTools, delete the required attribute, or skip your page entirely and POST to the endpoint with curl. Whatever the browser checked, the server must check again, and the server's version is the one that decides. In practice, define the rules once in a schema (Zod, Pydantic, Joi), run it on the server as the source of truth, and reuse the same schema on the client for instant feedback. Then treat the server's rejection as normal, handled UI, not as an exception.",
  "he": "לטופס יש שני קהלים. האדם רוצה לדעת מיידית שלמייל חסר @, לפני ששולח ומחכה. מסד הנתונים שלך רוצה ערבות ששום שורה לעולם לא תכיל מייל פגום, כמות בלתי אפשרית או שם של 40 מגה-בייט. אימות בצד הלקוח משרת את הראשון; אימות בצד השרת משרת את השני; הם לא מתחלפים.\n\nהסיבה פשוטה: הלקוח לא שלך. כל אחד יכול לפתוח DevTools, למחוק את התכונה required, או לדלג על הדף שלך לחלוטין ולשלוח POST לנקודת הקצה עם curl. מה שהדפדפן בדק, השרת חייב לבדוק שוב, והגרסה של השרת היא זו שמחליטה. בפועל, תגדיר את החוקים פעם אחת בסכמה (Zod, Pydantic, Joi), תריץ אותה בשרת כמקור האמת, ותשתמש באותה סכמה בלקוח למשוב מיידי. ואז תתייחס לדחייה של השרת כממשק רגיל ומטופל, לא כחריגה."
 },
 "Sync vs async work": {
  "en": "A request handler has one job: answer the request. Every extra thing it does while the user waits — send the confirmation email, resize the uploaded photo, notify the warehouse, call the analytics provider — makes the response slower and, worse, makes the response fail when any of those fail. The user clicked \"buy\" and got an error because the email provider hiccupped, even though their order was saved.\n\nThe async pattern splits the request into what must happen now and what can happen soon. Save the order and return 201: that is the request. Everything else becomes a message on a queue, processed by a separate worker seconds later, retried if it fails, and invisible to the user except for its result arriving. The response time drops to the cost of one database write, and the checkout no longer depends on the health of five other services.",
  "he": "למטפל בקשה יש עבודה אחת: לענות על הבקשה. כל דבר נוסף שהוא עושה בזמן שהמשתמש מחכה — לשלוח מייל אישור, לשנות גודל של תמונה שהועלתה, להודיע למחסן, לקרוא לספק האנליטיקה — עושה את התשובה איטית יותר, וגרוע מזה, גורם לתשובה להיכשל כשכל אחד מאלה נכשל. המשתמש לחץ ״קנה״ וקיבל שגיאה כי ספק המייל שיהק, למרות שההזמנה שלו נשמרה.\n\nהתבנית האסינכרונית מפצלת את הבקשה למה שחייב לקרות עכשיו ומה שיכול לקרות בקרוב. לשמור את ההזמנה ולהחזיר 201: זו הבקשה. כל השאר הופך להודעה על תור, מעובד על ידי worker נפרד שניות אחר כך, מנוסה שוב אם נכשל, ובלתי נראה למשתמש חוץ מהתוצאה שמגיעה. זמן התגובה יורד לעלות של כתיבה אחת למסד הנתונים, והתשלום כבר לא תלוי בבריאות של חמישה שירותים אחרים."
 },
 "Background job": {
  "en": "A job is a description of work, not the work itself: \"send welcome email to user 812\", \"generate PDF for invoice 4471\". It is written to a queue — Redis, SQS, a database table — with its parameters. Separately, one or more worker processes pull jobs off the queue, execute them, and mark them done or failed. The web process and the worker share nothing but the queue.\n\nThis separation is what gives jobs their properties. If the worker crashes mid-job, the job is still on the queue and another worker picks it up: durability. If a job throws, the queue can schedule a retry: resilience. If a thousand jobs arrive at once, they wait in line rather than overwhelming anything, and you add workers to drain faster: elastic throughput. Compare the in-process alternative — setTimeout, a fire-and-forget promise — which offers none of these and silently loses work every deploy. Libraries like BullMQ, Celery and Sidekiq are all this pattern with the edges handled.",
  "he": "job הוא תיאור של עבודה, לא העבודה עצמה: ״שלח מייל ברוכים הבאים למשתמש 812״, ״צור PDF לחשבונית 4471״. הוא נכתב לתור — Redis, SQS, טבלה במסד נתונים — עם הפרמטרים שלו. בנפרד, תהליך worker אחד או יותר מושכים jobs מהתור, מבצעים אותם, ומסמנים אותם כהושלמו או נכשלו. תהליך הווב וה-worker לא משתפים כלום חוץ מהתור.\n\nההפרדה הזאת היא מה שנותנת ל-jobs את התכונות שלהם. אם ה-worker קורס באמצע job, ה-job עדיין על התור ו-worker אחר אוסף אותו: עמידות. אם job זורק שגיאה, התור יכול לתזמן ניסיון חוזר: חוסן. אם אלף jobs מגיעים בבת אחת, הם מחכים בתור במקום להציף משהו, ואתה מוסיף workers כדי לרוקן מהר יותר: תפוקה גמישה. תשווה לחלופה בתוך התהליך — setTimeout, promise של ״שגר ושכח״ — שלא מציעה אף אחת מאלה ומאבדת עבודה בשקט בכל פריסה. ספריות כמו BullMQ, Celery ו-Sidekiq הן כולן התבנית הזאת עם הקצוות מטופלים."
 },
 "Scheduled job (cron)": {
  "en": "Cron is the ancient Unix scheduler and the name has stuck for any time-driven work: every night at 02:00 run the report, every hour sync inventory, every minute expire stale sessions. The schedule is written in a terse five-field syntax that every scheduler still understands, and every cloud has a managed equivalent — EventBridge, Cloud Scheduler, Vercel Cron.\n\nTwo things go wrong reliably. First, duplication: when you run two copies of your app for reliability, both start the schedule, and the report is emailed twice. The fix is a lock — one row in the database or one key in Redis that a runner must claim before starting — or a single dedicated scheduler that only enqueues jobs for the workers to do. Second, silence: a cron that stops running fails invisibly, because nothing observes the absence of an event. Have each run write a heartbeat and alert when the heartbeat is late.",
  "he": "cron הוא המתזמן העתיק של Unix והשם נדבק לכל עבודה מונעת-זמן: כל לילה ב-02:00 להריץ את הדוח, כל שעה לסנכרן מלאי, כל דקה להפקיע סשנים ישנים. לוח הזמנים נכתב בתחביר תמציתי של חמישה שדות שכל מתזמן עדיין מבין, ולכל ענן יש מקבילה מנוהלת — EventBridge, Cloud Scheduler, Vercel Cron.\n\nשני דברים משתבשים באופן אמין. ראשית, כפילות: כשאתה מריץ שני עותקים של האפליקציה לצורך אמינות, שניהם מתחילים את לוח הזמנים, והדוח נשלח פעמיים. התיקון הוא נעילה — שורה אחת במסד הנתונים או מפתח אחד ב-Redis שמריץ חייב לתפוס לפני שמתחיל — או מתזמן יחיד ייעודי שרק מוסיף jobs לתור בשביל ה-workers. שנית, שקט: cron שמפסיק לרוץ נכשל בלי שרואים, כי שום דבר לא צופה בהיעדר של אירוע. תגרום לכל ריצה לכתוב פעימת לב ותתריע כשהפעימה מאחרת."
 },
 "Event & pub/sub": {
  "en": "The direct approach to \"when an order is placed, do these five things\" is five function calls inside the checkout code. It works until the sixth thing arrives, and the seventh, and the checkout function knows about email, Slack, analytics, the warehouse and loyalty points and can fail because of any of them. Every new reaction is another edit to the most important code you own.\n\nPublish/subscribe inverts it. Checkout emits one event — OrderPlaced, with the order id — to a broker and is finished. Anything interested subscribes: the emailer, the Slack notifier, the analytics forwarder, each in its own code, each failing independently, each addable without touching checkout. The cost is indirection: to answer \"what happens when an order is placed?\" you now search for subscribers instead of reading one function. Keep event names as past-tense facts (OrderPlaced, not SendEmail), put ids in them rather than whole objects, and expect every subscriber to occasionally see the same event twice.",
  "he": "הגישה הישירה ל״כשהזמנה מבוצעת, תעשה את חמשת הדברים האלה״ היא חמש קריאות לפונקציות בתוך קוד התשלום. זה עובד עד שהדבר השישי מגיע, והשביעי, ופונקציית התשלום מכירה מייל, Slack, אנליטיקה, מחסן ונקודות נאמנות ויכולה להיכשל בגלל כל אחד מהם. כל תגובה חדשה היא עוד עריכה בקוד החשוב ביותר שיש לך.\n\nPublish/subscribe הופך את זה. התשלום פולט אירוע אחד — OrderPlaced, עם מזהה ההזמנה — ל-broker וסיים. כל מי שמתעניין נרשם: שולח המייל, מודיע ה-Slack, מעביר האנליטיקה, כל אחד בקוד משלו, כל אחד נכשל בנפרד, כל אחד ניתן להוספה בלי לגעת בתשלום. המחיר הוא עקיפות: כדי לענות ״מה קורה כשהזמנה מבוצעת?״ אתה עכשיו מחפש מנויים במקום לקרוא פונקציה אחת. תשמור שמות אירועים כעובדות בזמן עבר (OrderPlaced, לא SendEmail), תשים בהם מזהים ולא אובייקטים שלמים, ותצפה שכל מנוי יראה מדי פעם את אותו אירוע פעמיים."
 },
 "Retry & backoff": {
  "en": "Networks blip, providers restart, databases hit a lock for a moment. Most of these failures are gone if you try again a second later, which is why retrying is the single most effective reliability tool. It is also the tool that turns a small incident into a large one when done badly: a struggling service receives a retry from every client at once, at full speed, and now it is not struggling, it is down.\n\nBackoff is the discipline. Wait before retrying; wait longer each time — 1s, 2s, 4s, 8s — and cap both the wait and the number of attempts. Add jitter, a random fraction, so a thousand clients that failed at the same instant do not retry at the same instant. Retry only errors that could plausibly be transient: timeouts, 429, 503, connection reset — never a 400 or a 404, which will fail identically forever. And retry only operations that are safe to repeat, or make them safe with an idempotency key. Queue libraries have all this built in; the settings are worth reading rather than accepting.",
  "he": "רשתות מהבהבות, ספקים מתאתחלים, מסדי נתונים פוגעים בנעילה לרגע. רוב הכשלים האלה נעלמים אם מנסים שוב שנייה אחר כך, ולכן ניסיון חוזר הוא כלי האמינות היעיל ביותר. הוא גם הכלי שהופך תקרית קטנה לגדולה כשעושים אותו רע: שירות שמתאמץ מקבל ניסיון חוזר מכל לקוח בבת אחת, במהירות מלאה, ועכשיו הוא לא מתאמץ, הוא למטה.\n\nbackoff הוא המשמעת. תחכה לפני שתנסה שוב; תחכה יותר בכל פעם — 1, 2, 4, 8 שניות — ותשים תקרה גם על ההמתנה וגם על מספר הניסיונות. תוסיף jitter, שבר אקראי, כדי שאלף לקוחות שנכשלו באותו רגע לא ינסו שוב באותו רגע. תנסה שוב רק שגיאות שיכולות להיות חולפות: טיים-אאוט, 429, 503, connection reset — לעולם לא 400 או 404, שייכשלו באופן זהה לנצח. ותנסה שוב רק פעולות שבטוח לחזור עליהן, או תעשה אותן בטוחות עם מפתח אידמפוטנטיות. לספריות תורים כל זה מובנה; שווה לקרוא את ההגדרות במקום לקבל אותן."
 },
 "Dead-letter queue": {
  "en": "Retries end. After the fifth attempt the email still bounces, the PDF generator still throws on that one malformed invoice, the webhook target is still returning 500. Something must happen to the job now. Dropping it loses the work silently; leaving it on the main queue blocks or poisons everything behind it. The dead-letter queue is the third option: a holding area where exhausted jobs go with their full payload and their last error.\n\nWhat makes it valuable is that it turns unknown failures into a list. Instead of a customer writing in three weeks later about an invoice that never arrived, you have a queue with 14 items in it, each one saying exactly what it tried to do and why it could not. You can fix the underlying bug and replay them in bulk. The operational rule: the DLQ should normally be empty, and a non-empty DLQ should page someone — because each item in it is a promise your system made and did not keep.",
  "he": "ניסיונות חוזרים נגמרים. אחרי הניסיון החמישי המייל עדיין חוזר, מחולל ה-PDF עדיין זורק שגיאה על אותה חשבונית פגומה, יעד ה-webhook עדיין מחזיר 500. משהו חייב לקרות ל-job עכשיו. לזרוק אותו מאבד את העבודה בשקט; להשאיר אותו על התור הראשי חוסם או מרעיל כל מה שמאחוריו. תור האותיות המתות הוא האפשרות השלישית: אזור החזקה שאליו הולכים jobs מותשים עם כל המטען שלהם והשגיאה האחרונה.\n\nמה שעושה אותו יקר-ערך הוא שהוא הופך כשלים לא ידועים לרשימה. במקום שלקוח יכתוב שלושה שבועות אחר כך על חשבונית שלא הגיעה אף פעם, יש לך תור עם 14 פריטים, שכל אחד אומר בדיוק מה הוא ניסה לעשות ולמה לא הצליח. אתה יכול לתקן את הבאג הבסיסי ולהריץ אותם שוב בבת אחת. הכלל התפעולי: ה-DLQ אמור להיות ריק בדרך כלל, ו-DLQ לא ריק אמור להזעיק מישהו — כי כל פריט בו הוא הבטחה שהמערכת שלך נתנה ולא קיימה."
 },
 "Eventual consistency": {
  "en": "The moment work leaves the request and moves to the background, your system stops having one truth at one instant. The order row exists; the invoice job has not run yet; the search index will pick up the new product in thirty seconds; the analytics dashboard updates hourly. Each part is correct about what it knows, and they disagree for a while. This is eventual consistency: they converge, but not instantly.\n\nIt is not a bug to be fixed; it is a trade you made for speed and resilience, and the job is to be honest about it. In the interface: show \"processing\" states, disable the button that would act on a thing not yet created, and poll or push until the truth arrives. In the code: never assume the invoice exists because the order does; look it up, handle its absence. In your head: when a user reports \"it said saved but it is not there\", ask how long ago — a five-second gap is the design working, a five-hour gap is a job stuck in a queue.",
  "he": "ברגע שעבודה עוזבת את הבקשה ועוברת לרקע, למערכת שלך מפסיקה להיות אמת אחת ברגע אחד. שורת ההזמנה קיימת; ה-job של החשבונית עוד לא רץ; אינדקס החיפוש יאסוף את המוצר החדש בעוד שלושים שניות; דשבורד האנליטיקה מתעדכן כל שעה. כל חלק צודק לגבי מה שהוא יודע, והם חולקים לזמן מה. זו עקביות בסופו של דבר: הם מתכנסים, אבל לא מיידית.\n\nזה לא באג שצריך לתקן; זו עסקה שעשית תמורת מהירות וחוסן, והעבודה היא להיות ישר לגביה. בממשק: להראות מצבי ״מעבד״, לנטרל את הכפתור שיפעל על דבר שעוד לא נוצר, ולעשות פולינג או דחיפה עד שהאמת מגיעה. בקוד: לעולם לא להניח שהחשבונית קיימת כי ההזמנה קיימת; לחפש אותה, לטפל בהיעדרה. בראש: כשמשתמש מדווח ״זה אמר נשמר אבל זה לא שם״, תשאל לפני כמה זמן — פער של חמש שניות הוא העיצוב עובד, פער של חמש שעות הוא job תקוע בתור."
 },
 "Real-time (WebSocket / SSE)": {
  "en": "HTTP is request and response: the browser asks, the server answers, the line closes. For a chat, a live price, or \"your export finished\", the server needs to speak first. Two standard tools do this. Server-sent events keep one response open indefinitely and let the server stream text messages down it; it is plain HTTP, one-directional, auto-reconnects, and is enough for most \"tell me when\" needs. WebSockets upgrade the connection to a two-way channel where either side sends at any time; that is what games, collaborative editors and chat use.\n\nThe cost is state. A normal request is over in 50 milliseconds; a real-time connection lives for an hour and is pinned to one server process. Run two instances behind a load balancer and the server that has the news is not necessarily the one holding the user's connection. This is why real-time systems introduce a shared broker — Redis pub/sub is the usual one — so any instance can publish and the instance with the connection delivers. Or you use a managed service (Pusher, Ably, Supabase Realtime) and let it hold the connections.",
  "he": "HTTP הוא בקשה ותשובה: הדפדפן שואל, השרת עונה, הקו נסגר. לצ׳אט, למחיר חי, או ל״הייצוא שלך הסתיים״, השרת צריך לדבר ראשון. שני כלים סטנדרטיים עושים את זה. Server-sent events שומרים תשובה אחת פתוחה ללא הגבלה ומאפשרים לשרת להזרים הודעות טקסט דרכה; זה HTTP רגיל, חד-כיווני, מתחבר מחדש אוטומטית, ומספיק לרוב צורכי ״תודיע לי כש״. WebSockets משדרגים את החיבור לערוץ דו-כיווני שבו כל צד שולח בכל זמן; זה מה שמשחקים, עורכים שיתופיים וצ׳אט משתמשים בו.\n\nהמחיר הוא מצב. בקשה רגילה נגמרת ב-50 מילישניות; חיבור זמן אמת חי שעה ונעוץ לתהליך שרת אחד. תריץ שני מופעים מאחורי מאזן עומסים והשרת שיש לו את החדשות הוא לא בהכרח זה שמחזיק את החיבור של המשתמש. לכן מערכות זמן אמת מציגות broker משותף — Redis pub/sub הוא הרגיל — כדי שכל מופע יוכל לפרסם והמופע עם החיבור ימסור. או שמשתמשים בשירות מנוהל (Pusher, Ably, Supabase Realtime) ונותנים לו להחזיק את החיבורים."
 },
 "Long-running task & progress": {
  "en": "Somewhere between two and thirty seconds, a synchronous request stops being viable. Browsers give up, load balancers cut the connection at 60 seconds, serverless functions have hard limits, and a user staring at a spinner with no feedback assumes it is broken and clicks again — now you are generating the report twice. Any operation that can take that long needs to become a task.\n\nThe pattern is always the same. The request creates a task record with status \"queued\" and returns its id immediately — 202 Accepted is the honest status code. A worker picks it up, sets \"running\", and updates a progress field as it goes: 40 of 900 rows, step 3 of 5. The client shows that progress by polling GET /tasks/{id} every couple of seconds or subscribing to events. When the worker finishes it stores the result — often a file in object storage — and sets \"done\" with a link, or \"failed\" with a message a human can read. Same shape for exports, imports, video processing, bulk emails and every AI generation that takes more than a moment.",
  "he": "איפשהו בין שתיים לשלושים שניות, בקשה סינכרונית מפסיקה להיות ריאלית. דפדפנים מוותרים, מאזני עומסים חותכים את החיבור ב-60 שניות, לפונקציות serverless יש מגבלות קשיחות, ומשתמש שבוהה בספינר בלי משוב מניח שזה שבור ולוחץ שוב — עכשיו אתה מייצר את הדוח פעמיים. כל פעולה שיכולה לקחת כל כך הרבה זמן צריכה להפוך למשימה.\n\nהתבנית תמיד זהה. הבקשה יוצרת רשומת משימה בסטטוס ״בתור״ ומחזירה את המזהה שלה מיידית — 202 Accepted הוא קוד הסטטוס הישר. worker אוסף אותה, קובע ״רץ״, ומעדכן שדה התקדמות בדרך: 40 מתוך 900 שורות, שלב 3 מתוך 5. הלקוח מציג את ההתקדמות על ידי פולינג של GET /tasks/{id} כל כמה שניות או הרשמה לאירועים. כשה-worker מסיים הוא שומר את התוצאה — לרוב קובץ באחסון אובייקטים — וקובע ״הושלם״ עם קישור, או ״נכשל״ עם הודעה שאדם יכול לקרוא. אותה צורה לייצואים, ייבואים, עיבוד וידאו, מיילים בכמות וכל יצירת AI שלוקחת יותר מרגע."
 },
 "Threat model": {
  "en": "Security advice without a threat model is a list of everything, and a list of everything gets nothing done. Threat modelling is deciding, deliberately and in writing, what you are actually protecting and from whom. What data do you hold that would hurt someone if it leaked — emails, addresses, payment details, health information, private messages? Who would want it — bored scanners running scripts against every IP, a competitor, a jilted user, a criminal group? And where are the doors — the login form, the file upload, the admin panel, the API keys on a laptop, the ex-contractor who still has access?\n\nThe answers change everything downstream. A public recipe site has almost nothing worth stealing, and the realistic threat is defacement and spam: strong admin password, updates, backups, done. A tool that stores other people's customer lists has a real target on it, and the realistic threats include account takeover and a leaked database: now MFA, least privilege, encryption, audit logs and a plan for the breach are all proportionate. Ten minutes on this question, revisited when the product changes, is the highest-leverage security work you will do.",
  "he": "עצות אבטחה בלי מודל איומים הן רשימה של הכל, ורשימה של הכל לא מביאה לשום דבר. מודל איומים הוא להחליט, במכוון ובכתב, על מה אתה באמת מגן וממי. אילו נתונים אתה מחזיק שיפגעו במישהו אם ידלפו — מיילים, כתובות, פרטי תשלום, מידע רפואי, הודעות פרטיות? מי ירצה אותם — סורקים משועממים שמריצים סקריפטים על כל IP, מתחרה, משתמש נעלב, קבוצה פלילית? ואיפה הדלתות — טופס ההתחברות, העלאת הקבצים, פאנל האדמין, מפתחות ה-API על לפטופ, הקבלן לשעבר שעדיין יש לו גישה?\n\nהתשובות משנות את כל מה שבא אחר כך. לאתר מתכונים ציבורי אין כמעט כלום ששווה לגנוב, והאיום הריאלי הוא השחתה וספאם: סיסמת אדמין חזקה, עדכונים, גיבויים, סיימנו. לכלי שמאחסן רשימות לקוחות של אחרים יש מטרה אמיתית עליו, והאיומים הריאליים כוללים השתלטות על חשבון ומסד נתונים שדלף: עכשיו MFA, הרשאה מינימלית, הצפנה, יומני ביקורת ותוכנית לפריצה — כולם פרופורציונליים. עשר דקות על השאלה הזאת, שחוזרים אליה כשהמוצר משתנה, הן עבודת האבטחה עם המנוף הגבוה ביותר שתעשה."
 },
 "OWASP Top 10": {
  "en": "The Open Worldwide Application Security Project maintains a periodically updated list of the ten categories of vulnerability that actually cause breaches in real web applications. It is not exotic. Broken access control — a user changing the id in a URL and seeing someone else's order — has been at the top for years. Then cryptographic failures (plaintext passwords, weak hashing), injection, insecure design, misconfiguration (debug mode on in production, default credentials, open S3 buckets), vulnerable components, authentication failures, integrity failures, insufficient logging, and server-side request forgery.\n\nThe list is valuable because it is a checklist, and checklists are exactly what AI-generated code lacks. Research through 2025 and 2026 found that AI assistants produce code with these vulnerabilities at high rates unless specifically asked not to, with access control and XSS among the most common failures. So ask. \"Review this code against the OWASP Top 10, one item at a time, and show me where each does or does not apply\" is a prompt that regularly finds real problems in ten minutes. Then make the fixes, and make them into tests.",
  "he": "ה-Open Worldwide Application Security Project מתחזק רשימה שמתעדכנת מדי פעם של עשר קטגוריות הפגיעות שבאמת גורמות לפריצות באפליקציות ווב אמיתיות. זה לא אקזוטי. בקרת גישה שבורה — משתמש שמשנה את המזהה בכתובת ורואה הזמנה של מישהו אחר — נמצאת בראש כבר שנים. ואז כשלים קריפטוגרפיים (סיסמאות בטקסט גלוי, גיבוב חלש), injection, עיצוב לא מאובטח, קונפיגורציה שגויה (מצב debug דלוק בפרודקשן, סיסמאות ברירת מחדל, דליי S3 פתוחים), רכיבים פגיעים, כשלי הזדהות, כשלי שלמות, רישום לא מספק, ו-server-side request forgery.\n\nהרשימה יקרת-ערך כי היא רשימת בדיקה, ורשימות בדיקה הן בדיוק מה שחסר לקוד שנוצר ב-AI. מחקרים לאורך 2025 ו-2026 מצאו שעוזרי AI מייצרים קוד עם הפגיעויות האלה בשיעורים גבוהים אלא אם מבקשים מהם במפורש לא, כשבקרת גישה ו-XSS בין הכשלים הנפוצים ביותר. אז תבקש. ״תסקור את הקוד הזה מול OWASP Top 10, פריט אחד בכל פעם, ותראה לי איפה כל אחד חל או לא חל״ הוא פרומפט שמוצא באופן קבוע בעיות אמיתיות בעשר דקות. ואז תעשה את התיקונים, ותהפוך אותם לבדיקות."
 },
 "Least privilege": {
  "en": "Every credential in your system is a description of what can go wrong when it leaks. A database user that can only SELECT from three tables leaks into a read of three tables. A database user that is the superuser leaks into a deleted database. The principle of least privilege says: grant each identity — human, service, key, container — the minimum it needs to do its actual job, and no more. Not because you distrust it, but because you cannot control where it ends up.\n\nAI assistants violate this constantly, because broad permissions make the demo work on the first try. The IAM policy with \"Action\": \"*\", the database connection as the root user, the API key with every scope ticked, the container running as root. Each one is a decision to make the eventual leak maximally expensive. The habit is to ask, every time a permission is created: what does this thing actually do? Read from one bucket — then only that bucket, only read. Write orders — then only the orders table. And separate the identities: the web app, the worker, the backup job and you-at-the-keyboard should each have their own credentials, so that revoking one does not break the others and the audit log can tell them apart.",
  "he": "כל אישור גישה במערכת שלך הוא תיאור של מה יכול להשתבש כשהוא דולף. משתמש מסד נתונים שיכול רק SELECT משלוש טבלאות דולף לקריאה של שלוש טבלאות. משתמש מסד נתונים שהוא superuser דולף למסד נתונים מחוק. עקרון ההרשאה המינימלית אומר: תעניק לכל זהות — אדם, שירות, מפתח, קונטיינר — את המינימום שהיא צריכה כדי לעשות את העבודה האמיתית שלה, ולא יותר. לא כי אתה לא בוטח בה, אלא כי אתה לא יכול לשלוט לאן היא תגיע.\n\nעוזרי AI מפרים את זה כל הזמן, כי הרשאות רחבות גורמות לדמו לעבוד בניסיון הראשון. מדיניות IAM עם \"Action\": \"*\", חיבור למסד הנתונים כמשתמש root, מפתח API עם כל ה-scopes מסומנים, קונטיינר שרץ כ-root. כל אחד מאלה הוא החלטה להפוך את הדליפה שתבוא ליקרה ככל האפשר. ההרגל הוא לשאול, בכל פעם שנוצרת הרשאה: מה הדבר הזה באמת עושה? קורא מדלי אחד — אז רק הדלי הזה, רק קריאה. כותב הזמנות — אז רק טבלת ההזמנות. ותפריד את הזהויות: אפליקציית הווב, ה-worker, job הגיבוי ואתה-ליד-המקלדת צריכים כל אחד אישורים משלו, כדי שביטול של אחד לא ישבור את האחרים ויומן הביקורת יוכל להבדיל ביניהם."
 },
 "Secrets in git history": {
  "en": "Git remembers everything. That is its purpose. So when a key lands in a commit — in a .env you forgot to ignore, in a config file, in a test fixture — and you later delete it and commit again, you have two commits: one that adds the key and one that removes it, and the key is still readable in the first. Push that repository anywhere public and automated scanners will find the key within minutes; they watch the GitHub firehose for exactly these patterns, and a leaked AWS key is typically being used to mine cryptocurrency before you have finished your coffee.\n\nThe response order matters. First, revoke: go to the provider and rotate the key so the leaked one is worthless. This is the only step that actually fixes anything. Second, if the repository is or may become public, rewrite history to remove the secret (git filter-repo, or GitHub's own tooling) — understanding that anyone who already cloned still has it. Third, prevent the next one: add .env to .gitignore, install a pre-commit secret scanner (gitleaks, trufflehog), and enable your Git host's push protection. Then treat every secret that was ever committed as compromised, even in a private repository, because private repositories change hands.",
  "he": "Git זוכר הכל. זו המטרה שלו. אז כשמפתח נוחת בקומיט — ב-.env ששכחת להתעלם ממנו, בקובץ קונפיגורציה, ב-fixture של בדיקה — ואחר כך אתה מוחק אותו ומקמט שוב, יש לך שני קומיטים: אחד שמוסיף את המפתח ואחד שמסיר אותו, והמפתח עדיין קריא בראשון. תדחוף את המאגר הזה לכל מקום ציבורי וסורקים אוטומטיים ימצאו את המפתח בתוך דקות; הם צופים בזרם של GitHub בדיוק בשביל התבניות האלה, ומפתח AWS שדלף בדרך כלל כבר משמש לכריית קריפטו לפני שסיימת את הקפה.\n\nסדר התגובה חשוב. ראשית, לבטל: ללכת לספק ולהחליף את המפתח כדי שזה שדלף יהיה חסר ערך. זה הצעד היחיד שבאמת מתקן משהו. שנית, אם המאגר ציבורי או עלול להפוך לציבורי, לשכתב היסטוריה כדי להסיר את הסוד (git filter-repo, או הכלים של GitHub עצמו) — מתוך הבנה שמי שכבר שיבט עדיין מחזיק בו. שלישית, למנוע את הבא: להוסיף .env ל-.gitignore, להתקין סורק סודות pre-commit (gitleaks, trufflehog), ולהפעיל הגנת push של שרת ה-Git שלך. ואז להתייחס לכל סוד שאי פעם קומט כאל פרוץ, גם במאגר פרטי, כי מאגרים פרטיים מחליפים ידיים."
 },
 "Supply chain (dependencies)": {
  "en": "Run npm ls or pip freeze on a typical project and count: hundreds of packages, written by hundreds of strangers, all executing with the full permissions of your application. Your security is now the minimum of theirs. Real attacks work through this chain: a maintainer's account is phished and a malicious version published; a package with a name one letter off from a popular one (typosquatting) waits for a mistyped install; a dependency's install script quietly reads environment variables and posts them somewhere.\n\nAI adds a new failure mode called slopsquatting: models confidently import packages that do not exist, and attackers register those hallucinated names with malicious code inside. So before installing what the AI suggested, check that the package exists, has a real repository, recent activity, meaningful download numbers and few open security issues. Commit your lockfile so every install is byte-identical. Run an audit tool in CI. Prefer fewer, larger, well-known dependencies over many tiny ones. And ask, for each new one: could I write this in twenty lines instead?",
  "he": "תריץ npm ls או pip freeze על פרויקט טיפוסי ותספור: מאות חבילות, שנכתבו על ידי מאות זרים, שכולן מתבצעות עם ההרשאות המלאות של האפליקציה שלך. האבטחה שלך היא עכשיו המינימום של שלהם. התקפות אמיתיות עובדות דרך השרשרת הזאת: חשבון של מתחזק נופל לפישינג וגרסה זדונית מתפרסמת; חבילה עם שם שונה באות אחת מחבילה פופולרית (typosquatting) מחכה להתקנה עם שגיאת הקלדה; סקריפט התקנה של תלות קורא בשקט משתני סביבה ושולח אותם לאנשהו.\n\nAI מוסיף אופן כשל חדש שנקרא slopsquatting: מודלים מייבאים בביטחון חבילות שלא קיימות, ותוקפים רושמים את השמות ההזויים האלה עם קוד זדוני בפנים. אז לפני שמתקינים מה שה-AI הציע, תבדוק שהחבילה קיימת, שיש לה מאגר אמיתי, פעילות עדכנית, מספרי הורדות משמעותיים ומעט בעיות אבטחה פתוחות. תקמט את קובץ הנעילה כדי שכל התקנה תהיה זהה בייט לבייט. תריץ כלי audit ב-CI. תעדיף פחות תלויות, גדולות ומוכרות, על פני הרבה קטנות. ותשאל, על כל אחת חדשה: אני יכול לכתוב את זה בעשרים שורות במקום?"
 },
 "CVE & patching": {
  "en": "When a security flaw is found in a piece of software, it is assigned a CVE identifier — CVE-2026-12345 — and published with a severity score. From that moment, two clocks start: attackers write exploits, and maintainers ship a fixed version. Your job is to be on the fixed version before the exploit reaches you. Since your application is mostly other people's code, this is mostly about dependencies, and it is unglamorous, continuous work that never finishes.\n\nThe tooling makes it nearly automatic. npm audit, pip-audit and cargo audit compare your lockfile against the vulnerability databases and tell you what to upgrade. Dependabot and Renovate open pull requests with the upgrades already made. The part that requires you is merging them — and the temptation to ignore forty boring PRs is exactly how a two-year-old critical vulnerability ends up in production. A workable rhythm: security updates merged within days, everything else batched weekly, tests running on each so you know when an upgrade breaks something. Also patch the layers you forget: the base Docker image, the Node or Python runtime itself, the operating system on any VM you run.",
  "he": "כשנמצא פגם אבטחה בתוכנה, הוא מקבל מזהה CVE — CVE-2026-12345 — ומתפרסם עם ציון חומרה. מאותו רגע, שני שעונים מתחילים: תוקפים כותבים exploits, ומתחזקים משחררים גרסה מתוקנת. העבודה שלך היא להיות על הגרסה המתוקנת לפני שה-exploit מגיע אליך. מכיוון שהאפליקציה שלך היא בעיקר קוד של אחרים, זה בעיקר עניין של תלויות, וזו עבודה לא זוהרת, מתמשכת, שלא נגמרת אף פעם.\n\nהכלים עושים את זה כמעט אוטומטי. npm audit, pip-audit ו-cargo audit משווים את קובץ הנעילה שלך מול מאגרי הפגיעויות ואומרים לך מה לשדרג. Dependabot ו-Renovate פותחים pull requests עם השדרוגים כבר עשויים. החלק שדורש אותך הוא למזג אותם — והפיתוי להתעלם מארבעים PRs משעממים הוא בדיוק איך פגיעות קריטית בת שנתיים מגיעה לפרודקשן. קצב שעובד: עדכוני אבטחה ממוזגים תוך ימים, כל השאר מקובץ שבועית, בדיקות רצות על כל אחד כדי שתדע כשעדכון שובר משהו. תעדכן גם את השכבות שאתה שוכח: תמונת ה-Docker הבסיסית, ה-runtime של Node או Python עצמו, מערכת ההפעלה על כל VM שאתה מריץ."
 },
 "Security headers & CSP": {
  "en": "Browsers will do dangerous things by default because the web was designed before the dangers were understood: load your site inside another site's iframe (enabling clickjacking), guess a file's type from its contents (turning an uploaded image into executable script), send the full URL as a referrer to third parties, and run any script that appears in the page from anywhere. Security headers are your server telling the browser to stop: X-Frame-Options or frame-ancestors, X-Content-Type-Options: nosniff, Referrer-Policy, Strict-Transport-Security to force HTTPS forever.\n\nContent-Security-Policy is the powerful one. It declares where scripts, styles, images and connections may come from, and the browser refuses anything else — which means an injected <script> tag from an XSS bug simply does not execute. A strict CSP is real work to get right, because every inline script and third-party widget must be accounted for; start with report-only mode, watch what it would have blocked, then enforce. For everything else, a middleware like helmet for Node or the equivalent in your framework sets sane defaults in one line. Check the result at securityheaders.com; it is a two-minute audit that catches a shocking number of production sites with nothing at all.",
  "he": "דפדפנים יעשו דברים מסוכנים כברירת מחדל כי הווב תוכנן לפני שהסכנות הובנו: לטעון את האתר שלך בתוך iframe של אתר אחר (מה שמאפשר clickjacking), לנחש סוג של קובץ מהתוכן שלו (מה שהופך תמונה שהועלתה לסקריפט שרץ), לשלוח את הכתובת המלאה כ-referrer לצדדים שלישיים, ולהריץ כל סקריפט שמופיע בדף מכל מקום. כותרות אבטחה הן השרת שלך שאומר לדפדפן לעצור: X-Frame-Options או frame-ancestors, X-Content-Type-Options: nosniff, Referrer-Policy, Strict-Transport-Security כדי לכפות HTTPS לנצח.\n\nContent-Security-Policy היא החזקה. היא מצהירה מאיפה מותר לסקריפטים, סגנונות, תמונות וחיבורים להגיע, והדפדפן מסרב לכל דבר אחר — מה שאומר שתגית <script> מוזרקת מבאג XSS פשוט לא מתבצעת. CSP קפדני הוא עבודה אמיתית לדייק, כי צריך לתת דין וחשבון על כל סקריפט inline וכל widget של צד שלישי; תתחיל במצב report-only, תראה מה הוא היה חוסם, ואז תכפה. לכל השאר, middleware כמו helmet ל-Node או המקבילה בפריימוורק שלך קובע ברירות מחדל הגיוניות בשורה אחת. תבדוק את התוצאה ב-securityheaders.com; זו ביקורת של שתי דקות שתופסת מספר מזעזע של אתרי פרודקשן בלי כלום."
 },
 "Encryption at rest / in transit": {
  "en": "Data is exposed in two states: while moving between machines, and while sitting on a disk. In transit, the threat is anyone on the path — a coffee-shop network, a compromised router, a cloud neighbour — reading or altering it. TLS solves this: HTTPS between browser and your server, and, less often remembered, TLS between your server and your database, your cache, your queue. Most managed databases offer it; many applications never turn it on because the connection string works without it.\n\nAt rest, the threat is the storage itself leaving your control: a decommissioned disk, a stolen laptop, a misconfigured bucket, a backup file copied somewhere convenient. Encryption at rest means the bytes on the medium are ciphertext without the key, so a copy of the storage is worthless. Cloud providers make this a checkbox on databases, volumes and buckets — tick it, it costs nothing. The gap they cannot close is your own habits: a production database dump in your Downloads folder, a CSV export in Slack, a .sqlite file in a repository. Those are unencrypted copies of your most sensitive data in the least protected places you own.",
  "he": "נתונים חשופים בשני מצבים: בזמן שהם עוברים בין מכונות, ובזמן שהם יושבים על דיסק. בתעבורה, האיום הוא כל מי שעל הדרך — רשת של בית קפה, ראוטר שנפרץ, שכן בענן — שקורא או משנה אותם. TLS פותר את זה: HTTPS בין הדפדפן לשרת שלך, ו — מה שנזכר פחות — TLS בין השרת שלך למסד הנתונים, למטמון, לתור. רוב מסדי הנתונים המנוהלים מציעים אותו; אפליקציות רבות לא מפעילות אותו אף פעם כי מחרוזת החיבור עובדת בלעדיו.\n\nבמנוחה, האיום הוא האחסון עצמו שיוצא משליטתך: דיסק שהוצא משימוש, לפטופ שנגנב, דלי עם קונפיגורציה שגויה, קובץ גיבוי שהועתק למקום נוח. הצפנה במנוחה אומרת שהבייטים על המדיום הם טקסט מוצפן בלי המפתח, אז עותק של האחסון חסר ערך. ספקי ענן עושים את זה תיבת סימון על מסדי נתונים, כוננים ודליים — תסמן, זה לא עולה כלום. הפער שהם לא יכולים לסגור הוא ההרגלים שלך: dump של מסד הנתונים מפרודקשן בתיקיית Downloads, ייצוא CSV ב-Slack, קובץ .sqlite במאגר. אלה עותקים לא מוצפנים של הנתונים הרגישים ביותר שלך במקומות הפחות מוגנים שיש לך."
 },
 "Backups & recovery": {
  "en": "The question is not whether you will lose data; it is when, and how much, and how long it takes to get back. A wrong DELETE without a WHERE clause. A migration that drops the column with the data still in it. A ransomware key. A cloud account suspended for a billing mixup. An AI agent with database access that misunderstood the instruction. Each of these happens to someone every day, and the difference between an anecdote and an obituary is a backup that restores.\n\nThat last word is the whole discipline. A backup is a file; a recovery is a proven process. Automate the backup — managed databases offer daily snapshots and point-in-time recovery, turn both on. Store copies somewhere the original failure cannot reach: a different region, a different account, a different provider. Then actually restore it, on a schedule, into a fresh database, and check the data is there — because the backup job that has been silently writing empty files for six months is a classic. Write down the recovery steps while you are calm, and know your two numbers: how much data you can afford to lose (hours? minutes?) and how long you can afford to be down. Those numbers decide how often you back up and how much you spend.",
  "he": "השאלה היא לא אם תאבד נתונים; אלא מתי, וכמה, וכמה זמן ייקח לחזור. DELETE שגוי בלי WHERE. מיגרציה שמוחקת את העמודה עם הנתונים עדיין בפנים. מפתח כופרה. חשבון ענן שהושעה בגלל בלבול בחיוב. סוכן AI עם גישה למסד הנתונים שהבין לא נכון את ההוראה. כל אחד מאלה קורה למישהו כל יום, וההבדל בין אנקדוטה להספד הוא גיבוי שמשתחזר.\n\nהמילה האחרונה היא כל המשמעת. גיבוי הוא קובץ; שחזור הוא תהליך מוכח. תאטמט את הגיבוי — מסדי נתונים מנוהלים מציעים snapshots יומיים ושחזור לנקודת זמן, תפעיל את שניהם. תשמור עותקים במקום שהכשל המקורי לא יכול להגיע אליו: אזור אחר, חשבון אחר, ספק אחר. ואז באמת תשחזר אותו, לפי לוח זמנים, למסד נתונים טרי, ותבדוק שהנתונים שם — כי job הגיבוי שכתב בשקט קבצים ריקים שישה חודשים הוא קלאסיקה. תכתוב את צעדי השחזור בזמן שאתה רגוע, ותדע את שני המספרים שלך: כמה נתונים אתה יכול להרשות לעצמך לאבד (שעות? דקות?) וכמה זמן אתה יכול להרשות לעצמך להיות למטה. המספרים האלה מחליטים כמה פעמים אתה מגבה וכמה אתה משלם."
 },
 "Audit log": {
  "en": "Application logs tell you what the code did. An audit log tells you what the people did: who logged in and from where, who changed a permission, who exported the customer list, who deleted the record, who viewed the sensitive file. It is written as a fact — actor, action, target, timestamp, and enough context to reconstruct the moment — and it is never edited or deleted, because its entire value is that it can be trusted after the fact.\n\nYou need it on the day something goes wrong. A customer asks who accessed their data. A record is missing and three people had the rights to delete it. A key was used at 3am and you need to know from which account. Compliance regimes — SOC 2, GDPR, HIPAA — all require some form of it. And it is trivially cheap on day one: one table, one function called from the handful of places that do sensitive things. Retroactively, it is impossible; you cannot log what already happened. Keep it separate from debug logs, keep it longer, and make sure the admin who could misuse the system is not the only one who can read or clear it.",
  "he": "לוגי אפליקציה אומרים לך מה הקוד עשה. יומן ביקורת אומר לך מה האנשים עשו: מי התחבר ומאיפה, מי שינה הרשאה, מי ייצא את רשימת הלקוחות, מי מחק את הרשומה, מי צפה בקובץ הרגיש. הוא נכתב כעובדה — פועל, פעולה, יעד, חותמת זמן, ומספיק הקשר כדי לשחזר את הרגע — והוא לעולם לא נערך או נמחק, כי כל הערך שלו הוא שאפשר לבטוח בו בדיעבד.\n\nאתה צריך אותו ביום שמשהו משתבש. לקוח שואל מי ניגש לנתונים שלו. רשומה חסרה ולשלושה אנשים היו הרשאות למחוק אותה. מפתח שימש בשלוש לפנות בוקר ואתה צריך לדעת מאיזה חשבון. משטרי תאימות — SOC 2, GDPR, HIPAA — כולם דורשים צורה כלשהי שלו. והוא זול להחריד ביום הראשון: טבלה אחת, פונקציה אחת שנקראת מהמקומות המעטים שעושים דברים רגישים. בדיעבד, הוא בלתי אפשרי; אי אפשר לרשום מה שכבר קרה. תשמור אותו נפרד מלוגי הדיבוג, תשמור אותו יותר זמן, ותוודא שהאדמין שיכול לנצל את המערכת לרעה הוא לא היחיד שיכול לקרוא או לנקות אותו."
 },
 "Domain & registrar": {
  "en": "A domain is a name you rent, not buy: example.com is yours for as long as you keep paying the registrar (Namecheap, Cloudflare, Porkbun, GoDaddy) a yearly fee, typically 10 to 15 dollars for a .com. The registrar records who owns the name and, crucially, which nameservers answer questions about it. Those nameservers — often at Cloudflare or your DNS host rather than at the registrar — are where your actual DNS records live. Two settings in two places, and confusing them is the first thing that goes wrong when a new builder tries to \"point the domain at Vercel\".\n\nExpiry is the outage nobody monitors. A card that expired quietly, a renewal email that went to an old inbox, and one morning the site resolves to a parking page; after a grace period, someone else can buy the name. Turn on auto-renew, add a second contact to the account, and enable the transfer lock so a phished login cannot move the domain to another registrar. If a freelancer, an agency or a hosting provider offers to \"handle the domain for you\", make sure the registration is still in your name: a name registered under someone else's account is a name you do not own, and getting it back is a legal process rather than a support ticket.",
  "he": "דומיין הוא שם שאתה שוכר, לא קונה: example.com שלך כל עוד אתה ממשיך לשלם לרשם (Namecheap, Cloudflare, Porkbun, GoDaddy) דמי שימוש שנתיים, בדרך כלל 10 עד 15 דולר ל-.com. הרשם מתעד מי הבעלים של השם, והחשוב מכל — אילו שרתי שמות (nameservers) עונים על שאלות לגביו. שרתי השמות האלה — לרוב אצל Cloudflare או אצל ספק ה-DNS שלך ולא אצל הרשם — הם המקום שבו רשומות ה-DNS האמיתיות שלך חיות. שתי הגדרות בשני מקומות, והבלבול ביניהן הוא הדבר הראשון שמשתבש כשבונה חדש מנסה ״להפנות את הדומיין ל-Vercel״.\n\nתפוגה היא ההשבתה שאף אחד לא מנטר. כרטיס אשראי שפג בשקט, מייל חידוש שהלך לתיבה ישנה, ובוקר אחד האתר מצביע על דף חניה; אחרי תקופת חסד, מישהו אחר יכול לקנות את השם. תדליק חידוש אוטומטי, תוסיף איש קשר שני לחשבון, ותפעיל נעילת העברה (transfer lock) כדי שהתחברות שנגנבה בפישינג לא תוכל להעביר את הדומיין לרשם אחר. אם פרילנסר, סוכנות או ספק אחסון מציעים ״לטפל בדומיין בשבילך״, תוודא שהרישום עדיין על שמך: שם שנרשם תחת חשבון של מישהו אחר הוא שם שאינו שלך, ולהחזיר אותו זה תהליך משפטי ולא טיקט לתמיכה."
 },
 "DNS records (A, CNAME, TXT)": {
  "en": "DNS is a phone book and records are its entries. An A record maps a name to an IPv4 address (AAAA does the same for IPv6): example.com → 76.76.21.21. A CNAME says \"this name is an alias for that name\": www.example.com → cname.vercel-dns.com, so when the host changes its IP you do not have to. TXT records carry text that other systems read: the verification string Google or Vercel asks you to add to prove ownership, and the SPF and DKIM entries that tell mail servers who may send email as your domain. MX records name the servers that receive your email. You will touch these four types and almost nothing else.\n\nTwo rules save hours. First, a CNAME cannot sit at the bare domain (example.com) alongside other records, which is why hosts give you an A record for the root and a CNAME for www; Cloudflare's \"CNAME flattening\" hides this. Second, every record has a TTL, and resolvers around the world cache the old answer until it expires. A change you made a minute ago can look \"not working\" for an hour while your laptop and your ISP still hold the old value. Check with dig against 1.1.1.1 or with dnschecker.org before assuming the change failed, and lower the TTL to 300 seconds a day before a planned migration so the switch itself is quick.",
  "he": "DNS הוא ספר טלפונים והרשומות הן הערכים בו. רשומת A ממפה שם לכתובת IPv4 (AAAA עושה את אותו הדבר ל-IPv6): example.com → 76.76.21.21. CNAME אומר ״השם הזה הוא כינוי לשם ההוא״: www.example.com → cname.vercel-dns.com, כך שכשהמארח משנה את ה-IP שלו, אתה לא צריך לשנות כלום. רשומות TXT נושאות טקסט שמערכות אחרות קוראות: מחרוזת האימות שגוגל או Vercel מבקשים שתוסיף כדי להוכיח בעלות, ורשומות SPF ו-DKIM שאומרות לשרתי מייל מי רשאי לשלוח מייל בשם הדומיין שלך. רשומות MX מציינות את השרתים שמקבלים את המייל שלך. בארבעת הסוגים האלה תיגע, וכמעט בשום דבר אחר.\n\nשני כללים חוסכים שעות. ראשית, CNAME לא יכול לשבת על הדומיין החשוף (example.com) לצד רשומות אחרות, ולכן מארחים נותנים לך רשומת A לשורש ו-CNAME ל-www; ״CNAME flattening״ של Cloudflare מסתיר את זה. שנית, לכל רשומה יש TTL, ו-resolvers ברחבי העולם שומרים את התשובה הישנה במטמון עד שהיא פגה. שינוי שעשית לפני דקה יכול להיראות ״לא עובד״ במשך שעה בזמן שהלפטופ שלך וספק האינטרנט שלך עדיין מחזיקים את הערך הישן. תבדוק עם dig מול 1.1.1.1 או עם dnschecker.org לפני שאתה מסיק שהשינוי נכשל, ותוריד את ה-TTL ל-300 שניות יום לפני מיגרציה מתוכננת כדי שהמעבר עצמו יהיה מהיר."
 },
 "Public vs private IP": {
  "en": "Your laptop has an address like 192.168.1.24, and so do roughly a billion other laptops. Addresses in 10.x.x.x, 172.16-31.x.x and 192.168.x.x are private: they mean something only inside one network and are never routed across the internet. Your router owns one public address — the one whatismyip.com shows — and performs NAT: it rewrites outgoing packets to come from that public address and remembers who to hand each reply to. Everything behind the router shares it. This is why localhost:3000 works on your machine and http://192.168.1.24:3000 works from your phone on the same Wi-Fi, but nothing outside the house can reach either.\n\nA server in the cloud has the same split. An EC2 instance gets a private address inside your VPC and, optionally, a public one; your database usually gets only a private one, which is exactly what you want. When you need to show a local build to someone remote, the honest options are a tunnel — ngrok, Cloudflare Tunnel, Tailscale — which opens an outbound connection from your machine and forwards traffic back through it, or simply pushing a preview deployment. Port-forwarding on your home router also works, but it exposes your laptop to the whole internet with none of the firewall discipline a server gets; do not do it for anything you would not run on a public server.",
