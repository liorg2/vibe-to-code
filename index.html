<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vibe → Code</title>
<meta name="description" content="The vocabulary and mental models of professional software development, for people who build with AI. English and Hebrew.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Heebo:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0b0f; --card:#151822; --card2:#1b1f2c; --code:#0e1017;
  --line:#262b3a; --tx:#e8eaf0; --tx2:#9aa1b4; --tx3:#6b7286;
  --acc:#6c5ce7; --acc2:#00d2b8; --warn:#ffb020; --bad:#ff5c72; --good:#22c98a;
  --grad:linear-gradient(135deg,#6c5ce7,#00d2b8);
  --r:16px; --shadow:0 12px 40px rgba(0,0,0,.45);
}
:root[data-theme="light"]{
  --bg:#f7f8fb; --card:#ffffff; --card2:#f3f5fa; --code:#12141c;
  --line:#e3e7f0; --tx:#12141c; --tx2:#5a6279; --tx3:#8a91a6;
  --shadow:0 12px 32px rgba(20,25,50,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased}
body[dir="rtl"]{font-family:Heebo,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60vw 60vw at 15% -10%,rgba(108,92,231,.18),transparent 60%),
             radial-gradient(50vw 50vw at 90% 0%,rgba(0,210,184,.12),transparent 60%)}
.wrap{position:relative;z-index:1}
code,pre,.mono{font-family:"JetBrains Mono",ui-monospace,monospace}

/* top bar */
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:14px}
.logo{font-weight:800;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;
  text-decoration:none;color:inherit}
.logo .dot{width:26px;height:26px;border-radius:9px;background:var(--grad);display:grid;
  place-items:center;font-size:13px;color:#fff}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--card);color:var(--tx);padding:8px 14px;
  border-radius:10px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--acc);transform:translateY(-1px)}
.btn.prim{background:var(--grad);border:none;color:#fff}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--tx2);padding:8px 13px;font:inherit;
  font-size:13px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--acc);color:#fff}
#search{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 13px;
  color:var(--tx);font:inherit;font-size:14px;width:200px}
#search:focus{outline:none;border-color:var(--acc)}
.progbar{height:3px;background:var(--line)}
.progbar i{display:block;height:100%;width:0;background:var(--grad);transition:width .4s}

/* hero */
.hero{max-width:1240px;margin:0 auto;padding:76px 24px 52px;text-align:center}
.pill{display:inline-block;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;
  border:1px solid var(--line);background:var(--card);color:var(--tx2);margin-bottom:22px}
h1{font-size:clamp(34px,6vw,62px);line-height:1.05;letter-spacing:-.035em;font-weight:800}
h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:640px;margin:18px auto 0;color:var(--tx2);font-size:18px}
.hero .cta{margin-top:30px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn.big{padding:13px 26px;font-size:15px;border-radius:12px}

/* layout */
main{max-width:1240px;margin:0 auto;padding:0 24px 100px;display:grid;
  grid-template-columns:272px 1fr;gap:34px;align-items:start}
nav.side{position:sticky;top:86px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:12px;box-shadow:var(--shadow);max-height:calc(100vh - 110px);overflow:auto}
nav.side h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--tx3);margin:6px 8px 8px}
nav.side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;
  color:var(--tx2);text-decoration:none;font-size:14px;font-weight:500;transition:.15s}
nav.side a:hover{background:var(--card2);color:var(--tx)}
nav.side a.on{background:var(--card2);color:var(--tx);box-shadow:inset 2px 0 0 var(--acc)}
body[dir="rtl"] nav.side a.on{box-shadow:inset -2px 0 0 var(--acc)}
nav.side a .ic{width:24px;height:24px;border-radius:7px;background:var(--card2);display:grid;
  place-items:center;font-size:12px;flex:none;border:1px solid var(--line)}
nav.side a .cnt{margin-inline-start:auto;font-size:11px;color:var(--tx3);font-family:"JetBrains Mono",monospace}
nav.side hr{border:0;border-top:1px solid var(--line);margin:8px 6px}

/* module page */
section.mod{scroll-margin-top:90px;margin-bottom:40px}
.mhead{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.mhead .ic{width:44px;height:44px;border-radius:13px;background:var(--grad);display:grid;
  place-items:center;color:#fff;font-size:18px;flex:none}
.mhead h2{font-size:26px;letter-spacing:-.02em;font-weight:800}
.mhead .n{margin-inline-start:auto;font-family:"JetBrains Mono",monospace;font-size:12px;
  color:var(--tx3);text-align:end;flex:none}
.mblurb{color:var(--tx2);margin:0 0 20px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.term{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;transition:.18s;position:relative;overflow:hidden;cursor:pointer;
  display:block;text-decoration:none;color:inherit}
.term:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--acc) 50%,var(--line));
  box-shadow:var(--shadow)}
.term::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;
  background:var(--grad);opacity:0;transition:.18s}
.term.done::after{opacity:1}
.term.done{background:var(--card2)}
.term h4{font-size:16px;font-weight:700;letter-spacing:-.01em;margin-bottom:8px;padding-inline-end:34px}
.term p{color:var(--tx2);font-size:14.5px}
.term .more{margin-top:10px;font-size:12px;font-weight:700;color:var(--acc2);
  letter-spacing:.04em;text-transform:uppercase}
.chk{position:absolute;inset-inline-end:14px;top:16px;width:22px;height:22px;border-radius:7px;
  border:1.5px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;
  color:transparent;font-size:12px;transition:.15s;padding:0;z-index:2}
.chk:hover{border-color:var(--acc)}
.term.done .chk{background:var(--grad);border-color:transparent;color:#fff}

/* home index */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.mcard{display:block;text-decoration:none;color:inherit;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);padding:20px;transition:.18s}
.mcard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--acc) 50%,var(--line));
  box-shadow:var(--shadow)}
.mcard .row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.mcard .ic{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;
  place-items:center;color:#fff;font-size:17px;flex:none}
.mcard .num{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--tx3)}
.mcard h3{font-size:17px;font-weight:700;letter-spacing:-.01em}
.mcard p{color:var(--tx2);font-size:14px;min-height:44px}
.mcard .mini{margin-top:14px;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.mcard .mini i{display:block;height:100%;background:var(--grad);transition:width .4s}
.mcard .cnt{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--tx3);
  margin-top:6px;display:block}
.mcard.special{border-color:color-mix(in srgb,var(--acc2) 45%,var(--line))}
.mcard.special .ic{background:linear-gradient(135deg,#00d2b8,#ffb020)}

/* slide */
.slide{background:var(--card);border:1px solid var(--line);border-radius:22px;
  padding:clamp(24px,4vw,44px);box-shadow:var(--shadow)}
.slide .kicker{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--acc2);
  letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.slide h2{font-size:clamp(26px,4vw,40px);line-height:1.15;letter-spacing:-.03em;font-weight:800}
.slide .lede{font-size:clamp(17px,2.2vw,21px);color:var(--tx);margin-top:16px;
  padding-inline-start:16px;border-inline-start:3px solid var(--acc)}
.slide .body{margin-top:26px;color:var(--tx2);font-size:16.5px;max-width:72ch}
.slide .body p{margin-bottom:16px}
.slide .cal{margin-top:26px;background:var(--card2);border:1px solid var(--line);
  border-radius:14px;padding:16px 18px}
.slide .cal b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--acc2);margin-bottom:6px}
.slide .cal p{color:var(--tx);font-size:15.5px}
.ex{margin-top:26px}
.ex .cap{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3);
  margin-bottom:8px;font-weight:700}
pre.code{background:var(--code);border:1px solid var(--line);border-radius:14px;padding:18px;
  overflow-x:auto;color:#dfe4f0;font-size:13.5px;line-height:1.65;direction:ltr;text-align:left}
.slidebar{display:flex;gap:10px;align-items:center;margin-top:28px;flex-wrap:wrap}
.slidebar .grow{flex:1}
.kbd{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--tx3);
  border:1px solid var(--line);border-radius:6px;padding:2px 6px}

/* quiz */
.quiz{margin-top:34px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:24px}
.quiz > h3{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.quiz > .sub{color:var(--tx2);font-size:14px;margin-bottom:20px}
.q{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}
.q:first-of-type{border-top:0;padding-top:0;margin-top:0}
.q .qt{font-weight:700;font-size:16px;margin-bottom:12px}
.q .qt i{font-family:"JetBrains Mono",monospace;font-style:normal;color:var(--tx3);
  margin-inline-end:8px;font-size:13px}
.opt{display:block;width:100%;text-align:start;background:var(--card2);border:1px solid var(--line);
  color:var(--tx);border-radius:11px;padding:11px 14px;margin-bottom:8px;font:inherit;font-size:14.5px;
  cursor:pointer;transition:.13s}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card2))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card2))}
.opt .mk{float:inline-end;font-weight:800}
.ans{margin-top:8px;font-size:14.5px;color:var(--tx2);background:var(--card2);
  border-inline-start:3px solid var(--acc2);border-radius:0 11px 11px 0;padding:11px 14px}
body[dir="rtl"] .ans{border-radius:11px 0 0 11px}
.score{margin-top:22px;padding:14px 18px;border-radius:12px;border:1px dashed var(--line);
  text-align:center;font-weight:700}
.score.pass{border-color:var(--good);color:var(--good)}

/* pager / crumb */
.pager{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
.pager a{flex:1;min-width:200px;text-decoration:none;color:inherit;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;transition:.18s}
.pager a:hover{border-color:var(--acc);transform:translateY(-2px)}
.pager a b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--tx3);margin-bottom:4px;font-weight:700}
.pager a span{font-weight:700;font-size:15px}
.pager a.nx{text-align:end}
.pager .finish{flex:1;min-width:200px;margin:0}
.crumb{display:inline-block;margin-bottom:16px;color:var(--tx2);text-decoration:none;
  font-size:14px;font-weight:600}
.crumb:hover{color:var(--acc)}
.finish{text-align:center;padding:30px;border:1px dashed var(--line);border-radius:var(--r);color:var(--tx2)}
.finish.win{border-color:var(--acc2);color:var(--tx)}
.empty{padding:40px;text-align:center;color:var(--tx3)}

/* project */
.note{border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));
  background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:14px;
  padding:14px 18px;color:var(--tx);font-size:14.5px;margin-bottom:24px}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:22px;margin-bottom:16px}
.step .top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.step .no{width:34px;height:34px;border-radius:10px;background:var(--grad);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.step h3{font-size:18px;font-weight:700;letter-spacing:-.01em}
.step .goal{color:var(--tx);font-size:15px;margin-bottom:10px}
.step .whyp{color:var(--tx2);font-size:14.5px;margin-bottom:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tags a{font-size:11.5px;text-decoration:none;background:var(--card2);border:1px solid var(--line);
  color:var(--tx2);padding:3px 9px;border-radius:99px;transition:.13s}
.tags a:hover{border-color:var(--acc2);color:var(--tx)}
.promptbox{position:relative}
.promptbox .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--acc2);
  font-weight:700;margin-bottom:8px}
.copy{position:absolute;inset-inline-end:10px;top:30px;z-index:2;font-size:12px;padding:5px 10px}

/* checklist */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}
.col{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.col.no{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.col > h3{font-size:18px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.col.ok > h3{color:var(--good)} .col.no > h3{color:var(--bad)}
.col > .sub{color:var(--tx2);font-size:13.5px;margin-bottom:16px}
.ci{border-top:1px solid var(--line);padding:13px 0 0;margin-top:13px}
.ci:first-of-type{border-top:0;margin-top:0;padding-top:0}
.ci label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-weight:600;font-size:15px}
.ci input{margin-top:5px;accent-color:var(--acc);width:16px;height:16px;flex:none}
.ci p{color:var(--tx2);font-size:14px;margin-top:5px;padding-inline-start:26px}
.col.no .ci label{cursor:default}
.col.no .ci .x{color:var(--bad);font-weight:800;flex:none}

@media(max-width:900px){
  main{grid-template-columns:1fr}
  nav.side{position:static;max-height:none}
  #search{width:130px}
  .bar{flex-wrap:wrap;gap:10px}
  .copy{position:static;margin-bottom:8px}
}

/* grid/flex children default to min-width:auto, so a wide <pre> stretches
   the whole column instead of scrolling inside it */
main > #content{min-width:0}
.slide,.step,.quiz,.col,.promptbox,.mod,.cards,.grid,.cols{min-width:0}
pre.code{max-width:100%}

#who{font-size:13px;opacity:.7;max-width:14ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- learning paths (home) ---- */
.paths{margin-bottom:26px}
.phead h3{font-size:20px;font-weight:800;letter-spacing:-.01em}
.phead p{color:var(--tx2);font-size:14px;margin-bottom:14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.path{display:block;text-decoration:none;color:inherit;background:var(--card2);
  border:1px solid var(--line);border-radius:var(--r);padding:18px;transition:.18s;min-width:0}
.path:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}
.path .row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.path .ic{font-size:20px}
.path h4{font-size:16px;font-weight:700}
.path p{color:var(--tx2);font-size:14px}
.path .chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 10px}
.path .chips span{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--card);
  border:1px solid var(--line);color:var(--tx3)}
.path .mini{height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.path .mini i{display:block;height:100%;background:var(--grad)}

/* ---- ask-the-AI disclosure on a slide ---- */
.ask{margin-top:22px;border:1px dashed var(--line);border-radius:var(--r);padding:14px 16px}
.ask summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--acc2)}
.ask .sub{color:var(--tx3);font-size:13px;margin:6px 0 4px}
.ask .promptbox{margin-top:10px}

/* ---- architectures ---- */
.mini-dia{font-size:9.5px;line-height:1.35;max-height:170px;overflow:hidden;opacity:.75;
  background:var(--code);padding:10px;border-radius:10px;margin-top:10px}
.dia{font-size:12.5px;line-height:1.5;overflow-x:auto}
.arch h3{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;
  color:var(--tx3);margin:26px 0 10px}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.part{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.part b{font-size:14px}
.part p{color:var(--tx2);font-size:13.5px;margin-top:4px}
.aboxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:22px}
.abox{background:var(--card2);border:1px solid var(--line);border-inline-start:3px solid var(--tx3);
  border-radius:12px;padding:12px 14px;min-width:0}
.abox.ok{border-inline-start-color:var(--good)}
.abox.no{border-inline-start-color:var(--bad)}
.abox b{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3)}
.abox p{font-size:14px;margin-top:5px}

/* ---- glossary ---- */
.gloss{columns:3 240px;column-gap:20px}
.gl{break-inside:avoid;margin-bottom:18px}
.gl h4{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--acc2);
  border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:6px}
.gl a{display:flex;justify-content:space-between;gap:10px;align-items:baseline;
  padding:5px 6px;border-radius:8px;text-decoration:none;color:var(--tx2);font-size:14px}
.gl a:hover{background:var(--card2);color:var(--tx)}
.gl a.done{color:var(--tx3)}
.gl a.done span{text-decoration:line-through;text-decoration-color:var(--acc2)}
.gl a i{font-size:11px;color:var(--tx3);font-style:normal;white-space:nowrap}

/* ---- flashcards ---- */
.flash{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:44px 28px;text-align:center;cursor:pointer;min-height:260px;
  display:flex;flex-direction:column;justify-content:center;gap:12px;box-shadow:var(--shadow)}
.flash:hover{border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}
.flash .fk{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--tx3);
  text-transform:uppercase;letter-spacing:.1em}
.flash h2{font-size:30px;font-weight:800;letter-spacing:-.02em}
.flash .fhint{color:var(--tx3);font-size:13px}
.flash .fb{max-width:620px;margin:0 auto;color:var(--tx2);font-size:15.5px}
.flash .fb .w{margin-top:12px;color:var(--acc2);font-size:14px}
.fbar{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.fbar .grow{flex:1}

@media (max-width:900px){ .gloss{columns:1} .flash{padding:32px 18px} .flash h2{font-size:24px} }

</style>
</head>
<body dir="ltr">
<div class="wrap">

<header>
  <div class="bar">
    <a class="logo" href="#/"><span class="dot">◆</span><span id="brand">Vibe → Code</span></a>
    <div class="spacer"></div>

 "Source code": {
  "en": "Source code is a description of a machine, written down. Not the machine itself, and not a set of hints about it — a complete description, in a language strict enough that something with no judgement can follow it. The strictness is the whole job. A human reader fills in what you left out; a computer executes exactly the gap you left, and calls the result your intention. Everything else — files, folders, frameworks — is bookkeeping around that one fact.\n\nA team ships a signup form. The requirement said \"email must be valid\", so the code checks that the text contains an @. On the third day a customer types \"lior@@globale \" with a trailing space, the record is written, the welcome email bounces, and support spends an hour explaining why the account exists but cannot be reached. Nothing crashed. No error appeared anywhere. The code did precisely what it said, and what it said was thinner than what anyone meant. Three lines of text, written months apart by two different people, one of whom is now on another team.\n\nWhen you build with an agent, this is the failure mode you should expect, because the agent is an extremely fast writer of plausible descriptions. It will produce code that reads correctly and handles the cases your prompt mentioned. The cases you did not mention become silent behaviour that nobody chose. So read what it wrote — it is plain text, that is the point — and read it asking one question: what input makes this do something stupid? Empty string, zero, negative number, a name with an apostrophe, two users clicking at once. Ask the agent that question directly and it will usually find its own holes; it simply was not asked. And keep files small enough to read in one sitting; a two-thousand-line file is where both humans and agents stop reading and start guessing.",
  "he": "קוד מקור הוא תיאור של מכונה, כתוב. לא המכונה עצמה, ולא אוסף רמזים עליה — תיאור מלא, בשפה מחמירה מספיק כדי שמשהו חסר שיקול דעת יוכל לבצע אותו. ההקפדה הזאת היא כל העבודה. קורא אנושי משלים את מה שהשמטת; מחשב מריץ בדיוק את החור שהשארת, וקורא לתוצאה הכוונה שלך. כל השאר — קבצים, תיקיות, פריימוורקים — הוא הנהלת חשבונות סביב העובדה האחת הזאת.\n\nצוות מעלה טופס הרשמה. הדרישה אמרה ״אימייל חייב להיות תקין״, אז הקוד בודק שהטקסט מכיל @. ביום השלישי לקוח מקליד ״lior@@globale״ עם רווח בסוף, הרשומה נכתבת, מייל הברוכים הבאים חוזר, ותמיכה מבזבזת שעה בהסבר למה החשבון קיים אבל אי אפשר להגיע אליו. שום דבר לא קרס. שום שגיאה לא הופיעה. הקוד עשה בדיוק מה שהוא אמר, ומה שהוא אמר היה דק ממה שמישהו התכוון. שלוש שורות טקסט, שנכתבו בהפרש של חודשים על ידי שני אנשים, שאחד מהם כבר בצוות אחר.\n\nכשאתה בונה עם סוכן, זה מצב הכשל שכדאי לצפות לו, כי הסוכן הוא כותב מהיר במיוחד של תיאורים סבירים. הוא ייצר קוד שנקרא נכון ומטפל במקרים שהפרומפט שלך הזכיר. המקרים שלא הזכרת הופכים להתנהגות שקטה שאף אחד לא בחר. אז תקרא מה שהוא כתב — זה טקסט רגיל, זו כל הנקודה — ותקרא אותו עם שאלה אחת: איזה קלט יגרום לזה לעשות שטות? מחרוזת ריקה, אפס, מספר שלילי, שם עם גרש, שני משתמשים שלוחצים באותו רגע. תשאל את הסוכן בדיוק את זה והוא בדרך כלל ימצא את החורים של עצמו; פשוט לא שאלו אותו. ותשאיר קבצים קטנים מספיק כדי לקרוא אותם בישיבה אחת; קובץ של אלפיים שורות הוא המקום שבו גם בני אדם וגם סוכנים מפסיקים לקרוא ומתחילים לנחש."

 "Compiler / Interpreter": {
  "en": "The difference is when the translation happens, and that single choice decides when you find out you were wrong. A compiler reads your whole program before anything runs, turns it into machine code, and refuses to produce output if it cannot make sense of a line — even a line that would never have executed. An interpreter reads and runs as it goes, so a broken line sitting in a rarely-used branch is a perfectly happy program right up until someone reaches that branch.\n\nTwo teams ship the same typo: a function called sendInvioce. The Go service fails to build in CI, a red X appears ninety seconds after the push, and the developer fixes it before lunch. The Python service builds nothing, deploys cleanly, serves traffic all week, and then on the 1st of the month the billing job runs its once-a-month path and dies with NameError: name 'sendInvioce' is not defined. Same mistake, same cost to fix, discovered eleven days and one missed invoice run apart. Nothing about the typo was harder in Python; the feedback simply arrived from a customer instead of from a machine.\n\nThe practical consequence for you: know which kind of language your project is in, because it tells you how much a successful build actually proves. In a compiled or type-checked project, \"it builds \" is real evidence that the agent's refactor did not break call sites. In an interpreted one, \"it builds \" means nothing — the equivalent evidence is running the code, which means tests, or at minimum clicking through the path you changed. This is also the strongest argument for TypeScript over plain JavaScript on an AI-heavy project: it buys back a compiler's up-front check on work you did not write yourself. Either way, never ignore a warning the toolchain prints during a build that succeeded — in practice that is where next week's production error is announced in advance.",
  "he": "ההבדל הוא מתי התרגום קורה, והבחירה האחת הזאת קובעת מתי תגלה שטעית. קומפיילר קורא את כל התוכנית לפני שמשהו רץ, הופך אותה לקוד מכונה, ומסרב לייצר פלט אם הוא לא מצליח להבין שורה — גם שורה שלעולם לא הייתה מתבצעת. אינטרפרטר קורא ומריץ תוך כדי, אז שורה שבורה שיושבת בענף שכמעט לא בשימוש היא תוכנית מאושרת לגמרי, עד שמישהו מגיע לענף הזה.\n\nשני צוותים מעלים את אותה שגיאת כתיב: פונקציה בשם sendInvioce. השירות ב-Go נכשל בבילד ב-CI, איקס אדום מופיע תשעים שניות אחרי הפוש, והמפתח מתקן לפני הצהריים. השירות בפייתון לא בונה כלום, עולה לאוויר נקי, מגיש תעבורה כל השבוע, ואז ב-1 בחודש ג׳וב החיוב רץ בנתיב החודשי שלו ומת עם NameError: name 'sendInvioce' is not defined. אותה טעות, אותו מחיר תיקון, נתגלתה בהפרש של אחד עשר ימים והרצת חיוב אחת שהוחמצה. שום דבר בשגיאה לא היה קשה יותר בפייתון; המשוב פשוט הגיע מלקוח במקום ממכונה.\n\nהמסקנה המעשית בשבילך: תדע באיזה סוג שפה הפרויקט שלך, כי זה אומר לך כמה בילד מוצלח באמת מוכיח. בפרויקט מקומפל או עם בדיקת טיפוסים, ״זה בונה״ הוא ראיה אמיתית שהריפקטור של הסוכן לא שבר קריאות. בפרויקט מפורש, ״זה בונה״ לא אומר כלום — הראיה המקבילה היא להריץ את הקוד, כלומר טסטים, או לפחות לעבור ידנית על הנתיב ששינית. זה גם הטיעון החזק ביותר ל-TypeScript על פני ג׳אווהסקריפט רגיל בפרויקט עתיר-AI: הוא קונה בחזרה בדיקה מוקדמת של קומפיילר על קוד שלא כתבת בעצמך. בכל מקרה, אל תתעלם מאזהרה שהכלים מדפיסים בבילד שהצליח — בפועל שם השגיאה של השבוע הבא בפרודקשן מוכרזת מראש."

 "Runtime": {
  "en": "Your code never runs alone. It runs inside an engine that hands it memory, a clock, a filesystem, a network stack and a set of rules about what is allowed — Node for server-side JavaScript, the browser for the same language on a page, CPython for Python, the JVM for Java. That engine has a version, a configuration and bugs of its own, and none of that lives in your repository. Two machines running identical code are not running the same program if their runtimes differ.\n\nA developer builds a dashboard locally on Node 20 and it works. CI runs Node 18 because the workflow file was copied from an older project, and the build fails on a line using Object.groupBy, which only exists from Node 21. She adds a polyfill, CI goes green, and the app is deployed to a container that turns out to be Node 22 — where a dependency using a removed internal API crashes on the first request with a message mentioning nothing she wrote. Three machines, one codebase, three different programs. The fix is boring and permanent: pin the version in one place and make all three read it.\n\nThis is what \"works on my machine \" almost always means, and it is the reason containers exist — a container is the runtime plus its configuration, shipped as one artifact so every environment gets the same engine. When an agent gives you code that fails only in one place, say which runtime and which version in your prompt, and paste the actual error rather than describing it. Half the time the answer is not a code change at all: it is an engines field in package.json, an .nvmrc, or a base image tag that says 20 instead of latest. \"latest \" is a moving target, and a build that passed yesterday can fail today without a single line changing.",
  "he": "הקוד שלך אף פעם לא רץ לבד. הוא רץ בתוך מנוע שנותן לו זיכרון, שעון, מערכת קבצים, מחסנית רשת ואוסף חוקים על מה מותר — Node לג׳אווהסקריפט בצד שרת, הדפדפן לאותה שפה בדף, CPython לפייתון, ה-JVM לג׳אווה. למנוע הזה יש גרסה, קונפיגורציה ובאגים משלו, ושום דבר מזה לא נמצא בריפו שלך. שתי מכונות שמריצות קוד זהה לא מריצות את אותה תוכנית אם הרנטיים שלהן שונה.\n\nמפתחת בונה דשבורד מקומית על Node 20 וזה עובד. ה-CI מריץ Node 18 כי קובץ ה-workflow הועתק מפרויקט ישן, והבילד נכשל על שורה שמשתמשת ב-Object.groupBy, שקיים רק מ-Node 21. היא מוסיפה polyfill, ה-CI נהיה ירוק, והאפליקציה עולה לקונטיינר שמתברר שהוא Node 22 — שם תלות שמשתמשת ב-API פנימי שהוסר קורסת בריקווסט הראשון עם הודעה שלא מזכירה שום דבר שהיא כתבה. שלוש מכונות, בסיס קוד אחד, שלוש תוכניות שונות. התיקון משעמם וקבוע: לנעוץ את הגרסה במקום אחד ולגרום לשלושתם לקרוא ממנו.\n\nזה מה ש״אצלי זה עובד״ כמעט תמיד אומר, וזו הסיבה שקונטיינרים קיימים — קונטיינר הוא הרנטיים והקונפיגורציה שלו, נארזים כארטיפקט אחד כך שכל סביבה מקבלת את אותו מנוע. כשסוכן נותן לך קוד שנכשל רק במקום אחד, תגיד בפרומפט איזה רנטיים ואיזו גרסה, ותדביק את השגיאה עצמה במקום לתאר אותה. בחצי מהמקרים התשובה היא בכלל לא שינוי קוד: היא שדה engines ב-package.json, קובץ ‎.nvmrc, או תגית אימג׳ שאומרת 20 במקום latest. ״latest״ הוא מטרה נעה, ובילד שעבר אתמול יכול להיכשל היום בלי ששורה אחת השתנתה."
 },
 "Terminal / CLI": {
  "en": "A terminal is a text conversation with your computer, and its power is not nostalgia — it is composition. Every command reads text and writes text, so the output of one becomes the input of the next, and a tool nobody designed to work with your tool works with your tool anyway. Clicking cannot be piped, scripted, scheduled, diffed or pasted into a bug report. That is why every serious dev tool is a CLI first and grows a GUI later, if ever.\n\nA deploy fails at 18:40 on a Thursday. The dashboard shows a red box saying \"Build failed\". In the terminal, the same failure is a line you can act on: grep the log for the first \"error \" and you see a missing environment variable; one command lists which variables the container actually received; another shows the value is set in staging but not production. Four commands, ninety seconds, and the answer is a config difference rather than a code bug. The same investigation through a web console is six pages of clicking, and at the end you cannot paste what you did to a colleague.\n\nFor AI-assisted work the terminal is where the truth lives, and it is also the most dangerous surface you have. An agent that can run commands can also run the wrong one, and rm, git reset --hard, DROP and force-push do not ask twice. Read commands before approving them, and be suspicious of any one-liner you would not be able to explain. Learn six: how to list files, how to see where you are, how to search text, how to see what is listening on a port, how to read the last part of a log, and how to stop a running process. That handful covers most of what you will ever need, and it makes an agent's suggestions checkable instead of magic.",
  "he": "טרמינל הוא שיחת טקסט עם המחשב שלך, והכוח שלו הוא לא נוסטלגיה — הוא הרכבה. כל פקודה קוראת טקסט וכותבת טקסט, אז הפלט של אחת הופך לקלט של הבאה, וכלי שאף אחד לא תכנן שיעבוד עם הכלי שלך עובד איתו בכל זאת. אי אפשר לצנרת לחיצות, אי אפשר לסקריפט אותן, לתזמן, להשוות או להדביק אותן בדיווח באג. בגלל זה כל כלי פיתוח רציני הוא קודם כל CLI, ומגדל ממשק גרפי אחר כך, אם בכלל.\n\nדיפלוי נכשל ב-18:40 ביום חמישי. הדשבורד מציג ריבוע אדום שאומר ״Build failed״. בטרמינל, אותו כשל הוא שורה שאפשר לפעול לפיה: grep על הלוג אחרי ה-error הראשון ואתה רואה משתנה סביבה חסר; פקודה אחת מציגה אילו משתנים הקונטיינר באמת קיבל; אחרת מראה שהערך מוגדר בסטייג׳ינג ולא בפרודקשן. ארבע פקודות, תשעים שניות, והתשובה היא הבדל קונפיגורציה ולא באג בקוד. אותה חקירה דרך קונסולת ווב היא שישה מסכים של לחיצות, ובסוף אי אפשר להדביק לעמית מה עשית.\n\nבעבודה עם AI הטרמינל הוא המקום שבו האמת נמצאת, והוא גם המשטח המסוכן ביותר שיש לך. סוכן שיכול להריץ פקודות יכול גם להריץ את הפקודה הלא נכונה, ו-rm, git reset --hard, DROP ופוש בכוח לא שואלים פעמיים. תקרא פקודות לפני שאתה מאשר אותן, ותחשוד בכל שורה שלא היית יודע להסביר. תלמד שש: איך לראות קבצים, איך לדעת איפה אתה, איך לחפש טקסט, איך לראות מי מאזין על פורט, איך לקרוא את סוף הלוג, ואיך לעצור תהליך שרץ. החופן הזה מכסה את רוב מה שתצטרך אי פעם, והוא הופך הצעות של סוכן לניתנות לבדיקה במקום לקסם."
 },
 "Repository (repo)": {
  "en": "A repo is a folder that remembers. Every saved state, who produced it, when, and the sentence they wrote explaining why — all of it kept locally, all of it queryable. That last part matters more than the backup: the history is a searchable record of decisions, so the question \"why on earth is this here? \" has an answer three years later, attached to the line itself.\n\nA rate limit starts rejecting a partner's traffic on a Tuesday. Nobody on the current team wrote it. One command blames the line and points at a commit from fourteen months ago; the message says \"limit to 100/min — vendor asked, see ticket OPS-412\". Total time to answer: twenty seconds, and the decision is now re-openable with the person who made it rather than guessed at. Without that history the team either leaves a rule nobody understands or removes it and rediscovers the reason the hard way, which in this case was a vendor contract.\n\nWorking with an agent makes the repo load-bearing rather than merely nice. An agent can touch thirty files in a minute, and your ability to accept that confidently rests entirely on being able to see exactly what changed and undo all of it with one command. So the habits are: commit before you start a session, not after; commit small and often while it works, so a bad step is one commit to drop rather than an afternoon to untangle; and never let an uncommitted mess accumulate over days. Two things not to put in there: secrets, because history is forever and rotating a leaked key is the only real fix, and large binaries, because Git stores every version of them. If you are not sure the repo is clean before an agent starts, that is the moment to check — not after it has rewritten half your app.",
  "he": "ריפו הוא תיקייה שזוכרת. כל מצב שנשמר, מי יצר אותו, מתי, והמשפט שהוא כתב כדי להסביר למה — הכול נשמר מקומית, הכול ניתן לשאילתה. החלק האחרון חשוב יותר מהגיבוי: ההיסטוריה היא תיעוד ניתן לחיפוש של החלטות, כך שלשאלה ״למה לעזאזל זה כאן?״ יש תשובה שלוש שנים אחר כך, צמודה לשורה עצמה.\n\nהגבלת קצב מתחילה לדחות תעבורה של שותף ביום שלישי. אף אחד בצוות הנוכחי לא כתב אותה. פקודה אחת עושה blame על השורה ומצביעה על קומיט מלפני ארבעה עשר חודשים; ההודעה אומרת ״limit to 100/min — vendor asked, see ticket OPS-412״. זמן כולל לתשובה: עשרים שניות, ועכשיו אפשר לפתוח מחדש את ההחלטה מול מי שקיבל אותה במקום לנחש אותה. בלי ההיסטוריה הזאת הצוות או משאיר חוק שאף אחד לא מבין, או מוחק אותו ומגלה את הסיבה בדרך הקשה — שבמקרה הזה הייתה חוזה עם ספק.\n\nעבודה עם סוכן הופכת את הריפו לקריטי ולא רק לנחמד. סוכן יכול לגעת בשלושים קבצים בדקה, והיכולת שלך לקבל את זה בביטחון נשענת כולה על כך שאתה יכול לראות בדיוק מה השתנה ולבטל הכול בפקודה אחת. אז ההרגלים הם: לעשות קומיט לפני שמתחילים סשן, לא אחריו; לעשות קומיטים קטנים ותכופים תוך כדי, כדי שצעד גרוע יהיה קומיט אחד לזרוק ולא אחר צהריים של פירוק; ולא לתת לבלגן לא-מקומט להצטבר על פני ימים. שני דברים שלא שמים שם: סודות, כי ההיסטוריה היא לנצח והחלפת מפתח שדלף היא התיקון האמיתי היחיד, וקבצים בינאריים גדולים, כי Git שומר כל גרסה שלהם. אם אתה לא בטוח שהריפו נקי לפני שסוכן מתחיל — זה הרגע לבדוק, לא אחרי שהוא שכתב חצי אפליקציה."
 },
 "Commit / Branch / Merge": {
  "en": "These three words describe one habit: work that can be thrown away cheaply. A commit is a saved point with a sentence attached. A branch is a name for a line of commits, so you can build something half-finished without anyone else seeing it. A merge folds that line back into the main one, and when two lines changed the same region, Git stops and asks you which version wins rather than choosing for you.\n\nA developer asks an agent to \"move the checkout to the new pricing service\". Forty minutes and twenty-two files later, checkout works but the admin export silently returns zero rows, because a shared helper changed shape. On main, that is an evening of picking apart what to keep. On a branch called feat/pricing-service, it is two commands: switch back, delete the branch, and the app is exactly as it was at 14:00. The forty minutes are gone; nothing else is. Then the second attempt starts from a known-good state with a sharper prompt, because now you know where it broke.\n\nThe pattern to internalise is branch-before-agent, and small commits during. Write commit messages for the person reading them under pressure at 2am — \"fix checkout 500 on empty cart \" beats \"fix bug \" and costs the same. When a merge conflict appears, do not let the agent resolve it blind; it will happily pick a side and produce code that compiles while dropping someone's change. Look at both versions yourself — that is the one moment where Git is explicitly telling you two intentions collided, and it is the cheapest possible place to notice. If you only take one thing from this module: a branch costs nothing, and regret is expensive. And push the branch even while it is unfinished — a branch that exists only on your laptop is one spilled coffee away from being a story instead of a change.",
  "he": "שלוש המילים האלה מתארות הרגל אחד: עבודה שאפשר לזרוק בזול. קומיט הוא נקודת שמירה עם משפט מוצמד. ברנץ׳ הוא שם לקו של קומיטים, כך שאפשר לבנות משהו חצי-גמור בלי שאף אחד אחר יראה. מרג׳ מקפל את הקו הזה בחזרה לראשי, וכששני קווים שינו את אותו אזור, Git עוצר ושואל איזו גרסה מנצחת במקום לבחור בשבילך.\n\nמפתח מבקש מסוכן ״להעביר את הצ׳קאאוט לשירות התמחור החדש״. ארבעים דקות ועשרים ושניים קבצים אחר כך, הצ׳קאאוט עובד אבל ייצוא האדמין מחזיר בשקט אפס שורות, כי helper משותף שינה צורה. על main, זה ערב שלם של לפרק מה לשמור. על ברנץ׳ בשם feat/pricing-service, זה שתי פקודות: לחזור, למחוק את הברנץ׳, והאפליקציה בדיוק כמו שהייתה ב-14:00. ארבעים הדקות הלכו; שום דבר אחר לא. ואז הניסיון השני מתחיל ממצב תקין ידוע עם פרומפט חד יותר, כי עכשיו אתה יודע איפה זה נשבר.\n\nהתבנית שכדאי להפנים היא ברנץ׳-לפני-סוכן, וקומיטים קטנים תוך כדי. תכתוב הודעות קומיט בשביל מי שיקרא אותן בלחץ בשתיים בלילה — ״fix checkout 500 on empty cart״ עדיף על ״fix bug״ ועולה אותו דבר. כשמופיע קונפליקט במרג׳, אל תיתן לסוכן לפתור אותו בעיוורון; הוא ישמח לבחור צד ולייצר קוד שמתקמפל תוך שהוא מוחק שינוי של מישהו. תסתכל בעצמך על שתי הגרסאות — זה הרגע היחיד שבו Git אומר לך במפורש ששתי כוונות התנגשו, וזה המקום הזול ביותר לשים לב. אם אתה לוקח דבר אחד מהמודול הזה: ברנץ׳ לא עולה כלום, וחרטה עולה ביוקר. ותעשה פוש לברנץ׳ גם כשהוא עוד לא גמור — ברנץ׳ שקיים רק על הלפטופ שלך נמצא במרחק כוס קפה אחת מלהפוך לסיפור במקום לשינוי."
 },
 "Environment": {
  "en": "An environment is a complete copy of your system with its own configuration, its own data and its own audience. Local is yours alone. Staging looks like the real thing and is safe to break. Production has real users, real money and real consequences. The code can be identical in all three and the behaviour still differs, because the parts that are not code — keys, feature flags, database contents, third-party accounts, resource limits — are what define an environment.\n\nA team tests a refund flow in staging against the payment provider's sandbox. Every refund succeeds instantly. In production the same provider returns a 202 and completes asynchronously minutes later, so the code that marks the order refunded immediately after the call is correct in staging and wrong in production. Nobody notices for nine days, until finance reconciles and finds 31 orders marked refunded that were never actually paid back. The bug was never in the code path; it was in the assumption that the two environments behaved alike.\n\nThe discipline that pays: environments differ only in configuration, never in code, and configuration lives in the environment rather than the repository — which is why .env files are not committed and secrets are injected at runtime. Ask an agent to \"add a config value \" and check where it put it; agents cheerfully hardcode a test key or write a localhost URL that works everywhere until it reaches a server. Know which environment your terminal is pointed at before you run anything destructive — a database migration and a truncate look the same until you notice the host. And treat a production console the way you would treat a live microphone: assume every action is visible, irreversible and watched by someone who will be affected by it. And make staging boring to reset: the faster you can rebuild it from nothing, the less tempting it becomes to verify something risky in production instead.",
  "he": "סביבה היא עותק שלם של המערכת שלך עם קונפיגורציה משלה, נתונים משלה וקהל משלה. מקומית היא שלך בלבד. סטייג׳ינג נראית כמו הדבר האמיתי ובטוח לשבור אותה. פרודקשן מחזיקה משתמשים אמיתיים, כסף אמיתי ותוצאות אמיתיות. הקוד יכול להיות זהה בשלושתן וההתנהגות עדיין תשתנה, כי החלקים שהם לא קוד — מפתחות, פיצ׳ר-פלאגים, תוכן במסד הנתונים, חשבונות אצל צד שלישי, מגבלות משאבים — הם מה שמגדיר סביבה.\n\nצוות בודק תהליך זיכוי בסטייג׳ינג מול הסנדבוקס של ספק התשלומים. כל זיכוי מצליח מיידית. בפרודקשן אותו ספק מחזיר 202 ומשלים אסינכרונית כעבור דקות, אז הקוד שמסמן את ההזמנה כמזוכה מיד אחרי הקריאה נכון בסטייג׳ינג ושגוי בפרודקשן. אף אחד לא שם לב תשעה ימים, עד שהכספים עושים התאמה ומוצאים 31 הזמנות מסומנות כמזוכות שמעולם לא הוחזר עליהן כסף. הבאג מעולם לא היה בנתיב הקוד; הוא היה בהנחה ששתי הסביבות מתנהגות אותו דבר.\n\nהמשמעת שמשתלמת: סביבות נבדלות רק בקונפיגורציה, אף פעם לא בקוד, והקונפיגורציה חיה בסביבה ולא בריפו — ולכן קבצי ‎.env לא נכנסים לקומיט וסודות מוזרקים בזמן ריצה. תבקש מסוכן ״להוסיף ערך קונפיגורציה״ ותבדוק איפה הוא שם אותו; סוכנים משתילים בשמחה מפתח בדיקה קשיח או כתובת localhost שעובדת בכל מקום עד שהיא מגיעה לשרת. תדע לאיזו סביבה הטרמינל שלך מכוון לפני שאתה מריץ משהו הרסני — מיגרציה ו-truncate נראים אותו דבר עד שאתה שם לב ל-host. ותתייחס לקונסולה של פרודקשן כמו למיקרופון פתוח: תניח שכל פעולה גלויה, בלתי הפיכה ונצפית על ידי מישהו שתושפע ממנה. ותהפוך איפוס של סטייג׳ינג למשעמם: ככל שאפשר לבנות אותה מחדש מאפס מהר יותר, כך פחות מפתה לאמת משהו מסוכן בפרודקשן במקום."
 },
 "Bug / Stack trace": {
  "en": "A stack trace is not noise, and it is not an error message — it is the exact path the program walked to reach the moment it gave up, printed innermost-first. The top line is where it actually broke. Below it, in order, is who called that, and who called them, down to the framework. Reading it is a two-second skill that most people never acquire, which is why so much debugging starts with guessing.\n\nA checkout returns 500. The trace reads: TypeError: Cannot read properties of undefined (reading 'id') at getOwner (src/orders/service.ts:42), then at handler (src/routes/orders.ts:17), then twelve lines inside node_modules/express. The useful content is entirely in the first two lines: something at service.ts:42 expected an object and got undefined, and it was called from the orders route. Open line 42 and the answer is usually visible — an order with no user, a lookup that returned nothing, a field renamed last week. The twelve framework lines below contain no information about your bug at all; their only job is to confirm the request came in through Express.\n\nWith an agent, the trace is the single highest-value thing you can paste, and most people paste the wrong part. Give it the full trace, not the one-line summary, plus the code at the top frame and what you were doing when it happened. Then be specific about the ask: \"why is order.user undefined here \" gets a diagnosis, while \"fix this error \" often gets a defensive `if (!order.user) return` that makes the 500 disappear and the real bug — an order created without an owner — permanent and invisible. A crash you can see is a gift. A silent wrong answer is the expensive kind. Keep the full trace in the ticket as text rather than a screenshot of its first line — the frames underneath are what tell the next person which call path produced it.",
  "he": "סטאק טרייס הוא לא רעש, והוא לא הודעת שגיאה — הוא הנתיב המדויק שהתוכנית עברה עד לרגע שבו ויתרה, מודפס מהפנימי כלפי חוץ. השורה העליונה היא המקום שבו זה באמת נשבר. מתחתיה, לפי סדר, מי קרא לזה, ומי קרא להם, עד הפריימוורק. לקרוא את זה היא מיומנות של שתי שניות שרוב האנשים לא רוכשים, ובגלל זה כל כך הרבה דיבוג מתחיל בניחוש.\n\nצ׳קאאוט מחזיר 500. הטרייס אומר: TypeError: Cannot read properties of undefined (reading 'id') at getOwner (src/orders/service.ts:42), אחר כך at handler (src/routes/orders.ts:17), ואז שתים עשרה שורות בתוך node_modules/express. כל התוכן השימושי נמצא בשתי השורות הראשונות: משהו ב-service.ts:42 ציפה לאובייקט וקיבל undefined, והוא נקרא מהנתיב של ההזמנות. תפתח את שורה 42 והתשובה בדרך כלל גלויה — הזמנה בלי משתמש, שליפה שלא החזירה כלום, שדה ששינו לו שם בשבוע שעבר. שתים עשרה שורות הפריימוורק שמתחת לא מכילות שום מידע על הבאג שלך; כל תפקידן הוא לאשר שהריקווסט נכנס דרך Express.\n\nמול סוכן, הטרייס הוא הדבר בעל הערך הגבוה ביותר שאתה יכול להדביק, ורוב האנשים מדביקים את החלק הלא נכון. תן לו את הטרייס המלא, לא את שורת הסיכום, יחד עם הקוד בפריים העליון ומה עשית כשזה קרה. ואז תהיה מדויק בבקשה: ״למה order.user הוא undefined כאן״ מקבל אבחנה, בעוד ש״תתקן את השגיאה״ מקבל הרבה פעמים `if (!order.user) return` הגנתי שגורם ל-500 להיעלם ולבאג האמיתי — הזמנה שנוצרה בלי בעלים — להיות קבוע ובלתי נראה. קריסה שאתה רואה היא מתנה. תשובה שגויה ושקטה היא הסוג היקר. תשמור בכרטיס את הטרייס המלא כטקסט ולא כצילום מסך של השורה הראשונה — הפריימים שמתחת הם מה שאומר לאדם הבא איזה מסלול קריאה ייצר אותו."
 },
 "Client": {
  "en": "The client is the computer you do not control. A browser, a phone app, a curl command, a partner's script — anything that sends you a request. Every number it posts is a claim, not a fact. The user can open DevTools, change a hidden field, replay a request, and skip every animation you built. That is not a hacker scenario; it is the default physics of a machine that belongs to someone else. The interface is a courtesy. The request is the product. If a number can be changed in a text box or a JSON body, it is not a decision until the server says so — hidden fields, disabled buttons and client-side totals are the same class of thing: they slow down honest people and do nothing to anyone else.\n\nNorthline, a fashion retailer, shipped a weekend sale. The React checkout applied a 30% coupon and posted the final line: `{price_cents: 12600, discount_percent: 30}`. The API stored those numbers. At 09:12 on Black Friday a student opened the Network tab, replayed the same POST with `discount_percent: 100`, and paid ₪0 for a ₪180 coat. By 15:40, support had 847 zero-price orders and finance had a ₪312,000 hole. Nothing was broken. The form was pretty. The server had believed a percentage that came from a laptop in a dorm.\n\nWhen an agent builds you a form, ask one question: what happens if this request is sent with curl, not the form? The trap is validation that lives only in the frontend — a disabled button, a `max` on an input, a function named `validateCoupon` imported only by the page. Duplicate the rule on the server and make the client number a hint you recompute. If the AI put an API key, a cost, or a role in frontend code, it is public the moment you deploy.",
  "he": "הקליינט הוא המחשב שאין לך שליטה עליו. דפדפן, אפליקציה בטלפון, פקודת curl, סקריפט של שותף — כל דבר ששולח לך ריקווסט. כל מספר שהוא שולח הוא טענה, לא עובדה. המשתמש יכול לפתוח את DevTools, לשנות שדה מוסתר, לשחזר ריקווסט, ולדלג על כל אנימציה שבנית. זה לא תרחיש של האקר; זו הפיזיקה הרגילה של מכונה ששייכת למישהו אחר. הממשק הוא נימוס. הריקווסט הוא המוצר. אם מספר אפשר לשנות בתיבת טקסט או בגוף JSON, הוא לא החלטה עד שהשרת אומר שכן — שדות מוסתרים, כפתורים מנוטרלים וסכומים בצד הקליינט הם אותה משפחה: הם מאטים אנשים ישרים ולא עושים כלום לשום אדם אחר.\n\nנורת׳ליין, רשת אופנה, העלתה מבצע של סוף שבוע. הצ׳קאאוט בריאקט הפעיל קופון של 30% ושלח את השורה הסופית: `{price_cents: 12600, discount_percent: 30}`. ה-API שמר את המספרים האלה. ב-09:12 בשישי השחור סטודנט פתח את טאב הרשת, שיחזר את אותו POST עם `discount_percent: 100`, ושילם ₪0 על מעיל ב-₪180. עד 15:40 לתמיכה היו 847 הזמנות במחיר אפס ולכספים היה חור של ₪312,000. שום דבר לא היה שבור. הטופס היה יפה. השרת האמין לאחוז שהגיע מלפטופ במעונות.\n\nכשסוכן בונה לך טופס, תשאל שאלה אחת: מה קורה אם שולחים את הריקווסט הזה ב-curl, לא מהטופס? המלכודת היא ולידציה שחיה רק בפרונט — כפתור מנוטרל, `max` על שדה, פונקציה בשם `validateCoupon` שמיובאת רק בדף. תשכפל את החוק בשרת ותהפוך את המספר מהקליינט לרמז שאתה מחשב מחדש. אם ה-AI שם מפתח API, מחיר או תפקיד בקוד פרונט — זה פומבי מרגע הדיפלוי."
 },
 "Server": {
  "en": "A server is a process that waits, on a machine you usually cannot touch, and answers many people from one pool of CPU, memory and file descriptors. Your laptop has 32GB and one user. The container has 512MB and whoever showed up. That gap is the whole subject. Code that is correct for you can still knock everyone else over, because on a server one slow request is not a private inconvenience — it is a slice of the only thread, the only connection pool, the only disk. Capacity is shared whether you designed for it or not; a laptop never teaches you that.\n\nCheckout at Parcelly hashed passwords with `bcrypt.hashSync` inside the request, cost factor 12. On a developer Mac it took 90ms and felt instant. In production, Node's single thread meant those 90ms froze every other shopper. During a 19:00 flash sale, 47 people clicked Pay together, p99 jumped from 180ms to 8.4 seconds, and 12% of carts were abandoned in eleven minutes. The logs showed no error. The health check was still 200. The process was simply busy being synchronous. Moving the hash to `bcrypt.hash` (async) brought p99 back to 210ms the same evening.\n\nWhen an agent writes server code, ask: what does this do under a hundred concurrent requests, and where is the timeout? The trap is anything that works on one laptop and holds a shared resource — `readFileSync`, a full-table load into an array, a Stripe call with no deadline, a connection taken from the pool and never released. Also look where secrets went. The server is the only place they are actually secret. If the generated handler reads an unbounded body or retries forever, one client can become everyone else's outage.",
  "he": "שרת הוא תהליך שמחכה, על מכונה שבדרך כלל אי אפשר לגעת בה, ועונה להרבה אנשים מתוך בריכה אחת של מעבד, זיכרון ו-file descriptors. ללפטופ שלך יש 32GB ומשתמש אחד. לקונטיינר יש 512MB ומי שהגיע. הפער הזה הוא כל הנושא. קוד שנכון אצלך עדיין יכול להפיל את כולם, כי בשרת ריקווסט איטי אחד הוא לא אי-נוחות פרטית — הוא פרוסה מהת׳רד היחיד, ממאגר החיבורים היחיד, מהדיסק היחיד. קיבולת משותפת בין אם תכננת לזה ובין אם לא; לפטופ אף פעם לא מלמד אותך את זה.\n\nהצ׳קאאוט ב-Parcelly עשה האש לסיסמאות עם `bcrypt.hashSync` בתוך הריקווסט, cost factor 12. על מק של מפתח זה לקח 90ms והרגיש מיידי. בפרודקשן, הת׳רד הבודד של Node אמר שאותן 90ms הקפיאו כל קונה אחר. במבצע בזק ב-19:00, 47 אנשים לחצו שלם יחד, ה-p99 קפץ מ-180ms ל-8.4 שניות, ו-12% מהעגלות ננטשו בתוך אחת עשרה דקות. הלוגים לא הראו שגיאה. בדיקת הבריאות עדיין החזירה 200. התהליך פשוט היה עסוק בלהיות סינכרוני. מעבר ל-`bcrypt.hash` (אסינכרוני) החזיר את ה-p99 ל-210ms באותו ערב.\n\nכשסוכן כותב קוד שרת, תשאל: מה זה עושה תחת מאה ריקווסטים במקביל, ואיפה הטיים-אאוט? המלכודת היא כל דבר שעובד על לפטופ אחד ותופס משאב משותף — `readFileSync`, טעינת טבלה שלמה למערך, קריאה ל-Stripe בלי דדליין, חיבור שנלקח מהבריכה ולא הוחזר. תסתכל גם לאן הלכו הסודות. השרת הוא המקום היחיד שבו הם באמת סודיים. אם המטפל שנוצר קורא גוף בלי תקרה או מנסה שוב לנצח, קליינט אחד יכול להפוך לתקלה של כולם."
 },
 "Frontend": {
  "en": "The frontend is what a human looks at: layout, copy, buttons, empty states, the spinner, the number in the corner. It runs on their device, so it is the fastest thing to change and the easiest thing to screenshot. A pretty interface is not evidence that the number is right. It is evidence that someone styled a number. The data still came from somewhere, and that somewhere is the part of the review that actually matters. Polish makes a wrong number harder to doubt, which is why a pretty cart can hide a finance incident for days.\n\nShoply rebuilt the VAT line in the cart over a weekend. The component looked perfect in dark mode. A developer hardcoded `0.17` because \"Israel is 17%\" and the design used that figure in Figma. For eleven days, EU checkout at 21% and UK at 20% still showed 17%. Finance reconciled on the 12th and found a ₪41,200 shortfall against Stripe tax — 1,104 invoices, all looking correct on screen, all wrong in the ledger. Support had no tickets: customers were undercharged and did not complain. The beautiful cart was the reason nobody opened DevTools.\n\nWhen an agent hands you a UI, ignore the happy screenshot and ask where each displayed number is computed, and what the user sees when the request fails, is empty, or is still loading. The trap is business rules in the component — a price, a permission, a limit, a tax rate — because those are suggestions a user can edit. Keep the pretty path, then demand the three boring states in the same prompt. A spinner that never ends and a silent wrong total are both frontend bugs; only one of them looks like a bug.",
  "he": "הפרונט-אנד הוא מה שבן אדם מסתכל עליו: דיפלוי, טקסט, כפתורים, מצבים ריקים, הספינר, המספר בפינה. הוא רץ על המכשיר שלהם, אז זה הדבר הכי מהיר לשנות והכי קל לצלם. ממשק יפה אינו ראיה שהמספר נכון. הוא ראיה שמישהו עיצב מספר. הדאטה עדיין הגיע ממקום כלשהו, והמקום הזה הוא חלק הסקירה שחשוב באמת. ליטוש הופך מספר שגוי לקשה יותר לפקפק בו, ובגלל זה עגלה יפה יכולה להסתיר תקלת כספים ימים.\n\nשופלי בנה מחדש את שורת המע\"מ בעגלה בסוף שבוע. הקומפוננטה נראתה מושלמת במצב כהה. מפתח כתב `0.17` בקשיח כי ״בישראל זה 17%״ וזה המספר שהיה בפיגמה. במשך אחד עשר ימים, צ׳קאאוט באירופה ב-21% ובבריטניה ב-20% עדיין הציג 17%. הכספים עשו התאמה ב-12 לחודש ומצאו חוסר של ₪41,200 מול מס של Stripe — 1,104 חשבוניות, כולן נראות נכונות על המסך, כולן שגויות בספרים. לתמיכה לא היו פניות: לקוחות חויבו חסר ולא התלוננו. העגלה היפה הייתה הסיבה שאף אחד לא פתח DevTools.\n\nכשסוכן מוסר לך ממשק, תתעלם מצילום המסך המאושר ותשאל איפה מחושב כל מספר שמוצג, ומה המשתמש רואה כשהריקווסט נכשל, ריק, או עדיין טוען. המלכודת היא חוקים עסקיים בקומפוננטה — מחיר, הרשאה, מגבלה, שיעור מס — כי אלה הצעות שמשתמש יכול לערוך. תשאיר את הנתיב היפה, ואז תדרוש את שלושת המצבים המשעממים באותו פרומפט. ספינר שלא נגמר וסכום שגוי בשקט הם שניהם באגים בפרונט; רק אחד מהם נראה כמו באג."
 },
 "Backend": {
  "en": "The backend is the part that remembers, decides and refuses. It talks to the database, to Stripe, to the warehouse. If the frontend vanished and someone spoke HTTP at your API, whatever they could still do is the real product. Limits, prices, who owns a row — those are backend facts or they are theatre. The till is not the shop window. Anything you only enforced by hiding a control was never enforced; partners, mobile apps and curl never saw the control.\n\nMerchDesk limited each seller to 50 product photos. The New Photo button hid itself at 50. `POST /photos` did not check. A partner integration, written against the docs and not the UI, uploaded 6,400 images onto a free account over a weekend. Disk on the uploads volume hit 98% at 04:11 on Monday; the API started returning 500 for every seller, including paying ones. Cleanup took fourteen hours and a conversation with a customer who had broken nothing. The quota was theatre until the API said no; partners never saw the button, and they should not have to. The ten-line quota check would have returned 403 and a sentence. It was never written, because the button already looked like a limit.\n\nWhen you prompt an agent, name the side: reject on the server with 403 when the quota is exceeded, and also hide the button. The trap is the visible half of the rule. Also keep money, identity and secrets here — a Stripe key in a React file is a bill. A useful review question: if I delete the frontend tomorrow, what can a logged-in client still create, update or read? Whatever you cannot say no to in the API is already in production, whether or not a button exists.",
  "he": "הבק-אנד הוא החלק שזוכר, מחליט ומסרב. הוא מדבר עם הדאטהבייס, עם Stripe, עם המחסן. אם הפרונט היה נעלם ומישהו היה מדבר HTTP אל ה-API שלך, מה שהוא עדיין יכול לעשות הוא המוצר האמיתי. מגבלות, מחירים, מי הבעלים של שורה — אלה עובדות בק-אנד או שהם תיאטרון. הקופה היא לא חלון הראווה. כל דבר שנאכף רק בהסתרת פקד מעולם לא נאכף; שותפים, אפליקציות מובייל ו-curl מעולם לא ראו את הפקד.\n\nמרצ׳דסק הגביל כל מוכר ל-50 תמונות מוצר. כפתור תמונה חדשה הסתיר את עצמו ב-50. `POST /photos` לא בדק. אינטגרציה של שותף, שנכתבה מול התיעוד ולא מול הממשק, העלתה 6,400 תמונות לחשבון חינם בסוף שבוע. הדיסק בווליום ההעלאות הגיע ל-98% ב-04:11 ביום שני; ה-API התחיל להחזיר 500 לכל מוכר, כולל משלמים. הניקוי לקח ארבע עשרה שעות ושיחה עם לקוח שלא שבר כלום. המכסה הייתה תיאטרון עד שה-API אמר לא; שותפים מעולם לא ראו את הכפתור, וגם לא היו צריכים. בדיקת המכסה של עשר שורות הייתה מחזירה 403 ומשפט. היא מעולם לא נכתבה, כי הכפתור כבר נראה כמו מגבלה.\n\nכשאתה מפרומפט סוכן, תן שם לצד: לדחות בשרת עם 403 כשהמכסה חורגת, וגם להסתיר את הכפתור. המלכודת היא החצי הגלוי של החוק. תשאיר גם כסף, זהות וסודות כאן — מפתח Stripe בקובץ ריאקט הוא חשבון. שאלת סקירה שימושית: אם אמחק את הפרונט מחר, מה קליינט מחובר עדיין יכול ליצור, לעדכן או לקרוא? כל מה שאי אפשר להגיד לו לא ב-API כבר נמצא בפרודקשן, בין אם יש כפתור ובין אם לא."
 },
 "API": {
  "en": "An API is a contract between two programs: the requests one may send, the shape that comes back, and the failures that are allowed. It is not a website and it is not magic. Your database driver is an API. Stripe is an API. The danger is that someone else builds against the contract, so changing a field name is no longer a private refactor. The other danger is that the happy path is three lines and the rest of the work is timeouts, 429s, and bodies the docs never showed. Integrations fail in the unhappy path, every time, and that path is where the money is.\n\nFold shipped checkout against Stripe's test mode in four hours. Sandbox answers in 80ms. In production they called `PaymentIntent.create` on API version `2020-08-27` because that string was in an old snippet. Stripe had moved the default to `2024-11-20`, where `automatic_payment_methods` is required. For four hours on a Sunday, 23% of EU cards returned a shape the code did not parse; the handler treated it as success and wrote `orders.status = 'paid'`. 64 orders, ₪18,400, never actually captured. Stripe's dashboard showed `incomplete`. The shop showed a thank-you page.\n\nWhen someone says integrate X, translate it to: call X's API and handle its failures. Paste the current docs, not a memory of 2022. Ask three questions of the generated client: what happens on a 2-second timeout, what happens on 429, and what happens if a field you need is missing. Then find the key. If it is in the repo, in the frontend, or in a log line, it is already burned — rotate it. Invented field names are the most common agent failure, and they compile, and they look right.",
  "he": "API הוא חוזה בין שתי תוכניות: אילו ריקווסטים מותר לשלוח, איזו צורה חוזרת, ואילו כשלים מותרים. זה לא אתר וזה לא קסם. הדרייבר של הדאטהבייס שלך הוא API. Stripe הוא API. הסכנה היא שמישהו אחר בונה מול החוזה, אז שינוי שם שדה כבר אינו ריפקטור פרטי. הסכנה השנייה היא שנתיב השמחה הוא שלוש שורות ושאר העבודה היא טיים-אאוטים, 429, וגופים שהתיעוד מעולם לא הציג. אינטגרציות נכשלות בנתיב הלא-מאושר, תמיד, ושם נמצא הכסף.\n\nFold העלו צ׳קאאוט מול מצב הטסט של Stripe בארבע שעות. הסנדבוקס עונה ב-80ms. בפרודקשן הם קראו ל-`PaymentIntent.create` בגרסת API `2020-08-27` כי זו המחרוזת שהייתה בקטע ישן. Stripe העבירו את ברירת המחדל ל-`2024-11-20`, שם `automatic_payment_methods` חובה. במשך ארבע שעות ביום ראשון, 23% מהכרטיסים באירופה החזירו צורה שהקוד לא פירסר; המטפל התייחס לזה כהצלחה וכתב `orders.status = 'paid'`. 64 הזמנות, ₪18,400, מעולם לא נלכדו באמת. הדשבורד של Stripe הראה `incomplete`. החנות הראתה דף תודה.\n\nכשמישהו אומר לחבר את X, תתרגם ל: לקרוא ל-API של X ולטפל בכשלים שלו. תדביק את התיעוד הנוכחי, לא זיכרון מ-2022. תשאל שלוש שאלות על הקליינט שנוצר: מה קורה בטיים-אאוט של שתי שניות, מה קורה ב-429, ומה קורה אם שדה שאתה צריך חסר. ואז תמצא את המפתח. אם הוא בריפו, בפרונט או בשורת לוג — הוא כבר שרוף, תחליף אותו. שמות שדות מומצאים הם כשל הסוכן הנפוץ ביותר, והם מתקמפלים, והם נראים נכון."
 },
 "localhost & port": {
  "en": "localhost is a name that always means this machine, and it never travels. A port is a numbered door on that machine so more than one program can listen at once — 3000 for the app, 5432 for Postgres, 6379 for Redis. A URL is three pieces: host, door, path. The confusion is always the same: which machine, and which door, from whose point of view. Inside a container, localhost is the container. On your laptop, it is your laptop. In a production browser, it is the customer's laptop, where your API is not running.\n\nLens Shop built the storefront with `VITE_API_URL=http://localhost:3000`. It worked for six weeks on every developer machine. The production JavaScript bundle baked that string in at build time. After the launch email to 2,400 customers, the browser on each of their phones tried to open port 3000 on the phone itself and got connection refused. Support volume hit 180 tickets in 40 minutes. The API on the real host was healthy the entire time — nobody in the office could reproduce it, because their laptops really did have something on 3000. One environment variable, one build-time inlining, one afternoon of thinking the internet was down.\n\nWhen an agent writes a base URL, read it. If it says localhost and the code will run in a browser or on a server you do not sit at, it is wrong. The trap is config that works in `.env` locally and is compiled into the frontend, plus the cousin bug: yesterday's process still bound to 3000 so today's server silently moved to 3001. Know how to see who owns a port, and know that binding to 127.0.0.1 inside Docker publishes nothing. Binding a dev server to 0.0.0.0 on café wifi is the other direction of the same mistake.",
  "he": "localhost הוא שם שתמיד אומר המכונה הזאת, והוא אף פעם לא נוסע. פורט הוא דלת ממוספרת במכונה כדי שיותר מתוכנית אחת תוכל להאזין בבת אחת — 3000 לאפליקציה, 5432 לפוסטגרס, 6379 ל-Redis. URL הוא שלושה חלקים: מארח, דלת, נתיב. הבלבול תמיד אותו דבר: איזו מכונה, ואיזו דלת, מנקודת המבט של מי. בתוך קונטיינר, localhost הוא הקונטיינר. על הלפטופ שלך, הוא הלפטופ. בדפדפן בפרודקשן, הוא הלפטופ של הלקוח, שבו ה-API שלך לא רץ.\n\nלנס שופ בנו את חזית החנות עם `VITE_API_URL=http://localhost:3000`. זה עבד שישה שבועות על כל מכונת מפתח. באנדל הג׳אווהסקריפט בפרודקשן אפה את המחרוזת הזאת בזמן בילד. אחרי מייל ההשקה ל-2,400 לקוחות, הדפדפן בכל טלפון ניסה לפתוח פורט 3000 על הטלפון עצמו וקיבל connection refused. נפח התמיכה הגיע ל-180 פניות ב-40 דקות. ה-API על המארח האמיתי היה בריא כל הזמן — אף אחד במשרד לא הצליח לשחזר, כי אצלם באמת היה משהו על 3000. משתנה סביבה אחד, הטמעה בזמן בילד, אחר צהריים של לחשוב שהאינטרנט נפל.\n\nכשסוכן כותב כתובת בסיס, תקרא אותה. אם כתוב localhost והקוד ירוץ בדפדפן או על שרת שאתה לא יושב לידו, זה שגוי. המלכודת היא קונפיג שעובד ב-`.env` מקומית ועובר קומפילציה לפרונט, ועוד באג בן דוד: התהליך של אתמול עדיין תפוס על 3000 אז השרת של היום עבר בשקט ל-3001. תדע איך לראות מי מחזיק פורט, ותדע שקשירה ל-127.0.0.1 בתוך Docker לא מפרסמת כלום. לקשור שרת פיתוח ל-0.0.0.0 בוויי-פיי של בית קפה הוא הכיוון ההפוך של אותה טעות."
 },
 "DNS": {
  "en": "DNS is a phone book with a delay. You ask what shop.example.com is, a resolver answers with an IP or another name, and then caches that answer for a lifetime you set — the TTL. Changing the record does not change the copies already sitting in ISPs, phones, and coffee-shop routers. Those copies expire on their own schedule. Until they do, part of the world is still knocking on the old door, and they will write orders into whatever is still listening there.\n\nOn a Sunday at 21:00, Braid moved checkout from a VM at 34.120.5.9 to CloudFront. They updated the A record, refreshed, saw the new site, and went home. The previous TTL was 43,200 seconds — twelve hours. Until 09:00 Monday, roughly 31% of sessions still hit the decommissioned VM. That VM had been left running \"just in case\" with yesterday's database. 190 paid orders landed in a Postgres nobody was replicating. The new site showed empty carts for those customers. The team only believed the reports after a `dig +trace` from a phone on cellular showed the old IP and office wifi showed the new one.\n\nBefore you debug application code for \"some users see the old version\", resolve the name from somewhere that is not your laptop. The trap an agent walks you into is an A record aimed at an ephemeral IP, where a CNAME at a stable hostname was required — it works for a week, then the load balancer moves and half the internet cannot find you. Lower the TTL to 300 a day before a cutover. After a cutover, leave the old origin up in read-only until the TTL has fully expired, or you will replay this story with a different domain.",
  "he": "DNS הוא ספר טלפונים עם השהיה. אתה שואל מה זה shop.example.com, רזולבר עונה עם IP או שם אחר, ואז שומר את התשובה בקאש למשך חיים שאתה קובע — ה-TTL. שינוי הרשומה לא משנה את העותקים שכבר יושבים אצל ספקיות, בטלפונים ובנתבים של בתי קפה. העותקים האלה פגים בלוח זמנים משלהם. עד אז, חלק מהעולם עדיין דופק בדלת הישנה, והם יכתבו הזמנות אל מה שעדיין מאזין שם.\n\nביום ראשון ב-21:00, ברייד העבירו צ׳קאאוט ממכונה ב-34.120.5.9 ל-CloudFront. הם עדכנו את רשומת ה-A, ריעננו, ראו את האתר החדש, והלכו הביתה. ה-TTL הקודם היה 43,200 שניות — שתים עשרה שעות. עד 09:00 ביום שני, בערך 31% מהסשנים עדיין פגעו במכונה שכובתה. המכונה ההיא נשארה דולקת ״ליתר ביטחון״ עם הדאטהבייס של אתמול. 190 הזמנות ששולמו נחתו בפוסטגרס שאף אחד לא שיכפל. האתר החדש הציג עגלות ריקות לאותם לקוחות. הצוות האמין לדיווחים רק אחרי ש-`dig +trace` מטלפון בסלולר הראה את ה-IP הישן והוויי-פיי במשרד הראה את החדש.\n\nלפני שמדבגים קוד אפליקציה על ״חלק מהמשתמשים רואים את הגרסה הישנה״, תפתור את השם ממקום שהוא לא הלפטופ שלך. המלכודת שסוכן מכניס אותך אליה היא רשומת A שמכוונת ל-IP זמני, במקום CNAME לשם מארח יציב — זה עובד שבוע, ואז מאזן העומסים זז וחצי מהאינטרנט לא מוצא אותך. תוריד את ה-TTL ל-300 יום לפני מעבר. אחרי מעבר, תשאיר את המקור הישן ב-read-only עד שה-TTL פג לגמרי, או שתשחזר את הסיפור הזה עם דומיין אחר."
 },
 "Full stack": {
  "en": "Full stack means following one value across every layer until you can say where it became wrong: the button, the client bundle, the HTTP call, the handler, the query, the row, the webhook that wrote the row last month. The stack is just the list of choices — language, framework, database, host — and naming them lets you ask what each one is for. The person who can walk a number from the screen to the disk is the person who closes the ticket. Everyone else describes a symptom and waits.\n\nBlack Friday at Knitco, a 30% sale. The React cart applied 30%. The API applied 30% again on `unit_price`. Stripe was given a coupon `BF30` as well. Three discounts stacked. Average order was 73% off instead of 30%. In six hours they took 2,140 orders and recognised ₪89,000 of revenue against ₪241,000 of goods at cost. The frontend team blamed Stripe. The backend team blamed the coupon config. Nobody followed one SKU through the three layers until an on-call engineer printed the same `order_id` from the browser payload, the API log, and the Stripe event. The bug was not in one place. It was the absence of a single owner for \"what is the price\".\n\nYou already operate at every layer when you build with an agent, usually without depth in any of them. Aim learning at the seams: how a value travels, where it can be changed, who is allowed to change it. When an agent adds a new piece to the stack — another cache, another framework, another queue — ask what it replaces and who gets the pager at 03:00. The trap is confidence in the visible layer and hand-waving underneath, where money and identity live. One source of truth for a price, a permission, a stock count. If you find three, you have already found the next incident.",
  "he": "פול סטאק אומר לעקוב אחרי ערך אחד בכל שכבה עד שאפשר להגיד איפה הוא נהיה שגוי: הכפתור, הבאנדל בקליינט, קריאת ה-HTTP, המטפל, השאילתה, השורה, ה-webhook שכתב את השורה בחודש שעבר. הסטאק הוא פשוט רשימת הבחירות — שפה, פריימוורק, דאטהבייס, הוסט — ולתת להן שמות מאפשר לשאול בשביל מה כל אחת. מי שיודע להוליך מספר מהמסך לדיסק הוא מי שסוגר את הכרטיס. כל השאר מתארים סימפטום ומחכים.\n\nשישי השחור בקינטקו, מבצע 30%. עגלת הריאקט הפעילה 30%. ה-API הפעיל 30% שוב על `unit_price`. ל-Stripe ניתן גם קופון `BF30`. שלוש הנחות נערמו. הזמנה ממוצעת הייתה 73% הנחה במקום 30%. בשש שעות הם לקחו 2,140 הזמנות והכירו ב-₪89,000 הכנסות מול ₪241,000 עלות סחורה. צוות הפרונט האשים את Stripe. צוות הבק-אנד האשים את קונפיג הקופון. אף אחד לא עקב אחרי SKU אחד בשלוש השכבות עד שמהנדס כונן הדפיס את אותו `order_id` מפיילוד הדפדפן, מלוג ה-API ומאירוע Stripe. הבאג לא היה במקום אחד. הוא היה היעדר בעלים יחיד ל״מה המחיר״.\n\nאתה כבר פועל בכל שכבה כשאתה בונה עם סוכן, בדרך כלל בלי עומק באף אחת מהן. תכוון למידה לתפרים: איך ערך נוסע, איפה אפשר לשנות אותו, למי מותר לשנות אותו. כשסוכן מוסיף חתיכה חדשה לסטאק — עוד קאש, עוד פריימוורק, עוד תור — תשאל מה היא מחליפה ומי מקבל את הפאג׳ר ב-03:00. המלכודת היא ביטחון בשכבה הגלויה וטשטוש מתחת, שם חיים כסף וזהות. מקור אמת אחד למחיר, להרשאה, לכמות מלאי. אם מצאת שלושה, כבר מצאת את התקלה הבאה."
 },
 "Request / Response": {
  "en": "HTTP has one rhythm and it never varies: the client sends a request, the server sends back exactly one response, and the exchange is over. The server has no way to speak first. It does not know you exist until you knock, and the moment it answers it forgets you — which is why every request has to carry its own identity, usually a token or a cookie, rather than relying on the server remembering who you were a second ago.\n\nA product manager asks for \"live \" order status on the customer page. The developer implements it the obvious way: the browser asks the server every two seconds whether anything changed. With 3,000 people on that page during a campaign, that is 90,000 requests a minute to answer \"no change \" — the database saturates, response times climb from 80ms to 1.4s, and the page everyone is watching becomes the slowest one in the product. The feature was not wrong; the mechanism was. A websocket or a server-sent stream keeps one open channel per user and pushes only when something actually happens.\n\nOnce the rhythm is in your head, a whole class of confusion resolves. It explains why a server cannot notify your app of a payment result directly and uses a webhook — which is just the same rhythm in the other direction, their server making a request to yours. It explains why refreshing a page re-sends everything, and why a request that times out may still have been fully processed on the other side. And when an agent proposes real-time updates, the question to ask is which mechanism and at what cost: polling every two seconds is trivially easy to write and quietly expensive to run. And treat each request as independent: if two of them must happen in a fixed order, that order has to be enforced by your data, not by hoping the network cooperates.",
  "he": "ל-HTTP יש קצב אחד והוא אף פעם לא משתנה: הקליינט שולח ריקווסט, השרת מחזיר רספונס אחד בדיוק, וההחלפה נגמרה. לשרת אין שום דרך לדבר ראשון. הוא לא יודע שאתה קיים עד שאתה דופק, וברגע שהוא עונה הוא שוכח אותך — ולכן כל ריקווסט חייב לשאת את הזהות שלו, בדרך כלל טוקן או קוקי, במקום להישען על זה שהשרת זוכר מי היית לפני שנייה.\n\nמנהל מוצר מבקש סטטוס הזמנה ״חי״ בעמוד הלקוח. המפתח מממש בדרך המתבקשת: הדפדפן שואל את השרת כל שתי שניות אם משהו השתנה. עם 3,000 אנשים בעמוד הזה במהלך קמפיין, אלה 90,000 ריקווסטים בדקה כדי לענות ״לא השתנה״ — מסד הנתונים נחנק, זמני התגובה מטפסים מ-80ms ל-1.4 שניות, והעמוד שכולם מסתכלים עליו הופך לאיטי במוצר. הפיצ׳ר לא היה שגוי; המנגנון היה. websocket או זרם מהשרת מחזיקים ערוץ פתוח אחד לכל משתמש ודוחפים רק כשמשהו באמת קורה.\n\nברגע שהקצב הזה בראש שלך, מחלקה שלמה של בלבול נפתרת. זה מסביר למה שרת לא יכול להודיע לאפליקציה שלך על תוצאת תשלום ישירות ומשתמש ב-webhook — שהוא בסך הכול אותו קצב בכיוון ההפוך, השרת שלהם שולח ריקווסט לשלך. זה מסביר למה רענון עמוד שולח הכול מחדש, ולמה ריקווסט שנפל בטיים-אאוט יכול בכל זאת להיות מעובד במלואו בצד השני. וכשסוכן מציע עדכונים בזמן אמת, השאלה היא איזה מנגנון ובאיזה מחיר: polling כל שתי שניות קל לכתוב וקר בשקט לתפעל. ותתייחס לכל ריקווסט כעצמאי: אם שניים מהם חייבים לקרות בסדר קבוע, הסדר הזה חייב להיאכף על ידי הנתונים שלך, ולא על ידי תקווה שהרשת תשתף פעולה."
 },
 "GET": {
  "en": "GET means read. It is defined as safe, which is a technical promise rather than a style preference: performing it must not change anything the caller can observe. Because of that promise, GET responses can be cached, prefetched, retried after a failure, stored in browser history and crawled by anything that finds the link — and none of those actors ask your permission first.\n\nAn internal admin tool exposes deletion as a link: GET /users/42/delete. It works, it is one line of code, and nothing bad happens for a year. Then the team adds a link-preview bot to their chat: someone pastes an admin URL into a channel, the bot dutifully fetches every link to render a preview, and four accounts are deleted by a robot that was trying to be helpful. Chrome's prefetch, an antivirus proxy scanning links in email, and a monitoring tool that pings your routes will all do the same thing. Nobody was careless at the moment of deletion; the carelessness was months earlier, in the choice of verb.\n\nThe habit worth building: reads are GET, and anything with a consequence is POST, PUT, PATCH or DELETE — not because a committee said so, but because the entire internet is built around that assumption. Two related traps to check in generated code. First, secrets in query strings: a token in a URL ends up in server logs, browser history and the Referer header sent to the next site. Second, a GET that quietly writes — updating a last_seen timestamp is usually fine, sending an email or charging a card is not. If the AI wrote a route, read the verb before you read the body. One more habit worth having: when a page feels slow, count how many GETs it fires before blaming the server — thirty small reads on one screen is a design problem, not a performance one.",
  "he": "GET אומר קריאה. הוא מוגדר כבטוח, וזו הבטחה טכנית ולא העדפת סגנון: ביצוע שלו לא אמור לשנות שום דבר שהקורא יכול לראות. בזכות ההבטחה הזאת אפשר לשמור תשובות GET בקאש, להביא אותן מראש, לנסות שוב אחרי כישלון, לשמור אותן בהיסטוריית הדפדפן ולזחול אליהן מכל מקום שמצא את הקישור — ואף אחד מהגורמים האלה לא מבקש ממך רשות.\n\nכלי אדמין פנימי חושף מחיקה כקישור: GET /users/42/delete. זה עובד, זו שורה אחת, ושום דבר רע לא קורה במשך שנה. ואז הצוות מוסיף בוט תצוגה מקדימה לצ׳אט: מישהו מדביק כתובת אדמין בערוץ, הבוט מושך בנאמנות כל קישור כדי לרנדר תצוגה מקדימה, וארבעה חשבונות נמחקים על ידי רובוט שניסה לעזור. ה-prefetch של כרום, פרוקסי אנטי-וירוס שסורק קישורים במייל, וכלי ניטור שדוגם את הנתיבים שלך — כולם יעשו בדיוק אותו דבר. אף אחד לא היה רשלן ברגע המחיקה; הרשלנות הייתה חודשים קודם, בבחירת המתודה.\n\nההרגל ששווה לבנות: קריאות הן GET, וכל מה שיש לו תוצאה הוא POST, PUT, PATCH או DELETE — לא כי ועדה אמרה, אלא כי כל האינטרנט בנוי סביב ההנחה הזאת. שתי מלכודות קרובות שכדאי לבדוק בקוד שנוצר. ראשית, סודות ב-query string: טוקן בכתובת מגיע ללוגים של השרת, להיסטוריית הדפדפן ולכותרת Referer שנשלחת לאתר הבא. שנית, GET שכותב בשקט — לעדכן חותמת last_seen בדרך כלל בסדר, לשלוח מייל או לחייב כרטיס לא. אם ה-AI כתב נתיב, תקרא את המתודה לפני שאתה קורא את הגוף. עוד הרגל ששווה לאמץ: כשעמוד מרגיש איטי, תספור כמה קריאות GET הוא יורה לפני שאתה מאשים את השרת — שלושים קריאות קטנות במסך אחד הן בעיית תכנון, לא בעיית ביצועים."
 },
 "POST / PUT / PATCH / DELETE": {
  "en": "Four verbs, four different promises. POST creates something new and is the only one of the four that is expected to produce a different result each time you call it. PUT replaces a resource entirely with what you sent — anything you omitted is now gone. PATCH changes only the fields you named. DELETE removes. The distinction that matters most in practice is repeatability: sending the same PUT, PATCH or DELETE twice should leave the world in the same state as sending it once, while sending the same POST twice creates two things.\n\nA mobile checkout posts an order. The user is on a train, the connection drops after the server has already created order 7c3f but before the response arrives, and the app's retry logic fires. The server creates 7c40, identical. The customer is charged twice, gets two confirmation emails, and the support conversation costs more than the order was worth. The fix is not to stop retrying — networks will always do this — it is an idempotency key: a unique id the client generates and sends with both attempts, so the server recognises the second one and returns the original result instead of creating another order.\n\nThe other classic is PUT used where PATCH was meant. A profile update sends {\"name\": \"Lior\"} as a PUT, the server replaces the whole record, and the user's phone number, address and notification settings are silently blanked. Everything about the request looked successful. When reviewing generated endpoints, check three things: does the verb match what the code actually does, is a repeated call safe, and for PUT, does it really intend to replace everything. Picking the right verb is also free documentation — for the next developer, and for the next AI reading your codebase. And prefer a soft delete for anything a person can trigger by hand: a deleted_at column turns an angry support call into a one-line fix.",
  "he": "ארבע מתודות, ארבע הבטחות שונות. POST יוצר משהו חדש והוא היחיד מהארבעה שמצפים ממנו לתוצאה שונה בכל קריאה. PUT מחליף את המשאב כולו במה ששלחת — כל מה שהשמטת פשוט נעלם. PATCH משנה רק את השדות שציינת. DELETE מוחק. ההבחנה שהכי חשובה בפועל היא יכולת החזרה: שליחה של אותו PUT, PATCH או DELETE פעמיים אמורה להשאיר את העולם באותו מצב כמו שליחה אחת, בעוד ששליחת אותו POST פעמיים יוצרת שני דברים.\n\nצ׳קאאוט בנייד שולח הזמנה ב-POST. המשתמש ברכבת, החיבור נופל אחרי שהשרת כבר יצר הזמנה 7c3f אבל לפני שהרספונס הגיע, והלוגיקה של הניסיון החוזר באפליקציה נורית. השרת יוצר 7c40, זהה. הלקוח מחויב פעמיים, מקבל שני מיילים, ושיחת התמיכה עולה יותר מההזמנה. התיקון הוא לא להפסיק לנסות שוב — רשתות תמיד יעשו את זה — אלא מפתח אידמפוטנטיות: מזהה ייחודי שהקליינט מייצר ושולח בשני הניסיונות, כך שהשרת מזהה את השני ומחזיר את התוצאה המקורית במקום ליצור עוד הזמנה.\n\nהקלאסיקה השנייה היא PUT במקום שבו התכוונו ל-PATCH. עדכון פרופיל שולח {\"name\": \"Lior\"} כ-PUT, השרת מחליף את כל הרשומה, ומספר הטלפון, הכתובת והעדפות ההתראות של המשתמש נמחקים בשקט. הכול בריקווסט נראה מוצלח. כשאתה סוקר endpoints שנוצרו, תבדוק שלושה דברים: האם המתודה תואמת למה שהקוד באמת עושה, האם קריאה חוזרת בטוחה, ובמקרה של PUT — האם באמת רוצים להחליף הכול. בחירת המתודה הנכונה היא גם תיעוד חינם — למפתח הבא, ול-AI הבא שיקרא את הקוד שלך. ותעדיף מחיקה רכה לכל דבר שאדם יכול להפעיל ידנית: עמודת deleted_at הופכת שיחת תמיכה זועמת לתיקון של שורה אחת."
 },
 "Headers": {
