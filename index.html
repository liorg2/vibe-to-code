<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vibe → Code</title>
<meta name="description" content="The vocabulary and mental models of professional software development, for people who build with AI. English and Hebrew.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Heebo:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0b0f; --card:#151822; --card2:#1b1f2c; --code:#0e1017;
  --line:#262b3a; --tx:#e8eaf0; --tx2:#9aa1b4; --tx3:#6b7286;
  --acc:#6c5ce7; --acc2:#00d2b8; --warn:#ffb020; --bad:#ff5c72; --good:#22c98a;
  --grad:linear-gradient(135deg,#6c5ce7,#00d2b8);
  --r:16px; --shadow:0 12px 40px rgba(0,0,0,.45);
}
:root[data-theme="light"]{
  --bg:#f7f8fb; --card:#ffffff; --card2:#f3f5fa; --code:#12141c;
  --line:#e3e7f0; --tx:#12141c; --tx2:#5a6279; --tx3:#8a91a6;
  --shadow:0 12px 32px rgba(20,25,50,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased}
body[dir="rtl"]{font-family:Heebo,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60vw 60vw at 15% -10%,rgba(108,92,231,.18),transparent 60%),
             radial-gradient(50vw 50vw at 90% 0%,rgba(0,210,184,.12),transparent 60%)}
.wrap{position:relative;z-index:1}
code,pre,.mono{font-family:"JetBrains Mono",ui-monospace,monospace}

/* top bar */
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:14px}
.logo{font-weight:800;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;
  text-decoration:none;color:inherit}
.logo .dot{width:26px;height:26px;border-radius:9px;background:var(--grad);display:grid;
  place-items:center;font-size:13px;color:#fff}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--card);color:var(--tx);padding:8px 14px;
  border-radius:10px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--acc);transform:translateY(-1px)}
.btn.prim{background:var(--grad);border:none;color:#fff}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--tx2);padding:8px 13px;font:inherit;
  font-size:13px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--acc);color:#fff}
#search{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 13px;
  color:var(--tx);font:inherit;font-size:14px;width:200px}
#search:focus{outline:none;border-color:var(--acc)}
.progbar{height:3px;background:var(--line)}
.progbar i{display:block;height:100%;width:0;background:var(--grad);transition:width .4s}

/* hero */
.hero{max-width:1240px;margin:0 auto;padding:76px 24px 52px;text-align:center}
.pill{display:inline-block;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;
  border:1px solid var(--line);background:var(--card);color:var(--tx2);margin-bottom:22px}
h1{font-size:clamp(34px,6vw,62px);line-height:1.05;letter-spacing:-.035em;font-weight:800}
h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:640px;margin:18px auto 0;color:var(--tx2);font-size:18px}
.hero .cta{margin-top:30px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn.big{padding:13px 26px;font-size:15px;border-radius:12px}

/* layout */
main{max-width:1240px;margin:0 auto;padding:0 24px 100px;display:grid;
  grid-template-columns:272px 1fr;gap:34px;align-items:start}
nav.side{position:sticky;top:86px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:12px;box-shadow:var(--shadow);max-height:calc(100vh - 110px);overflow:auto}
nav.side h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--tx3);margin:6px 8px 8px}
nav.side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;
  color:var(--tx2);text-decoration:none;font-size:14px;font-weight:500;transition:.15s}
nav.side a:hover{background:var(--card2);color:var(--tx)}
nav.side a.on{background:var(--card2);color:var(--tx);box-shadow:inset 2px 0 0 var(--acc)}
body[dir="rtl"] nav.side a.on{box-shadow:inset -2px 0 0 var(--acc)}
nav.side a .ic{width:24px;height:24px;border-radius:7px;background:var(--card2);display:grid;
  place-items:center;font-size:12px;flex:none;border:1px solid var(--line)}
nav.side a .cnt{margin-inline-start:auto;font-size:11px;color:var(--tx3);font-family:"JetBrains Mono",monospace}
nav.side hr{border:0;border-top:1px solid var(--line);margin:8px 6px}

/* module page */
section.mod{scroll-margin-top:90px;margin-bottom:40px}
.mhead{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.mhead .ic{width:44px;height:44px;border-radius:13px;background:var(--grad);display:grid;
  place-items:center;color:#fff;font-size:18px;flex:none}
.mhead h2{font-size:26px;letter-spacing:-.02em;font-weight:800}
.mhead .n{margin-inline-start:auto;font-family:"JetBrains Mono",monospace;font-size:12px;
  color:var(--tx3);text-align:end;flex:none}
.mblurb{color:var(--tx2);margin:0 0 20px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.term{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;transition:.18s;position:relative;overflow:hidden;cursor:pointer;
  display:block;text-decoration:none;color:inherit}
.term:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--acc) 50%,var(--line));
  box-shadow:var(--shadow)}
.term::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;
  background:var(--grad);opacity:0;transition:.18s}
.term.done::after{opacity:1}
.term.done{background:var(--card2)}
.term h4{font-size:16px;font-weight:700;letter-spacing:-.01em;margin-bottom:8px;padding-inline-end:34px}
.term p{color:var(--tx2);font-size:14.5px}
.term .more{margin-top:10px;font-size:12px;font-weight:700;color:var(--acc2);
  letter-spacing:.04em;text-transform:uppercase}
.chk{position:absolute;inset-inline-end:14px;top:16px;width:22px;height:22px;border-radius:7px;
  border:1.5px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;
  color:transparent;font-size:12px;transition:.15s;padding:0;z-index:2}
.chk:hover{border-color:var(--acc)}
.term.done .chk{background:var(--grad);border-color:transparent;color:#fff}

/* home index */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.mcard{display:block;text-decoration:none;color:inherit;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);padding:20px;transition:.18s}
.mcard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--acc) 50%,var(--line));
  box-shadow:var(--shadow)}
.mcard .row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.mcard .ic{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;
  place-items:center;color:#fff;font-size:17px;flex:none}
.mcard .num{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--tx3)}
.mcard h3{font-size:17px;font-weight:700;letter-spacing:-.01em}
.mcard p{color:var(--tx2);font-size:14px;min-height:44px}
.mcard .mini{margin-top:14px;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.mcard .mini i{display:block;height:100%;background:var(--grad);transition:width .4s}
.mcard .cnt{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--tx3);
  margin-top:6px;display:block}
.mcard.special{border-color:color-mix(in srgb,var(--acc2) 45%,var(--line))}
.mcard.special .ic{background:linear-gradient(135deg,#00d2b8,#ffb020)}

/* slide */
.slide{background:var(--card);border:1px solid var(--line);border-radius:22px;
  padding:clamp(24px,4vw,44px);box-shadow:var(--shadow)}
.slide .kicker{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--acc2);
  letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.slide h2{font-size:clamp(26px,4vw,40px);line-height:1.15;letter-spacing:-.03em;font-weight:800}
.slide .lede{font-size:clamp(17px,2.2vw,21px);color:var(--tx);margin-top:16px;
  padding-inline-start:16px;border-inline-start:3px solid var(--acc)}
.slide .body{margin-top:26px;color:var(--tx2);font-size:16.5px;max-width:72ch}
.slide .body p{margin-bottom:16px}
.slide .cal{margin-top:26px;background:var(--card2);border:1px solid var(--line);
  border-radius:14px;padding:16px 18px}
.slide .cal b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--acc2);margin-bottom:6px}
.slide .cal p{color:var(--tx);font-size:15.5px}
.ex{margin-top:26px}
.ex .cap{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3);
  margin-bottom:8px;font-weight:700}
pre.code{background:var(--code);border:1px solid var(--line);border-radius:14px;padding:18px;
  overflow-x:auto;color:#dfe4f0;font-size:13.5px;line-height:1.65;direction:ltr;text-align:left}
.slidebar{display:flex;gap:10px;align-items:center;margin-top:28px;flex-wrap:wrap}
.slidebar .grow{flex:1}
.kbd{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--tx3);
  border:1px solid var(--line);border-radius:6px;padding:2px 6px}

/* quiz */
.quiz{margin-top:34px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:24px}
.quiz > h3{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.quiz > .sub{color:var(--tx2);font-size:14px;margin-bottom:20px}
.q{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}
.q:first-of-type{border-top:0;padding-top:0;margin-top:0}
.q .qt{font-weight:700;font-size:16px;margin-bottom:12px}
.q .qt i{font-family:"JetBrains Mono",monospace;font-style:normal;color:var(--tx3);
  margin-inline-end:8px;font-size:13px}
.opt{display:block;width:100%;text-align:start;background:var(--card2);border:1px solid var(--line);
  color:var(--tx);border-radius:11px;padding:11px 14px;margin-bottom:8px;font:inherit;font-size:14.5px;
  cursor:pointer;transition:.13s}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card2))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card2))}
.opt .mk{float:inline-end;font-weight:800}
.ans{margin-top:8px;font-size:14.5px;color:var(--tx2);background:var(--card2);
  border-inline-start:3px solid var(--acc2);border-radius:0 11px 11px 0;padding:11px 14px}
body[dir="rtl"] .ans{border-radius:11px 0 0 11px}
.score{margin-top:22px;padding:14px 18px;border-radius:12px;border:1px dashed var(--line);
  text-align:center;font-weight:700}
.score.pass{border-color:var(--good);color:var(--good)}

/* pager / crumb */
.pager{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
.pager a{flex:1;min-width:200px;text-decoration:none;color:inherit;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;transition:.18s}
.pager a:hover{border-color:var(--acc);transform:translateY(-2px)}
.pager a b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--tx3);margin-bottom:4px;font-weight:700}
.pager a span{font-weight:700;font-size:15px}
.pager a.nx{text-align:end}
.pager .finish{flex:1;min-width:200px;margin:0}
.crumb{display:inline-block;margin-bottom:16px;color:var(--tx2);text-decoration:none;
  font-size:14px;font-weight:600}
.crumb:hover{color:var(--acc)}
.finish{text-align:center;padding:30px;border:1px dashed var(--line);border-radius:var(--r);color:var(--tx2)}
.finish.win{border-color:var(--acc2);color:var(--tx)}
.empty{padding:40px;text-align:center;color:var(--tx3)}

/* project */
.note{border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));
  background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:14px;
  padding:14px 18px;color:var(--tx);font-size:14.5px;margin-bottom:24px}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:22px;margin-bottom:16px}
.step .top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.step .no{width:34px;height:34px;border-radius:10px;background:var(--grad);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.step h3{font-size:18px;font-weight:700;letter-spacing:-.01em}
.step .goal{color:var(--tx);font-size:15px;margin-bottom:10px}
.step .whyp{color:var(--tx2);font-size:14.5px;margin-bottom:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tags a{font-size:11.5px;text-decoration:none;background:var(--card2);border:1px solid var(--line);
  color:var(--tx2);padding:3px 9px;border-radius:99px;transition:.13s}
.tags a:hover{border-color:var(--acc2);color:var(--tx)}
.promptbox{position:relative}
.promptbox .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--acc2);
  font-weight:700;margin-bottom:8px}
.copy{position:absolute;inset-inline-end:10px;top:30px;z-index:2;font-size:12px;padding:5px 10px}

/* checklist */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}
.col{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.col.no{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.col > h3{font-size:18px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.col.ok > h3{color:var(--good)} .col.no > h3{color:var(--bad)}
.col > .sub{color:var(--tx2);font-size:13.5px;margin-bottom:16px}
.ci{border-top:1px solid var(--line);padding:13px 0 0;margin-top:13px}
.ci:first-of-type{border-top:0;margin-top:0;padding-top:0}
.ci label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-weight:600;font-size:15px}
.ci input{margin-top:5px;accent-color:var(--acc);width:16px;height:16px;flex:none}
.ci p{color:var(--tx2);font-size:14px;margin-top:5px;padding-inline-start:26px}
.col.no .ci label{cursor:default}
.col.no .ci .x{color:var(--bad);font-weight:800;flex:none}

@media(max-width:900px){
  main{grid-template-columns:1fr}
  nav.side{position:static;max-height:none}
  #search{width:130px}
  .bar{flex-wrap:wrap;gap:10px}
  .copy{position:static;margin-bottom:8px}
}

/* grid/flex children default to min-width:auto, so a wide <pre> stretches
   the whole column instead of scrolling inside it */
main > #content{min-width:0}
.slide,.step,.quiz,.col,.promptbox,.mod,.cards,.grid,.cols{min-width:0}
pre.code{max-width:100%}

#who{font-size:13px;opacity:.7;max-width:14ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- learning paths (home) ---- */
.paths{margin-bottom:26px}
.phead h3{font-size:20px;font-weight:800;letter-spacing:-.01em}
.phead p{color:var(--tx2);font-size:14px;margin-bottom:14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.path{display:block;text-decoration:none;color:inherit;background:var(--card2);
  border:1px solid var(--line);border-radius:var(--r);padding:18px;transition:.18s;min-width:0}
.path:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}
.path .row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.path .ic{font-size:20px}
.path h4{font-size:16px;font-weight:700}
.path p{color:var(--tx2);font-size:14px}
.path .chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 10px}
.path .chips span{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--card);
  border:1px solid var(--line);color:var(--tx3)}
.path .mini{height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.path .mini i{display:block;height:100%;background:var(--grad)}

/* ---- ask-the-AI disclosure on a slide ---- */
.ask{margin-top:22px;border:1px dashed var(--line);border-radius:var(--r);padding:14px 16px}
.ask summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--acc2)}
.ask .sub{color:var(--tx3);font-size:13px;margin:6px 0 4px}
.ask .promptbox{margin-top:10px}

/* ---- architectures ---- */
.mini-dia{font-size:9.5px;line-height:1.35;max-height:170px;overflow:hidden;opacity:.75;
  background:var(--code);padding:10px;border-radius:10px;margin-top:10px}
.dia{font-size:12.5px;line-height:1.5;overflow-x:auto}
.arch h3{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;
  color:var(--tx3);margin:26px 0 10px}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.part{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.part b{font-size:14px}
.part p{color:var(--tx2);font-size:13.5px;margin-top:4px}
.aboxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:22px}
.abox{background:var(--card2);border:1px solid var(--line);border-inline-start:3px solid var(--tx3);
  border-radius:12px;padding:12px 14px;min-width:0}
.abox.ok{border-inline-start-color:var(--good)}
.abox.no{border-inline-start-color:var(--bad)}
.abox b{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3)}
.abox p{font-size:14px;margin-top:5px}

/* ---- glossary ---- */
.gloss{columns:3 240px;column-gap:20px}
.gl{break-inside:avoid;margin-bottom:18px}
.gl h4{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--acc2);
  border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:6px}
.gl a{display:flex;justify-content:space-between;gap:10px;align-items:baseline;
  padding:5px 6px;border-radius:8px;text-decoration:none;color:var(--tx2);font-size:14px}
.gl a:hover{background:var(--card2);color:var(--tx)}
.gl a.done{color:var(--tx3)}
.gl a.done span{text-decoration:line-through;text-decoration-color:var(--acc2)}
.gl a i{font-size:11px;color:var(--tx3);font-style:normal;white-space:nowrap}

/* ---- flashcards ---- */
.flash{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:44px 28px;text-align:center;cursor:pointer;min-height:260px;
  display:flex;flex-direction:column;justify-content:center;gap:12px;box-shadow:var(--shadow)}
.flash:hover{border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}
.flash .fk{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--tx3);
  text-transform:uppercase;letter-spacing:.1em}
.flash h2{font-size:30px;font-weight:800;letter-spacing:-.02em}
.flash .fhint{color:var(--tx3);font-size:13px}
.flash .fb{max-width:620px;margin:0 auto;color:var(--tx2);font-size:15.5px}
.flash .fb .w{margin-top:12px;color:var(--acc2);font-size:14px}
.fbar{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.fbar .grow{flex:1}

@media (max-width:900px){ .gloss{columns:1} .flash{padding:32px 18px} .flash h2{font-size:24px} }

</style>
</head>
<body dir="ltr">
<div class="wrap">

<header>
  <div class="bar">
    <a class="logo" href="#/"><span class="dot">◆</span><span id="brand">Vibe → Code</span></a>
    <div class="spacer"></div>

const DETAIL = {
 "Source code": {
  "en": "Source code is a description of a machine, written down. Not the machine itself, and not a set of hints about it — a complete description, in a language strict enough that something with no judgement can follow it. The strictness is the whole job. A human reader fills in what you left out; a computer executes exactly the gap you left, and calls the result your intention. Everything else — files, folders, frameworks — is bookkeeping around that one fact.\n\nA team ships a signup form. The requirement said \"email must be valid\", so the code checks that the text contains an @. On the third day a customer types \"lior@@globale\" with a trailing space, the record is written, the welcome email bounces, and support spends an hour explaining why the account exists but cannot be reached. Nothing crashed. No error appeared anywhere. The code did precisely what it said, and what it said was thinner than what anyone meant. Three lines of text, written months apart by two different people, one of whom is now on another team.\n\nWhen you build with an agent, this is the failure mode you should expect, because the agent is an extremely fast writer of plausible descriptions. It will produce code that reads correctly and handles the cases your prompt mentioned. The cases you did not mention become silent behaviour that nobody chose. So read what it wrote — it is plain text, that is the point — and read it asking one question: what input makes this do something stupid? Empty string, zero, negative number, a name with an apostrophe, two users clicking at once. Ask the agent that question directly and it will usually find its own holes; it simply was not asked.",
  "he": "קוד מקור הוא תיאור של מכונה, כתוב. לא המכונה עצמה, ולא אוסף רמזים עליה — תיאור מלא, בשפה מחמירה מספיק כדי שמשהו חסר שיקול דעת יוכל לבצע אותו. ההקפדה הזאת היא כל העבודה. קורא אנושי משלים את מה שהשמטת; מחשב מריץ בדיוק את החור שהשארת, וקורא לתוצאה הכוונה שלך. כל השאר — קבצים, תיקיות, פריימוורקים — הוא הנהלת חשבונות סביב העובדה האחת הזאת.\n\nצוות מעלה טופס הרשמה. הדרישה אמרה ״אימייל חייב להיות תקין״, אז הקוד בודק שהטקסט מכיל @. ביום השלישי לקוח מקליד ״lior@@globale״ עם רווח בסוף, הרשומה נכתבת, מייל הברוכים הבאים חוזר, ותמיכה מבזבזת שעה בהסבר למה החשבון קיים אבל אי אפשר להגיע אליו. שום דבר לא קרס. שום שגיאה לא הופיעה. הקוד עשה בדיוק מה שהוא אמר, ומה שהוא אמר היה דק ממה שמישהו התכוון. שלוש שורות טקסט, שנכתבו בהפרש של חודשים על ידי שני אנשים, שאחד מהם כבר בצוות אחר.\n\nכשאתה בונה עם סוכן, זה מצב הכשל שכדאי לצפות לו, כי הסוכן הוא כותב מהיר במיוחד של תיאורים סבירים. הוא ייצר קוד שנקרא נכון ומטפל במקרים שהפרומפט שלך הזכיר. המקרים שלא הזכרת הופכים להתנהגות שקטה שאף אחד לא בחר. אז תקרא מה שהוא כתב — זה טקסט רגיל, זו כל הנקודה — ותקרא אותו עם שאלה אחת: איזה קלט יגרום לזה לעשות שטות? מחרוזת ריקה, אפס, מספר שלילי, שם עם גרש, שני משתמשים שלוחצים באותו רגע. תשאל את הסוכן בדיוק את זה והוא בדרך כלל ימצא את החורים של עצמו; פשוט לא שאלו אותו."

 "Compiler / Interpreter": {
  "en": "The difference is when the translation happens, and that single choice decides when you find out you were wrong. A compiler reads your whole program before anything runs, turns it into machine code, and refuses to produce output if it cannot make sense of a line — even a line that would never have executed. An interpreter reads and runs as it goes, so a broken line sitting in a rarely-used branch is a perfectly happy program right up until someone reaches that branch.\n\nTwo teams ship the same typo: a function called sendInvioce. The Go service fails to build in CI, a red X appears ninety seconds after the push, and the developer fixes it before lunch. The Python service builds nothing, deploys cleanly, serves traffic all week, and then on the 1st of the month the billing job runs its once-a-month path and dies with NameError: name 'sendInvioce' is not defined. Same mistake, same cost to fix, discovered eleven days and one missed invoice run apart. Nothing about the typo was harder in Python; the feedback simply arrived from a customer instead of from a machine.\n\nThe practical consequence for you: know which kind of language your project is in, because it tells you how much a successful build actually proves. In a compiled or type-checked project, \"it builds\" is real evidence that the agent's refactor did not break call sites. In an interpreted one, \"it builds\" means nothing — the equivalent evidence is running the code, which means tests, or at minimum clicking through the path you changed. This is also the strongest argument for TypeScript over plain JavaScript on an AI-heavy project: it buys back a compiler's up-front check on work you did not write yourself.",
  "he": "ההבדל הוא מתי התרגום קורה, והבחירה האחת הזאת קובעת מתי תגלה שטעית. קומפיילר קורא את כל התוכנית לפני שמשהו רץ, הופך אותה לקוד מכונה, ומסרב לייצר פלט אם הוא לא מצליח להבין שורה — גם שורה שלעולם לא הייתה מתבצעת. אינטרפרטר קורא ומריץ תוך כדי, אז שורה שבורה שיושבת בענף שכמעט לא בשימוש היא תוכנית מאושרת לגמרי, עד שמישהו מגיע לענף הזה.\n\nשני צוותים מעלים את אותה שגיאת כתיב: פונקציה בשם sendInvioce. השירות ב-Go נכשל בבילד ב-CI, איקס אדום מופיע תשעים שניות אחרי הפוש, והמפתח מתקן לפני הצהריים. השירות בפייתון לא בונה כלום, עולה לאוויר נקי, מגיש תעבורה כל השבוע, ואז ב-1 בחודש ג׳וב החיוב רץ בנתיב החודשי שלו ומת עם NameError: name 'sendInvioce' is not defined. אותה טעות, אותו מחיר תיקון, נתגלתה בהפרש של אחד עשר ימים והרצת חיוב אחת שהוחמצה. שום דבר בשגיאה לא היה קשה יותר בפייתון; המשוב פשוט הגיע מלקוח במקום ממכונה.\n\nהמסקנה המעשית בשבילך: תדע באיזה סוג שפה הפרויקט שלך, כי זה אומר לך כמה בילד מוצלח באמת מוכיח. בפרויקט מקומפל או עם בדיקת טיפוסים, ״זה בונה״ הוא ראיה אמיתית שהריפקטור של הסוכן לא שבר קריאות. בפרויקט מפורש, ״זה בונה״ לא אומר כלום — הראיה המקבילה היא להריץ את הקוד, כלומר טסטים, או לפחות לעבור ידנית על הנתיב ששינית. זה גם הטיעון החזק ביותר ל-TypeScript על פני ג׳אווהסקריפט רגיל בפרויקט עתיר-AI: הוא קונה בחזרה בדיקה מוקדמת של קומפיילר על קוד שלא כתבת בעצמך."
 },
 "Runtime": {
  "en": "Your code never runs alone. It runs inside an engine that hands it memory, a clock, a filesystem, a network stack and a set of rules about what is allowed — Node for server-side JavaScript, the browser for the same language on a page, CPython for Python, the JVM for Java. That engine has a version, a configuration and bugs of its own, and none of that lives in your repository. Two machines running identical code are not running the same program if their runtimes differ.\n\nA developer builds a dashboard locally on Node 20 and it works. CI runs Node 18 because the workflow file was copied from an older project, and the build fails on a line using Object.groupBy, which only exists from Node 21. She adds a polyfill, CI goes green, and the app is deployed to a container that turns out to be Node 22 — where a dependency using a removed internal API crashes on the first request with a message mentioning nothing she wrote. Three machines, one codebase, three different programs. The fix is boring and permanent: pin the version in one place and make all three read it.\n\nThis is what \"works on my machine\" almost always means, and it is the reason containers exist — a container is the runtime plus its configuration, shipped as one artifact so every environment gets the same engine. When an agent gives you code that fails only in one place, say which runtime and which version in your prompt, and paste the actual error rather than describing it. Half the time the answer is not a code change at all: it is an engines field in package.json, an .nvmrc, or a base image tag that says 20 instead of latest. \"latest\" is a moving target, and a build that passed yesterday can fail today without a single line changing.",
  "he": "הקוד שלך אף פעם לא רץ לבד. הוא רץ בתוך מנוע שנותן לו זיכרון, שעון, מערכת קבצים, מחסנית רשת ואוסף חוקים על מה מותר — Node לג׳אווהסקריפט בצד שרת, הדפדפן לאותה שפה בדף, CPython לפייתון, ה-JVM לג׳אווה. למנוע הזה יש גרסה, קונפיגורציה ובאגים משלו, ושום דבר מזה לא נמצא בריפו שלך. שתי מכונות שמריצות קוד זהה לא מריצות את אותה תוכנית אם הרנטיים שלהן שונה.\n\nמפתחת בונה דשבורד מקומית על Node 20 וזה עובד. ה-CI מריץ Node 18 כי קובץ ה-workflow הועתק מפרויקט ישן, והבילד נכשל על שורה שמשתמשת ב-Object.groupBy, שקיים רק מ-Node 21. היא מוסיפה polyfill, ה-CI נהיה ירוק, והאפליקציה עולה לקונטיינר שמתברר שהוא Node 22 — שם תלות שמשתמשת ב-API פנימי שהוסר קורסת בריקווסט הראשון עם הודעה שלא מזכירה שום דבר שהיא כתבה. שלוש מכונות, בסיס קוד אחד, שלוש תוכניות שונות. התיקון משעמם וקבוע: לנעוץ את הגרסה במקום אחד ולגרום לשלושתם לקרוא ממנו.\n\nזה מה ש״אצלי זה עובד״ כמעט תמיד אומר, וזו הסיבה שקונטיינרים קיימים — קונטיינר הוא הרנטיים והקונפיגורציה שלו, נארזים כארטיפקט אחד כך שכל סביבה מקבלת את אותו מנוע. כשסוכן נותן לך קוד שנכשל רק במקום אחד, תגיד בפרומפט איזה רנטיים ואיזו גרסה, ותדביק את השגיאה עצמה במקום לתאר אותה. בחצי מהמקרים התשובה היא בכלל לא שינוי קוד: היא שדה engines ב-package.json, קובץ ‎.nvmrc, או תגית אימג׳ שאומרת 20 במקום latest. ״latest״ הוא מטרה נעה, ובילד שעבר אתמול יכול להיכשל היום בלי ששורה אחת השתנתה."
 },
 "Terminal / CLI": {
  "en": "A terminal is a text conversation with your computer, and its power is not nostalgia — it is composition. Every command reads text and writes text, so the output of one becomes the input of the next, and a tool nobody designed to work with your tool works with your tool anyway. Clicking cannot be piped, scripted, scheduled, diffed or pasted into a bug report. That is why every serious dev tool is a CLI first and grows a GUI later, if ever.\n\nA deploy fails at 18:40 on a Thursday. The dashboard shows a red box saying \"Build failed\". In the terminal, the same failure is a line you can act on: grep the log for the first \"error\" and you see a missing environment variable; one command lists which variables the container actually received; another shows the value is set in staging but not production. Four commands, ninety seconds, and the answer is a config difference rather than a code bug. The same investigation through a web console is six pages of clicking, and at the end you cannot paste what you did to a colleague.\n\nFor AI-assisted work the terminal is where the truth lives, and it is also the most dangerous surface you have. An agent that can run commands can also run the wrong one, and rm, git reset --hard, DROP and force-push do not ask twice. Read commands before approving them, and be suspicious of any one-liner you would not be able to explain. Learn six: how to list files, how to see where you are, how to search text, how to see what is listening on a port, how to read the last part of a log, and how to stop a running process. That handful covers most of what you will ever need, and it makes an agent's suggestions checkable instead of magic.",
  "he": "טרמינל הוא שיחת טקסט עם המחשב שלך, והכוח שלו הוא לא נוסטלגיה — הוא הרכבה. כל פקודה קוראת טקסט וכותבת טקסט, אז הפלט של אחת הופך לקלט של הבאה, וכלי שאף אחד לא תכנן שיעבוד עם הכלי שלך עובד איתו בכל זאת. אי אפשר לצנרת לחיצות, אי אפשר לסקריפט אותן, לתזמן, להשוות או להדביק אותן בדיווח באג. בגלל זה כל כלי פיתוח רציני הוא קודם כל CLI, ומגדל ממשק גרפי אחר כך, אם בכלל.\n\nדיפלוי נכשל ב-18:40 ביום חמישי. הדשבורד מציג ריבוע אדום שאומר ״Build failed״. בטרמינל, אותו כשל הוא שורה שאפשר לפעול לפיה: grep על הלוג אחרי ה-error הראשון ואתה רואה משתנה סביבה חסר; פקודה אחת מציגה אילו משתנים הקונטיינר באמת קיבל; אחרת מראה שהערך מוגדר בסטייג׳ינג ולא בפרודקשן. ארבע פקודות, תשעים שניות, והתשובה היא הבדל קונפיגורציה ולא באג בקוד. אותה חקירה דרך קונסולת ווב היא שישה מסכים של לחיצות, ובסוף אי אפשר להדביק לעמית מה עשית.\n\nבעבודה עם AI הטרמינל הוא המקום שבו האמת נמצאת, והוא גם המשטח המסוכן ביותר שיש לך. סוכן שיכול להריץ פקודות יכול גם להריץ את הפקודה הלא נכונה, ו-rm, git reset --hard, DROP ופוש בכוח לא שואלים פעמיים. תקרא פקודות לפני שאתה מאשר אותן, ותחשוד בכל שורה שלא היית יודע להסביר. תלמד שש: איך לראות קבצים, איך לדעת איפה אתה, איך לחפש טקסט, איך לראות מי מאזין על פורט, איך לקרוא את סוף הלוג, ואיך לעצור תהליך שרץ. החופן הזה מכסה את רוב מה שתצטרך אי פעם, והוא הופך הצעות של סוכן לניתנות לבדיקה במקום לקסם."

 "Repository (repo)": {
  "en": "A repo is a folder that remembers. Every saved state, who produced it, when, and the sentence they wrote explaining why — all of it kept locally, all of it queryable. That last part matters more than the backup: the history is a searchable record of decisions, so the question \"why on earth is this here?\" has an answer three years later, attached to the line itself.\n\nA rate limit starts rejecting a partner's traffic on a Tuesday. Nobody on the current team wrote it. One command blames the line and points at a commit from fourteen months ago; the message says \"limit to 100/min — vendor asked, see ticket OPS-412\". Total time to answer: twenty seconds, and the decision is now re-openable with the person who made it rather than guessed at. Without that history the team either leaves a rule nobody understands or removes it and rediscovers the reason the hard way, which in this case was a vendor contract.\n\nWorking with an agent makes the repo load-bearing rather than merely nice. An agent can touch thirty files in a minute, and your ability to accept that confidently rests entirely on being able to see exactly what changed and undo all of it with one command. So the habits are: commit before you start a session, not after; commit small and often while it works, so a bad step is one commit to drop rather than an afternoon to untangle; and never let an uncommitted mess accumulate over days. Two things not to put in there: secrets, because history is forever and rotating a leaked key is the only real fix, and large binaries, because Git stores every version of them. If you are not sure the repo is clean before an agent starts, that is the moment to check — not after it has rewritten half your app.",
  "he": "ריפו הוא תיקייה שזוכרת. כל מצב שנשמר, מי יצר אותו, מתי, והמשפט שהוא כתב כדי להסביר למה — הכול נשמר מקומית, הכול ניתן לשאילתה. החלק האחרון חשוב יותר מהגיבוי: ההיסטוריה היא תיעוד ניתן לחיפוש של החלטות, כך שלשאלה ״למה לעזאזל זה כאן?״ יש תשובה שלוש שנים אחר כך, צמודה לשורה עצמה.\n\nהגבלת קצב מתחילה לדחות תעבורה של שותף ביום שלישי. אף אחד בצוות הנוכחי לא כתב אותה. פקודה אחת עושה blame על השורה ומצביעה על קומיט מלפני ארבעה עשר חודשים; ההודעה אומרת ״limit to 100/min — vendor asked, see ticket OPS-412״. זמן כולל לתשובה: עשרים שניות, ועכשיו אפשר לפתוח מחדש את ההחלטה מול מי שקיבל אותה במקום לנחש אותה. בלי ההיסטוריה הזאת הצוות או משאיר חוק שאף אחד לא מבין, או מוחק אותו ומגלה את הסיבה בדרך הקשה — שבמקרה הזה הייתה חוזה עם ספק.\n\nעבודה עם סוכן הופכת את הריפו לקריטי ולא רק לנחמד. סוכן יכול לגעת בשלושים קבצים בדקה, והיכולת שלך לקבל את זה בביטחון נשענת כולה על כך שאתה יכול לראות בדיוק מה השתנה ולבטל הכול בפקודה אחת. אז ההרגלים הם: לעשות קומיט לפני שמתחילים סשן, לא אחריו; לעשות קומיטים קטנים ותכופים תוך כדי, כדי שצעד גרוע יהיה קומיט אחד לזרוק ולא אחר צהריים של פירוק; ולא לתת לבלגן לא-מקומט להצטבר על פני ימים. שני דברים שלא שמים שם: סודות, כי ההיסטוריה היא לנצח והחלפת מפתח שדלף היא התיקון האמיתי היחיד, וקבצים בינאריים גדולים, כי Git שומר כל גרסה שלהם. אם אתה לא בטוח שהריפו נקי לפני שסוכן מתחיל — זה הרגע לבדוק, לא אחרי שהוא שכתב חצי אפליקציה."
 },
 "Commit / Branch / Merge": {
  "en": "These three words describe one habit: work that can be thrown away cheaply. A commit is a saved point with a sentence attached. A branch is a name for a line of commits, so you can build something half-finished without anyone else seeing it. A merge folds that line back into the main one, and when two lines changed the same region, Git stops and asks you which version wins rather than choosing for you.\n\nA developer asks an agent to \"move the checkout to the new pricing service\". Forty minutes and twenty-two files later, checkout works but the admin export silently returns zero rows, because a shared helper changed shape. On main, that is an evening of picking apart what to keep. On a branch called feat/pricing-service, it is two commands: switch back, delete the branch, and the app is exactly as it was at 14:00. The forty minutes are gone; nothing else is. Then the second attempt starts from a known-good state with a sharper prompt, because now you know where it broke.\n\nThe pattern to internalise is branch-before-agent, and small commits during. Write commit messages for the person reading them under pressure at 2am — \"fix checkout 500 on empty cart\" beats \"fix bug\" and costs the same. When a merge conflict appears, do not let the agent resolve it blind; it will happily pick a side and produce code that compiles while dropping someone's change. Look at both versions yourself — that is the one moment where Git is explicitly telling you two intentions collided, and it is the cheapest possible place to notice. If you only take one thing from this module: a branch costs nothing, and regret is expensive.",
  "he": "שלוש המילים האלה מתארות הרגל אחד: עבודה שאפשר לזרוק בזול. קומיט הוא נקודת שמירה עם משפט מוצמד. ברנץ׳ הוא שם לקו של קומיטים, כך שאפשר לבנות משהו חצי-גמור בלי שאף אחד אחר יראה. מרג׳ מקפל את הקו הזה בחזרה לראשי, וכששני קווים שינו את אותו אזור, Git עוצר ושואל איזו גרסה מנצחת במקום לבחור בשבילך.\n\nמפתח מבקש מסוכן ״להעביר את הצ׳קאאוט לשירות התמחור החדש״. ארבעים דקות ועשרים ושניים קבצים אחר כך, הצ׳קאאוט עובד אבל ייצוא האדמין מחזיר בשקט אפס שורות, כי helper משותף שינה צורה. על main, זה ערב שלם של לפרק מה לשמור. על ברנץ׳ בשם feat/pricing-service, זה שתי פקודות: לחזור, למחוק את הברנץ׳, והאפליקציה בדיוק כמו שהייתה ב-14:00. ארבעים הדקות הלכו; שום דבר אחר לא. ואז הניסיון השני מתחיל ממצב תקין ידוע עם פרומפט חד יותר, כי עכשיו אתה יודע איפה זה נשבר.\n\nהתבנית שכדאי להפנים היא ברנץ׳-לפני-סוכן, וקומיטים קטנים תוך כדי. תכתוב הודעות קומיט בשביל מי שיקרא אותן בלחץ בשתיים בלילה — ״fix checkout 500 on empty cart״ עדיף על ״fix bug״ ועולה אותו דבר. כשמופיע קונפליקט במרג׳, אל תיתן לסוכן לפתור אותו בעיוורון; הוא ישמח לבחור צד ולייצר קוד שמתקמפל תוך שהוא מוחק שינוי של מישהו. תסתכל בעצמך על שתי הגרסאות — זה הרגע היחיד שבו Git אומר לך במפורש ששתי כוונות התנגשו, וזה המקום הזול ביותר לשים לב. אם אתה לוקח דבר אחד מהמודול הזה: ברנץ׳ לא עולה כלום, וחרטה עולה ביוקר."
 },
 "Environment": {
  "en": "An environment is a complete copy of your system with its own configuration, its own data and its own audience. Local is yours alone. Staging looks like the real thing and is safe to break. Production has real users, real money and real consequences. The code can be identical in all three and the behaviour still differs, because the parts that are not code — keys, feature flags, database contents, third-party accounts, resource limits — are what define an environment.\n\nA team tests a refund flow in staging against the payment provider's sandbox. Every refund succeeds instantly. In production the same provider returns a 202 and completes asynchronously minutes later, so the code that marks the order refunded immediately after the call is correct in staging and wrong in production. Nobody notices for nine days, until finance reconciles and finds 31 orders marked refunded that were never actually paid back. The bug was never in the code path; it was in the assumption that the two environments behaved alike.\n\nThe discipline that pays: environments differ only in configuration, never in code, and configuration lives in the environment rather than the repository — which is why .env files are not committed and secrets are injected at runtime. Ask an agent to \"add a config value\" and check where it put it; agents cheerfully hardcode a test key or write a localhost URL that works everywhere until it reaches a server. Know which environment your terminal is pointed at before you run anything destructive — a database migration and a truncate look the same until you notice the host. And treat a production console the way you would treat a live microphone: assume every action is visible, irreversible and watched by someone who will be affected by it.",
  "he": "סביבה היא עותק שלם של המערכת שלך עם קונפיגורציה משלה, נתונים משלה וקהל משלה. מקומית היא שלך בלבד. סטייג׳ינג נראית כמו הדבר האמיתי ובטוח לשבור אותה. פרודקשן מחזיקה משתמשים אמיתיים, כסף אמיתי ותוצאות אמיתיות. הקוד יכול להיות זהה בשלושתן וההתנהגות עדיין תשתנה, כי החלקים שהם לא קוד — מפתחות, פיצ׳ר-פלאגים, תוכן במסד הנתונים, חשבונות אצל צד שלישי, מגבלות משאבים — הם מה שמגדיר סביבה.\n\nצוות בודק תהליך זיכוי בסטייג׳ינג מול הסנדבוקס של ספק התשלומים. כל זיכוי מצליח מיידית. בפרודקשן אותו ספק מחזיר 202 ומשלים אסינכרונית כעבור דקות, אז הקוד שמסמן את ההזמנה כמזוכה מיד אחרי הקריאה נכון בסטייג׳ינג ושגוי בפרודקשן. אף אחד לא שם לב תשעה ימים, עד שהכספים עושים התאמה ומוצאים 31 הזמנות מסומנות כמזוכות שמעולם לא הוחזר עליהן כסף. הבאג מעולם לא היה בנתיב הקוד; הוא היה בהנחה ששתי הסביבות מתנהגות אותו דבר.\n\nהמשמעת שמשתלמת: סביבות נבדלות רק בקונפיגורציה, אף פעם לא בקוד, והקונפיגורציה חיה בסביבה ולא בריפו — ולכן קבצי ‎.env לא נכנסים לקומיט וסודות מוזרקים בזמן ריצה. תבקש מסוכן ״להוסיף ערך קונפיגורציה״ ותבדוק איפה הוא שם אותו; סוכנים משתילים בשמחה מפתח בדיקה קשיח או כתובת localhost שעובדת בכל מקום עד שהיא מגיעה לשרת. תדע לאיזו סביבה הטרמינל שלך מכוון לפני שאתה מריץ משהו הרסני — מיגרציה ו-truncate נראים אותו דבר עד שאתה שם לב ל-host. ותתייחס לקונסולה של פרודקשן כמו למיקרופון פתוח: תניח שכל פעולה גלויה, בלתי הפיכה ונצפית על ידי מישהו שתושפע ממנה."
 },
 "Bug / Stack trace": {
  "en": "A stack trace is not noise, and it is not an error message — it is the exact path the program walked to reach the moment it gave up, printed innermost-first. The top line is where it actually broke. Below it, in order, is who called that, and who called them, down to the framework. Reading it is a two-second skill that most people never acquire, which is why so much debugging starts with guessing.\n\nA checkout returns 500. The trace reads: TypeError: Cannot read properties of undefined (reading 'id') at getOwner (src/orders/service.ts:42), then at handler (src/routes/orders.ts:17), then twelve lines inside node_modules/express. The useful content is entirely in the first two lines: something at service.ts:42 expected an object and got undefined, and it was called from the orders route. Open line 42 and the answer is usually visible — an order with no user, a lookup that returned nothing, a field renamed last week. The twelve framework lines below contain no information about your bug at all; their only job is to confirm the request came in through Express.\n\nWith an agent, the trace is the single highest-value thing you can paste, and most people paste the wrong part. Give it the full trace, not the one-line summary, plus the code at the top frame and what you were doing when it happened. Then be specific about the ask: \"why is order.user undefined here\" gets a diagnosis, while \"fix this error\" often gets a defensive `if (!order.user) return` that makes the 500 disappear and the real bug — an order created without an owner — permanent and invisible. A crash you can see is a gift. A silent wrong answer is the expensive kind.",
  "he": "סטאק טרייס הוא לא רעש, והוא לא הודעת שגיאה — הוא הנתיב המדויק שהתוכנית עברה עד לרגע שבו ויתרה, מודפס מהפנימי כלפי חוץ. השורה העליונה היא המקום שבו זה באמת נשבר. מתחתיה, לפי סדר, מי קרא לזה, ומי קרא להם, עד הפריימוורק. לקרוא את זה היא מיומנות של שתי שניות שרוב האנשים לא רוכשים, ובגלל זה כל כך הרבה דיבוג מתחיל בניחוש.\n\nצ׳קאאוט מחזיר 500. הטרייס אומר: TypeError: Cannot read properties of undefined (reading 'id') at getOwner (src/orders/service.ts:42), אחר כך at handler (src/routes/orders.ts:17), ואז שתים עשרה שורות בתוך node_modules/express. כל התוכן השימושי נמצא בשתי השורות הראשונות: משהו ב-service.ts:42 ציפה לאובייקט וקיבל undefined, והוא נקרא מהנתיב של ההזמנות. תפתח את שורה 42 והתשובה בדרך כלל גלויה — הזמנה בלי משתמש, שליפה שלא החזירה כלום, שדה ששינו לו שם בשבוע שעבר. שתים עשרה שורות הפריימוורק שמתחת לא מכילות שום מידע על הבאג שלך; כל תפקידן הוא לאשר שהריקווסט נכנס דרך Express.\n\nמול סוכן, הטרייס הוא הדבר בעל הערך הגבוה ביותר שאתה יכול להדביק, ורוב האנשים מדביקים את החלק הלא נכון. תן לו את הטרייס המלא, לא את שורת הסיכום, יחד עם הקוד בפריים העליון ומה עשית כשזה קרה. ואז תהיה מדויק בבקשה: ״למה order.user הוא undefined כאן״ מקבל אבחנה, בעוד ש״תתקן את השגיאה״ מקבל הרבה פעמים `if (!order.user) return` הגנתי שגורם ל-500 להיעלם ולבאג האמיתי — הזמנה שנוצרה בלי בעלים — להיות קבוע ובלתי נראה. קריסה שאתה רואה היא מתנה. תשובה שגויה ושקטה היא הסוג היקר."
 },
 "Client": {
  "en": "Everything on the client is a suggestion. The user can open the tools, change a value, and send whatever they like. Hidden buttons are still reachable; disabled fields are still submittable.\n\nSo the client has exactly one security job: none. It shapes the experience and it validates for convenience, but every rule it enforces must also be enforced on the other side, where the user cannot reach.",
  "he": "כל מה שנמצא אצל הלקוח הוא בגדר הצעה. המשתמש יכול לפתוח את הכלים, לשנות ערך, ולשלוח מה שבא לו. כפתורים מוסתרים עדיין נגישים; שדות מנוטרלים עדיין ניתנים לשליחה.\n\nאז ללקוח יש בדיוק תפקיד אבטחה אחד: אף אחד. הוא מעצב את החוויה ומאמת לנוחות, אבל כל חוק שהוא אוכף חייב להיאכף גם בצד השני, שם המשתמש לא מגיע."
 },
 "Server": {
  "en": "The server is the only place you control. It is the boundary between what people want to do and what they are permitted to do, and it is the single source of truth about what actually happened.\n\nThinking of it as just a computer is right and useful. It has a disk that fills up, memory that runs out, and a clock that drifts. Every mysterious production issue eventually reduces to one of those three.",
  "he": "השרת הוא המקום היחיד שאתה שולט בו. הוא הגבול בין מה שאנשים רוצים לעשות לבין מה שמותר להם, והוא מקור האמת היחיד לגבי מה באמת קרה.\n\nלחשוב עליו כעל מחשב רגיל זה נכון ומועיל. יש לו דיסק שמתמלא, זיכרון שנגמר, ושעון שנסחף. כל תקלה מסתורית בפרודקשן מתכנסת בסוף לאחד משלושת אלה."
 },
 "Frontend": {
  "en": "Frontend work is mostly state management wearing a costume. The visual part is the easy half; the hard half is that the screen must stay consistent with data that arrives late, arrives wrong, or never arrives.\n\nLoading, empty, error, and partial are not edge cases — they are four of the five states every screen has. Designs that only show the happy path are the main source of frontend rework.",
  "he": "עבודת פרונטאנד היא בעיקר ניהול מצב בתחפושת. החלק הוויזואלי הוא החצי הקל; החצי הקשה הוא שהמסך חייב להישאר עקבי מול נתונים שמגיעים מאוחר, מגיעים שגויים, או לא מגיעים בכלל.\n\nטעינה, ריק, שגיאה וחלקי הם לא מקרי קצה — הם ארבעה מתוך חמשת המצבים שיש לכל מסך. עיצובים שמציגים רק את המסלול המוצלח הם המקור העיקרי לעבודה חוזרת בפרונט."
 },
 "Backend": {
  "en": "The backend is where the rules live, and a rule only counts if it cannot be bypassed. If the price can be changed by the caller, the price is not a rule — it is a default.\n\nIt is also where time and order become real problems. Two requests arriving at once, a retry after a timeout, a job that ran twice — none of these exist in the UI, and all of them exist here.",
  "he": "הבקאנד הוא המקום שבו החוקים חיים, וחוק נחשב רק אם אי אפשר לעקוף אותו. אם הקורא יכול לשנות את המחיר, המחיר הוא לא חוק — הוא ברירת מחדל.\n\nזה גם המקום שבו זמן וסדר הופכים לבעיות אמיתיות. שתי בקשות שמגיעות יחד, ניסיון חוזר אחרי פסק זמן, משימה שרצה פעמיים — כל אלה לא קיימים בממשק, וכולם קיימים כאן."
 },
 "API": {
  "en": "An API is a promise about shape: these fields, these names, these meanings. Once someone depends on it, the promise is harder to change than the code behind it — that is the entire reason versioning exists.\n\nThe design question is never what data do I have, it is what does the caller need to do. An API that mirrors your database tables forces every consumer to understand your internals, and locks you out of changing them.",
  "he": "API הוא הבטחה לגבי צורה: השדות האלה, השמות האלה, המשמעויות האלה. ברגע שמישהו נשען עליו, קשה יותר לשנות את ההבטחה מאשר את הקוד שמאחוריה — זו כל הסיבה שקיים ניהול גרסאות.\n\nשאלת התכנון היא אף פעם לא אילו נתונים יש לי, אלא מה הקורא צריך לעשות. API שמשקף את טבלאות מסד הנתונים שלך מכריח כל צרכן להבין את הפנימיות שלך, ונועל אותך מלשנות אותן."
 },
 "localhost & port": {
  "en": "A machine has one address but thousands of doors. A port is how the operating system decides which running program a arriving connection belongs to.\n\nThis is why a conflict is always two programs wanting the same door, never a broken network. And it is why exposing a port is a security decision: you are deciding who, from where, may knock.",
  "he": "למכונה יש כתובת אחת אבל אלפי דלתות. פורט הוא הדרך שבה מערכת ההפעלה מחליטה לאיזו תוכנית רצה שייך חיבור שמגיע.\n\nבגלל זה התנגשות היא תמיד שתי תוכניות שרוצות את אותה דלת, אף פעם לא רשת שבורה. ובגלל זה חשיפת פורט היא החלטת אבטחה: אתה מחליט מי, ומאיפה, רשאי לדפוק."
 },
 "DNS": {
  "en": "DNS is a global cache with no reliable way to clear it. Your change is instant at the source and arbitrarily slow everywhere else, because thousands of machines in between are still holding the old answer until its timer expires.\n\nThe practical rule: lower the record TTL a day before a planned move, not during it. Once the move has started, everyone already has the old value and the old timer.",
  "he": "DNS הוא מטמון גלובלי בלי דרך אמינה לנקות אותו. השינוי שלך מיידי במקור ואיטי באופן שרירותי בכל מקום אחר, כי אלפי מכונות בדרך עדיין מחזיקות בתשובה הישנה עד שהטיימר שלהן יפוג.\n\nהכלל המעשי: הורד את ה-TTL של הרשומה יום לפני מעבר מתוכנן, לא תוך כדי. ברגע שהמעבר התחיל, לכולם כבר יש את הערך הישן ואת הטיימר הישן."
 },
 "Full stack": {
  "en": "Full stack is not knowing everything. It is knowing enough of each layer to find which layer is lying to you.\n\nThat diagnostic ability is the actual value. A slow page could be the query, the network, the render, or the cache — and someone who can only see one layer will confidently optimise the wrong one.",
  "he": "פול סטאק זה לא לדעת הכל. זה לדעת מספיק מכל שכבה כדי למצוא איזו שכבה משקרת לך.\n\nיכולת האבחון הזו היא הערך האמיתי. דף איטי יכול להיות השאילתה, הרשת, הרינדור או המטמון — ומי שרואה רק שכבה אחת יבצע אופטימיזציה בטוחה בעצמה לשכבה הלא נכונה."
 },
 "Request / Response": {
  "en": "HTTP has one rhythm and it never varies: the client sends a request, the server sends back exactly one response, and the exchange is over. The server has no way to speak first. It does not know you exist until you knock, and the moment it answers it forgets you — which is why every request has to carry its own identity, usually a token or a cookie, rather than relying on the server remembering who you were a second ago.\n\nA product manager asks for \"live\" order status on the customer page. The developer implements it the obvious way: the browser asks the server every two seconds whether anything changed. With 3,000 people on that page during a campaign, that is 90,000 requests a minute to answer \"no change\" — the database saturates, response times climb from 80ms to 1.4s, and the page everyone is watching becomes the slowest one in the product. The feature was not wrong; the mechanism was. A websocket or a server-sent stream keeps one open channel per user and pushes only when something actually happens.\n\nOnce the rhythm is in your head, a whole class of confusion resolves. It explains why a server cannot notify your app of a payment result directly and uses a webhook — which is just the same rhythm in the other direction, their server making a request to yours. It explains why refreshing a page re-sends everything, and why a request that times out may still have been fully processed on the other side. And when an agent proposes real-time updates, the question to ask is which mechanism and at what cost: polling every two seconds is trivially easy to write and quietly expensive to run.",
  "he": "ל-HTTP יש קצב אחד והוא אף פעם לא משתנה: הקליינט שולח ריקווסט, השרת מחזיר רספונס אחד בדיוק, וההחלפה נגמרה. לשרת אין שום דרך לדבר ראשון. הוא לא יודע שאתה קיים עד שאתה דופק, וברגע שהוא עונה הוא שוכח אותך — ולכן כל ריקווסט חייב לשאת את הזהות שלו, בדרך כלל טוקן או קוקי, במקום להישען על זה שהשרת זוכר מי היית לפני שנייה.\n\nמנהל מוצר מבקש סטטוס הזמנה ״חי״ בעמוד הלקוח. המפתח מממש בדרך המתבקשת: הדפדפן שואל את השרת כל שתי שניות אם משהו השתנה. עם 3,000 אנשים בעמוד הזה במהלך קמפיין, אלה 90,000 ריקווסטים בדקה כדי לענות ״לא השתנה״ — מסד הנתונים נחנק, זמני התגובה מטפסים מ-80ms ל-1.4 שניות, והעמוד שכולם מסתכלים עליו הופך לאיטי במוצר. הפיצ׳ר לא היה שגוי; המנגנון היה. websocket או זרם מהשרת מחזיקים ערוץ פתוח אחד לכל משתמש ודוחפים רק כשמשהו באמת קורה.\n\nברגע שהקצב הזה בראש שלך, מחלקה שלמה של בלבול נפתרת. זה מסביר למה שרת לא יכול להודיע לאפליקציה שלך על תוצאת תשלום ישירות ומשתמש ב-webhook — שהוא בסך הכול אותו קצב בכיוון ההפוך, השרת שלהם שולח ריקווסט לשלך. זה מסביר למה רענון עמוד שולח הכול מחדש, ולמה ריקווסט שנפל בטיים-אאוט יכול בכל זאת להיות מעובד במלואו בצד השני. וכשסוכן מציע עדכונים בזמן אמת, השאלה היא איזה מנגנון ובאיזה מחיר: polling כל שתי שניות קל לכתוב וקר בשקט לתפעל."
 },
 "GET": {
  "en": "GET means read. It is defined as safe, which is a technical promise rather than a style preference: performing it must not change anything the caller can observe. Because of that promise, GET responses can be cached, prefetched, retried after a failure, stored in browser history and crawled by anything that finds the link — and none of those actors ask your permission first.\n\nAn internal admin tool exposes deletion as a link: GET /users/42/delete. It works, it is one line of code, and nothing bad happens for a year. Then the team adds a link-preview bot to their chat: someone pastes an admin URL into a channel, the bot dutifully fetches every link to render a preview, and four accounts are deleted by a robot that was trying to be helpful. Chrome's prefetch, an antivirus proxy scanning links in email, and a monitoring tool that pings your routes will all do the same thing. Nobody was careless at the moment of deletion; the carelessness was months earlier, in the choice of verb.\n\nThe habit worth building: reads are GET, and anything with a consequence is POST, PUT, PATCH or DELETE — not because a committee said so, but because the entire internet is built around that assumption. Two related traps to check in generated code. First, secrets in query strings: a token in a URL ends up in server logs, browser history and the Referer header sent to the next site. Second, a GET that quietly writes — updating a last_seen timestamp is usually fine, sending an email or charging a card is not. If the AI wrote a route, read the verb before you read the body.",
  "he": "GET אומר קריאה. הוא מוגדר כבטוח, וזו הבטחה טכנית ולא העדפת סגנון: ביצוע שלו לא אמור לשנות שום דבר שהקורא יכול לראות. בזכות ההבטחה הזאת אפשר לשמור תשובות GET בקאש, להביא אותן מראש, לנסות שוב אחרי כישלון, לשמור אותן בהיסטוריית הדפדפן ולזחול אליהן מכל מקום שמצא את הקישור — ואף אחד מהגורמים האלה לא מבקש ממך רשות.\n\nכלי אדמין פנימי חושף מחיקה כקישור: GET /users/42/delete. זה עובד, זו שורה אחת, ושום דבר רע לא קורה במשך שנה. ואז הצוות מוסיף בוט תצוגה מקדימה לצ׳אט: מישהו מדביק כתובת אדמין בערוץ, הבוט מושך בנאמנות כל קישור כדי לרנדר תצוגה מקדימה, וארבעה חשבונות נמחקים על ידי רובוט שניסה לעזור. ה-prefetch של כרום, פרוקסי אנטי-וירוס שסורק קישורים במייל, וכלי ניטור שדוגם את הנתיבים שלך — כולם יעשו בדיוק אותו דבר. אף אחד לא היה רשלן ברגע המחיקה; הרשלנות הייתה חודשים קודם, בבחירת המתודה.\n\nההרגל ששווה לבנות: קריאות הן GET, וכל מה שיש לו תוצאה הוא POST, PUT, PATCH או DELETE — לא כי ועדה אמרה, אלא כי כל האינטרנט בנוי סביב ההנחה הזאת. שתי מלכודות קרובות שכדאי לבדוק בקוד שנוצר. ראשית, סודות ב-query string: טוקן בכתובת מגיע ללוגים של השרת, להיסטוריית הדפדפן ולכותרת Referer שנשלחת לאתר הבא. שנית, GET שכותב בשקט — לעדכן חותמת last_seen בדרך כלל בסדר, לשלוח מייל או לחייב כרטיס לא. אם ה-AI כתב נתיב, תקרא את המתודה לפני שאתה קורא את הגוף."
 },
 "POST / PUT / PATCH / DELETE": {
  "en": "Four verbs, four different promises. POST creates something new and is the only one of the four that is expected to produce a different result each time you call it. PUT replaces a resource entirely with what you sent — anything you omitted is now gone. PATCH changes only the fields you named. DELETE removes. The distinction that matters most in practice is repeatability: sending the same PUT, PATCH or DELETE twice should leave the world in the same state as sending it once, while sending the same POST twice creates two things.\n\nA mobile checkout posts an order. The user is on a train, the connection drops after the server has already created order 7c3f but before the response arrives, and the app's retry logic fires. The server creates 7c40, identical. The customer is charged twice, gets two confirmation emails, and the support conversation costs more than the order was worth. The fix is not to stop retrying — networks will always do this — it is an idempotency key: a unique id the client generates and sends with both attempts, so the server recognises the second one and returns the original result instead of creating another order.\n\nThe other classic is PUT used where PATCH was meant. A profile update sends {\"name\": \"Lior\"} as a PUT, the server replaces the whole record, and the user's phone number, address and notification settings are silently blanked. Everything about the request looked successful. When reviewing generated endpoints, check three things: does the verb match what the code actually does, is a repeated call safe, and for PUT, does it really intend to replace everything. Picking the right verb is also free documentation — for the next developer, and for the next AI reading your codebase.",
  "he": "ארבע מתודות, ארבע הבטחות שונות. POST יוצר משהו חדש והוא היחיד מהארבעה שמצפים ממנו לתוצאה שונה בכל קריאה. PUT מחליף את המשאב כולו במה ששלחת — כל מה שהשמטת פשוט נעלם. PATCH משנה רק את השדות שציינת. DELETE מוחק. ההבחנה שהכי חשובה בפועל היא יכולת החזרה: שליחה של אותו PUT, PATCH או DELETE פעמיים אמורה להשאיר את העולם באותו מצב כמו שליחה אחת, בעוד ששליחת אותו POST פעמיים יוצרת שני דברים.\n\nצ׳קאאוט בנייד שולח הזמנה ב-POST. המשתמש ברכבת, החיבור נופל אחרי שהשרת כבר יצר הזמנה 7c3f אבל לפני שהרספונס הגיע, והלוגיקה של הניסיון החוזר באפליקציה נורית. השרת יוצר 7c40, זהה. הלקוח מחויב פעמיים, מקבל שני מיילים, ושיחת התמיכה עולה יותר מההזמנה. התיקון הוא לא להפסיק לנסות שוב — רשתות תמיד יעשו את זה — אלא מפתח אידמפוטנטיות: מזהה ייחודי שהקליינט מייצר ושולח בשני הניסיונות, כך שהשרת מזהה את השני ומחזיר את התוצאה המקורית במקום ליצור עוד הזמנה.\n\nהקלאסיקה השנייה היא PUT במקום שבו התכוונו ל-PATCH. עדכון פרופיל שולח {\"name\": \"Lior\"} כ-PUT, השרת מחליף את כל הרשומה, ומספר הטלפון, הכתובת והעדפות ההתראות של המשתמש נמחקים בשקט. הכול בריקווסט נראה מוצלח. כשאתה סוקר endpoints שנוצרו, תבדוק שלושה דברים: האם המתודה תואמת למה שהקוד באמת עושה, האם קריאה חוזרת בטוחה, ובמקרה של PUT — האם באמת רוצים להחליף הכול. בחירת המתודה הנכונה היא גם תיעוד חינם — למפתח הבא, ול-AI הבא שיקרא את הקוד שלך."
 },
 "Headers": {
  "en": "Headers are the metadata around a message: who is sending it, what format the body is in, what the sender is willing to accept back, whether the answer may be cached, and for how long. They travel with every request and every response, they are plain text, and they are visible in your browser's network tab — which makes them the fastest place to look when something behaves strangely and the body looks fine.\n\nAn integration returns 401 Unauthorized no matter what. The token is correct, the endpoint is correct, and the same call works from the provider's own console. The actual cause: the code sends Authorization: eyJhbGci... without the word Bearer in front of it. The server cannot parse the scheme, so it treats the request as anonymous, and its error message — \"invalid or missing credentials\" — describes the symptom rather than the cause. Variations of this are endless and all look identical from the outside: a trailing newline copied with the token, Content-Type left as text/plain so the JSON body is never parsed, a missing Accept header getting you XML from an API that happily speaks both.\n\nSo when a request fails in a way that makes no sense, compare headers before rewriting logic — a working request from the provider's docs side by side with yours, line by line. Two families are worth knowing beyond authentication. Caching headers (Cache-Control, ETag) decide whether users see your update or a version from yesterday, and are the usual explanation for \"I deployed but nothing changed\". Security headers on responses (HSTS, X-Content-Type-Options, cookie flags like HttpOnly and Secure) are cheap to set and easy for an agent to omit — ask explicitly, because nothing will fail without them until it matters.",
  "he": "הדרים הם המטא-דאטה סביב הודעה: מי שולח אותה, באיזה פורמט הגוף, מה השולח מוכן לקבל בחזרה, האם מותר לשמור את התשובה בקאש ולכמה זמן. הם נוסעים עם כל ריקווסט וכל רספונס, הם טקסט רגיל, והם גלויים בטאב הרשת של הדפדפן — מה שהופך אותם למקום הכי מהיר להסתכל בו כשמשהו מתנהג מוזר והגוף נראה תקין.\n\nאינטגרציה מחזירה 401 Unauthorized לא משנה מה. הטוקן נכון, ה-endpoint נכון, ואותה קריאה עובדת מהקונסולה של הספק. הסיבה האמיתית: הקוד שולח Authorization: eyJhbGci... בלי המילה Bearer לפניו. השרת לא מצליח לפענח את השיטה, אז הוא מתייחס לריקווסט כאנונימי, והודעת השגיאה שלו — ״invalid or missing credentials״ — מתארת את הסימפטום ולא את הסיבה. לווריאציות אין סוף וכולן נראות זהות מבחוץ: ירידת שורה שנגררה עם הטוקן, Content-Type שנשאר text/plain אז גוף ה-JSON אף פעם לא מפוענח, כותרת Accept חסרה שמחזירה לך XML מ-API ששמח לדבר בשתי השפות.\n\nאז כשריקווסט נכשל בצורה שלא מסתדרת, תשווה הדרים לפני ששוכתבים לוגיקה — ריקווסט עובד מהתיעוד של הספק זה לצד זה עם שלך, שורה מול שורה. שתי משפחות שווה להכיר מעבר לאימות. הדרים של קאש (Cache-Control, ETag) מחליטים אם משתמשים רואים את העדכון שלך או גרסה מאתמול, והם ההסבר הרגיל ל״עשיתי דיפלוי ושום דבר לא השתנה״. הדרים של אבטחה ברספונס (HSTS, X-Content-Type-Options, דגלי קוקי כמו HttpOnly ו-Secure) זולים להגדרה וקל לסוכן להשמיט אותם — תבקש במפורש, כי בלעדיהם שום דבר לא ייכשל עד שזה יהיה חשוב."
 },
 "Payload / Body": {
  "en": "The body is the data itself — usually JSON, sometimes a form encoding, sometimes a file. Headers describe it; the body is it. Two things about it are worth internalising. First, it is not automatically understood: the server parses the body according to the Content-Type header, so sending perfect JSON with the wrong content type produces an empty object and a confusing validation error. Second, a body is optional, and GET does not have one — if you need to send parameters in order to read something, they go in the query string.\n\nA team builds a bulk import. The endpoint accepts an array of rows in the body, and it works beautifully with the 200-row test file. A customer uploads 60,000 rows, the JSON body is 38MB, and three things happen at once: the reverse proxy rejects it with 413 Payload Too Large, the retry sends the same 38MB again, and the third attempt — which slipped in under an older limit — puts the whole file in memory and takes the process down. The design flaw is not the size limit, it is an endpoint with no bound on how much a single request may carry. Large input belongs in a file upload plus a background job, not in one body.\n\nWhen you review generated endpoints, look for a size cap, a schema check on arrival, and a rejection that says what was wrong rather than crashing. Never trust body content just because your own frontend produced it; the body is the single most common place where attacker-controlled data enters your system, and \"the app always sends valid data\" is the assumption behind most injection bugs. And keep secrets out of the URL but in the body or a header — bodies are not logged by default, query strings usually are.",
  "he": "הגוף הוא הנתונים עצמם — בדרך כלל JSON, לפעמים קידוד טופס, לפעמים קובץ. ההדרים מתארים אותו; הגוף הוא הוא. שני דברים לגביו שווים הפנמה. ראשית, הוא לא מובן מאליו: השרת מפענח את הגוף לפי הכותרת Content-Type, אז שליחת JSON מושלם עם סוג תוכן שגוי מייצרת אובייקט ריק ושגיאת ולידציה מבלבלת. שנית, גוף הוא אופציונלי, ול-GET אין כזה — אם אתה צריך לשלוח פרמטרים כדי לקרוא משהו, הם הולכים ל-query params בכתובת.\n\nצוות בונה ייבוא מרובה. ה-endpoint מקבל מערך שורות בגוף, וזה עובד יפהפה עם קובץ בדיקה של 200 שורות. לקוח מעלה 60,000 שורות, גוף ה-JSON הוא 38MB, ושלושה דברים קורים בבת אחת: הפרוקסי דוחה עם 413 Payload Too Large, הניסיון החוזר שולח שוב את אותם 38MB, והניסיון השלישי — שהתגנב מתחת למגבלה ישנה יותר — מכניס את כל הקובץ לזיכרון ומפיל את התהליך. פגם התכנון הוא לא מגבלת הגודל, הוא endpoint בלי שום חסם על כמה ריקווסט אחד יכול לשאת. קלט גדול שייך להעלאת קובץ ולג׳וב רקע, לא לגוף אחד.\n\nכשאתה סוקר endpoints שנוצרו, תחפש תקרת גודל, בדיקת סכמה בכניסה, ודחייה שאומרת מה היה שגוי במקום לקרוס. אל תסמוך על תוכן הגוף רק כי הפרונט שלך ייצר אותו; הגוף הוא המקום הנפוץ ביותר שבו נתונים בשליטת תוקף נכנסים למערכת, ו״האפליקציה תמיד שולחת נתונים תקינים״ היא ההנחה שמאחורי רוב באגי ההזרקה. ותשאיר סודות מחוץ לכתובת אבל בתוך הגוף או בהדר — גופים לא נרשמים בלוג כברירת מחדל, query strings כן."
 },
 "Status codes": {
  "en": "The status code is the machine-readable summary of what happened; the body is the human explanation. The families are simple — 2xx worked, 3xx moved, 4xx the caller was wrong, 5xx the server was wrong — and the 4xx/5xx split carries the most weight, because it tells every automated system whether retrying could possibly help. A 4xx says stop, you sent something invalid. A 5xx says try again, it might work this time.\n\nA service returns 200 OK for everything and puts {\"success\": false, \"error\": \"...\"} in the body, which the frontend handles correctly. Then the failures become invisible: the monitoring dashboard shows a 0% error rate through an incident, alerts never fire, the load balancer keeps routing traffic to a broken instance because its health check gets a 200, and the client SDK's retry logic never engages because nothing looked like a failure. The outage lasts four hours instead of four minutes, and the only reason anyone notices is a customer email. Every one of those systems reads the code and nothing else.\n\nWhen reviewing what an agent built, check that failures actually return failure codes, and that the specific code carries the right meaning: 401 when we do not know who you are, 403 when we know and you still may not, 404 when it does not exist, 409 when it conflicts with existing state, 422 when the shape was fine but the values were not, 429 when the caller should slow down. On the client side, the same discipline in reverse — treat 4xx as a bug to fix rather than something to retry, respect Retry-After on a 429, and back off on 5xx instead of hammering a service that is already struggling.",
  "he": "קוד הסטטוס הוא התקציר שהמכונה קוראת; הגוף הוא ההסבר לאדם. המשפחות פשוטות — 2xx הצליח, 3xx עבר מקום, 4xx הקורא טעה, 5xx השרת טעה — והפיצול בין 4xx ל-5xx נושא את המשקל הגדול ביותר, כי הוא אומר לכל מערכת אוטומטית אם ניסיון חוזר יכול בכלל לעזור. 4xx אומר תפסיק, שלחת משהו לא תקין. 5xx אומר נסה שוב, אולי הפעם יעבוד.\n\nשירות מחזיר 200 OK על הכול ושם {\"success\": false, \"error\": \"...\"} בגוף, והפרונט מטפל בזה נכון. ואז הכשלים נהיים בלתי נראים: דשבורד הניטור מראה 0% שגיאות לאורך תקלה, התראות לא נורות, מאזן העומסים ממשיך לנתב תעבורה לאינסטנס שבור כי בדיקת הבריאות שלו מקבלת 200, ולוגיקת הניסיון החוזר ב-SDK של הלקוח לא נכנסת לפעולה כי שום דבר לא נראה ככישלון. ההשבתה נמשכת ארבע שעות במקום ארבע דקות, והסיבה היחידה שמישהו שם לב היא מייל מלקוח. כל אחת מהמערכות האלה קוראת את הקוד ושום דבר אחר.\n\nכשאתה סוקר מה שסוכן בנה, תוודא שכשלים באמת מחזירים קודי כישלון, ושהקוד הספציפי נושא את המשמעות הנכונה: 401 כשאנחנו לא יודעים מי אתה, 403 כשאנחנו יודעים ועדיין אסור, 404 כשזה לא קיים, 409 כשיש התנגשות עם המצב הקיים, 422 כשהמבנה תקין אבל הערכים לא, 429 כשהקורא צריך להאט. בצד הקליינט, אותה משמעת הפוכה — להתייחס ל-4xx כבאג לתקן ולא כמשהו לנסות שוב, לכבד Retry-After ב-429, ולהאט ב-5xx במקום להלום בשירות שכבר מתקשה."
 },
 "JSON": {
  "en": "JSON is a text format for structured data with six types and nothing else: object, array, string, number, boolean, null. Everything a real system needs beyond that — dates, money, ids, enums — is encoded into one of those six by convention, and conventions are where integrations break. The format is trivially simple, which is exactly why it is everywhere; the difficulty is never the syntax, it is the agreement about what the strings mean.\n\nA sync job pulls orders from a partner. Their API returns \"amount\": 19.99 as a JSON number and \"created\": \"2026-03-01 10:00\" as a string with no timezone. Two failures follow. The amounts accumulate floating-point error — 0.1 plus 0.2 is famously not 0.3 — so a monthly total is off by a few agorot and no two reports agree. And the timestamps are interpreted as UTC by one service and local time by another, so an order placed at 10:00 appears in yesterday's report for customers in one region during winter. Both are invisible in testing, where a single row looks perfectly correct.\n\nThe conventions that avoid this are worth demanding in any generated code: money as integer minor units (1999, not 19.99), timestamps as UTC in ISO-8601 with an explicit Z, and ids as strings, because a 19-digit number silently loses precision in JavaScript. JSON also has no comments, no trailing commas and no date type — if an agent hands you a config with a comment in it, it will not parse. And when an API response does not look right, read the raw JSON rather than a pretty-printed view of an object your code already transformed. The wire is where the truth is.",
  "he": "JSON הוא פורמט טקסט לנתונים מובנים עם שישה טיפוסים ולא יותר: אובייקט, מערך, מחרוזת, מספר, בוליאני, null. כל מה שמערכת אמיתית צריכה מעבר לזה — תאריכים, כסף, מזהים, ערכים מוגדרים — מקודד לאחד מהשישה לפי מוסכמה, והמוסכמות הן המקום שבו אינטגרציות נשברות. הפורמט פשוט עד כדי טריוויאליות, ובדיוק לכן הוא בכל מקום; הקושי הוא אף פעם לא התחביר, הוא ההסכמה על מה המחרוזות אומרות.\n\nג׳וב סנכרון מושך הזמנות משותף. ה-API שלהם מחזיר \"amount\": 19.99 כמספר JSON ו-\"created\": \"2026-03-01 10:00\" כמחרוזת בלי אזור זמן. שני כשלים נובעים מזה. הסכומים צוברים שגיאת נקודה צפה — 0.1 ועוד 0.2 זה לא בדיוק 0.3 — אז סכום חודשי מפספס בכמה אגורות ואין שני דוחות שמסכימים. והחותמות מתפרשות כ-UTC אצל שירות אחד וכשעון מקומי אצל אחר, אז הזמנה שנעשתה ב-10:00 מופיעה בדוח של אתמול ללקוחות באזור מסוים בחורף. שניהם בלתי נראים בבדיקות, שבהן שורה בודדת נראית נכונה לגמרי.\n\nהמוסכמות שמונעות את זה שוות דרישה בכל קוד שנוצר: כסף כמספר שלם ביחידות המשנה (1999, לא 19.99), חותמות זמן ב-UTC בתקן ISO-8601 עם Z מפורש, ומזהים כמחרוזות, כי מספר בן 19 ספרות מאבד דיוק בשקט בג׳אווהסקריפט. ל-JSON גם אין הערות, אין פסיק אחרון ואין טיפוס תאריך — אם סוכן נותן לך קובץ קונפיגורציה עם הערה בתוכו, הוא לא יפוענח. וכשתשובת API לא נראית נכונה, תקרא את ה-JSON הגולמי ולא תצוגה מיופה של אובייקט שהקוד שלך כבר שינה. האמת נמצאת על הקו."
 },
 "REST": {
  "en": "REST is a convention, not a law and not a technology. Its core idea: the things in your system are resources with addresses, the HTTP verbs act on those resources, and each request carries everything the server needs to handle it — no memory of the previous one. Following it means another developer can guess your endpoints correctly before reading a single page of documentation, and so can an AI.\n\nCompare two designs for the same product. One has POST /getUserOrders, POST /cancelOrder, POST /updateOrderQuantity, POST /fetchOrderList2, each with its own body shape and its own error convention, all added by different people over two years. The other has GET /orders, GET /orders/{id}, PATCH /orders/{id}, DELETE /orders/{id}. In the second, a new endpoint for a new resource writes itself, caching works by URL, a proxy can tell reads from writes, and onboarding a developer takes an afternoon. In the first, every route is a small negotiation, and nobody can tell from the name whether fetchOrderList2 is safe to call twice.\n\nThe practical value for you is prompting and reviewing. Say \"REST-style endpoints for this resource\" and an agent produces a predictable, boring shape you can check at a glance — plural nouns for collections, ids in the path, verbs expressed by the HTTP method rather than baked into the URL. Then check that the route names contain no verbs, that errors use status codes consistently across all of them, and that no endpoint depends on a previous call having happened. Do not let purity become the goal, though: a /search or /checkout route that does not map to a single resource is fine and universally understood. The point is predictability, not doctrine.",
  "he": "REST הוא מוסכמה, לא חוק ולא טכנולוגיה. הרעיון המרכזי: הדברים במערכת שלך הם משאבים עם כתובות, המתודות של HTTP פועלות על המשאבים האלה, וכל ריקווסט נושא את כל מה שהשרת צריך כדי לטפל בו — בלי זיכרון של הקודם. ללכת לפי זה אומר שמפתח אחר יכול לנחש נכון את ה-endpoints שלך לפני שקרא עמוד תיעוד אחד, וגם AI יכול.\n\nתשווה שני תכנונים לאותו מוצר. באחד יש POST /getUserOrders, POST /cancelOrder, POST /updateOrderQuantity, POST /fetchOrderList2, לכל אחד מבנה גוף משלו ומוסכמת שגיאות משלו, כולם נוספו על ידי אנשים שונים במשך שנתיים. בשני יש GET /orders, GET /orders/{id}, PATCH /orders/{id}, DELETE /orders/{id}. בשני, endpoint חדש למשאב חדש כותב את עצמו, קאש עובד לפי כתובת, פרוקסי יכול להבדיל בין קריאות לכתיבות, וחניכה של מפתח לוקחת אחר צהריים. בראשון, כל נתיב הוא משא ומתן קטן, ואף אחד לא יכול לדעת מהשם אם בטוח לקרוא ל-fetchOrderList2 פעמיים.\n\nהערך המעשי בשבילך הוא בפרומפט ובסקירה. תגיד ״endpoints בסגנון REST למשאב הזה״ והסוכן ייצר מבנה צפוי ומשעמם שאפשר לבדוק במבט — שמות עצם ברבים לאוספים, מזהים בנתיב, פעולות שמבוטאות במתודה של HTTP ולא מוטמעות בכתובת. ואז תבדוק ששמות הנתיבים לא מכילים פעלים, שהשגיאות משתמשות בקודי סטטוס באופן עקבי בכולם, ששום endpoint לא תלוי בקריאה קודמת שקרתה. אל תהפוך טוהר למטרה: נתיב /search או /checkout שלא ממופה למשאב יחיד הוא בסדר גמור ומובן לכולם. הנקודה היא צפיות, לא דוקטרינה."
 },
 "Endpoint": {
  "en": "An endpoint is one specific path plus verb that the server answers — POST /orders, GET /orders/{id}. It is the smallest unit that anyone measures, alerts on, rate-limits, documents or blames, which is why the word comes up constantly in conversations about performance and incidents. \"The app is slow\" is a feeling; \"POST /checkout has a p95 of 2.4 seconds\" is something you can act on.\n\nA team sees an average response time of 180ms and considers the service healthy. Broken down per endpoint, the picture changes completely: GET /health answers in 2ms and is called by the load balancer 60 times a minute, dragging the average down, while POST /checkout sits at a p95 of 2.4 seconds and a p99 of 6 seconds. That p99 is not a rounding error — it is one in a hundred checkouts, the busiest hour of the day, abandoned carts nobody attributes to a technical cause. The average hid it; the per-endpoint percentile exposed it in one screen.\n\nTwo things follow for your own work. First, ask for numbers per endpoint and in percentiles rather than averages, because users experience the tail, not the mean. Second, when designing one, you are choosing a granularity: too coarse and every caller downloads data it does not need, too fine and a single screen needs eight round trips over a mobile connection. When an agent designs an API for you, the useful review question is which screen calls which endpoint, and how many calls one page load makes. A design that looks elegant as a list of routes can still mean a spinner that never quite ends on a phone.",
  "he": "Endpoint הוא נתיב ספציפי אחד יחד עם מתודה שהשרת עונה עליהם — POST /orders, GET /orders/{id}. זו היחידה הקטנה ביותר שמישהו מודד, מתריע עליה, מגביל בקצב, מתעד או מאשים, ולכן המילה עולה כל הזמן בשיחות על ביצועים ותקלות. ״האפליקציה איטית״ היא תחושה; ״ל-POST /checkout יש p95 של 2.4 שניות״ הוא משהו שאפשר לפעול לפיו.\n\nצוות רואה זמן תגובה ממוצע של 180ms ומחשיב את השירות כבריא. בפירוק לפי endpoint התמונה מתהפכת: GET /health עונה ב-2ms ומאזן העומסים קורא לו 60 פעמים בדקה ומוריד את הממוצע, בזמן ש-POST /checkout יושב על p95 של 2.4 שניות ו-p99 של 6 שניות. ה-p99 הזה הוא לא שגיאת עיגול — הוא אחד ממאה צ׳קאאוטים, בשעה העמוסה ביותר, עגלות נטושות שאף אחד לא מייחס לסיבה טכנית. הממוצע הסתיר את זה; האחוזון לכל endpoint חשף את זה במסך אחד.\n\nשני דברים נובעים מזה לעבודה שלך. ראשית, תבקש מספרים לכל endpoint ובאחוזונים ולא בממוצעים, כי משתמשים חווים את הזנב, לא את האמצע. שנית, כשאתה מתכנן אחד, אתה בוחר רזולוציה: גס מדי וכל קורא מוריד נתונים שהוא לא צריך, עדין מדי ומסך אחד צריך שמונה הלוך-ושוב על חיבור סלולרי. כשסוכן מתכנן לך API, שאלת הסקירה השימושית היא איזה מסך קורא לאיזה endpoint, וכמה קריאות עושה טעינת עמוד אחת. תכנון שנראה אלגנטי כרשימת נתיבים עדיין יכול להיות ספינר שלא ממש נגמר בטלפון."
 },
 "Database": {
  "en": "A database is not a place to put data. It is a set of promises about what happens when things go wrong: that a write either landed completely or not at all, that two people writing in the same instant cannot interleave into nonsense, that a power cut halfway through leaves a consistent picture rather than a torn one. Those promises are the product. Storage itself is the easy part — every filesystem already does storage.\n\nTake a small booking tool that kept appointments in appointments.json, rewritten in full on every save. It was correct for four months with one receptionist. The day a second person started, two saves landed thirty milliseconds apart: the second had read the file before the first wrote it, so it wrote back a picture of the world that did not contain the first booking. No error appeared, the JSON stayed valid, and one appointment simply evaporated. Nobody found out until a customer arrived for a slot that no longer existed. Postgres would have refused to lose it — the second writer would have waited its turn, or been told the row had changed underneath it.\n\nWhen an agent scaffolds a project, the fastest thing it can reach for is a file or an in-process array, and it will, unless you say otherwise. So ask two questions on day one: where does this data live after the process restarts, and what happens when two requests write to it at the same moment. If the answer is a file, a global variable, or we will add a database later, you are building on the version that fails quietly. Switching to a real database at the start costs an hour. Switching after a hundred functions have been written against a file costs a week — and you will not be able to tell which of the records you already have were corrupted along the way.",
  "he": "דאטהבייס הוא לא מקום לשים בו נתונים. הוא אוסף הבטחות לגבי מה קורה כשמשהו משתבש: שכתיבה או נכנסה במלואה או בכלל לא, ששני אנשים שכותבים באותו רגע לא יכולים להשתרבב אחד לשני לג׳יבריש, ושהפסקת חשמל באמצע משאירה תמונה עקבית ולא תמונה קרועה. ההבטחות האלה הן המוצר. האחסון עצמו הוא החלק הקל — כל מערכת קבצים כבר יודעת לאחסן.\n\nקחו כלי קטן לזימון תורים ששמר פגישות ב-appointments.json, ונכתב מחדש במלואו בכל שמירה. הוא היה תקין ארבעה חודשים עם פקידה אחת. ביום שבו הצטרפה פקידה שנייה, שתי שמירות נחתו בהפרש של שלושים מילישניות: השנייה קראה את הקובץ לפני שהראשונה כתבה, ולכן כתבה בחזרה תמונת עולם שלא הכילה את הפגישה הראשונה. שום שגיאה לא הופיעה, ה-JSON נשאר תקין, ופגישה אחת פשוט התאדתה. אף אחד לא גילה עד שלקוח הגיע לתור שכבר לא היה קיים. פוסטגרס היה מסרב לאבד אותה — הכותב השני היה ממתין לתורו, או מקבל הודעה שהשורה השתנתה מתחתיו.\n\nכשסוכן AI מקים פרויקט, הדבר המהיר ביותר עבורו הוא לשמור לקובץ או למערך בזיכרון התהליך, וזה מה שהוא יעשה אם לא תגידו אחרת. אז תשאלו שתי שאלות כבר ביום הראשון: איפה הנתונים האלה חיים אחרי שהתהליך עולה מחדש, ומה קורה כששתי בקשות כותבות אליהם באותו רגע. אם התשובה היא קובץ, משתנה גלובלי, או ״נוסיף דאטהבייס אחר כך״ — אתם בונים על הגרסה שנכשלת בשקט. מעבר לדאטהבייס אמיתי בהתחלה עולה שעה. מעבר אחרי שנכתבו מאה פונקציות מול קובץ עולה שבוע — ולא תוכלו לדעת אילו מהרשומות שכבר יש לכם נפגמו בדרך."
 },
 "SQL vs NoSQL": {
