  "en": "Headers are the metadata around a message: who is sending it, what format the body is in, what the sender is willing to accept back, whether the answer may be cached, and for how long. They travel with every request and every response, they are plain text, and they are visible in your browser's network tab — which makes them the fastest place to look when something behaves strangely and the body looks fine.\n\nAn integration returns 401 Unauthorized no matter what. The token is correct, the endpoint is correct, and the same call works from the provider's own console. The actual cause: the code sends Authorization: eyJhbGci... without the word Bearer in front of it. The server cannot parse the scheme, so it treats the request as anonymous, and its error message — \"invalid or missing credentials \" — describes the symptom rather than the cause. Variations of this are endless and all look identical from the outside: a trailing newline copied with the token, Content-Type left as text/plain so the JSON body is never parsed, a missing Accept header getting you XML from an API that happily speaks both.\n\nSo when a request fails in a way that makes no sense, compare headers before rewriting logic — a working request from the provider's docs side by side with yours, line by line. Two families are worth knowing beyond authentication. Caching headers (Cache-Control, ETag) decide whether users see your update or a version from yesterday, and are the usual explanation for \"I deployed but nothing changed\". Security headers on responses (HSTS, X-Content-Type-Options, cookie flags like HttpOnly and Secure) are cheap to set and easy for an agent to omit — ask explicitly, because nothing will fail without them until it matters. And remember they are not secret: whatever you put in a header travels with the request and is visible to every proxy on the way, so a header is for identifying, never for hiding.",
  "he": "הדרים הם המטא-דאטה סביב הודעה: מי שולח אותה, באיזה פורמט הגוף, מה השולח מוכן לקבל בחזרה, האם מותר לשמור את התשובה בקאש ולכמה זמן. הם נוסעים עם כל ריקווסט וכל רספונס, הם טקסט רגיל, והם גלויים בטאב הרשת של הדפדפן — מה שהופך אותם למקום הכי מהיר להסתכל בו כשמשהו מתנהג מוזר והגוף נראה תקין.\n\nאינטגרציה מחזירה 401 Unauthorized לא משנה מה. הטוקן נכון, ה-endpoint נכון, ואותה קריאה עובדת מהקונסולה של הספק. הסיבה האמיתית: הקוד שולח Authorization: eyJhbGci... בלי המילה Bearer לפניו. השרת לא מצליח לפענח את השיטה, אז הוא מתייחס לריקווסט כאנונימי, והודעת השגיאה שלו — ״invalid or missing credentials״ — מתארת את הסימפטום ולא את הסיבה. לווריאציות אין סוף וכולן נראות זהות מבחוץ: ירידת שורה שנגררה עם הטוקן, Content-Type שנשאר text/plain אז גוף ה-JSON אף פעם לא מפוענח, כותרת Accept חסרה שמחזירה לך XML מ-API ששמח לדבר בשתי השפות.\n\nאז כשריקווסט נכשל בצורה שלא מסתדרת, תשווה הדרים לפני ששוכתבים לוגיקה — ריקווסט עובד מהתיעוד של הספק זה לצד זה עם שלך, שורה מול שורה. שתי משפחות שווה להכיר מעבר לאימות. הדרים של קאש (Cache-Control, ETag) מחליטים אם משתמשים רואים את העדכון שלך או גרסה מאתמול, והם ההסבר הרגיל ל״עשיתי דיפלוי ושום דבר לא השתנה״. הדרים של אבטחה ברספונס (HSTS, X-Content-Type-Options, דגלי קוקי כמו HttpOnly ו-Secure) זולים להגדרה וקל לסוכן להשמיט אותם — תבקש במפורש, כי בלעדיהם שום דבר לא ייכשל עד שזה יהיה חשוב. ותזכור שהם לא סודיים: כל מה שאתה שם בהדר נוסע עם הריקווסט וגלוי לכל פרוקסי בדרך, אז הדר נועד לזהות, אף פעם לא להסתיר."
 },
 "Payload / Body": {
  "en": "The body is the data itself — usually JSON, sometimes a form encoding, sometimes a file. Headers describe it; the body is it. Two things about it are worth internalising. First, it is not automatically understood: the server parses the body according to the Content-Type header, so sending perfect JSON with the wrong content type produces an empty object and a confusing validation error. Second, a body is optional, and GET does not have one — if you need to send parameters in order to read something, they go in the query string.\n\nA team builds a bulk import. The endpoint accepts an array of rows in the body, and it works beautifully with the 200-row test file. A customer uploads 60,000 rows, the JSON body is 38MB, and three things happen at once: the reverse proxy rejects it with 413 Payload Too Large, the retry sends the same 38MB again, and the third attempt — which slipped in under an older limit — puts the whole file in memory and takes the process down. The design flaw is not the size limit, it is an endpoint with no bound on how much a single request may carry. Large input belongs in a file upload plus a background job, not in one body.\n\nWhen you review generated endpoints, look for a size cap, a schema check on arrival, and a rejection that says what was wrong rather than crashing. Never trust body content just because your own frontend produced it; the body is the single most common place where attacker-controlled data enters your system, and \"the app always sends valid data \" is the assumption behind most injection bugs. And keep secrets out of the URL but in the body or a header — bodies are not logged by default, query strings usually are.",
  "he": "הגוף הוא הנתונים עצמם — בדרך כלל JSON, לפעמים קידוד טופס, לפעמים קובץ. ההדרים מתארים אותו; הגוף הוא הוא. שני דברים לגביו שווים הפנמה. ראשית, הוא לא מובן מאליו: השרת מפענח את הגוף לפי הכותרת Content-Type, אז שליחת JSON מושלם עם סוג תוכן שגוי מייצרת אובייקט ריק ושגיאת ולידציה מבלבלת. שנית, גוף הוא אופציונלי, ול-GET אין כזה — אם אתה צריך לשלוח פרמטרים כדי לקרוא משהו, הם הולכים ל-query params בכתובת.\n\nצוות בונה ייבוא מרובה. ה-endpoint מקבל מערך שורות בגוף, וזה עובד יפהפה עם קובץ בדיקה של 200 שורות. לקוח מעלה 60,000 שורות, גוף ה-JSON הוא 38MB, ושלושה דברים קורים בבת אחת: הפרוקסי דוחה עם 413 Payload Too Large, הניסיון החוזר שולח שוב את אותם 38MB, והניסיון השלישי — שהתגנב מתחת למגבלה ישנה יותר — מכניס את כל הקובץ לזיכרון ומפיל את התהליך. פגם התכנון הוא לא מגבלת הגודל, הוא endpoint בלי שום חסם על כמה ריקווסט אחד יכול לשאת. קלט גדול שייך להעלאת קובץ ולג׳וב רקע, לא לגוף אחד.\n\nכשאתה סוקר endpoints שנוצרו, תחפש תקרת גודל, בדיקת סכמה בכניסה, ודחייה שאומרת מה היה שגוי במקום לקרוס. אל תסמוך על תוכן הגוף רק כי הפרונט שלך ייצר אותו; הגוף הוא המקום הנפוץ ביותר שבו נתונים בשליטת תוקף נכנסים למערכת, ו״האפליקציה תמיד שולחת נתונים תקינים״ היא ההנחה שמאחורי רוב באגי ההזרקה. ותשאיר סודות מחוץ לכתובת אבל בתוך הגוף או בהדר — גופים לא נרשמים בלוג כברירת מחדל, query strings כן."
 },
 "Status codes": {
  "en": "The status code is the machine-readable summary of what happened; the body is the human explanation. The families are simple — 2xx worked, 3xx moved, 4xx the caller was wrong, 5xx the server was wrong — and the 4xx/5xx split carries the most weight, because it tells every automated system whether retrying could possibly help. A 4xx says stop, you sent something invalid. A 5xx says try again, it might work this time.\n\nA service returns 200 OK for everything and puts {\"success\": false, \"error\": \"...\"} in the body, which the frontend handles correctly. Then the failures become invisible: the monitoring dashboard shows a 0% error rate through an incident, alerts never fire, the load balancer keeps routing traffic to a broken instance because its health check gets a 200, and the client SDK's retry logic never engages because nothing looked like a failure. The outage lasts four hours instead of four minutes, and the only reason anyone notices is a customer email. Every one of those systems reads the code and nothing else.\n\nWhen reviewing what an agent built, check that failures actually return failure codes, and that the specific code carries the right meaning: 401 when we do not know who you are, 403 when we know and you still may not, 404 when it does not exist, 409 when it conflicts with existing state, 422 when the shape was fine but the values were not, 429 when the caller should slow down. On the client side, the same discipline in reverse — treat 4xx as a bug to fix rather than something to retry, respect Retry-After on a 429, and back off on 5xx instead of hammering a service that is already struggling. And keep the body useful next to the code: a machine-readable error identifier plus one human sentence beats a bare 400 that leaves the caller guessing which field was wrong.",
  "he": "קוד הסטטוס הוא התקציר שהמכונה קוראת; הגוף הוא ההסבר לאדם. המשפחות פשוטות — 2xx הצליח, 3xx עבר מקום, 4xx הקורא טעה, 5xx השרת טעה — והפיצול בין 4xx ל-5xx נושא את המשקל הגדול ביותר, כי הוא אומר לכל מערכת אוטומטית אם ניסיון חוזר יכול בכלל לעזור. 4xx אומר תפסיק, שלחת משהו לא תקין. 5xx אומר נסה שוב, אולי הפעם יעבוד.\n\nשירות מחזיר 200 OK על הכול ושם {\"success\": false, \"error\": \"...\"} בגוף, והפרונט מטפל בזה נכון. ואז הכשלים נהיים בלתי נראים: דשבורד הניטור מראה 0% שגיאות לאורך תקלה, התראות לא נורות, מאזן העומסים ממשיך לנתב תעבורה לאינסטנס שבור כי בדיקת הבריאות שלו מקבלת 200, ולוגיקת הניסיון החוזר ב-SDK של הלקוח לא נכנסת לפעולה כי שום דבר לא נראה ככישלון. ההשבתה נמשכת ארבע שעות במקום ארבע דקות, והסיבה היחידה שמישהו שם לב היא מייל מלקוח. כל אחת מהמערכות האלה קוראת את הקוד ושום דבר אחר.\n\nכשאתה סוקר מה שסוכן בנה, תוודא שכשלים באמת מחזירים קודי כישלון, ושהקוד הספציפי נושא את המשמעות הנכונה: 401 כשאנחנו לא יודעים מי אתה, 403 כשאנחנו יודעים ועדיין אסור, 404 כשזה לא קיים, 409 כשיש התנגשות עם המצב הקיים, 422 כשהמבנה תקין אבל הערכים לא, 429 כשהקורא צריך להאט. בצד הקליינט, אותה משמעת הפוכה — להתייחס ל-4xx כבאג לתקן ולא כמשהו לנסות שוב, לכבד Retry-After ב-429, ולהאט ב-5xx במקום להלום בשירות שכבר מתקשה. ותשאיר גוף שימושי לצד הקוד: מזהה שגיאה שמכונה יכולה לקרוא יחד עם משפט אחד לאדם עדיף על 400 חשוף שמשאיר את הקורא לנחש איזה שדה היה שגוי."
 },
 "JSON": {
  "en": "JSON is a text format for structured data with six types and nothing else: object, array, string, number, boolean, null. Everything a real system needs beyond that — dates, money, ids, enums — is encoded into one of those six by convention, and conventions are where integrations break. The format is trivially simple, which is exactly why it is everywhere; the difficulty is never the syntax, it is the agreement about what the strings mean.\n\nA sync job pulls orders from a partner. Their API returns \"amount\": 19.99 as a JSON number and \"created\": \"2026-03-01 10:00 \" as a string with no timezone. Two failures follow. The amounts accumulate floating-point error — 0.1 plus 0.2 is famously not 0.3 — so a monthly total is off by a few agorot and no two reports agree. And the timestamps are interpreted as UTC by one service and local time by another, so an order placed at 10:00 appears in yesterday's report for customers in one region during winter. Both are invisible in testing, where a single row looks perfectly correct.\n\nThe conventions that avoid this are worth demanding in any generated code: money as integer minor units (1999, not 19.99), timestamps as UTC in ISO-8601 with an explicit Z, and ids as strings, because a 19-digit number silently loses precision in JavaScript. JSON also has no comments, no trailing commas and no date type — if an agent hands you a config with a comment in it, it will not parse. And when an API response does not look right, read the raw JSON rather than a pretty-printed view of an object your code already transformed. The wire is where the truth is. And when two systems disagree about a value, compare the raw payloads from both sides before touching either codebase; the answer is usually a field that one of them never sent at all.",
  "he": "JSON הוא פורמט טקסט לנתונים מובנים עם שישה טיפוסים ולא יותר: אובייקט, מערך, מחרוזת, מספר, בוליאני, null. כל מה שמערכת אמיתית צריכה מעבר לזה — תאריכים, כסף, מזהים, ערכים מוגדרים — מקודד לאחד מהשישה לפי מוסכמה, והמוסכמות הן המקום שבו אינטגרציות נשברות. הפורמט פשוט עד כדי טריוויאליות, ובדיוק לכן הוא בכל מקום; הקושי הוא אף פעם לא התחביר, הוא ההסכמה על מה המחרוזות אומרות.\n\nג׳וב סנכרון מושך הזמנות משותף. ה-API שלהם מחזיר \"amount\": 19.99 כמספר JSON ו-\"created\": \"2026-03-01 10:00 \" כמחרוזת בלי אזור זמן. שני כשלים נובעים מזה. הסכומים צוברים שגיאת נקודה צפה — 0.1 ועוד 0.2 זה לא בדיוק 0.3 — אז סכום חודשי מפספס בכמה אגורות ואין שני דוחות שמסכימים. והחותמות מתפרשות כ-UTC אצל שירות אחד וכשעון מקומי אצל אחר, אז הזמנה שנעשתה ב-10:00 מופיעה בדוח של אתמול ללקוחות באזור מסוים בחורף. שניהם בלתי נראים בבדיקות, שבהן שורה בודדת נראית נכונה לגמרי.\n\nהמוסכמות שמונעות את זה שוות דרישה בכל קוד שנוצר: כסף כמספר שלם ביחידות המשנה (1999, לא 19.99), חותמות זמן ב-UTC בתקן ISO-8601 עם Z מפורש, ומזהים כמחרוזות, כי מספר בן 19 ספרות מאבד דיוק בשקט בג׳אווהסקריפט. ל-JSON גם אין הערות, אין פסיק אחרון ואין טיפוס תאריך — אם סוכן נותן לך קובץ קונפיגורציה עם הערה בתוכו, הוא לא יפוענח. וכשתשובת API לא נראית נכונה, תקרא את ה-JSON הגולמי ולא תצוגה מיופה של אובייקט שהקוד שלך כבר שינה. האמת נמצאת על הקו. וכששתי מערכות לא מסכימות על ערך, תשווה את הגופים הגולמיים משני הצדדים לפני שאתה נוגע בקוד של מישהו; התשובה בדרך כלל היא שדה שאחת מהן בכלל לא שלחה."
 },
 "REST": {
  "en": "REST is a convention, not a law and not a technology. Its core idea: the things in your system are resources with addresses, the HTTP verbs act on those resources, and each request carries everything the server needs to handle it — no memory of the previous one. Following it means another developer can guess your endpoints correctly before reading a single page of documentation, and so can an AI.\n\nCompare two designs for the same product. One has POST /getUserOrders, POST /cancelOrder, POST /updateOrderQuantity, POST /fetchOrderList2, each with its own body shape and its own error convention, all added by different people over two years. The other has GET /orders, GET /orders/{id}, PATCH /orders/{id}, DELETE /orders/{id}. In the second, a new endpoint for a new resource writes itself, caching works by URL, a proxy can tell reads from writes, and onboarding a developer takes an afternoon. In the first, every route is a small negotiation, and nobody can tell from the name whether fetchOrderList2 is safe to call twice.\n\nThe practical value for you is prompting and reviewing. Say \"REST-style endpoints for this resource \" and an agent produces a predictable, boring shape you can check at a glance — plural nouns for collections, ids in the path, verbs expressed by the HTTP method rather than baked into the URL. Then check that the route names contain no verbs, that errors use status codes consistently across all of them, and that no endpoint depends on a previous call having happened. Do not let purity become the goal, though: a /search or /checkout route that does not map to a single resource is fine and universally understood. The point is predictability, not doctrine. One more check worth making: can a client reach every resource by following ids it already has, without a private list of route names that lives in somebody's head?",
  "he": "REST הוא מוסכמה, לא חוק ולא טכנולוגיה. הרעיון המרכזי: הדברים במערכת שלך הם משאבים עם כתובות, המתודות של HTTP פועלות על המשאבים האלה, וכל ריקווסט נושא את כל מה שהשרת צריך כדי לטפל בו — בלי זיכרון של הקודם. ללכת לפי זה אומר שמפתח אחר יכול לנחש נכון את ה-endpoints שלך לפני שקרא עמוד תיעוד אחד, וגם AI יכול.\n\nתשווה שני תכנונים לאותו מוצר. באחד יש POST /getUserOrders, POST /cancelOrder, POST /updateOrderQuantity, POST /fetchOrderList2, לכל אחד מבנה גוף משלו ומוסכמת שגיאות משלו, כולם נוספו על ידי אנשים שונים במשך שנתיים. בשני יש GET /orders, GET /orders/{id}, PATCH /orders/{id}, DELETE /orders/{id}. בשני, endpoint חדש למשאב חדש כותב את עצמו, קאש עובד לפי כתובת, פרוקסי יכול להבדיל בין קריאות לכתיבות, וחניכה של מפתח לוקחת אחר צהריים. בראשון, כל נתיב הוא משא ומתן קטן, ואף אחד לא יכול לדעת מהשם אם בטוח לקרוא ל-fetchOrderList2 פעמיים.\n\nהערך המעשי בשבילך הוא בפרומפט ובסקירה. תגיד ״endpoints בסגנון REST למשאב הזה״ והסוכן ייצר מבנה צפוי ומשעמם שאפשר לבדוק במבט — שמות עצם ברבים לאוספים, מזהים בנתיב, פעולות שמבוטאות במתודה של HTTP ולא מוטמעות בכתובת. ואז תבדוק ששמות הנתיבים לא מכילים פעלים, שהשגיאות משתמשות בקודי סטטוס באופן עקבי בכולם, ששום endpoint לא תלוי בקריאה קודמת שקרתה. אל תהפוך טוהר למטרה: נתיב /search או /checkout שלא ממופה למשאב יחיד הוא בסדר גמור ומובן לכולם. הנקודה היא צפיות, לא דוקטרינה. עוד בדיקה ששווה לעשות: האם קליינט יכול להגיע לכל משאב לפי מזהים שכבר יש לו, בלי רשימה פרטית של שמות נתיבים שיושבת בראש של מישהו?"
 },
 "Endpoint": {
  "en": "An endpoint is one specific path plus verb that the server answers — POST /orders, GET /orders/{id}. It is the smallest unit that anyone measures, alerts on, rate-limits, documents or blames, which is why the word comes up constantly in conversations about performance and incidents. \"The app is slow \" is a feeling; \"POST /checkout has a p95 of 2.4 seconds \" is something you can act on.\n\nA team sees an average response time of 180ms and considers the service healthy. Broken down per endpoint, the picture changes completely: GET /health answers in 2ms and is called by the load balancer 60 times a minute, dragging the average down, while POST /checkout sits at a p95 of 2.4 seconds and a p99 of 6 seconds. That p99 is not a rounding error — it is one in a hundred checkouts, the busiest hour of the day, abandoned carts nobody attributes to a technical cause. The average hid it; the per-endpoint percentile exposed it in one screen.\n\nTwo things follow for your own work. First, ask for numbers per endpoint and in percentiles rather than averages, because users experience the tail, not the mean. Second, when designing one, you are choosing a granularity: too coarse and every caller downloads data it does not need, too fine and a single screen needs eight round trips over a mobile connection. When an agent designs an API for you, the useful review question is which screen calls which endpoint, and how many calls one page load makes. A design that looks elegant as a list of routes can still mean a spinner that never quite ends on a phone. And name it for the resource, not for the screen: an endpoint called /dashboard-data belongs to whichever page existed the day it was written, and it will outlive that page by years.",
  "he": "Endpoint הוא נתיב ספציפי אחד יחד עם מתודה שהשרת עונה עליהם — POST /orders, GET /orders/{id}. זו היחידה הקטנה ביותר שמישהו מודד, מתריע עליה, מגביל בקצב, מתעד או מאשים, ולכן המילה עולה כל הזמן בשיחות על ביצועים ותקלות. ״האפליקציה איטית״ היא תחושה; ״ל-POST /checkout יש p95 של 2.4 שניות״ הוא משהו שאפשר לפעול לפיו.\n\nצוות רואה זמן תגובה ממוצע של 180ms ומחשיב את השירות כבריא. בפירוק לפי endpoint התמונה מתהפכת: GET /health עונה ב-2ms ומאזן העומסים קורא לו 60 פעמים בדקה ומוריד את הממוצע, בזמן ש-POST /checkout יושב על p95 של 2.4 שניות ו-p99 של 6 שניות. ה-p99 הזה הוא לא שגיאת עיגול — הוא אחד ממאה צ׳קאאוטים, בשעה העמוסה ביותר, עגלות נטושות שאף אחד לא מייחס לסיבה טכנית. הממוצע הסתיר את זה; האחוזון לכל endpoint חשף את זה במסך אחד.\n\nשני דברים נובעים מזה לעבודה שלך. ראשית, תבקש מספרים לכל endpoint ובאחוזונים ולא בממוצעים, כי משתמשים חווים את הזנב, לא את האמצע. שנית, כשאתה מתכנן אחד, אתה בוחר רזולוציה: גס מדי וכל קורא מוריד נתונים שהוא לא צריך, עדין מדי ומסך אחד צריך שמונה הלוך-ושוב על חיבור סלולרי. כשסוכן מתכנן לך API, שאלת הסקירה השימושית היא איזה מסך קורא לאיזה endpoint, וכמה קריאות עושה טעינת עמוד אחת. תכנון שנראה אלגנטי כרשימת נתיבים עדיין יכול להיות ספינר שלא ממש נגמר בטלפון. ותקרא לו על שם המשאב ולא על שם המסך: endpoint בשם ‎/dashboard-data שייך לעמוד שהיה קיים ביום שנכתב, והוא ישרוד את העמוד הזה בשנים."
 },
 "Database": {
  "en": "A database is not a place to put data. It is a set of promises about what happens when things go wrong: that a write either landed completely or not at all, that two people writing in the same instant cannot interleave into nonsense, that a power cut halfway through leaves a consistent picture rather than a torn one. Those promises are the product. Storage itself is the easy part — every filesystem already does storage.\n\nTake a small booking tool that kept appointments in appointments.json, rewritten in full on every save. It was correct for four months with one receptionist. The day a second person started, two saves landed thirty milliseconds apart: the second had read the file before the first wrote it, so it wrote back a picture of the world that did not contain the first booking. No error appeared, the JSON stayed valid, and one appointment simply evaporated. Nobody found out until a customer arrived for a slot that no longer existed. Postgres would have refused to lose it — the second writer would have waited its turn, or been told the row had changed underneath it.\n\nWhen an agent scaffolds a project, the fastest thing it can reach for is a file or an in-process array, and it will, unless you say otherwise. So ask two questions on day one: where does this data live after the process restarts, and what happens when two requests write to it at the same moment. If the answer is a file, a global variable, or we will add a database later, you are building on the version that fails quietly. Switching to a real database at the start costs an hour. Switching after a hundred functions have been written against a file costs a week — and you will not be able to tell which of the records you already have were corrupted along the way.",
  "he": "דאטהבייס הוא לא מקום לשים בו נתונים. הוא אוסף הבטחות לגבי מה קורה כשמשהו משתבש: שכתיבה או נכנסה במלואה או בכלל לא, ששני אנשים שכותבים באותו רגע לא יכולים להשתרבב אחד לשני לג׳יבריש, ושהפסקת חשמל באמצע משאירה תמונה עקבית ולא תמונה קרועה. ההבטחות האלה הן המוצר. האחסון עצמו הוא החלק הקל — כל מערכת קבצים כבר יודעת לאחסן.\n\nקח כלי קטן לזימון תורים ששמר פגישות ב-appointments.json, ונכתב מחדש במלואו בכל שמירה. הוא היה תקין ארבעה חודשים עם פקידה אחת. ביום שבו הצטרפה פקידה שנייה, שתי שמירות נחתו בהפרש של שלושים מילישניות: השנייה קראה את הקובץ לפני שהראשונה כתבה, ולכן כתבה בחזרה תמונת עולם שלא הכילה את הפגישה הראשונה. שום שגיאה לא הופיעה, ה-JSON נשאר תקין, ופגישה אחת פשוט התאדתה. אף אחד לא גילה עד שלקוח הגיע לתור שכבר לא היה קיים. פוסטגרס היה מסרב לאבד אותה — הכותב השני היה ממתין לתורו, או מקבל הודעה שהשורה השתנתה מתחתיו.\n\nכשסוכן AI מקים פרויקט, הדבר המהיר ביותר עבורו הוא לשמור לקובץ או למערך בזיכרון התהליך, וזה מה שהוא יעשה אם לא תגיד אחרת. אז תשאל שתי שאלות כבר ביום הראשון: איפה הנתונים האלה חיים אחרי שהתהליך עולה מחדש, ומה קורה כששתי בקשות כותבות אליהם באותו רגע. אם התשובה היא קובץ, משתנה גלובלי, או ״נוסיף דאטהבייס אחר כך״ — אתה בונה על הגרסה שנכשלת בשקט. מעבר לדאטהבייס אמיתי בהתחלה עולה שעה. מעבר אחרי שנכתבו מאה פונקציות מול קובץ עולה שבוע — ולא תוכל לדעת אילו מהרשומות שכבר יש לך נפגמו בדרך."
 },
 "SQL vs NoSQL": {
  "en": "The real difference is not tables versus documents. It is where the shape of your data is enforced. SQL puts the rules in one place that the database owns and applies to every writer, forever, including the script someone runs by hand at midnight. NoSQL moves those rules into every piece of code that touches the data, which means they hold exactly as long as every developer and every agent remembers them.\n\nA sales team's CRM stored 40,000 customer documents in MongoDB over three years. Nothing enforced the shape, so the shape drifted. Phone was a string in the 2023 documents, an array of strings after someone added second numbers, and an object with type and value after a rewrite. Country lived at the top level in some documents and under address in others, sometimes capitalised. When finance asked for revenue by country, the query returned 11,000 customers instead of 40,000 — the rest simply did not match the field path. The fix was a 300-line normalisation script and two days of manually deciding what the ambiguous rows had meant.\n\nDefault to Postgres. It is the boring answer and it is right for almost everything an AI-assisted builder ships, because the constraint you did not write is the one that saves you. Reach for a document store when the data genuinely has no stable shape — raw event payloads, scraped pages, third-party blobs you only ever read whole. The question to put to an agent that suggests Mongo for your app: which of my entities has a shape that will really differ row to row? If the honest answer is none, you are trading away foreign keys, unique constraints and joins in exchange for being allowed to misspell a field name without anyone stopping you. For almost any product with users, orders and payments in it, that is a bad trade made on the first day and paid for on the four hundredth.",
  "he": "ההבדל האמיתי הוא לא טבלאות מול מסמכים. הוא איפה נאכפת הצורה של הנתונים שלך. SQL שם את החוקים במקום אחד שהדאטהבייס מחזיק ומחיל על כל כותב, לתמיד, כולל הסקריפט שמישהו מריץ ידנית בחצות. NoSQL מעביר את החוקים האלה לכל פיסת קוד שנוגעת בנתונים, כלומר הם מחזיק בדיוק כל עוד כל מפתח וכל סוכן זוכר אותם.\n\nמערכת CRM של צוות מכירות שמרה 40,000 מסמכי לקוח במונגו לאורך שלוש שנים. שום דבר לא אכף את הצורה, ולכן הצורה נסחפה. phone היה מחרוזת במסמכים מ-2023, מערך של מחרוזות אחרי שמישהו הוסיף מספר שני, ואובייקט עם type ו-value אחרי שכתוב. country ישב ברמה העליונה בחלק מהמסמכים ותחת address באחרים, לפעמים באות גדולה. כשהכספים ביקשו הכנסות לפי מדינה, הקווירי החזיר 11,000 לקוחות במקום 40,000 — השאר פשוט לא התאימו לנתיב השדה. התיקון היה סקריפט נרמול של 300 שורות ויומיים של החלטות ידניות מה השורות המעורפלות בעצם אמרו.\n\nברירת המחדל היא פוסטגרס. זו התשובה המשעממת והיא הנכונה כמעט לכל מה שבונה עם AI משחרר, כי האילוץ שלא כתבת הוא זה שמציל אותך. לך לדוקיומנט סטור כשלנתונים באמת אין צורה יציבה — פיילודים גולמיים של אירועים, דפים שנגרדו, בלובים של צד שלישי שאתה רק קורא בשלמותם. השאלה שצריך לשאול סוכן שמציע לך מונגו: לאיזו ישות אצלי הצורה באמת משתנה משורה לשורה? אם התשובה הכנה היא ״לאף אחת״, אתה מוותר על מפתחות זרים, אילוצי ייחודיות וג׳וינים בתמורה לזכות לכתוב שם שדה עם שגיאת כתיב בלי שאף אחד יעצור אותך. כמעט לכל מוצר שיש בו משתמשים, הזמנות ותשלומים, זו עסקה גרועה שנעשית ביום הראשון ומשלמים עליה ביום הארבע מאות."
 },
 "Schema": {
  "en": "A schema is the only validation that cannot be forgotten. Checks written in application code live on the paths that call them; a database constraint applies to every writer that ever existed — your API, the admin panel, the background job, the agent's new endpoint, and the person pasting an UPDATE into a console. Its second job is communication: a well-named schema tells the next reader what the system believes about the world, which fields are optional, which must be unique, and what has to exist before what.\n\nA subscription product stored prices in a column typed double precision because that is what the scaffolding generated. For eighteen months the invoices were right to the cent. Then a plan changed to 19.99 with a 3-for-2 discount, and the stored total came out 39.980000000000004. It rendered as 39.98, it summed in reports as 39.980000000000004, and the monthly revenue report disagreed with Stripe by a few cents — which took a finance analyst three days to chase, because a few cents looks like a rounding convention, not a bug. The column should have been integer cents, or numeric. A CHECK constraint and the right type would have made the wrong value unrepresentable.\n\nAgents write permissive schemas. Left alone they will give you text columns that allow anything, nullable everywhere because nullable never fails an insert, and no unique constraint because a unique constraint can make a seed script crash. Read the CREATE TABLE before you accept it, and ask of each column: can this really be empty, can two rows really share this value, and is this type able to represent a value that is nonsense. Money as a float, a date as text, a status as free text instead of a constrained set — each of those is a support ticket that has not happened yet.",
  "he": "סכמה היא האימות היחיד שאי אפשר לשכוח. בדיקות שכתובות בקוד האפליקציה חיות רק בנתיבים שקוראים להן; אילוץ בדאטהבייס חל על כל כותב שהיה אי פעם — ה-API שלך, פאנל האדמין, הג׳וב ברקע, האנדפוינט החדש שהסוכן הוסיף, והאדם שמדביק UPDATE לקונסול. התפקיד השני שלה הוא תקשורת: סכמה עם שמות טובים מספרת לקורא הבא במה המערכת מאמינה לגבי העולם, אילו שדות אופציונליים, מה חייב להיות ייחודי, ומה חייב להתקיים לפני מה.\n\nמוצר מנויים שמר מחירים בעמודה מטיפוס double precision, כי זה מה שהסקאפולדינג ייצר. שמונה עשר חודשים החשבוניות היו נכונות עד האגורה. ואז תוכנית השתנתה ל-19.99 עם הנחת 3 ב-2, והסכום שנשמר יצא 39.980000000000004. זה הוצג כ-39.98, הסתכם בדוחות כ-39.980000000000004, ודוח ההכנסות החודשי לא הסכים עם סטרייפ בכמה אגורות — מה שלקח לאנליסטית כספים שלושה ימים לרדוף אחריו, כי כמה אגורות נראות כמו מוסכמת עיגול ולא כמו באג. העמודה הייתה צריכה להיות integer של סנטים, או numeric. אילוץ CHECK והטיפוס הנכון היו הופכים את הערך השגוי לבלתי ניתן לייצוג.\n\nסוכנים כותבים סכמות מתירניות. אם לא תתערב תקבל עמודות text שמקבלות הכל, nullable בכל מקום כי nullable אף פעם לא מפיל INSERT, ובלי אילוץ ייחודיות כי אילוץ ייחודיות עלול להפיל סקריפט seed. תקרא את ה-CREATE TABLE לפני שאתה מאשר אותו, ותשאל על כל עמודה: האם זה באמת יכול להיות ריק, האם שתי שורות באמת יכולות לחלוק את הערך הזה, והאם הטיפוס הזה מסוגל לייצג ערך שהוא שטות. כסף כ-float, תאריך כטקסט, סטטוס כטקסט חופשי במקום קבוצה סגורה — כל אחד מאלה הוא פנייה לתמיכה שעוד לא קרתה."
 },
 "Query": {
  "en": "You describe what you want; the database decides how to get it. That separation is the whole power of SQL and also the reason performance can collapse overnight without anyone touching the code — the planner simply looked at the current size and distribution of the data and chose a different strategy than it chose last month.\n\nAn internal orders page ran a single query: filter by customer email, sort by date, take twenty. With 500 rows in the table it answered in 80 milliseconds and nobody thought about it again. At 50,000 rows it took nine seconds and the page started timing out. The code had not changed. EXPLAIN ANALYZE gave the answer in one line: Seq Scan on orders. There was an index on email, but the query filtered on lower(email) because someone had made the search case-insensitive, and an index on email cannot answer a question about lower(email). The database read all 50,000 rows, lowercased every one, then sorted the survivors. An index on lower(email) brought it back to four milliseconds.\n\nThe habit worth building is cheap: for anything on a page a user waits for, put EXPLAIN ANALYZE in front of the query once and read the first line. Seq Scan on a large table means it is reading everything. An agent will write queries that are correct and never tell you they are slow, because at development-time row counts everything is instant — a hundred seed rows hide every mistake of this kind. Before you ship, load a realistic number of rows, run the page, and look at the plan for the two or three queries that matter. That is a ten-minute exercise that catches the single most common cause of a site falling over. And when a page that was fine last month is suddenly slow with no deploy behind it, the plan is the first place to look, not the code.",
  "he": "אתה מתאר מה אתה רוצה; הדאטהבייס מחליט איך להשיג את זה. ההפרדה הזו היא כל הכוח של SQL וגם הסיבה שביצועים יכולים לקרוס בן לילה בלי שאף אחד נגע בקוד — הפלאנר פשוט הסתכל על הגודל והפיזור הנוכחיים של הנתונים ובחר אסטרטגיה אחרת מזו שבחר בחודש שעבר.\n\nדף הזמנות פנימי הריץ קווירי אחד: לסנן לפי אימייל של לקוח, למיין לפי תאריך, לקחת עשרים. עם 500 שורות בטבלה הוא ענה ב-80 מילישניות ואף אחד לא חשב עליו שוב. ב-50,000 שורות הוא לקח תשע שניות והדף התחיל ליפול בטיים-אאוט. הקוד לא השתנה. EXPLAIN ANALYZE נתן את התשובה בשורה אחת: Seq Scan on orders. היה אינדקס על email, אבל הקווירי סינן לפי lower(email) כי מישהו הפך את החיפוש לחסר רגישות לאותיות גדולות, ואינדקס על email לא יכול לענות על שאלה לגבי lower(email). הדאטהבייס קרא את כל 50,000 השורות, הוריד לאותיות קטנות כל אחת מהן, ואז מיין את מה שנשאר. אינדקס על lower(email) החזיר את זה לארבע מילישניות.\n\nההרגל ששווה לפתח זול: לכל דבר בדף שמשתמש ממתין לו, תשים EXPLAIN ANALYZE לפני הקווירי פעם אחת ותקרא את השורה הראשונה. Seq Scan על טבלה גדולה אומר שהוא קורא הכל. סוכן יכתוב קווריז נכונים ולעולם לא יגיד לך שהם איטיים, כי בכמויות השורות של סביבת הפיתוח הכל מיידי — מאה שורות seed מסתירות כל טעות מהסוג הזה. לפני שאתה עולה לאוויר, תטען כמות שורות ריאליסטית, תריץ את הדף, ותסתכל על הפלאן של שניים-שלושה הקווריז שחשובים. זה תרגיל של עשר דקות שתופס את הגורם הנפוץ ביותר לנפילת אתר. וכשדף שהיה תקין בחודש שעבר פתאום איטי בלי שום דיפלוי מאחוריו, הפלאן הוא המקום הראשון להסתכל בו, לא הקוד."
 },
 "Index": {
  "en": "An index is a pre-sorted copy of one or more columns, kept up to date on every write, that lets the database jump straight to the rows it needs instead of reading the table. The trade is explicit: you are spending disk space and write speed to buy read speed. Every insert, update and delete has to maintain every index on that table.\n\nBoth halves of that trade show up in practice. A support dashboard filtered tickets by assignee and sorted by created_at. On 100,000 rows it took 340 milliseconds; a composite index on (assignee_id, created_at DESC) took it to 2 milliseconds, because the index already holds the rows in exactly the order the query asks for, so there is nothing left to sort. The other half: an events table on the same system had accumulated nine indexes, added one at a time by people fixing one report each. A nightly bulk import that used to load 40,000 rows a minute had dropped to 6,000, because each row now meant ten writes instead of one. Dropping four indexes nobody's queries used restored it.\n\nThe rule to carry: index what you filter by and sort by, in that order, and only for queries you actually run. When an agent tells you a page is slow and proposes adding indexes, ask which specific query each index serves — an index that does not match the leading columns of a real WHERE clause is pure cost. And ask what it will do to writes on a table that takes heavy inserts. The highest-value version of this skill is unglamorous: look at the two or three slowest queries, add the two or three indexes that match them, and measure again. Not index everything and hope. Then look again in a few months, because the plan the database chooses is a function of how much data you had on the day it chose.",
  "he": "אינדקס הוא עותק ממוין מראש של עמודה אחת או יותר, שמתעדכן בכל כתיבה, ומאפשר לדאטהבייס לקפוץ ישר לשורות שהוא צריך במקום לקרוא את הטבלה. העסקה מפורשת: אתה משלם במקום בדיסק ובמהירות כתיבה כדי לקנות מהירות קריאה. כל INSERT, UPDATE ו-DELETE חייב לתחזק כל אינדקס על הטבלה הזו.\n\nשני הצדדים של העסקה מופיעים בשטח. דשבורד תמיכה סינן קריאות לפי מטפל ומיין לפי created_at. על 100,000 שורות זה לקח 340 מילישניות; אינדקס מורכב על (assignee_id, created_at DESC) הוריד את זה ל-2 מילישניות, כי האינדקס כבר מחזיק את השורות בדיוק בסדר שהקווירי מבקש, ולא נשאר מה למיין. הצד השני: טבלת events באותה מערכת צברה תשעה אינדקסים, שנוספו אחד-אחד על ידי אנשים שתיקנו דוח אחד כל אחד. ייבוא לילי בבאטצ׳ים שפעם טען 40,000 שורות בדקה ירד ל-6,000, כי כל שורה עכשיו פירושה עשר כתיבות במקום אחת. מחיקת ארבעה אינדקסים שאף קווירי לא השתמש בהם החזירה את המצב לקדמותו.\n\nהכלל שכדאי לקחת: לאנדקס את מה שמסננים לפיו וממיינים לפיו, בסדר הזה, ורק לקווריז שבאמת רצים. כשסוכן אומר לך שדף איטי ומציע להוסיף אינדקסים, תשאל איזה קווירי ספציפי כל אינדקס משרת — אינדקס שלא מתאים לעמודות הפותחות של WHERE אמיתי הוא עלות נטו. ותשאל מה זה יעשה לכתיבות בטבלה שמקבלת הרבה INSERTים. הגרסה הכי שווה של המיומנות הזו היא לא זוהרת: להסתכל על שניים-שלושה הקווריז האיטיים ביותר, להוסיף את שניים-שלושה האינדקסים שמתאימים להם, ולמדוד שוב. לא לאנדקס הכל ולקוות. ואז להסתכל שוב בעוד כמה חודשים, כי הפלאן שהדאטהבייס בוחר הוא פונקציה של כמות הנתונים שהייתה ביום שבו הוא בחר."
 },
 "Migration": {
  "en": "A migration turns a schema change from an event into an artifact. It is a numbered file, reviewed like code, applied in the same order in every environment, and recorded so it never runs twice. That is what keeps your laptop, staging and production describing the same world — and it is why the bug you reproduce locally is the same bug that happens live.\n\nA team added a not-null status column to orders. In staging someone did it by hand in a GUI, on a table with 900 rows, and it took no time at all. The migration that later ran against production hit 12 million rows, rewrote the whole table to fill the default, and held an exclusive lock for four minutes. Checkout returned 500s for those four minutes, at nine in the evening. The safe version is three migrations, not one: add the column as nullable, backfill it in batches while the app keeps running, then add the not-null constraint once the data is already clean. The difference between four minutes of downtime and zero was entirely in the shape of the change, not in the change itself.\n\nWhen you let an agent change your schema, the thing to insist on is that the change arrives as a new file in the migrations folder and never as an edit to a file that has already run somewhere. Production applied 0007 and will never look at it again, so editing 0007 means your laptop and production now disagree silently. Two questions are worth asking about every migration before it runs: does this lock a big table, and can I undo it. Adding a column and adding an index concurrently are cheap. Renaming a column, changing a type, and dropping anything are the ones that need a plan and a deploy window.",
  "he": "מיגרציה הופכת שינוי סכמה מאירוע לארטיפקט. היא קובץ ממוספר, עובר ריוויו כמו קוד, מורץ באותו סדר בכל סביבה, ונרשם כדי שלא ירוץ פעמיים. זה מה ששומר על המחשב שלך, הסטייג׳ינג והפרודקשן מתארים את אותו עולם — ובגלל זה הבאג שאתה משחזר מקומית הוא אותו באג שקורה באוויר.\n\nצוות הוסיף עמודת status עם NOT NULL לטבלת orders. בסטייג׳ינג מישהו עשה את זה ידנית בממשק גרפי, על טבלה של 900 שורות, וזה לקח אפס זמן. המיגרציה שרצה אחר כך בפרודקשן פגשה 12 מיליון שורות, כתבה מחדש את כל הטבלה כדי למלא את ברירת המחדל, והחזיקה נעילה בלעדית ארבע דקות. הצ׳קאאוט החזיר 500 בארבע הדקות האלה, בתשע בערב. הגרסה הבטוחה היא שלוש מיגרציות ולא אחת: להוסיף את העמודה כ-nullable, למלא אותה בבאטצ׳ים בזמן שהאפליקציה ממשיכה לרוץ, ואז להוסיף את אילוץ ה-NOT NULL כשהנתונים כבר נקיים. ההבדל בין ארבע דקות השבתה לאפס היה כולו בצורת השינוי, לא בשינוי עצמו.\n\nכשאתה נותן לסוכן לשנות לך את הסכמה, הדבר שצריך להתעקש עליו הוא שהשינוי מגיע כקובץ חדש בתיקיית המיגרציות ולעולם לא כעריכה של קובץ שכבר רץ אי שם. הפרודקשן הריץ את 0007 ולא יסתכל עליו שוב, אז עריכה של 0007 אומרת שהמחשב שלך והפרודקשן חלוקים בשקט. שתי שאלות שוות שאילה על כל מיגרציה לפני שהיא רצה: האם זה נועל טבלה גדולה, והאם אפשר לבטל. הוספת עמודה והוספת אינדקס עם CONCURRENTLY הן זולות. שינוי שם של עמודה, שינוי טיפוס, וכל מחיקה — אלה שצריכות תוכנית וחלון דיפלוי."
 },
 "Transaction": {
  "en": "A transaction is a promise that the outside world never sees a half-finished change. Either every write inside it becomes visible at the same instant, or none of them does. That is what makes multi-step operations safe to crash in the middle of, which matters because every deploy, every timeout and every out-of-memory kill is a crash in the middle of something.\n\nThe cost is that other work can queue behind it. A refund flow wrapped three steps in one transaction: insert a refunds row, call Stripe over HTTP, update the order status. Stripe normally answered in 200 milliseconds, so nobody noticed. One afternoon Stripe got slow and answered in eight seconds. Each refund now held its locks on the orders row for eight seconds, the connection pool of twenty filled with refunds that were doing nothing but waiting on a network call, and the entire site stopped serving — including pages that had nothing to do with refunds. The fix was not a bigger pool. It was moving the HTTP call outside the transaction: write the intent, commit, call Stripe, then record the result in a second short transaction.\n\nTwo rules make this concrete. Keep transactions short and keep network calls out of them — a transaction should touch the database and nothing else. And use one wherever two writes only make sense together: debit and credit, create-order and decrement-stock, delete-user and delete-their-files. An agent will often write those two statements one after another with no transaction at all, because the code reads fine and works every time you test it. The failure only shows up when the process dies between the two lines, which happens for real, on a schedule you do not control. Ask explicitly: which writes in this function must not be able to happen separately.",
  "he": "טרנזקציה היא הבטחה שהעולם החיצוני לעולם לא רואה שינוי חצי-גמור. או שכל הכתיבות שבתוכה הופכות גלויות באותו רגע, או שאף אחת מהן לא. זה מה שהופך פעולות רב-שלביות לבטוחות לקריסה באמצע, וזה חשוב כי כל דיפלוי, כל טיים-אאוט וכל הרג על חוסר זיכרון הם קריסה באמצע משהו.\n\nהמחיר הוא שעבודה אחרת עלולה להצטבר מאחוריה. תהליך זיכוי עטף שלושה שלבים בטרנזקציה אחת: להכניס שורת refunds, לקרוא לסטרייפ ב-HTTP, לעדכן את סטטוס ההזמנה. סטרייפ בדרך כלל ענה ב-200 מילישניות, אז אף אחד לא שם לב. אחר צהריים אחד סטרייפ נהיה איטי וענה בשמונה שניות. כל זיכוי החזיק עכשיו את הנעילות שלו על שורת ההזמנה שמונה שניות, ה-connection pool של עשרים התמלא בזיכויים שלא עשו כלום חוץ מלחכות לקריאת רשת, וכל האתר הפסיק לשרת — כולל דפים שאין להם שום קשר לזיכויים. הפתרון לא היה pool גדול יותר. הוא היה להוציא את קריאת ה-HTTP מחוץ לטרנזקציה: לכתוב את הכוונה, לעשות COMMIT, לקרוא לסטרייפ, ואז לרשום את התוצאה בטרנזקציה קצרה שנייה.\n\nשני כללים הופכים את זה למעשי. תשמור על טרנזקציות קצרות ותוציא מהן קריאות רשת — טרנזקציה צריכה לגעת בדאטהבייס ובכלום אחר. ותשתמש באחת בכל מקום ששתי כתיבות הגיוניות רק ביחד: חיוב וזיכוי, יצירת הזמנה והורדת מלאי, מחיקת משתמש ומחיקת הקבצים שלו. סוכן יכתוב לא פעם את שתי הפקודות האלה אחת אחרי השנייה בלי טרנזקציה בכלל, כי הקוד נקרא בסדר ועובד בכל בדיקה שתעשה. הכישלון מתגלה רק כשהתהליך מת בין שתי השורות, וזה קורה באמת, בלוח זמנים שאתה לא שולט בו. תשאל במפורש: אילו כתיבות בפונקציה הזו חייבות לא להיות מסוגלות לקרות בנפרד."
 },
 "ORM": {
  "en": "An ORM maps rows to objects so you can write your language instead of SQL. It hides the SQL, and hiding a cost never removes it. Everything the ORM does still becomes queries; you have simply stopped seeing how many and what shape.\n\nThe canonical failure is the N+1. An orders page loaded 100 orders in one query, then looped over them to attach each buyer's name. Ordinary-looking code, four lines, no loop over the database in sight — and 101 round trips to Postgres. Locally, with the database on the same machine, each round trip cost 0.4 milliseconds and the page rendered in 60. In production the database was a separate instance, each round trip cost 11 milliseconds of network, and the same page took 1.2 seconds. Nothing was slow; there was just a great deal of it. Replacing the loop with one eager-load option produced two queries and 40 milliseconds. The code barely changed; the number of conversations did.\n\nSo treat an ORM as a convenience layer you can always see through. Turn on query logging in development — every mainstream ORM has a one-line switch — and load a page. If the log shows the same statement repeated with different ids, you have found an N+1, and you have found it before a user did. This is worth doing specifically on AI-written code, because an agent optimises for code that reads naturally, and the loop-and-fetch pattern reads more naturally than the eager-load one. The useful prompt is not make this faster, it is show me the SQL this endpoint executes and how many statements it runs. Once you can see the count, the fix is usually one argument. The same applies to writes: an ORM that saves a hundred records one at a time inside a loop is the same mistake wearing different clothes.",
  "he": "ORM ממפה שורות לאובייקטים כדי שתכתוב בשפה שלך במקום SQL. הוא מסתיר את ה-SQL, והסתרת עלות אף פעם לא מבטלת אותה. כל מה שה-ORM עושה עדיין הופך לקווריז; פשוט הפסקת לראות כמה ובאיזו צורה.\n\nהכישלון הקלאסי הוא N+1. דף הזמנות טען 100 הזמנות בקווירי אחד, ואז רץ עליהן בלולאה כדי לצרף את שם הקונה לכל אחת. קוד שנראה רגיל לגמרי, ארבע שורות, בלי שום לולאה על הדאטהבייס באופק — ו-101 נסיעות הלוך-חזור לפוסטגרס. מקומית, כשהדאטהבייס על אותה מכונה, כל נסיעה עלתה 0.4 מילישניות והדף רונדר ב-60. בפרודקשן הדאטהבייס היה אינסטנס נפרד, כל נסיעה עלתה 11 מילישניות של רשת, ואותו דף לקח 1.2 שניות. שום דבר לא היה איטי; פשוט היה ממנו המון. החלפת הלולאה באופציית eager load אחת ייצרה שני קווריז ו-40 מילישניות. הקוד כמעט לא השתנה; מספר השיחות כן.\n\nאז תתייחס ל-ORM כשכבת נוחות שאתה תמיד יכול להסתכל דרכה. תדליק לוג של קווריז בסביבת הפיתוח — לכל ORM מרכזי יש מתג של שורה אחת — ותטען דף. אם הלוג מראה את אותה פקודה חוזרת עם מזהים שונים, מצאת N+1, ומצאת אותו לפני שמשתמש מצא. זה שווה במיוחד על קוד שנכתב על ידי AI, כי סוכן מייעל לקוד שנקרא טבעי, ותבנית ״לולאה ושליפה״ נקראת טבעי יותר מתבנית ה-eager load. הפרומפט המועיל הוא לא ״תעשה את זה מהיר יותר״, אלא ״תראה לי את ה-SQL שהאנדפוינט הזה מריץ וכמה פקודות הוא שולח״. ברגע שרואים את המספר, התיקון הוא בדרך כלל ארגומנט אחד. אותו דבר נכון לכתיבות: ORM ששומר מאה רשומות אחת-אחת בתוך לולאה הוא בדיוק אותה טעות בבגדים אחרים."
 },
 "Typed vs untyped": {
  "en": "A type is a claim a machine checks before the program runs. `qty` is a number is not a comment — it is a proof the compiler demands on every path. Untyped code lets a value be anything and finds out at the moment the operation happens, which is usually in front of a customer. The cost of types is ceremony at write time. The cost of their absence is a class of bug that looks like arithmetic and is actually a string. Types do not make the program right; they make a family of wrong programs refuse to build.\n\nHarbor checkout took quantity from an `<input>`. Inputs are strings. JavaScript multiplied happily (`\"2\" * 10 === 20`) for seven months. A new gift-wrap branch concatenated instead: `\"2\" + 10` stored `\"210\"` as `amount_cents` after a parse that failed open. 38 invoices went out at ₪210 instead of ₪20. TypeScript would have refused the function at the form boundary. The line survived review because it read like maths. A second cousin on the same week: an agent used `userId as string` on a JSON number; 3,200 order lookups against a uuid column returned nothing, and support saw \"order not found\" for people who had just paid.\n\nFor a script you run once, skip the ceremony. For anything an agent will keep editing, types are the cheapest net you can buy — renamed fields, arguments swapped, nulls you forgot. Start in TypeScript rather than converting later. When the model silences a red squiggle with `any` or `as`, that is the finding: the checker noticed a lie. Ask what the actual type is at the boundary, and parse it (zod, or a converter) instead of asserting. An assertion is a promise the runtime will not keep.",
  "he": "טיפוס הוא טענה שמכונה בודקת לפני שהתוכנית רצה. `qty` הוא מספר זה לא הערה — זו הוכחה שהקומפיילר דורש בכל נתיב. קוד בלי טיפוסים נותן לערך להיות כל דבר ומגלה ברגע שהפעולה קורית, שזה בדרך כלל מול לקוח. מחיר הטיפוסים הוא טקס בזמן כתיבה. מחיר ההיעדר שלהם הוא משפחת באגים שנראית כמו חשבון ובעצם מחרוזת. טיפוסים לא הופכים את התוכנית לנכונה; הם גורמים למשפחה של תוכניות שגויות לסרב להיבנות.\n\nהצ׳קאאוט של הארבור לקח כמות מ-`<input>`. שדות קלט הם מחרוזות. ג׳אווהסקריפט הכפיל בשמחה (`\"2\" * 10 === 20`) שבעה חודשים. ענף עטיפת מתנה חדש שרשר במקום: `\"2\" + 10` שמר `\"210\"` כ-`amount_cents` אחרי parse שנכשל בפתוח. 38 חשבוניות יצאו ב-₪210 במקום ₪20. טייפסקריפט היה מסרב לפונקציה בגבול הטופס. השורה שרדה ריוויו כי היא נקראה כמו חשבון. בן דוד באותו שבוע: סוכן השתמש ב-`userId as string` על מספר JSON; 3,200 שליפות הזמנה מול עמודת uuid החזירו כלום, והתמיכה ראתה ״הזמנה לא נמצאה״ לאנשים שזה עתה שילמו.\n\nלסקריפט שרץ פעם אחת, דלג על הטקס. לכל דבר שסוכן ימשיך לערוך, טיפוסים הם הרשת הזולה ביותר שאפשר לקנות — שדות ששונה שמם, ארגומנטים שהוחלפו, null ששכחת. תתחיל בטייפסקריפט במקום להמיר אחר כך. כשהמודל משתיק קו אדום עם `any` או `as`, זה הממצא: הבודק שם לב לשקר. תשאל מה הטיפוס האמיתי בגבול, ותפרסר אותו (zod, או ממיר) במקום להצהיר. Assertion הוא הבטחה שהראנטיים לא יקיים."
 },
 "Compiled vs interpreted": {
  "en": "The difference is when you find out you were wrong. A compiler reads the whole program, refuses to emit a binary if a name is missing, and you wait a minute to learn. An interpreter reads as it runs, so a broken line in the monthly path is a healthy program until the first of the month. Modern languages blur the slogan — JavaScript JIT-compiles hot paths, Java compiles twice — but the feedback loop you live in is still the thing you buy.\n\nTwo teams at the same company typo'd `sendInvioce`. The Go service failed CI in 90 seconds; it was fixed before lunch. The Python invoicing job had no build. It served traffic for eleven days and died on the 1st at 00:07 with `NameError: name 'sendInvioce' is not defined`. 14,000 invoices skipped one cycle; dunning letters went out 24 hours late; two enterprise customers opened severity-1 tickets. Same one-character mistake. The discovery cost was a customer, not a red X. A third variant: a TypeScript app with `transpileOnly: true` in the Docker start command, so `tsc` never ran. Production threw on an undefined helper that CI had never typechecked.\n\nKnow which loop your project is in, because \"it builds\" means different things. In Go, Rust, Java, C#, or `tsc --noEmit` in CI, a green build is evidence the agent's rename did not leave a dangling call. In Python or plain Node, a green start means nothing — you need tests, or a click through the path you changed. Ask the agent to add a typecheck step to CI if it is missing. The trap is treating a successful container start as proof. It is only proof that the interpreter began.",
  "he": "ההבדל הוא מתי אתה מגלה שטעית. קומפיילר קורא את כל התוכנית, מסרב לפלוט בינארי אם שם חסר, ואתה מחכה דקה כדי ללמוד. אינטרפרטר קורא תוך כדי ריצה, אז שורה שבורה בנתיב החודשי היא תוכנית בריאה עד ה-1 בחודש. שפות מודרניות מטשטשות את הסלוגן — ג׳אווהסקריפט מקמפל JIT נתיבים חמים, ג׳אווה מקמפלת פעמיים — אבל לולאת המשוב שאתה חי בה היא עדיין מה שאתה קונה.\n\nשני צוותים באותה חברה כתבו `sendInvioce`. שירות ה-Go נכשל ב-CI תוך 90 שניות; תוקן לפני הצהריים. ג׳וב החשבוניות בפייתון לא היה לו בילד. הוא שירת תעבורה אחד עשר ימים ומת ב-1 בחודש ב-00:07 עם `NameError: name 'sendInvioce' is not defined`. 14,000 חשבוניות דילגו על מחזור אחד; מכתבי דאנינג יצאו באיחור של 24 שעות; שני לקוחות אנטרפרייז פתחו כרטיסי חומרה-1. אותה טעות של תו אחד. מחיר הגילוי היה לקוח, לא איקס אדום. וריאנט שלישי: אפליקציית טייפסקריפט עם `transpileOnly: true` בפקודת העלייה בדוקר, אז `tsc` מעולם לא רץ. פרודקשן זרק על helper לא מוגדר שה-CI מעולם לא בדק טיפוסים עליו.\n\nתדע באיזו לולאה הפרויקט שלך, כי ״זה בונה״ אומר דברים שונים. ב-Go, ראסט, ג׳אווה, C#, או `tsc --noEmit` ב-CI, בילד ירוק הוא ראיה שהשינוי-שם של הסוכן לא השאיר קריאה תלויה. בפייתון או Node רגיל, עלייה ירוקה לא אומרת כלום — צריך טסטים, או קליק דרך הנתיב ששינית. תבקש מהסוכן להוסיף שלב typecheck ל-CI אם הוא חסר. המלכודת היא להתייחס לעליית קונטיינר מוצלחת כהוכחה. זו רק הוכחה שהאינטרפרטר התחיל."
 },
 "JavaScript / TypeScript": {
  "en": "JavaScript is the language that already sits in every browser, which is why it colonised servers, CLIs and phones. That is history, not a beauty contest. TypeScript is a check at authoring time that erases itself: production runs plain JS, with no runtime cost. One language on both sides lets you share a validator — and it also lets a Date become a string at the JSON boundary while the same function still type-checks, because `as Order` is a dare, not a parser. Sharing code across the wire is a gift only if you parse at the edge; otherwise you have shared a bug that throws on one side and not the other.\n\nA shared `isPaid(order)` used `order.paidAt.getFullYear()` in the React app and in the Node worker. In the browser `paidAt` was still a Date. After `JSON.stringify` the worker received `\"2026-03-04T10:00:00.000Z\"` and threw. Overnight, 1,100 \"paid\" orders never entered the fulfilment queue; warehouse SLA missed by 16 hours. Types had been asserted at `res.json() as Order`. Zod at the boundary would have failed the parse in 2ms. Separately, optional chaining on `payment_intent.status` swallowed `incomplete`; the UI said thanks, Stripe said not captured, 64 orders, ₪18,400.\n\nStart in TypeScript even for a prototype — converting later is a project, starting is a flag. Share schemas, parse at the edge, never `as`. Watch the lockfile: a casual `npm install` on a Node repo can pull hundreds of transitive packages. Ask the agent to justify each new dependency, and remember that types disappear at runtime, so a value that crossed HTTP is untyped until you say otherwise. The trap is believing TypeScript made the JSON safe. It made the authoring safer. The wire is still strings.",
  "he": "ג׳אווהסקריפט היא השפה שכבר יושבת בכל דפדפן, ובגלל זה היא כבשה שרתים, CLIs וטלפונים. זו היסטוריה, לא תחרות יופי. טייפסקריפט היא בדיקה בזמן כתיבה שמוחקת את עצמה: פרודקשן מריץ JS רגיל, בלי עלות ריצה. שפה אחת בשני הצדדים נותנת לשתף ולידטור — וגם נותנת ל-Date להפוך למחרוזת בגבול ה-JSON בזמן שאותה פונקציה עדיין עוברת בדיקת טיפוסים, כי `as Order` הוא הימור, לא פרסר. שיתוף קוד מעל החוט הוא מתנה רק אם מפרסרים בקצה; אחרת שיתפת באג שזורק בצד אחד ולא בשני.\n\n`isPaid(order)` משותף השתמש ב-`order.paidAt.getFullYear()` באפליקציית הריאקט ובוורקר ב-Node. בדפדפן `paidAt` עדיין היה Date. אחרי `JSON.stringify` הוורקר קיבל `\"2026-03-04T10:00:00.000Z\"` וזרק. בלילה, 1,100 הזמנות ״ששולמו״ לא נכנסו לתור המימוש; SLA של המחסן פיספס ב-16 שעות. הטיפוסים הצהרו ב-`res.json() as Order`. Zod בגבול היה נכשל בפרסור ב-2ms. בנפרד, optional chaining על `payment_intent.status` בלע `incomplete`; ה-UI אמר תודה, Stripe אמר לא נלכד, 64 הזמנות, ₪18,400.\n\nתתחיל בטייפסקריפט גם לפרוטוטייפ — המרה אחר כך היא פרויקט, התחלה היא דגל. תשתף סכמות, תפרסר בקצה, לעולם לא `as`. תשמור עין על ה-lockfile: `npm install` חפיף בריפו Node יכול למשוך מאות חבילות טרנזיטיביות. תבקש מהסוכן להצדיק כל תלות חדשה, ותזכור שטיפוסים נעלמים בזמן ריצה, אז ערך שחצה HTTP הוא בלי טיפוס עד שאתה אומר אחרת. המלכודת היא להאמין שטייפסקריפט הפך את ה-JSON לבטוח. הוא הפך את הכתיבה לבטוחה יותר. החוט עדיין מחרוזות."
 },
 "Python": {
  "en": "Python minimises the distance between an idea and a result on screen. The language is readable; the asset is the library someone already wrote for files, tables, HTTP and models. That is why it dominates glue, reports and one-off jobs. The same looseness that makes a 30-line script a gift makes a 40-file service depend on discipline the runtime will not supply: a helper that returns a dict or `None` will work until one caller forgets the check.\n\nFinance at Northline spent a day each month reconciling Stripe CSV against `orders`. A 30-line pandas script cut that to four seconds — until `requirements.txt` listed `pandas` with no pin. CI in March got 2.0.3. A fresh image in September got 2.2.2, where `groupby(...).apply` changed enough that the join produced 0 rows. The monthly report emailed a blank table at 07:00. Six hours of \"the warehouse is empty\" later, someone ran `pip freeze` on the old laptop. Pinning `pandas==2.2.2` and a one-row smoke test on the report job would have failed CI in 20 seconds instead of failing finance in six hours.\n\nPick Python when the work is process this file, call that API, analyse these rows. Then add what the language will not: type hints plus mypy or pyright, a lock file, a virtualenv per project. Agents skip all three unless you demand them. Ask: where is the venv, and will this pip install the same versions in a year? The trap is a global Python on the laptop fighting every project, and an unpinned requirements file that turns \"works on my machine\" into a calendar event. Also watch `except Exception: pass` in generated scripts — the nightly job that writes empty rows instead of dying.",
  "he": "פייתון ממזער את המרחק בין רעיון לתוצאה על המסך. השפה קריאה; הנכס הוא הספרייה שמישהו כבר כתב בשביל קבצים, טבלאות, HTTP ומודלים. בגלל זה היא שולטת בגלו, בדוחות ובעבודות חד-פעמיות. אותה רפיון שהופכת סקריפט של 30 שורות למתנה הופכת שירות של 40 קבצים לתלוי במשמעת שהראנטיים לא יספק: helper שמחזיר dict או `None` יעבוד עד שקורא אחד ישכח לבדוק.\n\nהכספים בנורת׳ליין בילו יום בחודש בהתאמת CSV של Stripe מול `orders`. סקריפט pandas של 30 שורות קיצר את זה לארבע שניות — עד ש-`requirements.txt` רשם `pandas` בלי נעיצה. CI במרץ קיבל 2.0.3. אימג׳ טרי בספטמבר קיבל 2.2.2, שם `groupby(...).apply` השתנה מספיק כדי שהג׳וין ייצר 0 שורות. הדוח החודשי מייל טבלה ריקה ב-07:00. אחרי שש שעות של ״המחסן ריק״, מישהו הריץ `pip freeze` על הלפטופ הישן. נעיצת `pandas==2.2.2` וטסט עשן של שורה אחת על ג׳וב הדוח היו מפילים את ה-CI ב-20 שניות במקום להפיל את הכספים בשש שעות.\n\nתבחר פייתון כשהעבודה היא לעבד את הקובץ הזה, לקרוא ל-API ההוא, לנתח את השורות האלה. ואז תוסיף מה שהשפה לא תוסיף: רמזי טיפוסים ועוד mypy או pyright, קובץ lock, וירטואל-env לכל פרויקט. סוכנים מדלגים על שלושתם אם לא דורשים. תשאל: איפה ה-venv, והאם ה-pip הזה יתקין את אותן גרסאות בעוד שנה? המלכודת היא פייתון גלובלי על הלפטופ שנלחם בכל פרויקט, וקובץ requirements לא נעוץ שהופך ״אצלי זה עובד״ לאירוע ביומן. תשים לב גם ל-`except Exception: pass` בסקריפטים שנוצרים — הג׳וב הלילי שכותב שורות ריקות במקום למות."
 },
 "Go / Rust / Java / C#": {
  "en": "These languages charge ceremony up front because at some scale a mistake costs more than the ceremony. Go buys small, boring services and a single binary. Rust buys memory safety without a garbage collector, paid in compiler fights. Java and C# buy decades of libraries, ops knowledge, and frameworks that already decided your folder layout. You rarely pick them from a blog post about speed. You pick them because the team, the employer, or the ecosystem already speaks them. Speed is a measurement you take after the product exists, not a reason to start in a language nobody on-call can read.\n\nThumbly needed image resizing. A fan of Rust spent three weeks on a service that did 4ms per thumbnail at 60MB RSS. Traffic was eleven images a minute. A colleague's Node stopgap, four hours of work, used 400MB and was fine. Later, a Java shop rewrote checkout in Go \"for performance\": nine weeks, two engineers, p95 from 180ms to 140ms. The missed feature was Apple Pay, which a competitor shipped in week three. Rust was the better program. Go was the better binary. Neither was the better quarter.\n\nFor AI-assisted work, treat these names as a reading guide more than a shopping list. A `go.mod` means explicit `if err != nil` on every line — an agent that swallows errors is wrong for that repo. A `pom.xml` or `.csproj` means conventions you follow, not a tutorial the model remembers. Ask: will this service be deployed as one binary, and does the team already run this stack at 3am? The trap is an agent scaffolding Actix or Spring for a weekend prototype you will throw away, or ignoring the error style of the language you are actually in. Choose boring, choose spoken, measure before you switch for speed.",
  "he": "השפות האלה גובות טקס מראש כי בסקייל מסוים טעות עולה יותר מהטקס. Go קונה שירותים קטנים ומשעממים ובינארי אחד. ראסט קונה בטיחות זיכרון בלי GC, ומשלמים על זה במאבקים עם הקומפיילר. ג׳אווה ו-C# קונות עשורים של ספריות, ידע תפעול, ופריימוורקים שכבר החליטו על מבנה התיקיות. לעיתים נדירות בוחרים אותן מפוסט בבלוג על מהירות. בוחרים אותן כי הצוות, המעסיק או האקוסיסטם כבר מדברים אותן. מהירות היא מדידה שעושים אחרי שהמוצר קיים, לא סיבה להתחיל בשפה שאף אחד בכוננות לא יודע לקרוא.\n\nת׳מבלי היו צריכים שינוי גודל תמונות. חובב ראסט בילה שלושה שבועות על שירות שעשה 4ms לת׳אמבנייל ב-60MB RSS. התעבורה הייתה אחת עשרה תמונות בדקה. פתרון הביניים ב-Node של עמית, ארבע שעות עבודה, השתמש ב-400MB והיה בסדר. אחר כך, חברת ג׳אווה שכתבה צ׳קאאוט ב-Go ״בשביל ביצועים״: תשעה שבועות, שני מהנדסים, p95 מ-180ms ל-140ms. הפיצ׳ר שהוחמץ היה Apple Pay, שמתחרה שחרר בשבוע השלישי. ראסט הייתה התוכנית הטובה יותר. Go היה הבינארי הטוב יותר. אף אחד מהם לא היה הרבעון הטוב יותר.\n\nלעבודה עם AI, תתייחס לשמות האלה כמדריך קריאה יותר מאשר רשימת קניות. `go.mod` אומר `if err != nil` מפורש בכל שורה — סוכן שבולע שגיאות שגוי לריפו הזה. `pom.xml` או `.csproj` אומרים מוסכמות שעוקבים אחריהן, לא טוטוריאל שהמודל זוכר. תשאל: האם השירות הזה יעלה כבינארי אחד, והאם הצוות כבר מריץ את הסטאק הזה ב-03:00? המלכודת היא סוכן שמסקאפל Actix או Spring לפרוטוטייפ של סוף שבוע שתזרוק, או שמתעלם מסגנון השגיאות של השפה שאתה באמת בה. תבחר משעמם, תבחר מדובר, תמדוד לפני שאתה מחליף בשביל מהירות."
 },
 "Package manager": {
  "en": "A package manager makes the same tree of code appear on two machines: your laptop, CI, production. You declare a range. The tool solves a graph. The lock file writes down exactly what it solved. Without that file, a build is a function of what the registry felt like that morning. With it, a build in a year can be the same bytes. That is the whole product. The range in `package.json` is a wish. The lock file is history.\n\nCartel had `\"stripe\": \"^12.1.0\"` and no habit of `npm ci`. A developer laptop, installed in March, had 12.1.0. CI in June resolved 12.9.0, which changed a default from automatic payment methods to explicit ones. Unit tests mocked Stripe and stayed green. Production declined 19% of cards for 70 minutes after the deploy. Nobody had changed application code. The caret had. Switching CI to `npm ci` made the next drift a loud mismatch instead of a silent new library. A cousin incident: an agent ran `npm install axios` and the lockfile diff was 1,840 lines. Three packages deep sat a deprecated `follow-redirects` release with a published advisory.\n\nCommit the lock file — `package-lock.json`, `pnpm-lock.yaml`, `poetry.lock`, `Cargo.lock`, `go.sum` — always. When an agent adds a dependency, read the lock diff, not only the one-line manifest change. Ask CI to install from the lock (`npm ci`, `pnpm i --frozen-lockfile`). The trap is `npm install` in CI, which updates the lock, and the other trap is not committing the lock \"because it is generated\". Generated is the point. Also refuse `*` and `latest` in ranges. Yesterday's green build is not a promise about tomorrow's registry.",
  "he": "מנהל חבילות גורם לאותו עץ קוד להופיע על שתי מכונות: הלפטופ שלך, CI, פרודקשן. אתה מצהיר על טווח. הכלי פותר גרף. קובץ ה-lock רושם בדיוק מה הוא פתר. בלי הקובץ הזה, בילד הוא פונקציה של מה שהרג׳יסטרי הרגיש באותו בוקר. איתו, בילד בעוד שנה יכול להיות אותם בתים. זה כל המוצר. הטווח ב-`package.json` הוא משאלה. קובץ ה-lock הוא היסטוריה.\n\nקרטל היה להם `\"stripe\": \"^12.1.0\"` ובלי הרגל של `npm ci`. לפטופ מפתח, הותקן במרץ, היה 12.1.0. CI ביוני פתר 12.9.0, ששינה ברירת מחדל מאמצעי תשלום אוטומטיים למפורשים. יוניט טסטים עשו mock ל-Stripe ונשארו ירוקים. פרודקשן דחה 19% מהכרטיסים במשך 70 דקות אחרי הדיפלוי. אף אחד לא שינה קוד אפליקציה. הגגון שינה. מעבר של CI ל-`npm ci` הפך את הסחיפה הבאה לאי-התאמה רועשת במקום לספרייה חדשה שקטה. תקלה בת דודה: סוכן הריץ `npm install axios` והדיף של ה-lockfile היה 1,840 שורות. שלוש חבילות פנימה ישב ריליס deprecated של `follow-redirects` עם התרעה שפורסמה.\n\nתעשה קומיט לקובץ ה-lock — `package-lock.json`, `pnpm-lock.yaml`, `poetry.lock`, `Cargo.lock`, `go.sum` — תמיד. כשסוכן מוסיף תלות, תקרא את דיף ה-lock, לא רק את שינוי המניפסט של שורה אחת. תבקש מה-CI להתקין מה-lock (`npm ci`, `pnpm i --frozen-lockfile`). המלכודת היא `npm install` ב-CI, שמעדכן את ה-lock, והמלכודת השנייה היא לא לעשות קומיט ל-lock ״כי הוא מחולל״. מחולל זו הנקודה. תסרב גם ל-`*` ול-`latest` בטווחים. בילד ירוק מאתמול אינו הבטחה לגבי הרג׳יסטרי של מחר."
 },
 "Dependency": {
  "en": "A dependency is a stranger you hire forever. You take their bugs, their advisories, their breaking majors, their model of the problem, and their right to stop answering email. Day one feels free because `npm install` is one line. Day four hundred is a prototype-pollution notice four levels down that forces a framework bump, a Node bump, and a Docker rebuild you did not budget. The question is never can this library do it. It is would I rather own twenty lines or own this relationship.\n\nA Next.js shop had 14 direct dependencies and 1,190 packages in `node_modules`. An advisory landed on a helper four hops in. `npm audit fix --force` jumped a plugin major, which needed Node 20, which broke the Node 18 base image. Two engineers, two days. In the same repo, `is-email-valid` (40KB, last publish 2021) checked emails. A regex of three lines would have done it with no advisory feed. Meanwhile an agent, asked to format dates, added `moment` next to existing `date-fns` and `dayjs` — three clocks, two of them unmaintained, one extra 300KB in the checkout bundle, p75 on mobile up 180ms.\n\nWhen a new name appears in a diff, ask what it does, how many packages it brought, and when it last released. Four years of silence is abandoned, not stable. Own crypto, time zones, and protocol parsers as libraries; own a one-function helper as code. Agents install by default because an import is the shortest answer. The trap is a hallucinated package name that happens to exist on the registry under new ownership, and the cousin trap: three libraries for one job. Delete before you add. `npm ls --all | wc -l` is a number you should see once per PR that touches `package.json`.",
  "he": "תלות היא זר שאתה שוכר לנצח. אתה לוקח את הבאגים שלו, את ההתרעות שלו, את המייג׳ורים השוברים, את המודל שלו לבעיה, ואת הזכות שלו להפסיק לענות למייל. יום אחד מרגיש חינם כי `npm install` הוא שורה אחת. יום ארבע מאות הוא התרעת prototype-pollution ארבע רמות פנימה שמכריחה קפיצת פריימוורק, קפיצת Node, ובילד דוקר שלא תקצבת. השאלה היא אף פעם לא האם הספרייה יודעת. היא האם אני מעדיף להחזיק עשרים שורות או להחזיק את מערכת היחסים הזאת.\n\nחנות Next.js היו לה 14 תלויות ישירות ו-1,190 חבילות ב-`node_modules`. התרעה נחתה על helper ארבע קפיצות פנימה. `npm audit fix --force` קפץ מייג׳ר של פלאגין, שדרש Node 20, ששבר את אימג׳ הבסיס של Node 18. שני מהנדסים, יומיים. באותו ריפו, `is-email-valid` (40KB, פרסום אחרון 2021) בדק אימיילים. רג׳קס של שלוש שורות היה עושה את זה בלי פיד התרעות. בינתיים סוכן, שהתבקש לפרמט תאריכים, הוסיף `moment` ליד `date-fns` ו-`dayjs` קיימים — שלושה שעונים, שניים מהם לא מתוחזקים, 300KB נוספים בבאנדל הצ׳קאאוט, p75 במובייל עלה ב-180ms.\n\nכששם חדש מופיע בדיף, תשאל מה הוא עושה, כמה חבילות הוא הביא, ומתי הוא שוחרר לאחרונה. ארבע שנים של שקט זה נטוש, לא יציב. תחזיק קריפטו, אזורי זמן ופרסרי פרוטוקול כספריות; תחזיק helper של פונקציה אחת כקוד. סוכנים מתקינים כברירת מחדל כי ייבוא הוא התשובה הקצרה ביותר. המלכודת היא שם חבילה מומצא שבמקרה קיים ברג׳יסטרי תחת בעלות חדשה, ומלכודת בת דודה: שלוש ספריות לעבודה אחת. תמחק לפני שאתה מוסיף. `npm ls --all | wc -l` הוא מספר שכדאי לראות פעם בכל PR שנוגע ב-`package.json`."
 },
 "Framework vs library": {
  "en": "You call a library; a framework calls you. A library is a drawer: `format(date)` when you want it. A framework is a building: this folder is a route, this filename is a loading state, sessions live here. Leverage is enormous when its opinions match your problem. The tax is permanent when they do not — you will spend weeks fighting a room layout you agreed to on day one, in an afternoon, because the tutorial was pretty.\n\nAn internal tool took Next.js and had auth, routing and a deploy in one afternoon. Nine months later they needed login via a customer's IdP, returning to a per-tenant subdomain. The framework's session cookie was bound to one host. Two weeks of middleware later, the next framework upgrade broke the workaround. The same feature on Express plus a routing library was estimated at two days — days they would have paid on every feature before that. A smaller version of the same tax: an agent mixed `pages/` and `app/` routers in one repo. After deploy, 40% of URLs 404'd. The convention was the product, and nobody had picked one convention.\n\nEvaluate a framework by a three-year-old app larger than yours, not by the getting-started. For agents, popularity is a feature: the conventional answer is in the training data. A mainstream framework you mildly dislike will often generate better code than a unique snowflake layout. Ask which of your requirements sit outside its opinions before you commit — those are the weeks. The trap is two frameworks in one repo, or a library used as if it were a framework (invented folder magic nobody else knows). Pick one building, or pick drawers. Do not build a shed inside someone else's kitchen.",
  "he": "אתה קורא לספרייה; פריימוורק קורא לך. ספרייה היא מגירה: `format(date)` כשאתה רוצה. פריימוורק הוא בניין: התיקייה הזאת היא ראוט, שם הקובץ הזה הוא מצב טעינה, סשנים חיים כאן. המינוף עצום כשהדעות שלו מתאימות לבעיה. המס קבוע כשלא — תבלה שבועות בלהילחם בפריסת חדרים שהסכמת לה ביום הראשון, בצהריים, כי הטוטוריאל היה יפה.\n\nכלי פנימי לקח Next.js וקיבל הזדהות, ניתוב ודיפלוי בצהריים אחד. תשעה חודשים אחר כך הם נזקקו להתחברות דרך IdP של לקוח, עם חזרה לסאב-דומיין לכל טננט. קוקי הסשן של הפריימוורק היה קשור למארח אחד. אחרי שבועיים של מידלוור, שדרוג הפריימוורק הבא שבר את הפתרון הזמני. אותו פיצ׳ר על Express ועוד ספריית ניתוב הוערך ביומיים — ימים שהיו משלמים בכל פיצ׳ר לפני כן. גרסה קטנה יותר של אותו מס: סוכן ערבב ראוטרים של `pages/` ו-`app/` בריפו אחד. אחרי דיפלוי, 40% מה-URLs החזירו 404. המוסכמה הייתה המוצר, ואף אחד לא בחר מוסכמה אחת.\n\nתעריך פריימוורק לפי אפליקציה בת שלוש שנים שגדולה משלך, לא לפי ההתחלה. לסוכנים, פופולריות היא פיצ׳ר: התשובה המוסכמת נמצאת בדאטה האימון. פריימוורק מיינסטרים שאתה לא אוהב במיוחד ייצר לעיתים קוד טוב יותר מפריסת פתית שלג ייחודית. תשאל אילו מהדרישות שלך יושבות מחוץ לדעות שלו לפני שאתה מתחייב — אלה השבועות. המלכודת היא שני פריימוורקים בריפו אחד, או ספרייה בשימוש כאילו היא פריימוורק (קסם תיקיות מומצא שאף אחד אחר לא מכיר). תבחר בניין אחד, או מגירות. אל תבנה סככה בתוך המטבח של מישהו אחר."
 },
 "RAM vs disk": {
  "en": "Your program lives in two places at once. RAM is the desk: close, fast, and cleared the moment you stand up. Disk is the filing cabinet: slow, durable, still there in the morning. A RAM read is about a hundred nanoseconds; an SSD is a thousand times slower; a database across the network is a thousand times slower again. Almost every performance win is moving data one step up that ladder. Almost every data-loss incident is treating RAM as disk — assuming a value would still be there after a restart, a crash, or a second server.\n\nA marketplace held shopping carts in a process-level object, keyed by session id. For three months, with one instance and Sunday-night deploys, nothing went wrong. Then they started deploying twice a day. Every deploy emptied every unpaid cart — roughly 1,200 abandoned carts per weekday, about ₪38,000 of intended purchases, which marketing blamed on a bad email campaign for six weeks. When they added a second instance, a customer added three items, the next request landed on the other one, and the cart showed empty. Support logged 640 tickets in nine days. Moving the cart to Redis with a 24-hour TTL, about twenty lines, made both symptoms vanish the same afternoon.\n\nWhen an agent writes state, the default is a variable, because a variable is the smallest thing that compiles. Ask two questions of every map, cache or session store it produces: what happens on restart, and what happens when there are two processes. If either answer is \"it is gone\" or \"the other one cannot see it\", that data belongs on disk, in a database, or in Redis — not in RAM. Also watch for the opposite mistake: loading a 400MB table into memory to filter it. Tests pass on a 200-row fixture either way. Production will not.",
  "he": "התוכנית שלך חיה בשני מקומות בבת אחת. RAM הוא השולחן: קרוב, מהיר, ומנוקה ברגע שאתה קם. דיסק הוא ארון התיקיות: איטי, עמיד, ועדיין שם בבוקר. קריאה מ-RAM היא בערך מאה ננושניות; SSD איטי פי אלף; דאטהבייס דרך הרשת איטי פי אלף שוב. כמעט כל ניצחון ביצועים הוא הזזת נתונים צעד אחד למעלה בסולם. כמעט כל אובדן נתונים הוא להתייחס ל-RAM כדיסק — להניח שערך יישאר אחרי הפעלה מחדש, קריסה, או שרת שני.\n\nמרקטפלייס החזיק עגלות קניות באובייקט ברמת התהליך, לפי מזהה סשן. שלושה חודשים, עם אינסטנס אחד ודיפלויים בלילות ראשון, שום דבר לא השתבש. ואז הם התחילו לעשות דיפלוי פעמיים ביום. כל דיפלוי רוקן כל עגלה שעוד לא שולמה — בערך 1,200 עגלות נטושות ביום חול, בערך ₪38,000 של רכישות מתוכננות, ששיווק ייחס לקמפיין מייל גרוע במשך שישה שבועות. כשהוסיפו אינסטנס שני, לקוח הוסיף שלושה פריטים, הבקשה הבאה נחתה על האחר, והעגלה הציגה ריק. תמיכה תיעדה 640 פניות בתשעה ימים. העברת העגלה ל-Redis עם TTL של 24 שעות, בערך עשרים שורות, העלימה את שני הסימפטומים באותו אחר צהריים.\n\nכשסוכן כותב סטייט, ברירת המחדל היא משתנה, כי משתנה הוא הדבר הכי קטן שמתקמפל. תשאל שתי שאלות על כל מפה, קאש או מאגר סשנים שהוא מייצר: מה קורה בהפעלה מחדש, ומה קורה כשיש שני תהליכים. אם אחת התשובות היא ״זה נעלם״ או ״השני לא רואה את זה״, הנתונים שייכים לדיסק, לדאטהבייס, או ל-Redis — לא ל-RAM. תשים לב גם לטעות ההפוכה: לטעון טבלה של 400MB לזיכרון כדי לסנן אותה. טסטים עוברים על פיקסצ׳ר של 200 שורות בשני המקרים. פרודקשן לא."
 },
 "Stack & heap": {
  "en": "Both are memory. The difference is who decides when something can be thrown away. The stack is strictly ordered — last in, first out — so cleanup of a local variable is free. The heap has no such order: objects can outlive the function that created them and are released only when nobody is looking. That is why the heap needs a garbage collector and the stack does not. The stack is also deliberately small, usually around a megabyte. The heap is large, often gigabytes, because that is where the actual data lives.\n\nThose two limits produce two famous crashes that mean opposite things. A comments API walked reply trees by calling itself for every child. An admin pasted a CSV that set a comment's parent to one of its own replies, creating a cycle. Node stopped it at about 11,400 deep with Maximum call stack size exceeded — a logic bug: something never terminates. Separately, a nightly invoicing job loaded 2.1 million line items, peaked at 3.8GB, and died with JavaScript heap out of memory after 14 minutes on a 2GB container. That is a volume bug: the work does finish, it just does not fit. The first was fixed by detecting cycles; the second by paging the query in chunks of 5,000 rows.\n\nSo the error message tells you which question to ask. Stack overflow means find the recursion with no base case, or the cycle in your data — a bigger stack almost never helps. Out of memory means stop loading the whole thing at once: stream the file, page the query, process in chunks. When an agent writes code that loads all records and then filters, that is the pattern that passes on an 80-row fixture and dies on the real table. Ask it to bound the working set, and whether any tree-walking is protected against cycles.",
  "he": "שניהם זיכרון. ההבדל הוא מי מחליט מתי אפשר לזרוק משהו. הסטאק מסודר בהחלט — האחרון שנכנס הוא הראשון שיוצא — ולכן ניקוי של משתנה מקומי הוא חינם. להיפ אין סדר כזה: אובייקטים יכולים לשרוד את הפונקציה שיצרה אותם ומשתחררים רק כשאף אחד לא מסתכל. לכן ההיפ צריך גרבג׳ קולקשן והסטאק לא. הסטאק גם קטן בכוונה, בדרך כלל סביב מגה אחד. ההיפ גדול, לעיתים ג׳יגות, כי שם חיים הנתונים האמיתיים.\n\nשני הגבולות האלה מייצרים שתי קריסות מפורסמות שאומרות דברים הפוכים. API של תגובות עבר על עצי תשובות בקריאה לעצמו לכל ילד. אדמין הדביק CSV שהגדיר הורה של תגובה לאחת התשובות שלה עצמה, ויצר מעגל. נוד עצר אותו בעומק של בערך 11,400 עם Maximum call stack size exceeded — באג לוגי: משהו לא מסתיים. בנפרד, ג׳וב חיוב לילי טען 2.1 מיליון שורות פריט, הגיע לשיא של 3.8GB, ומת עם JavaScript heap out of memory אחרי 14 דקות על קונטיינר של 2GB. זה באג נפח: העבודה כן מסתיימת, היא פשוט לא נכנסת. הראשון תוקן בזיהוי מעגלים; השני בעימוד הקווירי בצ׳אנקים של 5,000 שורות.\n\nאז הודעת השגיאה אומרת לך איזו שאלה לשאול. Stack overflow אומר למצוא את הרקורסיה בלי תנאי עצירה, או את המעגל בנתונים — סטאק גדול יותר כמעט אף פעם לא עוזר. Out of memory אומר להפסיק לטעון הכל בבת אחת: סטרימינג לקובץ, עימוד לקווירי, עיבוד בצ׳אנקים. כשסוכן כותב קוד שטוען את כל הרשומות ואז מסנן, זו התבנית שעוברת על פיקסצ׳ר של 80 שורות ומתה על הטבלה האמיתית. תבקש ממנו לחסום את נפח העבודה, ואם כל הליכה על עץ מוגנת מפני מעגלים."
 },
 "Garbage collection": {
  "en": "Automatic memory management trades catastrophic bugs for timing surprises. You will never free the same memory twice, and you will never read a pointer to something that no longer exists. In exchange, the runtime occasionally stops your program to work out what is still reachable, and it chooses the moment, not you. For most products that is an excellent trade. It stops being one only when a single request must not pause for half a second, which is rarer than people assume.\n\nThat pause shows up as a shape in a graph rather than as an error. A pricing API served a median of 11 milliseconds and a p99 of 38. Roughly every 70 seconds a handful of requests took 640 to 980 milliseconds, and a partner's integration started retrying those as timeouts. The memory graph explained it: a sawtooth climbing to about 2.6GB and dropping back, each drop lining up with the slow requests. The service allocated a large decoded payload per request, so each major collection had a lot to walk. Reusing one buffer cut those pauses to under 40 milliseconds, with no collector flags changed.\n\nFor most applications, tuning the collector is almost never the right first move. When a service shows periodic latency spikes that do not correlate with traffic, look at the memory graph before you look at the code. Sawtooth plus spikes means garbage collection; a staircase that only climbs means a leak. When an agent proposes GC flags, a bigger heap, or \"just give it more RAM\", treat that as a signal to ask what is being allocated on the hot path instead. The flag hides the symptom for a week. The allocation is the actual finding.",
  "he": "ניהול זיכרון אוטומטי מחליף באגים קטסטרופליים בהפתעות תזמון. לעולם לא תשחרר את אותו זיכרון פעמיים, ולעולם לא תקרא מצביע למשהו שכבר לא קיים. בתמורה, הראנטיים עוצר מדי פעם את התוכנית כדי לחשב מה עדיין נגיש, והוא בוחר את הרגע, לא אתה. לרוב המוצרים זו עסקה מצוינת. היא מפסיקה להיות כזו רק כשבקשה אחת אסור שתיעצר לחצי שנייה, וזה נדיר יותר משנוטים להניח.\n\nהפאוזה הזאת מופיעה כצורה בגרף ולא כשגיאה. API תמחור שירת חציון של 11 מילישניות ו-p99 של 38. בערך כל 70 שניות קומץ בקשות לקחו 640 עד 980 מילישניות, ואינטגרציה של שותף התחילה לנסות אותן שוב כטיים-אאוט. גרף הזיכרון הסביר: שיני מסור שמטפסות לסביבות 2.6GB ויורדות בחזרה, כל ירידה מתיישרת עם הבקשות האיטיות. השירות הקצה פיילוד מפוענח גדול לכל בקשה, אז לכל איסוף מלא היה הרבה על מה לעבור. שימוש חוזר בבאפר אחד הוריד את הפאוזות מתחת ל-40 מילישניות, בלי שינוי בדגלי ה-GC.\n\nלרוב האפליקציות, כוונון ה-GC כמעט אף פעם לא המהלך הראשון הנכון. כששירות מראה קפיצות לייטנסי מחזוריות שלא מתואמות לתעבורה, תסתכל על גרף הזיכרון לפני שאתה מסתכל על הקוד. שיני מסור עם קפיצות אומרות גרבג׳ קולקשן; מדרגות שרק עולות אומרות ליק. כשסוכן מציע דגלי GC, היפ גדול יותר, או ״פשוט תן לו יותר RAM״, תתייחס לזה כסימן לשאול מה מוקצה בנתיב החם במקום. הדגל מסתיר את הסימפטום לשבוע. ההקצאה היא הממצא האמיתי."
 },
 "Memory leak": {
