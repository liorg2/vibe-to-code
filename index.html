  "he": "אותו קוד חייב לרוץ בכל שלוש הסביבות, אז ההבדלים חיים בקונפיגורציה, לא בקוד. כתובת מסד הנתונים, כתובת הבסיס של ה-API, רמת הלוגים, איזה מפתח Stripe, האם מיילים באמת נשלחים — אלה ערכים שנקראים מהסביבה בעלייה, סט אחד לכל סביבה. זה הלב של רעיון ״12-factor app״: הבנייה לא יודעת כלום על איפה היא תרוץ. קובץ .env.development על הלפטופ שלך, משתנים שמוגדרים בלוח הבקרה ל-staging ולפרודקשן, והאפליקציה קוראת process.env או os.environ ולעולם לא שואלת באיזו סביבה היא נמצאת.\n\nהאנטי-פטרן הוא קוד שכן שואל: if (process.env.NODE_ENV === \"production\") { useRealMailer() } else { logToConsole() }. עכשיו ההתנהגות תלויה בהסתעפות שאף אחד לא מפעיל עד פרודקשן, סביבה שלישית לא מתאימה ל-if/else, ובדיקה לעולם לא יכולה לשחזר את הנתיב של פרודקשן. תחליף את ההסתעפות בערך: EMAIL_TRANSPORT הוא או smtp או log, והקוד פשוט משתמש במה שקיבל. ה-AI מושיט יד להסתעפות if-prod כל הזמן כי זו העריכה הקצרה ביותר; תבקש ממנו להפוך כל הסתעפות כזאת למשתנה קונפיגורציה עם ברירת מחדל מתועדת, ותשמור במאגר קובץ .env.example שמפרט כל משתנה שהאפליקציה קוראת, כדי שהסביבה הבאה — או הסוכן הבא — ידעו מה למלא."
 },
 "Secrets manager": {
  "en": "A secret is configuration that would hurt if it leaked: database passwords, API keys, signing keys, OAuth client secrets. A .env file is fine on a laptop and wrong for production: it sits on disk in plain text, gets copied into Docker images by accident, ends up in a chat message when someone \"shares the config\", and keeps no record of who read it or when it last changed. A secrets manager — AWS Secrets Manager, GCP Secret Manager, Doppler, Infisical, 1Password's developer tools, or the built-in stores in Vercel and GitHub Actions — is a database for these values with access control, an audit log and versioning.\n\nThe pattern is injection at runtime: the deploy pipeline or the running container asks the manager for its secrets and receives them as environment variables or a mounted file, so nothing sensitive lives in the repository, the image or the CI logs. It also makes rotation possible — changing a key on a schedule or right after a suspected leak — without a code change, and lets the same code receive different secrets in staging and production. If the AI generates a Dockerfile with COPY .env . or a GitHub workflow that echoes a variable, stop it there. And when a secret has been committed even once, rotate it immediately: git history is forever, and scanners read every public push within minutes of it landing.",
  "he": "סוד הוא קונפיגורציה שתכאב אם תדלוף: סיסמאות למסד הנתונים, מפתחות API, מפתחות חתימה, client secrets של OAuth. קובץ .env בסדר על לפטופ ולא נכון לפרודקשן: הוא יושב על הדיסק בטקסט גלוי, מועתק בטעות לאימג׳ים של Docker, מגיע להודעת צ׳אט כשמישהו ״משתף את הקונפיג״, ולא שומר שום תיעוד של מי קרא אותו או מתי הוא השתנה לאחרונה. מנהל סודות — AWS Secrets Manager, ‏GCP Secret Manager, ‏Doppler, ‏Infisical, כלי המפתחים של 1Password, או המחסנים המובנים ב-Vercel וב-GitHub Actions — הוא מסד נתונים לערכים האלה עם בקרת גישה, יומן ביקורת וגרסאות.\n\nהתבנית היא הזרקה בזמן ריצה: צינור הדיפלוי או הקונטיינר הרץ מבקש מהמנהל את הסודות שלו ומקבל אותם כמשתני סביבה או כקובץ מעוגן (mounted), כך ששום דבר רגיש לא חי במאגר, באימג׳ או בלוגי ה-CI. זה גם מאפשר רוטציה — החלפת מפתח לפי לוח זמנים או מיד אחרי חשד לדליפה — בלי שינוי קוד, ומאפשר לאותו קוד לקבל סודות שונים ב-staging ובפרודקשן. אם ה-AI מייצר Dockerfile עם COPY .env . או workflow של GitHub שעושה echo למשתנה, תעצור אותו שם. וכשסוד נכנס לקומיט אפילו פעם אחת, תחליף אותו מיידית: היסטוריית git היא לנצח, וסורקים קוראים כל push ציבורי תוך דקות מהרגע שהוא נחת."
 },
 "Build artifact & image tag": {
  "en": "An artifact is the output of a build: a Docker image, a zip of compiled code, a static bundle. The principle is build once, deploy the same bytes everywhere. You build on a CI server from a specific commit, get an image such as ghcr.io/acme/app:3f9c2ab, run that exact image in staging, test it, and then promote the same image to production. If you rebuild for production you have tested one thing and shipped another: a dependency may have moved, a base image may have updated overnight, the compiler may differ, and \"it passed staging\" becomes meaningless.\n\nThis only works if tags are immutable. Tag every image with the git SHA — or a version plus SHA — and never move a tag once it is pushed. The tag latest is the opposite: it means \"whatever was pushed most recently\", so two servers pulling latest ten minutes apart can run different code, rollback becomes guesswork, and nobody can say what is running in production right now. Pin your base images the same way (node:22.4-alpine, not node:latest) for the same reason. When you ask the AI for a deploy workflow, check what it tags with; the fix is a one-line change, and it is the line that makes rollback possible.",
  "he": "ארטיפקט הוא הפלט של בנייה: אימג׳ Docker, ‏zip של קוד מקומפל, באנדל סטטי. העיקרון הוא לבנות פעם אחת ולפרוס את אותם בייטים בכל מקום. אתה בונה על שרת CI מקומיט ספציפי, מקבל אימג׳ כמו ghcr.io/acme/app:3f9c2ab, מריץ את האימג׳ המדויק הזה ב-staging, בודק אותו, ואז מקדם את אותו אימג׳ לפרודקשן. אם אתה בונה מחדש לפרודקשן, בדקת דבר אחד ושלחת דבר אחר: תלות אולי זזה, אימג׳ בסיס אולי התעדכן בלילה, הקומפיילר אולי שונה, ו״זה עבר staging״ נהיה חסר משמעות.\n\nזה עובד רק אם התגים בלתי ניתנים לשינוי (immutable). תתייג כל אימג׳ עם ה-SHA של git — או גרסה ועוד SHA — ולעולם אל תזיז תג אחרי שנדחף. התג latest הוא ההפך: הוא אומר ״מה שנדחף לאחרונה״, אז שני שרתים שמושכים latest בהפרש של עשר דקות יכולים להריץ קוד שונה, rollback נהיה ניחוש, ואף אחד לא יכול לומר מה רץ בפרודקשן ברגע זה. תנעוץ את אימג׳י הבסיס שלך באותה דרך (node:22.4-alpine, לא node:latest) מאותה סיבה. כשאתה מבקש מה-AI ‏workflow של דיפלוי, תבדוק במה הוא מתייג; התיקון הוא שינוי של שורה אחת, וזו השורה שהופכת rollback לאפשרי."
 },
 "Preview deployment": {
  "en": "A preview deployment is a live, throwaway copy of your app built from a pull request and given its own URL — something like acme-git-fix-checkout-total.vercel.app. Vercel, Netlify, Cloudflare Pages and Render create them automatically for every PR; on Kubernetes teams build the same thing with a namespace per branch. The reviewer no longer has to read the diff, imagine it running, and take the author's word for it: they click the link, use the feature, resize the window to phone width, and comment on what they see. Designers, product people and clients can review too, without a laptop set up for development.\n\nPreviews also catch the class of bugs that never appears on a laptop: a missing environment variable at build time, a build that only works with your local node_modules, an import path with the wrong letter case. They need care in two places. Data: a preview should point at a staging or seeded database, never production, and a preview that runs migrations against a shared database can break every other preview. Secrets: previews built from forks by strangers must not receive real keys, and most platforms have a setting for exactly that. When an AI agent opens a PR for you, the preview URL is the fastest way to check its work without pulling the branch — open it before you read the diff.",
  "he": "פריסת preview היא עותק חי וזמני של האפליקציה שלך שנבנה מ-pull request ומקבל כתובת משלו — משהו כמו acme-git-fix-checkout-total.vercel.app. Vercel, Netlify, Cloudflare Pages ו-Render יוצרים אותם אוטומטית לכל PR; ב-Kubernetes צוותים בונים את אותו הדבר עם namespace לכל branch. המבקר כבר לא צריך לקרוא את ה-diff, לדמיין אותו רץ, ולסמוך על המילה של המחבר: הוא לוחץ על הקישור, משתמש בפיצ׳ר, מצר את החלון לרוחב טלפון, ומעיר על מה שהוא רואה. גם מעצבים, אנשי מוצר ולקוחות יכולים לבקר, בלי לפטופ שמוכן לפיתוח.\n\nPreviews גם תופסים את מחלקת הבאגים שלעולם לא מופיעה על לפטופ: משתנה סביבה שחסר בזמן הבנייה, בנייה שעובדת רק עם ה-node_modules המקומי שלך, נתיב import עם אות גדולה/קטנה שגויה. הם דורשים תשומת לב בשני מקומות. נתונים: preview צריך להצביע על מסד נתונים של staging או כזה שנזרע (seeded), לעולם לא פרודקשן, ו-preview שמריץ מיגרציות מול מסד נתונים משותף יכול לשבור כל preview אחר. סודות: previews שנבנו מ-forks של זרים לא צריכים לקבל מפתחות אמיתיים, ולרוב הפלטפורמות יש הגדרה בדיוק לזה. כשסוכן AI פותח PR בשבילך, כתובת ה-preview היא הדרך המהירה ביותר לבדוק את העבודה שלו בלי למשוך את ה-branch — תפתח אותה לפני שאתה קורא את ה-diff."
 },
 "Zero-downtime deploy": {
  "en": "The naive deploy is: stop the old version, start the new one. Between the two every request fails — for the 30 seconds a Node app takes to boot, or the five minutes a slow migration takes. Zero-downtime deploy means the old version keeps serving until the new one is proven ready. Rolling: start one new instance, wait until its health check passes, add it to the load balancer, remove one old instance, repeat. Blue-green: bring up a full copy of the new version beside the old, switch all traffic at once, and keep the old copy running for a quick switch back. Both are automatic on Vercel, Render, ECS and Kubernetes once configured.\n\nThe mechanism that makes it work is the health check: an endpoint such as /healthz that returns 200 only when the app is actually ready — connected to the database, migrations applied, caches warm. If it returns 200 the instant the process starts, the balancer sends traffic to an instance that cannot serve yet and users see errors anyway. And it requires two instances minimum: with one, there is nothing to serve while the replacement boots. Two consequences follow that surprise builders. For a minute or two old and new code run side by side, which is why schema changes must be backward compatible. And in-memory state on an instance is lost when it is replaced, which is why sessions and caches belong in Redis or the database, not in a variable.",
  "he": "הדיפלוי הנאיבית היא: לעצור את הגרסה הישנה, להפעיל את החדשה. בין השתיים כל בקשה נכשלת — במשך 30 השניות שלוקח לאפליקציית Node לעלות, או חמש הדקות שלוקחת מיגרציה איטית. דיפלוי בלי השבתה אומרת שהגרסה הישנה ממשיכה לשרת עד שהחדשה הוכחה כמוכנה. Rolling: מפעילים מופע חדש אחד, מחכים שבדיקת הבריאות שלו תעבור, מוסיפים אותו ל-load balancer, מסירים מופע ישן אחד, וחוזרים. Blue-green: מעלים עותק מלא של הגרסה החדשה לצד הישנה, מעבירים את כל התעבורה בבת אחת, ומשאירים את העותק הישן רץ למעבר מהיר בחזרה. שתיהן אוטומטיות ב-Vercel, Render, ECS ו-Kubernetes אחרי שהוגדרו.\n\nהמנגנון שגורם לזה לעבוד הוא בדיקת הבריאות: נקודת קצה כמו /healthz שמחזירה 200 רק כשהאפליקציה באמת מוכנה — מחוברת למסד הנתונים, מיגרציות הוחלו, המטמונים חמים. אם היא מחזירה 200 ברגע שהתהליך מתחיל, ה-balancer שולח תעבורה למופע שעדיין לא יכול לשרת, והמשתמשים רואים שגיאות בכל מקרה. וזה דורש מינימום שני מופעים: עם אחד, אין מה שישרת בזמן שהמחליף עולה. שתי תוצאות נובעות מזה ומפתיעות בונים. במשך דקה או שתיים קוד ישן וחדש רצים זה לצד זה, ולכן שינויי סכמה חייבים להיות תואמים לאחור. ומצב בזיכרון של מופע נאבד כשהוא מוחלף, ולכן sessions ומטמונים שייכים ל-Redis או למסד הנתונים, לא למשתנה."
 },
 "Rollback": {
  "en": "A rollback is putting the previous version back. Done right it is a single command or button — redeploy artifact 3f9c2ab — and it takes as long as a normal deploy, because the artifact already exists and already passed its tests. Vercel keeps every deployment and lets you promote an older one; Kubernetes has kubectl rollout undo; Render and Fly keep a release history. What matters is that you rehearse it. The first time you roll back should not be at 2am with customers waiting, discovering that the old image was garbage-collected or that the button needs a permission you do not have.\n\nThe thing that makes rollback hard is the database. Code is stateless and versioned; data is not. If version 2 renamed a column or dropped one, version 1 crashes the moment it is back, because the column it expects is gone. If version 2 wrote rows in a new format, version 1 misreads them. This is why schema changes follow the expand / contract pattern, and why \"roll forward\" — shipping a small fix on top — is sometimes the only real option. Rule of thumb before every deploy: ask \"if I roll this back in ten minutes, does the old code still work against this database?\" If the answer is no, split the change into a deploy that can be undone and a later one that cleans up.",
  "he": "Rollback הוא להחזיר את הגרסה הקודמת. כשעושים את זה נכון זו פקודה אחת או כפתור אחד — לפרוס מחדש את ארטיפקט 3f9c2ab — וזה לוקח כמו דיפלוי רגילה, כי הארטיפקט כבר קיים וכבר עבר את הבדיקות שלו. Vercel שומר כל דיפלוי ומאפשר לקדם אחת ישנה יותר; ל-Kubernetes יש kubectl rollout undo; ‏Render ו-Fly שומרים היסטוריית releases. מה שחשוב הוא שתתאמן על זה. הפעם הראשונה שאתה עושה rollback לא צריכה להיות בשתיים בלילה עם לקוחות שמחכים, כשאתה מגלה שהאימג׳ הישן נמחק בניקוי או שהכפתור דורש הרשאה שאין לך.\n\nמה שמקשה על rollback הוא מסד הנתונים. קוד הוא חסר מצב ומגורסן; נתונים לא. אם גרסה 2 שינתה שם של עמודה או מחקה אחת, גרסה 1 קורסת ברגע שהיא חוזרת, כי העמודה שהיא מצפה לה נעלמה. אם גרסה 2 כתבה שורות בפורמט חדש, גרסה 1 קוראת אותן לא נכון. לכן שינויי סכמה עוקבים אחרי תבנית expand / contract, ולכן ״roll forward״ — לשלוח תיקון קטן מעל — הוא לפעמים האפשרות האמיתית היחידה. כלל אצבע לפני כל דיפלוי: תשאל ״אם אחזיר את זה אחורה בעוד עשר דקות, הקוד הישן עדיין עובד מול מסד הנתונים הזה?״ אם התשובה היא לא, תפצל את השינוי לדיפלוי שאפשר לבטל ולאחת מאוחרת יותר שמנקה."
 },
 "Feature flag": {
  "en": "A feature flag is an if-statement whose condition is read from configuration at runtime rather than fixed in code: if flags.newCheckout show the new checkout, else the old one. That small mechanism separates two things normally welded together: deploying code and releasing a feature. You can merge and deploy the new checkout weeks before anyone sees it (shipping dark), turn it on for yourself in production, then for 5% of users, then for the one customer who asked, then for everyone — with no deploy in between. LaunchDarkly, Unleash, PostHog, Statsig and Vercel's flags all provide the dashboard; a JSON document in Redis is enough to start.\n\nThe second use is the kill switch. When the new checkout starts throwing errors at 3pm, you flip the flag off in ten seconds instead of rolling back a deploy that also contained six unrelated fixes. The cost is complexity: two code paths to test, and flags that outlive their purpose until nobody remembers what happens when they are off. Give every flag an owner and a removal date, delete it once it has been 100% on for a sprint, and never nest flags inside flags. For a builder working with an AI agent this is a natural fit: ask the agent to put any risky new behaviour behind a flag that defaults to off, so a bad merge is one configuration change away from harmless.",
  "he": "Feature flag הוא if שהתנאי שלו נקרא מקונפיגורציה בזמן ריצה במקום להיות קבוע בקוד: if flags.newCheckout תראה את הצ׳ק-אאוט החדש, אחרת את הישן. המנגנון הקטן הזה מפריד בין שני דברים שבדרך כלל מרותכים יחד: פריסת קוד ושחרור פיצ׳ר. אתה יכול למזג ולפרוס את הצ׳ק-אאוט החדש שבועות לפני שמישהו רואה אותו (shipping dark), להדליק אותו לעצמך בפרודקשן, אז ל-5% מהמשתמשים, אז ללקוח האחד שביקש, אז לכולם — בלי דיפלוי באמצע. LaunchDarkly, Unleash, PostHog, Statsig והדגלים של Vercel מספקים כולם את לוח הבקרה; מסמך JSON ב-Redis מספיק בשביל להתחיל.\n\nהשימוש השני הוא מתג החירום (kill switch). כשהצ׳ק-אאוט החדש מתחיל לזרוק שגיאות ב-15:00, אתה מכבה את הדגל בעשר שניות במקום לגלגל אחורה דיפלוי שהכילה גם שישה תיקונים לא קשורים. המחיר הוא מורכבות: שני נתיבי קוד לבדוק, ודגלים ששורדים מעבר למטרה שלהם עד שאף אחד לא זוכר מה קורה כשהם כבויים. תיתן לכל דגל בעלים ותאריך הסרה, תמחק אותו אחרי שהיה 100% דלוק במשך ספרינט, ולעולם אל תקנן דגלים בתוך דגלים. לבונה שעובד עם סוכן AI זה מתאים באופן טבעי: תבקש מהסוכן לשים כל התנהגות חדשה ומסוכנת מאחורי דגל שברירת המחדל שלו כבויה, כדי שמיזוג גרוע יהיה במרחק שינוי קונפיגורציה אחד מלהיות חסר נזק."
 },
 "Infrastructure as Code": {
  "en": "Click-ops is creating your cloud infrastructure by hand in the console: a database here, a security group there, a bucket with settings nobody wrote down. It works until you need a second environment, or the person who clicked leaves, or you wonder six months later why port 5432 is open. Infrastructure as Code means describing the infrastructure in files — Terraform or OpenTofu, Pulumi, AWS CDK, or the simpler app-level equivalents like fly.toml and render.yaml — and letting a tool create and update the real resources to match. The files live in the repo, go through pull requests, and are the documentation.\n\nThe payoff is repeatability: staging is production with a different variable file, a destroyed environment comes back in minutes, and every change shows a plan — \"1 to add, 2 to change, 0 to destroy\" — before it touches anything. Read that plan; a destroy on a database is a data-loss event, not a config change. This is also an area where an AI is unusually good. Describe \"a Postgres database in a private subnet, an ECS service with two tasks behind an ALB on 443, security groups allowing only what is needed\" and the Terraform it produces is close to right, because the language is declarative and the patterns are heavily documented. Review it against the firewall and VPC principles in the previous module rather than applying it blind.",
  "he": "Click-ops זה ליצור את תשתית הענן שלך ידנית בקונסולה: מסד נתונים כאן, security group שם, bucket עם הגדרות שאף אחד לא רשם. זה עובד עד שאתה צריך סביבה שנייה, או שהאדם שלחץ עוזב, או שאתה שואל את עצמך חצי שנה אחרי למה פורט 5432 פתוח. תשתית כקוד אומרת לתאר את התשתית בקבצים — Terraform או OpenTofu, ‏Pulumi, ‏AWS CDK, או המקבילים הפשוטים ברמת האפליקציה כמו fly.toml ו-render.yaml — ולתת לכלי ליצור ולעדכן את המשאבים האמיתיים כך שיתאימו. הקבצים חיים במאגר, עוברים דרך pull requests, והם התיעוד.\n\nהתמורה היא יכולת שחזור: staging הוא פרודקשן עם קובץ משתנים אחר, סביבה שנהרסה חוזרת תוך דקות, וכל שינוי מציג תוכנית — ״1 להוסיף, 2 לשנות, 0 להרוס״ — לפני שהוא נוגע בכלום. תקרא את התוכנית הזאת; destroy על מסד נתונים הוא אירוע של אובדן נתונים, לא שינוי קונפיגורציה. זה גם תחום שבו AI טוב באופן יוצא דופן. תתאר ״מסד נתונים Postgres בתת-רשת פרטית, שירות ECS עם שני tasks מאחורי ALB על 443, ‏security groups שמאפשרים רק את הנדרש״ וה-Terraform שהוא מייצר קרוב לנכון, כי השפה דקלרטיבית והתבניות מתועדות היטב. תבקר אותו מול עקרונות חומת האש וה-VPC מהמודול הקודם במקום להחיל אותו בעיניים עצומות."
 },
 "Expand / contract migration": {
  "en": "During a zero-downtime deploy, old and new code run at the same time against one database, and after a rollback old code runs against a database the new code already changed. Any schema change must therefore be compatible with both versions. Expand / contract is the pattern that makes this true. Expand: add the new column, table or index — nullable, unused — so old code ignores it. Migrate: deploy code that writes to both old and new, then backfill existing rows in batches. Switch: deploy code that reads from the new column. Contract: once no version in production touches the old column, drop it — in a later release, days or weeks after.\n\nThe step that violates this is the tempting one: RENAME COLUMN name TO full_name in a single migration. The instant it runs, every old instance still serving traffic crashes on a missing column, and rollback is impossible without a second migration written under pressure. The same applies to changing a type, adding NOT NULL without a default, and dropping anything. Watch locking too: ALTER TABLE on a large table can block every write for minutes in some databases, so add indexes CONCURRENTLY in Postgres and backfill in chunks of a few thousand rows. When the AI writes a migration, ask for it in expand and contract halves, and ship the contract half only after the new code has been stable in production for a while.",
  "he": "במהלך דיפלוי בלי השבתה, קוד ישן וחדש רצים באותו זמן מול מסד נתונים אחד, ואחרי rollback קוד ישן רץ מול מסד נתונים שהקוד החדש כבר שינה. כל שינוי סכמה חייב לכן להיות תואם לשתי הגרסאות. Expand / contract היא התבנית שמבטיחה את זה. Expand: להוסיף את העמודה, הטבלה או האינדקס החדשים — nullable, לא בשימוש — כך שקוד ישן מתעלם מהם. Migrate: לפרוס קוד שכותב גם לישן וגם לחדש, ואז למלא לאחור (backfill) שורות קיימות בקבוצות. Switch: לפרוס קוד שקורא מהעמודה החדשה. Contract: כששום גרסה בפרודקשן לא נוגעת יותר בעמודה הישנה, למחוק אותה — ב-release מאוחר יותר, ימים או שבועות אחרי.\n\nהצעד שמפר את זה הוא המפתה: RENAME COLUMN name TO full_name במיגרציה אחת. ברגע שהיא רצה, כל מופע ישן שעדיין משרת תעבורה קורס על עמודה חסרה, ו-rollback בלתי אפשרי בלי מיגרציה שנייה שנכתבת תחת לחץ. אותו הדבר נכון לשינוי טיפוס, להוספת NOT NULL בלי ברירת מחדל, ולמחיקה של כל דבר. תשים לב גם לנעילות: ALTER TABLE על טבלה גדולה יכול לחסום כל כתיבה במשך דקות בחלק ממסדי הנתונים, אז תוסיף אינדקסים עם CONCURRENTLY ב-Postgres ותמלא לאחור בחתיכות של כמה אלפי שורות. כשה-AI כותב מיגרציה, תבקש אותה בשני חצאים — expand ו-contract — ותשלח את חצי ה-contract רק אחרי שהקוד החדש היה יציב בפרודקשן זמן מה."
 },
 "Structured logs": {
  "en": "A log line written as prose — \"User 42 failed to check out: card declined\" — is readable once and useless at scale. You cannot filter to one user, count failures per hour, or join the line to the request that caused it without regular expressions that break the next time someone rewords the message. Structured logging replaces the sentence with a record: a JSON object per line, with a fixed set of fields. level, ts, msg, request_id, user_id, and whatever the event needs. Your log platform (Datadog, Grafana Loki, CloudWatch, Axiom) indexes those fields, and \"every error for request abc123 in the last hour\" becomes a two-second query.\n\nThree rules make it useful. First, levels mean something: debug is for you locally, info is normal operation, warn is odd but handled, error is somebody should look. Second, every line carries the request id, so one request's story can be pulled out of a million interleaved lines. Third, never log secrets or personal data — tokens, passwords, full card numbers, emails in bulk — because logs are copied, retained and read by more people and tools than your database ever will be. Ask the AI for one shared logger module and forbid raw console.log in the codebase.",
  "he": "שורת לוג שכתובה כפרוזה — ״משתמש 42 נכשל בתשלום: הכרטיס נדחה״ — קריאה פעם אחת וחסרת תועלת בקנה מידה. אי אפשר לסנן למשתמש אחד, לספור כשלים לשעה, או לחבר את השורה לבקשה שגרמה לה בלי ביטויים רגולריים שנשברים בפעם הבאה שמישהו מנסח את ההודעה מחדש. לוגים מובנים מחליפים את המשפט ברשומה: אובייקט JSON לכל שורה, עם קבוצת שדות קבועה. level, ts, msg, request_id, user_id, וכל מה שהאירוע צריך. פלטפורמת הלוגים שלך (Datadog, Grafana Loki, CloudWatch, Axiom) מאנדקסת את השדות האלה, ו״כל שגיאה עבור בקשה abc123 בשעה האחרונה״ הופכת לשאילתה של שתי שניות.\n\nשלושה כללים עושים את זה שימושי. ראשית, לרמות יש משמעות: debug בשבילך מקומית, info זה פעולה רגילה, warn זה מוזר אבל מטופל, error זה שמישהו צריך להסתכל. שנית, כל שורה נושאת את מזהה הבקשה, כך שאפשר למשוך את הסיפור של בקשה אחת מתוך מיליון שורות משורגות. שלישית, לעולם לא לרשום סודות או מידע אישי — טוקנים, סיסמאות, מספרי כרטיס מלאים, מיילים בכמויות — כי לוגים מועתקים, נשמרים ונקראים על ידי יותר אנשים וכלים ממה שמסד הנתונים שלך אי פעם יהיה. תבקש מה-AI מודול לוגר משותף אחד ותאסור console.log גולמי בקוד."
 },
 "Metrics": {
  "en": "A metric is a number with a name and a timestamp, sampled over and over: http_requests_total, queue_depth, request_duration_seconds. Three shapes cover almost everything. A counter only goes up (requests served, errors thrown) and you graph its rate. A gauge goes up and down (active connections, memory in use) and you graph its value. A histogram buckets durations so you can ask \"what did the slowest 1% of users experience?\" Unlike logs, metrics cost the same whether you serve ten requests or ten million, which is why they are the backbone of every dashboard and alert.\n\nIf you instrument nothing else, instrument the four golden signals from Google's SRE book: latency (how long requests take), traffic (how many), errors (how many fail), saturation (how full the system is — CPU, connections, queue). And read latency as percentiles, never as an average. A p50 of 120ms means half your users are fine; a p99 of 6 seconds means one in a hundred is waiting six seconds, and on a page with ten API calls that is most users, most visits. Prometheus with Grafana is the open-source standard; Datadog and the cloud providers' own tools do the same with less setup.",
  "he": "מטריקה היא מספר עם שם וחותמת זמן, שנדגם שוב ושוב: http_requests_total, queue_depth, request_duration_seconds. שלוש צורות מכסות כמעט הכל. מונה רק עולה (בקשות שהוגשו, שגיאות שנזרקו) ואתה מצייר את הקצב שלו. מד עולה ויורד (חיבורים פעילים, זיכרון בשימוש) ואתה מצייר את הערך שלו. היסטוגרמה מחלקת משכי זמן לדליים כדי שתוכל לשאול ״מה חווה האחוז האיטי ביותר של המשתמשים?״ בניגוד ללוגים, מטריקות עולות אותו דבר בין אם אתה מגיש עשר בקשות או עשרה מיליון, ולכן הן עמוד השדרה של כל דשבורד והתראה.\n\nאם אתה לא מודד שום דבר אחר, תמדוד את ארבעת האותות המוזהבים מספר ה-SRE של גוגל: השהיה (כמה זמן בקשות לוקחות), תעבורה (כמה), שגיאות (כמה נכשלות), רוויה (כמה המערכת מלאה — CPU, חיבורים, תור). ותקרא השהיה כאחוזונים, לעולם לא כממוצע. p50 של 120ms אומר שחצי מהמשתמשים בסדר; p99 של 6 שניות אומר שאחד ממאה מחכה שש שניות, ובדף עם עשר קריאות API זה רוב המשתמשים, ברוב הביקורים. Prometheus עם Grafana הוא התקן בקוד פתוח; Datadog והכלים של ספקי הענן עושים אותו דבר עם פחות התקנה."
 },
 "Tracing & correlation id": {
  "en": "One user request rarely stays in one place. It hits your API, which calls the database twice, calls Stripe, drops a message on a queue, and a worker picks that up a second later and sends an email. When the user says \"checkout was slow\", the evidence is scattered across five processes and four log streams. A correlation id fixes the scattering: generate a random id at the very first hop, put it in a header, pass it to every downstream call and every queued job, and write it on every log line. Now one search reconstructs the whole story in order.\n\nDistributed tracing takes the same idea further. Each step — a handler, a query, an outbound call — becomes a span with a start time, duration and parent, and the collection of spans for one request is a trace, drawn as a waterfall in Jaeger, Tempo, Honeycomb or Datadog APM. The picture answers the question logs cannot: where did the time go? The 1.8-second checkout turns out to be 40ms of your code and one 1.7-second query with a missing index. OpenTelemetry is the vendor-neutral standard; most web frameworks have an auto-instrumentation package that produces useful traces with almost no code, and the AI can wire it in an hour.",
  "he": "בקשה אחת של משתמש כמעט לעולם לא נשארת במקום אחד. היא פוגעת ב-API שלך, שקורא למסד הנתונים פעמיים, קורא ל-Stripe, מפיל הודעה על תור, ו-worker אוסף אותה שנייה אחר כך ושולח מייל. כשהמשתמש אומר ״התשלום היה איטי״, הראיות מפוזרות על פני חמישה תהליכים וארבעה זרמי לוגים. מזהה קורלציה מתקן את הפיזור: תייצר מזהה אקראי בקפיצה הראשונה, תשים אותו בכותרת, תעביר אותו לכל קריאה במורד הזרם ולכל משימה בתור, ותכתוב אותו על כל שורת לוג. עכשיו חיפוש אחד משחזר את כל הסיפור לפי הסדר.\n\nטרייסינג מבוזר לוקח את אותו רעיון רחוק יותר. כל צעד — מטפל, שאילתה, קריאה יוצאת — הופך ל-span עם זמן התחלה, משך והורה, ואוסף ה-spans של בקשה אחת הוא טרייס, שמצויר כמפל ב-Jaeger, Tempo, Honeycomb או Datadog APM. התמונה עונה על השאלה שלוגים לא יכולים: לאן הלך הזמן? התשלום של 1.8 שניות מתברר כ-40ms של הקוד שלך ושאילתה אחת של 1.7 שניות עם אינדקס חסר. OpenTelemetry הוא התקן הנייטרלי לספקים; לרוב פריימוורקי הווב יש חבילת auto-instrumentation שמייצרת טרייסים שימושיים כמעט בלי קוד, וה-AI יכול לחווט אותה בשעה."
 },
 "Alert": {
  "en": "A dashboard only helps if someone is looking at it. An alert is the rule that looks for you: when this metric crosses this threshold for this long, notify this person through this channel. \"5xx rate above 2% for five minutes → page on-call\" is an alert. The important words are for five minutes — a single bad second is noise — and page: an alert that lands in a Slack channel nobody reads is not an alert, it is a log with better formatting. Tools like Grafana Alerting, Datadog Monitors and PagerDuty handle the routing; the hard part is deciding what deserves to wake you.\n\nThe rule that saves you from yourself: alert on symptoms, not causes. Users do not feel CPU at 85%; they feel errors and slowness. A CPU alert fires on a busy but healthy night and stays silent when a bug returns 500s at low load. So alert on the golden signals — error rate, latency percentile, saturation of the one resource that actually stops requests — and let causes be things you look up once the alert fires. Every alert that goes off and needs no action is a withdrawal from your attention: after a dozen, you mute it, and the thirteenth one is real. Delete or fix noisy alerts the same week they appear.",
  "he": "דשבורד עוזר רק אם מישהו מסתכל עליו. התראה היא החוק שמסתכל בשבילך: כשהמטריקה הזאת חוצה את הסף הזה למשך הזמן הזה, תודיע לאדם הזה דרך הערוץ הזה. ״שיעור 5xx מעל 2% במשך חמש דקות ← להקפיץ את התורן״ זו התראה. המילים החשובות הן במשך חמש דקות — שנייה רעה אחת היא רעש — ולהקפיץ: התראה שנוחתת בערוץ Slack שאף אחד לא קורא היא לא התראה, היא לוג עם עיצוב יותר יפה. כלים כמו Grafana Alerting, Datadog Monitors ו-PagerDuty מטפלים בניתוב; החלק הקשה הוא להחליט מה ראוי להעיר אותך.\n\nהכלל שמציל אותך מעצמך: תתריע על סימפטומים, לא על סיבות. משתמשים לא מרגישים CPU ב-85%; הם מרגישים שגיאות ואיטיות. התראת CPU נורית בלילה עמוס אבל בריא ושותקת כשבאג מחזיר 500 בעומס נמוך. אז תתריע על האותות המוזהבים — שיעור שגיאות, אחוזון השהיה, רוויה של המשאב האחד שבאמת עוצר בקשות — ותשאיר את הסיבות לדברים שאתה מחפש אחרי שההתראה נורית. כל התראה שנורית ולא דורשת פעולה היא משיכה מתשומת הלב שלך: אחרי תריסר, אתה משתיק אותה, והשלוש-עשרה אמיתית. תמחק או תתקן התראות רועשות באותו שבוע שהן מופיעות."
 },
 "Error tracking": {
  "en": "Exceptions in production do not print to a terminal you are watching. They vanish into a log file or, in the browser, into a user's console you will never see. An error tracker — Sentry is the default; Bugsnag, Rollbar and Datadog Error Tracking do the same — is an SDK that catches every unhandled exception, on the server and in the browser, and ships it with everything you need: the full stack trace mapped to your source, the release version, the browser and OS, which user was logged in, and breadcrumbs — the last twenty clicks, navigations and network calls before it blew up.\n\nThe feature that changes how you work is grouping. Ten thousand occurrences of the same TypeError become one issue with a counter, a first-seen and last-seen time, and a list of affected users. That turns \"there are errors\" into decisions: this one hit 340 users since the 14:02 deploy, roll back; that one hit one user on a browser from 2019, ignore. Mark an issue resolved and Sentry reopens it if it regresses in a later release. Setup is a few lines and a DSN in your environment; connect it to your deploys so each error is tagged with the version that introduced it. For a solo builder this is the single highest-value observability tool.",
  "he": "חריגות בפרודקשן לא מודפסות לטרמינל שאתה צופה בו. הן נעלמות לתוך קובץ לוג, או בדפדפן — לתוך קונסולה של משתמש שלעולם לא תראה. כלי מעקב שגיאות — Sentry הוא ברירת המחדל; Bugsnag, Rollbar ו-Datadog Error Tracking עושים אותו דבר — הוא SDK שתופס כל חריגה לא מטופלת, בשרת ובדפדפן, ושולח אותה עם כל מה שאתה צריך: ה-stack trace המלא ממופה לקוד המקור שלך, גרסת השחרור, הדפדפן ומערכת ההפעלה, איזה משתמש היה מחובר, ו-breadcrumbs — עשרים הלחיצות, הניווטים וקריאות הרשת האחרונות לפני שזה התפוצץ.\n\nהפיצ׳ר שמשנה את איך שאתה עובד הוא הקיבוץ. עשרת אלפים מופעים של אותו TypeError הופכים ל-issue אחד עם מונה, זמן ״נראה לראשונה״ ו״נראה לאחרונה״, ורשימת משתמשים שנפגעו. זה הופך את ״יש שגיאות״ להחלטות: זה פגע ב-340 משתמשים מאז הדיפלוי של 14:02 — לעשות rollback; זה פגע במשתמש אחד עם דפדפן מ-2019 — להתעלם. תסמן issue כפתור, ו-Sentry יפתח אותו מחדש אם הוא יחזור בשחרור מאוחר יותר. ההתקנה היא כמה שורות ו-DSN במשתני הסביבה; תחבר אותה לדיפלויים שלך כדי שכל שגיאה תתויג בגרסה שהציגה אותה. לבונה יחיד זה כלי התצפית בעל הערך הגבוה ביותר."
 },
 "Dashboard": {
  "en": "A dashboard is the screen you open when someone asks \"is it down?\" and you need an answer in ten seconds. That purpose dictates its contents. Top row: the golden signals for your main service — request rate, error rate, p50 and p99 latency — over the last hour and the last day, side by side so you can see what normal looks like. Below: saturation of whatever runs out first (database connections, queue depth, memory), and a marker on every graph for each deploy, because \"it broke at 14:02\" and \"we deployed at 14:01\" is a diagnosis. Grafana, Datadog and the cloud consoles all do this; the tool matters less than the discipline.\n\nWhat does not belong is everything that makes you feel good rather than tells you something. Total sign-ups, lifetime revenue and a world map of visitors are vanity metrics: they only go up, so they never signal a problem. Neither do forty panels — if you have to scroll, you cannot see the answer at a glance, and the one graph that mattered is on page three. A good test: could a friend with no context open this and tell you whether the site is healthy? Keep it to one screen and one link, pin the link where you will find it in a panic, and add a panel only when an incident showed you were missing it.",
  "he": "דשבורד הוא המסך שאתה פותח כשמישהו שואל ״זה נפל?״ ואתה צריך תשובה בעשר שניות. המטרה הזאת מכתיבה את התוכן שלו. שורה עליונה: האותות המוזהבים של השירות המרכזי שלך — קצב בקשות, שיעור שגיאות, השהיית p50 ו-p99 — על השעה האחרונה ועל היממה האחרונה, זה לצד זה, כדי שתראה איך ״נורמלי״ נראה. מתחת: רוויה של מה שנגמר ראשון (חיבורים למסד הנתונים, עומק התור, זיכרון), וסימון על כל גרף לכל דיפלוי, כי ״זה נשבר ב-14:02״ ו״פרסנו ב-14:01״ זו אבחנה. Grafana, Datadog וקונסולות הענן כולן עושות את זה; הכלי חשוב פחות מהמשמעת.\n\nמה שלא שייך הוא כל דבר שגורם לך להרגיש טוב במקום לספר לך משהו. סך ההרשמות, ההכנסות המצטברות ומפת עולם של מבקרים הן מטריקות יוקרה: הן רק עולות, אז הן לעולם לא מאותתות על בעיה. גם לא ארבעים פאנלים — אם צריך לגלול, אי אפשר לראות את התשובה במבט, והגרף האחד שהיה חשוב נמצא בעמוד שלוש. מבחן טוב: האם חבר בלי הקשר יכול לפתוח את זה ולהגיד לך אם האתר בריא? תשמור על מסך אחד וקישור אחד, תנעץ את הקישור איפה שתמצא אותו בפאניקה, ותוסיף פאנל רק כשתקרית הראתה לך שהוא היה חסר."
 },
 "SLO & error budget": {
  "en": "\"The site should be reliable\" is not a target anyone can act on. An SLO — service level objective — makes it a number: 99.9% of requests return successfully in under 500ms, measured over a rolling 30 days. Choosing the number is the real work. 99% allows 7 hours of failure a month; 99.9% allows 43 minutes; 99.99% allows 4 minutes and 20 seconds, and reaching it costs multiples of the engineering. For most products a customer will happily pay for, 99.9% is plenty, and your dependencies — Vercel, Supabase, Stripe — set a ceiling anyway.\n\nThe error budget is the SLO seen from the other side: the 0.1% you are allowed to fail. It is a spending account, and it settles an argument every team has. Budget mostly intact this month? Ship the risky migration, try the new provider, deploy on Friday. Budget burned by two incidents already? Freeze features and spend the sprint on the flaky job and the missing alert. For a solo builder the value is the same: it replaces a feeling of dread with a number you can check. Datadog, Grafana and Google Cloud all have SLO views that draw the burn-down for you once you name the metric.",
  "he": "״האתר צריך להיות אמין״ זה לא יעד שמישהו יכול לפעול לפיו. SLO — יעד רמת שירות — הופך אותו למספר: 99.9% מהבקשות חוזרות בהצלחה בפחות מ-500ms, נמדד על פני 30 ימים מתגלגלים. בחירת המספר היא העבודה האמיתית. 99% מאפשר 7 שעות של כשל בחודש; 99.9% מאפשר 43 דקות; 99.99% מאפשר 4 דקות ו-20 שניות, ולהגיע אליו עולה כפולות של ההנדסה. לרוב המוצרים שלקוח ישמח לשלם עליהם, 99.9% זה בשפע, והתלויות שלך — Vercel, Supabase, Stripe — קובעות תקרה בכל מקרה.\n\nתקציב השגיאות הוא ה-SLO מהצד השני: ה-0.1% שמותר לך להיכשל. זה חשבון הוצאות, והוא מסדר ויכוח שיש לכל צוות. התקציב בעיקרו שלם החודש? תשחרר את המיגרציה המסוכנת, תנסה את הספק החדש, תפרוס ביום שישי. התקציב נשרף כבר בשתי תקריות? תקפיא פיצ׳רים ותבזבז את הספרינט על המשימה הרעועה ועל ההתראה החסרה. לבונה יחיד הערך זהה: זה מחליף תחושת חרדה במספר שאפשר לבדוק. ל-Datadog, Grafana ו-Google Cloud כולם יש תצוגות SLO שמציירות לך את שריפת התקציב ברגע שאתה מציין את המטריקה."
 },
 "Health check & uptime monitor": {
  "en": "A health check is an endpoint — conventionally /health or /healthz — whose only job is to answer \"can this instance serve traffic?\" It comes in two depths. A shallow check returns 200 if the process is up and can respond; it is cheap and is what a load balancer or Kubernetes polls every few seconds to decide whether to send requests to this copy or restart it. A deep check also touches the dependencies — a SELECT 1 on the database, a ping to Redis — and reports which one is broken. Deep checks are for you and your monitor, not for the load balancer: if the database blips, you do not want every instance declared dead at once.\n\nNone of this helps if the problem is that nobody can reach your server at all — DNS expired, the cloud region is down, the certificate lapsed. Your own dashboard runs inside the same blast radius. An uptime monitor is an external service (UptimeRobot, Better Stack, Pingdom, Checkly) that requests your health endpoint from several places on the internet every minute and messages you when it fails twice in a row. The free tiers are enough for a small product, setup takes five minutes, and it is the one monitor that catches the whole class of \"everything is fine from where I am standing\" failures.",
  "he": "בדיקת תקינות היא נקודת קצה — לפי המוסכמה /health או /healthz — שכל תפקידה לענות ״האם המופע הזה יכול להגיש תעבורה?״ היא באה בשני עומקים. בדיקה רדודה מחזירה 200 אם התהליך למעלה ויכול להגיב; היא זולה, וזה מה ש-load balancer או Kubernetes שואלים כל כמה שניות כדי להחליט אם לשלוח בקשות לעותק הזה או לאתחל אותו. בדיקה עמוקה נוגעת גם בתלויות — SELECT 1 על מסד הנתונים, פינג ל-Redis — ומדווחת מה מהם שבור. בדיקות עמוקות הן בשבילך ובשביל המוניטור שלך, לא בשביל ה-load balancer: אם מסד הנתונים מהבהב, אתה לא רוצה שכל המופעים יוכרזו מתים בבת אחת.\n\nשום דבר מזה לא עוזר אם הבעיה היא שאף אחד לא יכול להגיע לשרת שלך בכלל — ה-DNS פג, אזור הענן נפל, התעודה פקעה. הדשבורד שלך רץ בתוך אותו רדיוס פגיעה. מוניטור זמינות הוא שירות חיצוני (UptimeRobot, Better Stack, Pingdom, Checkly) שמבקש את נקודת התקינות שלך מכמה מקומות באינטרנט כל דקה ושולח לך הודעה כשהיא נכשלת פעמיים ברצף. הרבדים החינמיים מספיקים למוצר קטן, ההתקנה לוקחת חמש דקות, וזה המוניטור האחד שתופס את כל המחלקה של כשלי ״הכל בסדר מאיפה שאני עומד״."
 },
 "Postmortem": {
  "en": "An incident ends when the site is back. A postmortem is what makes it worth having had: a short document, written within a few days, that records what happened and what changes. The skeleton is fixed. Timeline: when it started, when you noticed, what you tried, when it was fixed — with clock times, because \"noticed after 40 minutes\" is itself a finding. Impact: how many users, for how long, what they saw. Root cause: not the first thing that broke but the reason it could break — the migration ran without a backup, the alert did not exist. Action items: specific, owned, with a ticket each.\n\nThe word that matters is blameless. The engineer who ran the migration is not the root cause; a system that let one person run an irreversible migration on production with no confirmation is. Blame produces hiding, and hidden incidents repeat. So the fix is never \"be more careful\" — it is a process or a tool change: a backup step in the deploy script, a required health check, an alert on the metric that would have caught it. Working alone you still have a team: yourself in three months, who will make the same mistake without the note. Keep the postmortems in the repo under docs/postmortems, one file each, dated.",
  "he": "תקרית נגמרת כשהאתר חוזר. פוסטמורטם הוא מה שהופך אותה לכזאת שהיה שווה לעבור: מסמך קצר, שנכתב בתוך כמה ימים, שמתעד מה קרה ומה משתנה. השלד קבוע. ציר זמן: מתי זה התחיל, מתי שמת לב, מה ניסית, מתי זה תוקן — עם שעות, כי ״שמתי לב אחרי 40 דקות״ הוא בעצמו ממצא. השפעה: כמה משתמשים, כמה זמן, מה הם ראו. סיבת השורש: לא הדבר הראשון שנשבר אלא הסיבה שהוא יכול היה להישבר — המיגרציה רצה בלי גיבוי, ההתראה לא הייתה קיימת. פריטי פעולה: ספציפיים, עם בעלים, עם טיקט לכל אחד.\n\nהמילה שחשובה היא בלי האשמות. המהנדס שהריץ את המיגרציה הוא לא סיבת השורש; מערכת שאפשרה לאדם אחד להריץ מיגרציה בלתי הפיכה על פרודקשן בלי אישור — כן. האשמה מייצרת הסתרה, ותקריות מוסתרות חוזרות. אז התיקון הוא לעולם לא ״להיות יותר זהיר״ — הוא שינוי בתהליך או בכלי: צעד גיבוי בסקריפט הדיפלוי, בדיקת תקינות נדרשת, התראה על המטריקה שהייתה תופסת את זה. כשאתה עובד לבד עדיין יש לך צוות: אתה בעוד שלושה חודשים, שיעשה את אותה טעות בלי הפתק. תשמור את הפוסטמורטמים במאגר תחת docs/postmortems, קובץ לכל אחד, מתוארך."
 }
};

<script>
/* ---- state ---- */
const KEY = "vibe2code.v2";
const LS = { get: k => { try { return localStorage.getItem(k) } catch { return null } },
             set: (k, v) => { try { localStorage.setItem(k, v) } catch {} } };
let lang   = LS.get(KEY + ".lang")  || "en";
let theme  = LS.get(KEY + ".theme") || "dark";
let done   = new Set(JSON.parse(LS.get(KEY + ".done")  || "[]"));
let ticked = new Set(JSON.parse(LS.get(KEY + ".check") || "[]"));
let filter = "";
let answers = {};                                 // quiz answers for the open module
let card = 0, flipped = false;                    // flashcard review state

const $    = s => document.querySelector(s);
const tid  = (m, i) => m.id + ":" + i;
const esc  = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const t    = k => UI[k][lang];
const total = () => MODULES.reduce((n, m) => n + m.terms.length, 0);
const mins  = m => Math.max(3, Math.round(m.terms.length * 1.6));
const para  = s => s.split("\n\n").map(p => `<p>${esc(p)}</p>`).join("");
const byId  = id => MODULES.find(m => m.id === id);

function save() {
  LS.set(KEY + ".done", JSON.stringify([...done]));
  LS.set(KEY + ".check", JSON.stringify([...ticked]));
  LS.set(KEY + ".lang", lang);
  LS.set(KEY + ".theme", theme);
  if (window.cloudSave) window.cloudSave(window.vibeState.read());
}

// read/write hooks for auth.js; absent config, nothing ever calls them
window.vibeState = {
  read: () => ({ done: [...done], ticked: [...ticked] }),
  write: s => { done = new Set(s.done || []); ticked = new Set(s.ticked || []); save(); render(); }
};

/* ---- routing: #/  #/<mod>  #/<mod>/<termIndex>  #/project  #/checklist
                 #/glossary  #/review  #/architectures  #/architectures/<id> ---- */
const route = () => {
  const p = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  return { id: p[0] || "", sub: p[1], n: p[1] !== undefined ? parseInt(p[1], 10) : null };
};

const PAGES = { project: PROJECT, checklist: CHECKLIST, architectures: ARCHITECTURES };

/* ---- pieces ---- */
const termCard = (m, i, tm) => `
  <a class="term ${done.has(tid(m, i)) ? "done" : ""}" href="#/${m.id}/${i}" data-k="${tid(m, i)}">
    <button class="chk" title="${esc(t("got"))}">&#10003;</button>
    <h4>${esc(tm.t[lang])}</h4>
    <p>${esc(tm.d[lang])}</p>
    <div class="more">${esc(t("open"))} &rarr;</div>
  </a>`;

const modHead = (m, mi) => {
  const d = m.terms.filter((_, i) => done.has(tid(m, i))).length;
  return `<div class="mhead">
    <div class="ic">${m.icon}</div>
    <div><h2>${String(mi + 1).padStart(2, "0")}. ${esc(m.title[lang])}</h2></div>
    <div class="n">${d}/${m.terms.length} ${esc(t("terms"))}<br>~${mins(m)} ${esc(t("min"))}</div>
  </div>
  <p class="mblurb">${esc(m.blurb[lang])}</p>`;
};

const promptBox = (id, text, label) => `
  <div class="promptbox">
    <div class="lbl">${esc(label)}</div>
    <button class="btn copy" data-copy="${id}">${esc(t("copy"))}</button>
    <pre class="code" id="p${id}">${esc(text)}</pre>
  </div>`;

function quizHtml(modId) {
  const qs = QUIZ[modId]; if (!qs) return "";
  const got = qs.filter((_, i) => answers[i] === qs[i].c).length;
  const answered = qs.filter((_, i) => answers[i] !== undefined).length;
  return `<div class="quiz">
    <h3>${esc(t("test"))}</h3>
    <p class="sub">${esc(t("testSub"))}</p>
    ${qs.map((q, qi) => {
      const pick = answers[qi];
      return `<div class="q">
        <div class="qt"><i>${qi + 1}.</i>${esc(q.q[lang])}</div>
        ${q.a.map((a, ai) => {
          let cls = "", mk = "";
          if (pick !== undefined) {
            if (ai === q.c) { cls = "right"; mk = "&#10003;"; }
            else if (ai === pick) { cls = "wrong"; mk = "&times;"; }
          }
          return `<button class="opt ${cls}" data-q="${qi}" data-a="${ai}"
            ${pick !== undefined ? "disabled" : ""}>
            <span class="mk">${mk}</span>${esc(a[lang])}</button>`;
        }).join("")}
        ${pick !== undefined ? `<div class="ans">${esc(q.why[lang])}</div>` : ""}
      </div>`;
    }).join("")}
    ${answered === qs.length
      ? `<div class="score ${got === qs.length ? "pass" : ""}">${got} / ${qs.length}${
          got === qs.length ? " &mdash; " + esc(t("perfect")) : ""}</div>`
      : ""}
  </div>`;
}

/* ---- pages ---- */
function homePage() {

    { m: PROJECT,       sub: t("capstone") },

    <div class="phead"><h3>${esc(t("paths"))}</h3><p>${esc(t("pathsSub"))}</p></div>

      const mods = p.mods.map(id => byId(id) || PAGES[id]).filter(Boolean);
      const terms = mods.reduce((n, m) => n + (m.terms ? m.terms.length : 0), 0);

      return `<a class="path" href="#/${p.mods[0]}">
        <div class="row"><span class="ic">${p.icon}</span><h4>${esc(p.title[lang])}</h4></div>

        <div class="mini"><i style="width:${terms ? d / terms * 100 : 0}%"></i></div>
      </a>`;
    }).join("")}</div>
  </section>`;

  return paths + `<div class="cards">${MODULES.map((m, i) => {
    const d = m.terms.filter((_, j) => done.has(tid(m, j))).length;
    return `<a class="mcard" href="#/${m.id}">
      <div class="row"><div class="ic">${m.icon}</div>
        <div><div class="num">${esc(t("lesson"))} ${String(i + 1).padStart(2, "0")} &middot; ~${mins(m)} ${esc(t("min"))}</div>
        <h3>${esc(m.title[lang])}</h3></div></div>
      <p>${esc(m.blurb[lang])}</p>
      <div class="mini"><i style="width:${d / m.terms.length * 100}%"></i></div>
      <span class="cnt">${d}/${m.terms.length} ${esc(t("terms"))}</span>
    </a>`;
  }).join("") + extra.map(({ m, sub }) => `
    <a class="mcard special" href="#/${m.id}">
      <div class="row"><div class="ic">${m.icon}</div>
        <div><div class="num">${esc(sub)}</div><h3>${esc(m.title[lang])}</h3></div></div>
      <p>${esc(m.blurb[lang])}</p>
    </a>`).join("")}</div>`;
}

function modulePage(m, mi) {
  const prev = MODULES[mi - 1], next = MODULES[mi + 1];
  const nextLink = next ? `#/${next.id}` : `#/architectures`;

function slidePage(m, mi, i) {

      <summary>${esc(t("askAI"))}</summary>

function projectPage() {
  const P = PROJECT;
  return `<a class="crumb" href="#/">${esc(t("backHome"))}</a>
    <section class="mod">
      <div class="mhead"><div class="ic">${P.icon}</div><div><h2>${esc(P.title[lang])}</h2></div>
        <div class="n">${P.steps.length} ${esc(t("steps"))}</div></div>
      <p class="mblurb">${esc(P.blurb[lang])}</p>
    </section>
    <div class="note">&#9888; ${esc(P.warn[lang])}</div>
    ${P.steps.map(s => `
      <div class="step">
        <div class="top"><div class="no">${s.n}</div><h3>${esc(s.title[lang])}</h3></div>
        <p class="goal"><b>${esc(t("goal"))}:</b> ${esc(s.goal[lang])}</p>
        <p class="whyp">${esc(s.why[lang])}</p>
        <div class="tags">${s.uses.map(u => {
          const loc = findTerm(u);
          return loc ? `<a href="#/${loc.m.id}/${loc.i}">${esc(loc.m.terms[loc.i].t[lang])}</a>` : "";
        }).join("")}</div>
        ${promptBox(s.n, s.prompt, t("prompt"))}
      </div>`).join("")}
    <div class="pager"><a class="nx" href="#/checklist"><b>${esc(t("next"))}</b><span>${esc(CHECKLIST.title[lang])}</span></a></div>`;
}

function archPage(id) {
  const A = ARCHITECTURES;
  if (!A || !A.items) return "";
  if (id) {
    const a = A.items.find(x => x.id === id);
    if (a) return archDetail(a, A.items.indexOf(a));
  }
  return `<a class="crumb" href="#/">${esc(t("backHome"))}</a>
    <section class="mod">
      <div class="mhead"><div class="ic">${A.icon}</div><div><h2>${esc(A.title[lang])}</h2></div>
        <div class="n">${A.items.length}</div></div>
      <p class="mblurb">${esc(A.blurb[lang])}</p>
    </section>
    <div class="cards">${A.items.map((a, i) => `
      <a class="mcard" href="#/architectures/${a.id}">
        <div class="row"><div class="ic">${i + 1}</div>
          <div><div class="num">${esc(a.tag[lang])}</div><h3>${esc(a.title[lang])}</h3></div></div>
        <pre class="code mini-dia">${esc(a.diagram)}</pre>
      </a>`).join("")}</div>`;
}

function archDetail(a, i) {
  const A = ARCHITECTURES, next = A.items[i + 1];
  const box = (k, cls) => `<div class="abox ${cls}"><b>${esc(t(k[0]))}</b><p>${esc(a[k[1]][lang])}</p></div>`;
  return `<a class="crumb" href="#/architectures">&larr; ${esc(A.title[lang])}</a>
  <article class="slide arch">
    <div class="kicker">${String(i + 1).padStart(2, "0")} ${esc(A.title[lang])} &middot; ${esc(a.tag[lang])}</div>
    <h2>${esc(a.title[lang])}</h2>
    <pre class="code dia">${esc(a.diagram)}</pre>
    <h3>${esc(t("archFlow"))}</h3>
    <div class="body"><p>${esc(a.flow[lang])}</p></div>
    <h3>${esc(t("archParts"))}</h3>
    <div class="parts">${a.parts.map(p => `
      <div class="part"><b>${esc(p.n[lang])}</b><p>${esc(p.d[lang])}</p></div>`).join("")}</div>
    <div class="aboxes">
      ${box(["archGood", "good"], "ok")}
      ${box(["archBad", "bad"], "no")}
      ${box(["archCost", "cost"], "")}
      ${box(["archScale", "scale"], "")}
    </div>
    <div class="tags">${a.uses.map(u => {
      const loc = findTerm(u);
      return loc ? `<a href="#/${loc.m.id}/${loc.i}">${esc(loc.m.terms[loc.i].t[lang])}</a>` : "";
    }).join("")}</div>
    ${promptBox("arch", a.prompt, t("archPrompt"))}
    <div class="pager">
      ${next ? `<a class="nx" href="#/architectures/${next.id}"><b>${esc(t("next"))}</b><span>${esc(next.title[lang])}</span></a>` : ""}
    </div>
  </article>`;
}

function glossaryPage() {
  const all = [];
  MODULES.forEach(m => m.terms.forEach((tm, i) => all.push({ m, i, tm })));
  all.sort((a, b) => a.tm.t[lang].localeCompare(b.tm.t[lang], lang === "he" ? "he" : "en"));
  const groups = {};
  all.forEach(x => { const k = x.tm.t[lang][0].toUpperCase(); (groups[k] ||= []).push(x); });
  return `<a class="crumb" href="#/">${esc(t("backHome"))}</a>
    <section class="mod">
      <div class="mhead"><div class="ic">&#9776;</div><div><h2>${esc(t("glossary"))}</h2></div>
        <div class="n">${all.length} ${esc(t("terms"))}</div></div>
      <p class="mblurb">${esc(t("glossarySub"))}</p>
    </section>
    <div class="gloss">${Object.keys(groups).map(k => `
      <div class="gl"><h4>${esc(k)}</h4>
        ${groups[k].map(({ m, i, tm }) => `
          <a href="#/${m.id}/${i}" class="${done.has(tid(m, i)) ? "done" : ""}">
            <span>${esc(tm.t[lang])}</span><i>${esc(m.title[lang])}</i></a>`).join("")}
      </div>`).join("")}</div>`;
}

function reviewPage() {
  const pool = [];
  MODULES.forEach(m => m.terms.forEach((tm, i) => {
    if (!done.has(tid(m, i))) pool.push({ m, i, tm });
  }));
  const all = pool.length ? pool : (() => {
    const a = []; MODULES.forEach(m => m.terms.forEach((tm, i) => a.push({ m, i, tm }))); return a;
  })();
  if (card >= all.length) card = 0;
  const { m, i, tm } = all[card];
  return `<a class="crumb" href="#/">${esc(t("backHome"))}</a>
    <section class="mod">
      <div class="mhead"><div class="ic">&#9850;</div><div><h2>${esc(t("review"))}</h2></div>
        <div class="n">${all.length - card} ${esc(t("left"))}</div></div>
      <p class="mblurb">${esc(pool.length ? t("reviewSub") : t("reviewAll"))}</p>
    </section>
    <div class="flash ${flipped ? "on" : ""}" id="flash">
      <div class="fk">${esc(m.title[lang])}</div>
      <h2>${esc(tm.t[lang])}</h2>
      ${flipped
        ? `<div class="fb"><p>${esc(tm.d[lang])}</p><p class="w">${esc(tm.w[lang])}</p></div>`
        : `<div class="fhint">${esc(t("tapToFlip"))}</div>`}
    </div>
    <div class="fbar">
      <button class="btn" id="fSkip">${esc(t("skip"))} &rarr;</button>
      <span class="grow"></span>
      <a class="btn" href="#/${m.id}/${i}">${esc(t("openSlide"))}</a>
      <button class="btn prim" id="fGot" data-k="${tid(m, i)}">&#10003; ${esc(t("got"))}</button>
    </div>`;
}

function checklistPage() {
  const C = CHECKLIST;
  const item = (x, k, no) => `<div class="ci">
      <label>${no ? `<span class="x">&times;</span>` : `<input type="checkbox" data-ck="${k}" ${ticked.has(k) ? "checked" : ""}>`}
        <span>${esc(x.t[lang])}</span></label>
      <p>${esc(x.d[lang])}</p></div>`;
  const okDone = C.do.filter((_, i) => ticked.has("do:" + i)).length;
  return `<a class="crumb" href="#/">${esc(t("backHome"))}</a>
    <section class="mod">
      <div class="mhead"><div class="ic">${C.icon}</div><div><h2>${esc(C.title[lang])}</h2></div>
        <div class="n">${okDone}/${C.do.length}</div></div>
      <p class="mblurb">${esc(C.blurb[lang])}</p>
    </section>
    <div class="cols">
      <div class="col ok"><h3>&#10003; ${esc(t("doThis"))}</h3>
        <p class="sub">${esc(t("doSub"))}</p>
        ${C.do.map((x, i) => item(x, "do:" + i, false)).join("")}</div>
      <div class="col no"><h3>&times; ${esc(t("neverThis"))}</h3>
        <p class="sub">${esc(t("neverSub"))}</p>
        ${C.dont.map((x, i) => item(x, "no:" + i, true)).join("")}</div>
    </div>`;
}

function findTerm(nameEn) {
  for (const m of MODULES) {
    const i = m.terms.findIndex(x => x.t.en === nameEn);
    if (i >= 0) return { m, i };
  }
  return null;
}

/* ---- render ---- */
function render() {
  const rtl = lang === "he";
  document.body.dir = rtl ? "rtl" : "ltr";
  document.documentElement.lang = lang;
  document.documentElement.dataset.theme = theme;

  $("#brand").textContent = t("brand");
  $("#intro").textContent = `${MODULES.length} ${t("modules")} · ${total()} ${t("terms")} · ${t("noCode")}`;
  $("#h1").innerHTML = rtl ? "מ<span>Vibe</span> למפתח" : "From <span>vibe</span> to developer";
  $("#tagline").textContent  = t("tagline");
  $("#heroNote").textContent = t("heroNote");
  $("#startBtn").textContent = t("start");
  $("#resetBtn").textContent = t("reset");
  $("#navTitle").textContent = t("modules");
  $("#search").placeholder   = t("search");
  document.querySelectorAll(".seg button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));

  const q = filter.trim().toLowerCase();
  const { id, sub, n } = route();
  const mi = MODULES.findIndex(m => m.id === id);
  const special = ["project", "checklist", "architectures", "glossary", "review"];
  const home = mi < 0 && !q && !special.includes(id);

  document.querySelector(".hero").style.display = home ? "" : "none";

  const navLink = (p, icon, label, cnt) =>
    `<a href="#/${p}" class="${p === id && !q ? "on" : ""}"><span class="ic">${icon}</span>
      <span>${esc(label)}</span>${cnt ? `<span class="cnt">${cnt}</span>` : ""}</a>`;

  $("#nav").innerHTML =
    navLink("", "&#9635;", t("allMods"), `${done.size}/${total()}`) +
    MODULES.map(m => {
      const d = m.terms.filter((_, i) => done.has(tid(m, i))).length;
      return `<a href="#/${m.id}" class="${m.id === id && !q ? "on" : ""}"><span class="ic">${m.icon}</span>
        <span>${esc(m.title[lang])}</span><span class="cnt">${d}/${m.terms.length}</span></a>`;
    }).join("") +
    `<hr>` +
    [PROJECT, ARCHITECTURES, CHECKLIST].filter(p => p && p.id)
      .map(p => navLink(p.id, p.icon, p.title[lang])).join("") +
    navLink("glossary", "&#9776;", t("glossary")) +
    navLink("review", "&#9850;", t("review"));

  if (q) {
    const hit = tm => (tm.t.en + tm.t.he + tm.d[lang] + tm.w[lang]).toLowerCase().includes(q);
    const secs = MODULES.map((m, i) => {
      const hits = m.terms.map((tm, j) => ({ tm, j })).filter(({ tm }) => hit(tm));
      return hits.length
        ? `<section class="mod">${modHead(m, i)}<div class="grid">${
            hits.map(({ tm, j }) => termCard(m, j, tm)).join("")}</div></section>` : "";
    }).join("");
    $("#content").innerHTML = secs || `<div class="empty">${esc(t("noResults"))}</div>`;
  }
  else if (id === "project")       { $("#content").innerHTML = projectPage(); }
  else if (id === "checklist")     { $("#content").innerHTML = checklistPage(); }
  else if (id === "architectures") { $("#content").innerHTML = archPage(sub); }
  else if (id === "glossary")      { $("#content").innerHTML = glossaryPage(); }
  else if (id === "review")        { $("#content").innerHTML = reviewPage(); }
  else if (home)                   { $("#content").innerHTML = homePage(); }
  else if (n !== null && !isNaN(n) && MODULES[mi].terms[n]) {
                                     $("#content").innerHTML = slidePage(MODULES[mi], mi, n); }
  else                             { $("#content").innerHTML = modulePage(MODULES[mi], mi); }

  $("#pbar").style.width = (done.size / total() * 100) + "%";
}

/* ---- events ---- */
$("#content").addEventListener("click", e => {
  const chk = e.target.closest(".chk");
  if (chk) {                                   // tick from a card, without navigating
    e.preventDefault(); e.stopPropagation();
    const k = chk.closest(".term").dataset.k;
    done.has(k) ? done.delete(k) : done.add(k);
    save(); render(); return;
  }
  const got = e.target.closest("#gotBtn");
  if (got) {
    const k = got.dataset.k;
    done.has(k) ? done.delete(k) : done.add(k);
    save(); render(); return;
  }
  const flash = e.target.closest("#flash");
  if (flash) { flipped = !flipped; render(); return; }

  const fGot = e.target.closest("#fGot");
  if (fGot) { done.add(fGot.dataset.k); flipped = false; save(); render(); return; }

  const fSkip = e.target.closest("#fSkip");
  if (fSkip) { card++; flipped = false; render(); return; }

  const opt = e.target.closest(".opt");
  if (opt) { answers[+opt.dataset.q] = +opt.dataset.a; render(); return; }

  const cp = e.target.closest(".copy");
  if (cp) {
    const txt = document.getElementById("p" + cp.dataset.copy).textContent;
    navigator.clipboard.writeText(txt)
      .then(() => { cp.textContent = t("copied"); setTimeout(() => (cp.textContent = t("copy")), 1400); })
      .catch(() => { cp.textContent = t("copyFail"); });
  }
});

$("#content").addEventListener("change", e => {
  const ck = e.target.closest("[data-ck]"); if (!ck) return;
  const k = ck.dataset.ck;
  ck.checked ? ticked.add(k) : ticked.delete(k);
  save(); render();
});

document.querySelectorAll(".seg button").forEach(b =>
  b.onclick = () => { lang = b.dataset.lang; save(); render(); });

$("#theme").onclick    = () => { theme = theme === "dark" ? "light" : "dark"; save(); render(); };
$("#startBtn").onclick = () => { location.hash = "#/" + MODULES[0].id; };
$("#resetBtn").onclick = () => { done.clear(); ticked.clear(); answers = {}; save(); render(); };
$("#search").oninput   = e => { filter = e.target.value; render(); };

// arrow keys move between slides; space flips a flashcard
addEventListener("keydown", e => {
  if (e.target.matches("input,textarea")) return;
  const { id, n } = route();
  if (id === "review") {
    if (e.key === " ")     { e.preventDefault(); flipped = !flipped; render(); }
    if (e.key === "ArrowRight") { card++; flipped = false; render(); }
    return;
  }
  if (n === null || isNaN(n)) return;
  const m = byId(id); if (!m) return;
  const fwd = lang === "he" ? "ArrowLeft" : "ArrowRight";
  const bwd = lang === "he" ? "ArrowRight" : "ArrowLeft";
  if (e.key === fwd && n < m.terms.length - 1) location.hash = `#/${id}/${n + 1}`;
  if (e.key === bwd && n > 0)                  location.hash = `#/${id}/${n - 1}`;
});

addEventListener("hashchange", () => {
  const prev = route().id;
  filter = ""; $("#search").value = "";
  if (prev !== hashMod) { answers = {}; hashMod = prev; }   // reset quiz when leaving a module
  render(); scrollTo(0, 0);
});
let hashMod = route().id;

render();

</script>
<script type="module" src="auth.js"></script>
</body>
</html>
