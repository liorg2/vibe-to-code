  "en": "Injection is what happens when data the user supplied gets treated as instructions. The mechanism is always the same shape: you build a command — SQL, a shell line, an HTML fragment, an LDAP filter — by gluing strings together, and somewhere inside that string sits text a stranger wrote. The engine on the other end has no way to tell which characters came from you and which came from them, so it executes all of it. The fix is also always the same shape: send the command and the data on separate channels, so the data can never be parsed as syntax.\n\nPut yourself at the keyboard of the attacker. A support page looks up an order by email, and the query is assembled with the email pasted into the middle of it. Into that field they type ' OR '1'='1' -- and the WHERE clause becomes trivially true, so the page returns every order in the table. Once that works they escalate: ' UNION SELECT email, password_hash FROM users -- reuses your own endpoint to print the user table into your nicely formatted results list. No tooling, no exploit kit, just characters in a text box. The same idea with a filename becomes a deleted directory; with a comment body it becomes a script running in every reader's browser.\n\nTwo defences, and they are not interchangeable. Parameterized queries — placeholders with the values passed alongside — make injection structurally impossible in the database, and there is no case where string concatenation is the right choice. Validation is the second layer: check at the edge, with a schema, that qty is a positive integer under 100 and email looks like an email, and reject with a 400 before any logic sees it. Client-side checks are user experience; anyone can skip your form and post directly. And this is the review AI code needs most, because when you ask for dynamic filters or sorting, a template string is exactly what it will reach for.",
  "he": "הזרקה היא מה שקורה כשנתון שהמשתמש סיפק מטופל כהוראה. המנגנון תמיד באותה צורה: אתה בונה פקודה — SQL, שורת שֶׁל, קטע HTML, מסנן LDAP — על ידי הדבקת מחרוזות זו לזו, ואיפשהו בתוך המחרוזת הזאת יושב טקסט שזר כתב. למנוע בצד השני אין דרך להבחין אילו תווים הגיעו ממך ואילו מהם, אז הוא מריץ את הכל. התיקון גם הוא תמיד באותה צורה: לשלוח את הפקודה ואת הנתון בערוצים נפרדים, כך שהנתון לעולם לא ייקרא כתחביר.\n\nתשים את עצמך במקלדת של התוקף. דף תמיכה מחפש הזמנה לפי אימייל, והשאילתה מורכבת כשהאימייל מודבק לתוכה. בשדה הזה הוא מקליד ' OR '1'='1' -- וסעיף ה-WHERE הופך לנכון תמיד, אז הדף מחזיר את כל ההזמנות בטבלה. ברגע שזה עובד הוא מסלים: ' UNION SELECT email, password_hash FROM users -- מנצל את נקודת הקצה שלך עצמה כדי להדפיס את טבלת המשתמשים לתוך רשימת התוצאות המעוצבת יפה שלך. בלי כלים, בלי ערכת פריצה, רק תווים בתיבת טקסט. אותו רעיון עם שם קובץ הופך לתיקייה שנמחקה; עם גוף תגובה הוא הופך לסקריפט שרץ בדפדפן של כל קורא.\n\nשתי הגנות, והן לא מחליפות זו את זו. שאילתות עם פרמטרים — מצייני מקום כשהערכים מועברים בנפרד — הופכות הזרקה לבלתי אפשרית מבנית במסד, ואין מקרה שבו שרשור מחרוזות הוא הבחירה הנכונה. אימות הוא השכבה השנייה: לבדוק בקצה, עם סכמה, ש-qty הוא מספר שלם חיובי מתחת ל-100 ושהאימייל נראה כמו אימייל, ולדחות עם 400 לפני שהלוגיקה בכלל רואה את זה. בדיקות בצד הלקוח הן חוויית משתמש; כל אחד יכול לדלג על הטופס שלך ולשלוח ישירות. וזאת הביקורת שקוד של AI הכי זקוק לה, כי כשאתה מבקש סינון או מיון דינמי, מחרוזת תבנית היא בדיוק מה שהוא יושיט אליה יד."
 },
 "The cloud": {
  "en": "The cloud is a rental agreement with a meter attached. Nothing about it is magical: the machines are real, they sit in a warehouse in Dublin or Virginia, and a technician racked them. What changed is the unit of purchase. You buy a minute of a machine instead of a machine, and you order it through an API instead of a purchase order. That turns capacity from a procurement decision that took six weeks into one line of configuration, which is genuinely transformative. It also turns every line of configuration into a recurring cost, which is the part nobody plans for. Capacity you never use still runs, and the meter does not care whether a single person visited your site.\n\nA two-person team put a demo API behind a managed load balancer, with a NAT gateway so the private subnet could reach the internet, and a small Postgres. They budgeted for the compute: fourteen dollars a month, and the compute really was fourteen dollars. The first invoice was three hundred and forty. The load balancer bills about eighteen dollars a month whether anyone calls it or not. The NAT gateway bills a flat thirty-three plus four and a half cents per gigabyte processed, and a nightly sync job was pushing four hundred gigabytes out to a third-party API. A GPU instance left running after a weekend experiment added five hundred dollars the following month at roughly a dollar an hour. Nothing was hacked. Everything they created was still there, doing exactly what they had asked for.\n\nAn agent will cheerfully provision infrastructure it learned from a tutorial written by someone with a corporate budget, and it will not mention the monthly cost, because nothing in the code says what anything costs. The question to ask before you apply anything is: what does this bill if zero users show up? Set a billing alert on day one, before the first deploy, not after the first invoice. And when you delete an experiment, delete it in the console, service by service — the compute is the cheap part, and the things left behind are never the things you remember creating.",
  "he": "הענן הוא הסכם שכירות עם מונה. אין בו שום דבר קסום: המכונות אמיתיות, הן יושבות במחסן בדבלין או בווירג׳יניה, וטכנאי הרכיב אותן במדף. מה שהשתנה זו יחידת הקנייה. אתה קונה דקה של מכונה במקום מכונה, ומזמין אותה דרך API במקום דרך הזמנת רכש. זה הופך קיבולת מהחלטת רכש שלקחה שישה שבועות לשורת קונפיגורציה אחת, וזה באמת משנה הכל. זה גם הופך כל שורת קונפיגורציה לעלות חוזרת, וזה החלק שאף אחד לא מתכנן. קיבולת שלא השתמשת בה עדיין רצה, ולמונה לא אכפת אם בן אדם אחד נכנס לאתר.\n\nצוות של שניים שם API של דמו מאחורי מאזן עומסים מנוהל, עם NAT gateway כדי שהרשת הפרטית תגיע לאינטרנט, ועוד Postgres קטן. הם תקצבו את הקומפיוט: ארבעה עשר דולר בחודש, והקומפיוט באמת עלה ארבעה עשר דולר. החשבונית הראשונה הייתה שלוש מאות וארבעים. מאזן העומסים מחייב בערך שמונה עשר דולר בחודש בין אם קוראים לו ובין אם לא. ה-NAT gateway מחייב שלושים ושלושה דולר קבועים ועוד ארבע וחצי סנט לכל ג׳יגה שעובר, וג׳וב סנכרון לילי דחף ארבע מאות ג׳יגה החוצה ל-API חיצוני. מכונת GPU שנשארה דולקת אחרי ניסוי של סוף שבוע הוסיפה חמש מאות דולר בחודש שאחרי, בערך דולר לשעה. אף אחד לא נפרץ. כל מה שהם יצרו עדיין היה שם, ועשה בדיוק את מה שביקשו ממנו.\n\nסוכן AI ירים לך בשמחה תשתית שלמד מטוטוריאל שכתב מישהו עם תקציב של חברה, והוא לא יזכיר את העלות החודשית, כי שום דבר בקוד לא אומר כמה משהו עולה. השאלה לשאול לפני שאתה מריץ apply היא: כמה זה מחייב אם אפס משתמשים יגיעו? תגדיר התראת חיוב ביום הראשון, לפני הדיפלוי הראשון, לא אחרי החשבונית הראשונה. וכשאתה מוחק ניסוי, תמחק אותו בקונסולה, שירות אחרי שירות — הקומפיוט הוא החלק הזול, והדברים שנשארים מאחור הם אף פעם לא הדברים שאתה זוכר שיצרת."
 },
 "AWS / Azure / GCP": {
  "en": "All three sell the same six things: compute, storage, network, a managed database, identity, and a queue. Everything else in their console is one of those six with a marketing name on it. The differences that matter are not technical capability, they are naming, the shape of the pricing, and which managed services are actually good rather than merely present. Learning the primitives transfers between providers in an afternoon. Learning one provider's console does not transfer at all, and it is also the thing that takes six months. This is why experienced people sound bored about the provider question: they are choosing between three vendors of the same commodity, and they know the interesting decisions are elsewhere.\n\nA solo founder building a scheduling app spent eleven days on AWS getting a VPC, subnets, security groups, an IAM role, a task definition and a load balancer into a state where a container could serve traffic. The same app went live on Fly.io in about nine minutes with one command, and on Railway by connecting the repository. Two years and forty thousand users later it is still on that platform, costing around sixty dollars a month. The eleven days bought nothing except a vocabulary he could have learned later. The reverse case is real too: a team with compliance requirements, an existing enterprise agreement and a data-residency clause had no choice, and the eleven days were the job.\n\nAI agents were trained on a decade of AWS blog posts, so they reach for AWS reflexively and produce Terraform for a landing page. The useful counter-question is: what is the smallest host that serves this, and what would force me off it? For most projects the answer is a platform-as-a-service, and the forcing function is usually a specific managed service or a compliance requirement, not scale. Pick the boring host, keep your app in a container, and the migration you may never need stays cheap.",
  "he": "שלושתם מוכרים את אותם שישה דברים: קומפיוט, אחסון, רשת, מסד נתונים מנוהל, זהות, ותור. כל השאר בקונסולה שלהם הוא אחד מהשישה האלה עם שם שיווקי. ההבדלים שחשובים הם לא יכולת טכנית, אלא שמות, צורת התמחור, ואילו שירותים מנוהלים באמת טובים ולא רק קיימים. ללמוד את אבני הבסיס עובר בין ספקים תוך אחר צהריים. ללמוד את הקונסולה של ספק מסוים לא עובר בכלל, וזה גם מה שלוקח חצי שנה. בגלל זה אנשים מנוסים נשמעים משועממים משאלת הספק: הם בוחרים בין שלושה ספקים של אותה סחורה, והם יודעים שההחלטות המעניינות נמצאות במקום אחר.\n\nיזם סולו שבנה אפליקציית תיאום פגישות בילה אחד עשר ימים ב-AWS כדי להביא VPC, סאבנטים, security groups, תפקיד IAM, task definition ומאזן עומסים למצב שבו קונטיינר מצליח לשרת תעבורה. אותה אפליקציה עלתה לאוויר ב-Fly.io בתשע דקות בערך עם פקודה אחת, וב-Railway פשוט בחיבור הריפו. שנתיים וארבעים אלף משתמשים אחר כך היא עדיין שם, ועולה בערך שישים דולר בחודש. אחד עשר הימים לא קנו כלום חוץ מאוצר מילים שאפשר היה ללמוד אחר כך. גם המקרה ההפוך אמיתי: לצוות עם דרישות רגולציה, הסכם ארגוני קיים וסעיף מקום אחסון נתונים לא הייתה ברירה, ואחד עשר הימים היו בדיוק העבודה.\n\nסוכני AI אומנו על עשור של פוסטים מהבלוג של AWS, אז הם הולכים ל-AWS ברפלקס ומייצרים לך Terraform בשביל דף נחיתה. שאלת הנגד המועילה היא: מה ההוסטינג הכי קטן שמשרת את זה, ומה יכריח אותי לעזוב אותו? לרוב הפרויקטים התשובה היא פלטפורמה מנוהלת, ומה שמכריח לעזוב הוא בדרך כלל שירות מנוהל מסוים או דרישת רגולציה, לא סקייל. תבחר את ההוסטינג המשעמם, תשמור את האפליקציה בקונטיינר, וההגירה שאולי לעולם לא תצטרך נשארת זולה."
 },
 "S3 / object storage": {
  "en": "Object storage gives up everything a filesystem promises — folders you can rename, partial edits, locking, a path that means something — and gets back three things in exchange: capacity with no practical ceiling, durability measured in eleven nines, and a URL for every item. There are no directories. The slashes in a key are characters in a name, not a tree. You cannot append to an object or change byte four hundred of it; you replace the whole thing. Once you accept that it is a key-value store whose values happen to be files, the whole model stops being surprising and the mistakes stop being mysterious.\n\nA marketplace let sellers upload product photos and wrote them to the server's local disk, serving them from a static folder. It worked perfectly for four months. Then traffic grew, a second instance came up behind a load balancer, and roughly half of all image requests started returning 404, because each instance only had the photos uploaded to itself. The fix looked simple and was not: eighteen thousand images had to be copied off two disks, deduplicated, and re-pointed. Worse, the previous deploy had already destroyed the first instance's disk, so around nine hundred images from the earliest months were gone with no backup. The whole incident traced back to one line choosing a local path.\n\nThe pattern to insist on with an agent is that the browser uploads directly to storage using a short-lived presigned URL, and your server only ever stores the key. If you see code where the file passes through your API, ask what happens to a 200MB video on a container with 512MB of memory. Then check two settings that AI-generated bucket configs get wrong constantly: the bucket must not be publicly listable, and a lifecycle rule should expire whatever does not need to live forever. Storage is cheap per gigabyte and you are going to keep it for years.",
  "he": "אחסון אובייקטים מוותר על כל מה שמערכת קבצים מבטיחה — תיקיות שאפשר לשנות להן שם, עריכה חלקית, נעילה, נתיב שיש לו משמעות — ומקבל בתמורה שלושה דברים: קיבולת בלי תקרה מעשית, עמידות שנמדדת באחת עשרה תשיעיות, וכתובת URL לכל פריט. אין תיקיות. הלוכסנים במפתח הם תווים בשם, לא עץ. אי אפשר להוסיף לסוף אובייקט או לשנות בו את בייט ארבע מאות; מחליפים את כולו. ברגע שמקבלים שזה מאגר מפתח-ערך שהערכים שלו במקרה הם קבצים, המודל מפסיק להפתיע והטעויות מפסיקות להיות מסתוריות.\n\nמרקטפלייס אפשר למוכרים להעלות תמונות מוצר, וכתב אותן לדיסק המקומי של השרת והגיש אותן מתיקייה סטטית. זה עבד מצוין ארבעה חודשים. ואז התעבורה גדלה, אינסטנס שני עלה מאחורי מאזן עומסים, ובערך חצי מהבקשות לתמונות התחילו להחזיר 404, כי לכל אינסטנס היו רק התמונות שהועלו אליו. התיקון נראה פשוט ולא היה: שמונה עשר אלף תמונות היו צריכות לעבור משני דיסקים, לעבור ניכוי כפילויות, ולקבל הפניה מחדש. גרוע מזה, הדיפלוי הקודם כבר השמיד את הדיסק של האינסטנס הראשון, אז בערך תשע מאות תמונות מהחודשים הראשונים נעלמו בלי גיבוי. כל האירוע התחקה לשורה אחת שבחרה נתיב מקומי.\n\nהדפוס שכדאי להתעקש עליו מול סוכן AI הוא שהדפדפן מעלה ישירות לאחסון עם presigned URL קצר-טווח, והשרת שלך שומר רק את המפתח. אם אתה רואה קוד שבו הקובץ עובר דרך ה-API שלך, תשאל מה קורה לווידאו של 200MB על קונטיינר עם 512MB זיכרון. ואז תבדוק שתי הגדרות שקונפיגורציות באקט שנוצרו על ידי AI טועות בהן כל הזמן: אסור שיהיה אפשר להציג את רשימת הקבצים בבאקט באופן ציבורי, וצריך כלל lifecycle שמוחק את מה שלא צריך לחיות לנצח. אחסון זול לג׳יגה ואתה הולך לשמור אותו שנים."
 },
 "EC2 / VM vs Lambda / serverless": {
  "en": "The real question is who owns the idle time. On a virtual machine you rent the box, and every second nobody is using it is a second you paid for. With serverless the provider owns the box, packs many customers onto it, and charges you per invocation and per gigabyte-second of memory while your code is actually running. That is the whole difference, and every other property follows from it: the cold start exists because the provider is allowed to put your function to sleep, and the predictable latency of a VM exists because nobody is allowed to put it to sleep.\n\nA webhook receiver handling about thirty thousand calls a month costs somewhere near twenty cents on Lambda and would cost fifteen to thirty dollars on the smallest always-on instance. That is a hundredfold difference and the choice is obvious. Now change one number: an image-processing endpoint doing two million invocations a month at two seconds and 1GB each is roughly sixty-seven dollars of duration plus four of requests, while a single well-used small instance handling the same steady load runs around thirty. The crossover is not about scale, it is about the shape of the traffic. Spiky and mostly idle favours serverless; steady and constant favours a machine. The other trap is state: a colleague's Lambda held a database connection per instance, and a traffic spike opened nine hundred connections against a Postgres configured for a hundred, taking down an application that had nothing to do with the spike.\n\nAgents default to whichever pattern dominated their training data and rarely flag the constraints. Before accepting serverless, ask three things: how long can a single execution run, does anything here need a filesystem or a long-lived connection, and what is the p99 including a cold start. If the answer involves a background job that runs for four minutes, a WebSocket, or a connection pool, you want a machine — or at least a connection proxy in front of the database.",
  "he": "השאלה האמיתית היא של מי זמן הסרק. במכונה וירטואלית אתה שוכר את הקופסה, וכל שנייה שאף אחד לא משתמש בה היא שנייה ששילמת עליה. בסרברלס הספק הוא בעל הקופסה, דוחס עליה הרבה לקוחות, ומחייב אותך לפי קריאה ולפי ג׳יגה-שנייה של זיכרון בזמן שהקוד שלך באמת רץ. זה כל ההבדל, וכל תכונה אחרת נגזרת ממנו: הקולד-סטארט (cold start) קיים כי לספק מותר להרדים את הפונקציה שלך, וההשהיה הצפויה של מכונה וירטואלית קיימת כי לאף אחד לא מותר להרדים אותה.\n\nמקלט webhook שמטפל בערך בשלושים אלף קריאות בחודש עולה משהו כמו עשרים סנט ב-Lambda, והיה עולה חמישה עשר עד שלושים דולר על האינסטנס הקטן ביותר שרץ תמיד. זה פי מאה וההחלטה ברורה. עכשיו תשנה מספר אחד: נקודת קצה לעיבוד תמונות עם שני מיליון קריאות בחודש, שתי שניות ו-1GB לכל אחת, היא בערך שישים ושבעה דולר של זמן ריצה ועוד ארבעה של בקשות, בעוד שאינסטנס קטן אחד מנוצל היטב שמטפל באותו עומס קבוע עולה בערך שלושים. נקודת החיתוך היא לא סקייל, היא צורת התעבורה. קפיצות עם הרבה סרק מתאימות לסרברלס; עומס קבוע ורציף מתאים למכונה. המלכודת השנייה היא סטייט: ל-Lambda של חבר היה חיבור למסד נתונים לכל אינסטנס, וקפיצת תעבורה פתחה תשע מאות חיבורים מול Postgres שמוגדר למאה, והפילה אפליקציה אחרת לגמרי שלא הייתה קשורה לקפיצה.\n\nסוכנים בוחרים כברירת מחדל את הדפוס ששלט בנתוני האימון שלהם, ולעיתים רחוקות מציינים את המגבלות. לפני שאתה מקבל סרברלס, תשאל שלושה דברים: כמה זמן ריצה בודדת יכולה לרוץ, האם משהו כאן צריך מערכת קבצים או חיבור ארוך-טווח, ומה ה-p99 כולל קולד-סטארט. אם התשובה כוללת ג׳וב רקע שרץ ארבע דקות, WebSocket, או pool של חיבורים — אתה רוצה מכונה, או לפחות פרוקסי חיבורים לפני מסד הנתונים."
 },
 "Container / Docker": {
  "en": "A container is a written description of an environment that lives in version control next to the code it runs. That is the actual innovation. Isolation existed before, and virtual machines gave you more of it. What was new is that the environment became a file you can read, diff, review and roll back — the same operating system version, the same system libraries, the same locale, the same entrypoint, on your laptop and on the server and in CI. The image is built once and the identical bytes run everywhere, which is why the phrase \"works on my machine\" stopped being a defence.\n\nA team spent three days on a bug where date formatting was one day off for some customers and not others. The production containers were built on a base image with a different default timezone than the developers' machines, and a date was being formatted before conversion to UTC. Once the Dockerfile pinned the timezone explicitly, the bug was gone and — more importantly — could never come back silently, because the setting was now a reviewed line in a file. The same team later cut their image from 1.2GB to 180MB with a multi-stage build, which took the deploy from four minutes to fifty seconds and removed the compiler toolchain from the machine facing the internet.\n\nGenerated Dockerfiles have a few predictable flaws. They copy the whole source before installing dependencies, which destroys layer caching and makes every build reinstall everything. They use `latest` as a tag, so a rebuild three months from now silently gets a different language runtime. They run as root, which means a remote code execution is a root execution. And they ship the build toolchain into production. Ask for a multi-stage build, a pinned base image, a non-root user, and a .dockerignore — then confirm that the container actually starts with no network access to your local machine, because that is when the missing environment variable shows up.",
  "he": "קונטיינר הוא תיאור כתוב של סביבה שחי בבקרת גרסאות לצד הקוד שהוא מריץ. זו החדשנות האמיתית. בידוד היה קיים לפני כן, ומכונות וירטואליות נתנו יותר ממנו. מה שהיה חדש הוא שהסביבה הפכה לקובץ שאפשר לקרוא, להשוות, לעבור עליו בסקירה ולחזור ממנו אחורה — אותה גרסת מערכת הפעלה, אותן ספריות מערכת, אותו locale, אותה נקודת כניסה, על הלפטופ שלך ועל השרת וב-CI. האימג׳ נבנה פעם אחת ואותם בתים בדיוק רצים בכל מקום, ובגלל זה ״אצלי זה עובד״ הפסיק להיות טיעון.\n\nצוות בילה שלושה ימים על באג שבו פורמט תאריך היה יום אחד קדימה לחלק מהלקוחות ולא לאחרים. הקונטיינרים בפרודקשן נבנו על בסיס אימג׳ עם אזור זמן ברירת מחדל שונה מזה שעל המחשבים של המפתחים, והתאריך עבר פורמט לפני ההמרה ל-UTC. ברגע שה-Dockerfile קיבע את אזור הזמן במפורש, הבאג נעלם — וחשוב מזה, הוא לא יכול לחזור בשקט, כי ההגדרה היא עכשיו שורה מתועדת בקובץ שעוברת סקירה. אותו צוות אחר כך הוריד את האימג׳ מ-1.2GB ל-180MB עם בילד רב-שלבי, מה שקיצר את הדיפלוי מארבע דקות לחמישים שניות והוציא את כלי הקומפילציה מהמכונה שחשופה לאינטרנט.\n\nל-Dockerfile שנוצר על ידי AI יש כמה פגמים צפויים. הוא מעתיק את כל קוד המקור לפני התקנת התלויות, מה שהורס את הקאש של השכבות וגורם לכל בילד להתקין הכל מחדש. הוא משתמש בתגית latest, אז בילד מחדש בעוד שלושה חודשים יקבל בשקט ריצת שפה אחרת. הוא רץ כ-root, כלומר הרצת קוד מרחוק היא הרצה כ-root. והוא שולח את כלי הבילד לפרודקשן. תבקש בילד רב-שלבי, אימג׳ בסיס מקובע, משתמש שאינו root, וקובץ .dockerignore — ואז תוודא שהקונטיינר באמת עולה בלי גישת רשת למחשב המקומי שלך, כי אז מתגלה משתנה הסביבה החסר."
 },
 "Deploy": {
  "en": "Deployment is a risk-management problem wearing a technical costume. The goal is not to never break production — you will break production — it is to make each break small, obvious within minutes, and reversible in one action. Everything considered good practice here follows from that single sentence. Deploy small changes because a small change has a small blast radius. Deploy often because rehearsed procedures do not fail at 2am. Keep the previous version warm because undoing is faster than diagnosing. Separate deploying code from releasing a feature, using a flag, because then a bad feature does not require a bad rollback.\n\nAn e-commerce team shipped once every three weeks, batching around forty merged changes per release. One Thursday checkout started failing for customers paying in euros. It took four hours to find the cause among forty changes, and the rollback also reverted a fix that three other teams had already built on. Revenue lost that afternoon was in the tens of thousands. They moved to deploying on every merge to main, behind a rolling update that never drops below two healthy instances, with a one-command rollback. The next incident was found in eleven minutes, because there was only one change to suspect, and reverted in ninety seconds.\n\nThe question to ask an agent that has just written a deploy pipeline is not \"does it deploy\" but \"how do I undo this, and how long does it take\". If the answer involves rebuilding an image, you do not have a rollback, you have a second deploy. Also check what happens to requests already in flight while instances are being replaced, and whether a database migration in the same release can be reversed — a deploy you can roll back but a migration you cannot is not a rollback at all, and dropping a column in the same release that stops writing to it is the classic way to discover this.",
  "he": "דיפלוי הוא בעיה של ניהול סיכונים בתחפושת טכנית. המטרה היא לא אף פעם לא לשבור את הפרודקשן — אתה תשבור את הפרודקשן — אלא לגרום לכל שבירה להיות קטנה, ברורה תוך דקות, והפיכה בפעולה אחת. כל מה שנחשב פרקטיקה טובה בתחום נגזר מהמשפט הזה. לעשות דיפלוי לשינויים קטנים, כי לשינוי קטן יש רדיוס פגיעה קטן. לעשות דיפלוי לעיתים קרובות, כי תהליכים מתורגלים לא נכשלים בשתיים בלילה. להשאיר את הגרסה הקודמת חמה, כי לבטל מהיר יותר מלאבחן. להפריד בין דיפלוי של קוד לבין שחרור של פיצ׳ר, עם פיצ׳ר-פלאג, כי אז פיצ׳ר גרוע לא מחייב רולבק גרוע.\n\nצוות מסחר אלקטרוני שחרר פעם בשלושה שבועות, וצבר בערך ארבעים שינויים לכל שחרור. יום חמישי אחד הצ׳קאאוט התחיל להיכשל ללקוחות ששילמו ביורו. לקח ארבע שעות למצוא את הסיבה בין ארבעים שינויים, והרולבק גם ביטל תיקון ששלושה צוותים אחרים כבר בנו מעליו. ההכנסות שאבדו באותו אחר צהריים היו בעשרות אלפים. הם עברו לדיפלוי בכל מיזוג ל-main, מאחורי עדכון מתגלגל שלא יורד מתחת לשני אינסטנסים תקינים, עם רולבק בפקודה אחת. התקלה הבאה נמצאה תוך אחת עשרה דקות, כי היה רק שינוי אחד לחשוד בו, ובוטלה תוך תשעים שניות.\n\nהשאלה לשאול סוכן AI שזה עתה כתב לך תהליך דיפלוי היא לא ״האם זה עושה דיפלוי״ אלא ״איך אני מבטל את זה, וכמה זמן זה לוקח״. אם התשובה כוללת בנייה מחדש של אימג׳, אין לך רולבק, יש לך דיפלוי שני. תבדוק גם מה קורה לבקשות שכבר באוויר בזמן שמחליפים אינסטנסים, והאם מיגרציה של מסד נתונים באותו שחרור ניתנת להיפוך — דיפלוי שאפשר להחזיר אחורה עם מיגרציה שאי אפשר הוא בכלל לא רולבק, ומחיקת עמודה באותו שחרור שבו מפסיקים לכתוב אליה היא הדרך הקלאסית לגלות את זה."
 },
 "CI/CD": {
  "en": "CI is a machine that disagrees with you on a schedule. Its value is not that it saves typing — you could run the tests yourself — it is that the checks become unskippable and identical for everyone, including you at midnight, including the agent that just opened a pull request. A pipeline is also the only honest definition of \"done\" a team ever writes down. Whatever the pipeline enforces is the real standard; everything else is a preference that people follow when they are not in a hurry, which is to say when it does not matter.\n\nA team added a linter to CI but left it non-blocking, because failing builds felt aggressive. Nine months later they had four thousand warnings and nobody read the output. Another team made a single check blocking from day one: the test suite must pass and coverage on changed lines must not drop. Their agent-generated pull requests started arriving with tests, because the author — human or not — could not merge without them. The pipeline did not make anyone a better engineer; it made one specific mistake impossible, which is all a guardrail is supposed to do. The same pipeline caught a dependency update that broke date parsing in a way no reviewer would have noticed reading the diff.\n\nWith an AI agent in the loop this matters more than it used to, because the volume of confident, plausible, untested code went up by an order of magnitude and your reading speed did not. Insist the pipeline runs on pull requests, not only on main, and that at least one check actually blocks the merge. Watch the runtime: a pipeline that takes twenty minutes will be bypassed, so cache dependencies and run the slow jobs in parallel. And keep deploy credentials in the CI provider's secret store, never in the repository — a token in a YAML file is a token in everyone's clone, and rotating it is a worse afternoon than setting it up properly.",
  "he": "CI הוא מכונה שחולקת עליך באופן קבוע. הערך שלו הוא לא שהוא חוסך הקלדה — אתה יכול להריץ את הבדיקות בעצמך — אלא שהבדיקות הופכות לבלתי ניתנות לדילוג וזהות לכולם, כולל אותך בחצות, כולל הסוכן שזה עתה פתח pull request. תהליך CI הוא גם ההגדרה הכנה היחידה של ״סיימנו״ שצוות אי פעם כותב. מה שהתהליך אוכף הוא הסטנדרט האמיתי; כל השאר הוא העדפה שאנשים מקיימים כשהם לא ממהרים, כלומר כשזה לא משנה.\n\nצוות הוסיף לינטר ל-CI אבל השאיר אותו לא חוסם, כי בילד שנכשל הרגיש להם אגרסיבי. תשעה חודשים אחר כך היו להם ארבעת אלפים אזהרות ואף אחד לא קרא את הפלט. צוות אחר הפך בדיקה אחת לחוסמת מהיום הראשון: חבילת הבדיקות חייבת לעבור, וכיסוי על השורות שהשתנו לא יורד. ה-pull requests שהסוכן שלהם ייצר התחילו להגיע עם בדיקות, כי הכותב — אנושי או לא — לא יכול היה למזג בלעדיהן. התהליך לא הפך אף אחד למהנדס טוב יותר; הוא הפך טעות ספציפית אחת לבלתי אפשרית, וזה כל מה שמעקה אמור לעשות. אותו תהליך תפס עדכון תלות ששבר פענוח תאריכים בצורה שאף מבקר קוד לא היה מבחין בה בקריאת הדיף.\n\nעם סוכן AI בתהליך זה חשוב יותר מבעבר, כי כמות הקוד הבטוח-בעצמו, המשכנע והלא-בדוק גדלה בסדר גודל ומהירות הקריאה שלך לא. תתעקש שהתהליך ירוץ על pull requests, לא רק על main, ושלפחות בדיקה אחת באמת חוסמת מיזוג. תשים לב לזמן הריצה: תהליך שלוקח עשרים דקות ייעקף, אז תשמור קאש לתלויות ותריץ את הג׳ובים האיטיים במקביל. ותשמור הרשאות דיפלוי במאגר הסודות של ספק ה-CI, לעולם לא בריפו — טוקן בקובץ YAML הוא טוקן אצל כל מי ששיכפל את הריפו, והחלפה שלו היא אחר צהריים גרוע יותר מלהגדיר אותו נכון מלכתחילה."
 },
 "Logs & monitoring": {
  "en": "You cannot debug what you cannot observe, and production is the one place you cannot attach a debugger. Logs are therefore the only evidence you will ever have about what actually happened, and they are written before the incident, by a version of you who did not know what was going to go wrong. That is the whole difficulty. The useful unit is not the message, it is the decision: which branch was taken, with what input, and why. \"Processing order\" tells you nothing. \"Rejected order 7c3f: coupon expired 2026-03-01, user 9f2c\" ends the investigation in one line.\n\nA payments integration started failing for roughly two percent of transactions. The logs said \"payment failed\" with no identifiers, no amounts and no provider response, which meant that finding a single affected transaction required cross-referencing support tickets by hand. Three engineers spent two days on it. The eventual cause was a provider returning a specific decline code for one card network, which a single logged field would have shown immediately. Afterwards they added a request id that travels from the web request into every log line and into the queue job, and the next incident of similar shape was diagnosed in six minutes by pasting one id into a search box.\n\nAgents generate console.log statements, which are strings; what you want is structured events, which are objects you can filter and count. Ask for a JSON logger with a correlation id, and give it explicit instruction about what never goes in a log: passwords, tokens, full card numbers, and personal data you would not want in a third-party search index. Then add exactly two alerts before you need them — error rate above a threshold, and the healthcheck failing — because an alert that fires on everything trains you to ignore it, and the silence of a system with no monitoring is indistinguishable from the silence of a system that nobody can reach.",
  "he": "אי אפשר לדבג מה שאי אפשר לראות, ופרודקשן הוא המקום היחיד שבו אי אפשר לחבר דיבאגר. לכן לוגים הם הראיה היחידה שאי פעם תהיה לך לגבי מה באמת קרה, והם נכתבו לפני האירוע, על ידי גרסה שלך שלא ידעה מה עומד להשתבש. זה כל הקושי. היחידה המועילה היא לא ההודעה, היא ההחלטה: איזה ענף נבחר, עם איזה קלט, ולמה. ״מעבד הזמנה״ לא אומר לך כלום. ״נדחתה הזמנה 7c3f: קופון פג ב-2026-03-01, משתמש 9f2c״ מסיים את החקירה בשורה אחת.\n\nאינטגרציית תשלומים התחילה להיכשל בערך בשני אחוזים מהעסקאות. הלוגים אמרו ״תשלום נכשל״ בלי מזהים, בלי סכומים ובלי תשובת הספק, כלומר כדי למצוא עסקה אחת שנפגעה היה צריך להצליב פניות תמיכה ידנית. שלושה מפתחים בילו על זה יומיים. הסיבה בסוף הייתה שהספק החזיר קוד דחייה מסוים לרשת כרטיסים אחת, מה ששדה אחד בלוג היה מראה מיד. אחר כך הם הוסיפו מזהה בקשה שנוסע מהבקשה בדפדפן לכל שורת לוג ולתוך ג׳וב התור, והתקלה הבאה מאותה צורה אובחנה תוך שש דקות בהדבקת מזהה אחד בתיבת חיפוש.\n\nסוכנים מייצרים שורות console.log, שהן מחרוזות; מה שאתה רוצה הוא אירועים מובנים, שהם אובייקטים שאפשר לסנן ולספור. תבקש לוגר JSON עם מזהה מתאם, ותן לו הוראה מפורשת מה לעולם לא נכנס ללוג: סיסמאות, טוקנים, מספרי כרטיס מלאים, ומידע אישי שלא היית רוצה באינדקס חיפוש של צד שלישי. ואז תוסיף בדיוק שתי התראות עוד לפני שתצטרך אותן — שיעור שגיאות מעל סף, ובדיקת בריאות שנכשלת — כי התראה שקופצת על הכל מאמנת אותך להתעלם ממנה, והשקט של מערכת בלי ניטור זהה לחלוטין לשקט של מערכת שאף אחד לא מצליח להגיע אליה."
 },
 "Scaling up vs out": {
  "en": "Scaling up is buying your way out of a problem with no code changes, and it works far better and for far longer than most people expect. Doubling the CPU and memory of a database is a fifteen-minute maintenance window and solves most growing pains up to a size that the majority of products never reach. It ends at a hard ceiling — there is a largest instance — and the last few steps before the ceiling are priced punitively, because at that point the provider knows you have no alternative. Scaling out has no ceiling, but it demands a property from your code that scaling up never asked for: any instance must be able to serve any request.\n\nA SaaS with growing report volumes moved from a 4-core database instance to a 16-core one and went from 90% CPU to 22% in an afternoon, for about four hundred dollars a month more. That bought them eighteen months. They spent those eighteen months adding indexes and caching, which turned out to cut the load by more than the hardware had. The counter-example is a team that jumped straight to three application instances to fix slow response times, and discovered their sessions were in process memory: users were randomly logged out on roughly two requests in three, and the incident lasted a full day because the fix was not a config change but a rewrite of authentication.\n\nWhen an agent proposes horizontal scaling, the question is not whether it will work but what in the current code assumes a single process. Search for in-memory caches, module-level variables holding user data, scheduled jobs that would now run on every instance at once, files written to local disk, and anything counting things in a local variable. Fix those first and scaling out becomes a number in a config file. And before either move, check whether the actual bottleneck is a missing index — a query that goes from 340ms to 2ms is cheaper than any machine.",
  "he": "סקייל אנכי הוא לקנות את הדרך החוצה מהבעיה בלי לשנות שורת קוד, וזה עובד הרבה יותר טוב והרבה יותר זמן ממה שרוב האנשים מצפים. להכפיל מעבד וזיכרון של מסד נתונים זה חלון תחזוקה של רבע שעה, והוא פותר את רוב כאבי הגדילה עד גודל שרוב המוצרים לעולם לא מגיעים אליו. זה נגמר בתקרה קשיחה — יש אינסטנס הכי גדול — והצעדים האחרונים לפני התקרה מתומחרים בעונשין, כי בנקודה הזו הספק יודע שאין לך אלטרנטיבה. לסקייל אופקי אין תקרה, אבל הוא דורש מהקוד שלך תכונה שסקייל אנכי מעולם לא ביקש: כל אינסטנס חייב להיות מסוגל לשרת כל בקשה.\n\nחברת SaaS עם נפח דוחות שגדל עברה ממסד נתונים עם 4 ליבות לאחד עם 16 ליבות וירדה מ-90% מעבד ל-22% תוך אחר צהריים, בערך ארבע מאות דולר בחודש יותר. זה קנה להם שמונה עשר חודשים. את שמונה עשר החודשים האלה הם בילו בהוספת אינדקסים וקאשינג, שבסוף הורידו את העומס יותר ממה שהחומרה הורידה. הדוגמה ההפוכה היא צוות שקפץ ישר לשלושה אינסטנסים של האפליקציה כדי לתקן זמני תגובה איטיים, וגילה שהסשנים שלהם יושבים בזיכרון של התהליך: משתמשים הועפו החוצה באופן אקראי בערך בשתיים מכל שלוש בקשות, והתקלה נמשכה יום שלם כי התיקון לא היה שינוי קונפיגורציה אלא שכתוב של ההזדהות.\n\nכשסוכן AI מציע סקייל אופקי, השאלה היא לא האם זה יעבוד אלא מה בקוד הנוכחי מניח תהליך יחיד. תחפש קאשים בזיכרון, משתנים ברמת המודול שמחזיקים מידע משתמש, ג׳ובים מתוזמנים שעכשיו ירוצו על כל האינסטנסים בבת אחת, קבצים שנכתבים לדיסק מקומי, וכל דבר שסופר משהו במשתנה מקומי. תתקן את אלה קודם וסקייל אופקי הופך למספר בקובץ קונפיגורציה. ולפני שני המהלכים, תבדוק אם צוואר הבקבוק האמיתי הוא אינדקס חסר — שאילתה שיורדת מ-340ms ל-2ms זולה מכל מכונה."
 },
 "Load balancer": {
  "en": "A load balancer turns many machines into one address, and in doing so quietly becomes the place where several important decisions live: which instances are considered healthy, how connections are spread, where TLS terminates, and how long a slow response is allowed to hang before it is cut off. Most people set it up once and never look again, which is a shame, because the single most consequential setting in the whole system is usually sitting in it — the health check. The balancer's entire job is to skip broken instances, and it can only do that as well as your health check describes brokenness.\n\nAn API had a health check on `GET /` that returned 200 if the process was alive. Their database credentials expired during a rotation, and every instance began returning 500 for every real request while cheerfully reporting healthy. The balancer kept sending traffic to all of them for fifty minutes, because from its point of view nothing was wrong. A health check that actually opened a database connection and pinged Redis would have marked every instance unhealthy, and the alert would have fired in under a minute. The counterweight is equally real: a health check that is too strict, or that calls a third-party API, will take your whole fleet out of rotation because someone else had an outage.\n\nThe practical rule is that the health check should test the dependencies this instance needs in order to serve, and nothing further away than that. Cache its result for a few seconds so the check itself does not become load. When an agent sets up a balancer, verify three things beyond the routing: that idle and request timeouts are longer than your slowest legitimate endpoint, that connection draining is on so a deploy does not cut off in-flight requests, and that sticky sessions are off — if your app needs them, you have a state problem the balancer is only hiding.",
  "he": "מאזן עומסים הופך הרבה מכונות לכתובת אחת, ותוך כדי כך הופך בשקט למקום שבו חיות כמה החלטות חשובות: אילו אינסטנסים נחשבים תקינים, איך מפזרים חיבורים, איפה מסתיים TLS, וכמה זמן מותר לתגובה איטית להיתקע לפני שהיא נחתכת. רוב האנשים מגדירים אותו פעם אחת ולא מסתכלים שוב, וחבל, כי ההגדרה הכי משמעותית בכל המערכת בדרך כלל יושבת שם — בדיקת הבריאות. כל התפקיד של המאזן הוא לדלג על אינסטנסים שבורים, והוא יכול לעשות את זה רק כמו שבדיקת הבריאות שלך מתארת שבירה.\n\nל-API הייתה בדיקת בריאות על `GET /` שהחזירה 200 אם התהליך חי. פרטי ההתחברות למסד הנתונים פגו במהלך החלפה, וכל אינסטנס התחיל להחזיר 500 לכל בקשה אמיתית, בזמן שדיווח בשמחה שהוא תקין. המאזן המשיך לשלוח תעבורה לכולם במשך חמישים דקות, כי מבחינתו שום דבר לא היה בסדר. בדיקת בריאות שבאמת פותחת חיבור למסד הנתונים ועושה ping ל-Redis הייתה מסמנת את כל האינסטנסים כלא תקינים, וההתראה הייתה קופצת תוך פחות מדקה. המשקל הנגדי אמיתי באותה מידה: בדיקת בריאות מחמירה מדי, או כזו שקוראת ל-API של צד שלישי, תוציא לך את כל הצי מהמחזור כי למישהו אחר הייתה תקלה.\n\nהכלל המעשי הוא שבדיקת הבריאות צריכה לבדוק את התלויות שהאינסטנס הזה צריך כדי לשרת, ולא שום דבר רחוק מזה. תשמור את התוצאה שלה בקאש לכמה שניות כדי שהבדיקה עצמה לא תהפוך לעומס. כשסוכן AI מגדיר מאזן עומסים, תוודא שלושה דברים מעבר לניתוב: שהטיים-אאוטים ארוכים יותר מנקודת הקצה הלגיטימית האיטית ביותר שלך, ש-connection draining דלוק כדי שדיפלוי לא יחתוך בקשות באוויר, ושדביקות סשן (sticky sessions) כבויה — אם האפליקציה שלך צריכה אותה, יש לך בעיית סטייט שהמאזן רק מסתיר."
 },
 "Stateless": {
  "en": "Stateless does not mean there is no state. It means the state does not live inside the process. It lives in the database, in a shared cache like Redis, or in the request itself — somewhere every instance can reach equally, so that no request is tied to the machine that happened to handle the previous one. Once you have that property, a large number of hard things become trivial. You can add instances, kill instances, deploy by replacing every instance, run the same code in a container and in a lambda, and restart anything at any time without anyone noticing. Almost every scaling technique assumes it as a precondition.\n\nA team ran a rate limiter as a counter in a module-level variable. It worked in testing with one process. In production with four instances the effective limit was four times what anyone intended, and scaling to eight during a sale doubled it again — which they discovered when a scraper pulled their entire catalogue. The same code base kept an in-memory cache of feature flags, so turning a flag off took effect on one instance immediately and on the others whenever they next restarted, producing an hour of customers seeing two different checkout flows depending on which server answered.\n\nThe things to grep for are short and specific: module-level variables that are assigned after startup, `new Map()` or `{}` used as a cache, uploads written to a local path, `setInterval` doing scheduled work, and any in-memory session store. Each of them is correct with one process and a bug with two. When an agent suggests an in-memory cache because it is faster — and it is faster — the question is what happens when two instances disagree, and how long that disagreement lasts. If the answer is \"until restart\", it belongs in Redis with a TTL, not in the process.",
  "he": "סטייטלס לא אומר שאין סטייט. זה אומר שהסטייט לא חי בתוך התהליך. הוא חי במסד הנתונים, בקאש משותף כמו Redis, או בבקשה עצמה — במקום שכל אינסטנס מגיע אליו באותה מידה, כך שאף בקשה לא קשורה למכונה שבמקרה טיפלה בקודמת. ברגע שיש לך את התכונה הזו, הרבה מאוד דברים קשים הופכים לטריוויאליים. אפשר להוסיף אינסטנסים, להרוג אינסטנסים, לעשות דיפלוי בהחלפת כל האינסטנסים, להריץ את אותו קוד בקונטיינר וב-lambda, ולהפעיל מחדש כל דבר בכל רגע בלי שאף אחד ישים לב. כמעט כל טכניקת סקייל מניחה את זה כתנאי מקדים.\n\nצוות הריץ הגבלת קצב כמונה במשתנה ברמת המודול. זה עבד בבדיקות עם תהליך אחד. בפרודקשן עם ארבעה אינסטנסים המגבלה בפועל הייתה פי ארבעה ממה שמישהו התכוון, וסקייל לשמונה במהלך מבצע הכפיל אותה שוב — מה שהם גילו כששואב נתונים משך להם את כל הקטלוג. אותו קוד החזיק גם קאש בזיכרון של פיצ׳ר-פלאגים, אז כיבוי פלאג נכנס לתוקף באינסטנס אחד מיד ובאחרים רק כשהם עלו מחדש, מה שייצר שעה שבה לקוחות ראו שני מסלולי צ׳קאאוט שונים תלוי איזה שרת ענה.\n\nהדברים לחפש קצרים וספציפיים: משתנים ברמת המודול שמקבלים ערך אחרי העלייה, `new Map()` או `{}` שמשמשים כקאש, העלאות שנכתבות לנתיב מקומי, `setInterval` שעושה עבודה מתוזמנת, וכל מאגר סשנים בזיכרון. כל אחד מהם נכון עם תהליך אחד ובאג עם שניים. כשסוכן AI מציע קאש בזיכרון כי זה מהיר יותר — וזה באמת מהיר יותר — השאלה היא מה קורה כששני אינסטנסים לא מסכימים, וכמה זמן חוסר ההסכמה הזה נמשך. אם התשובה היא ״עד להפעלה מחדש״, זה שייך ל-Redis עם TTL, לא לתהליך."
 },
 "Queue / worker": {
  "en": "A queue separates accepting work from doing it, and that single separation buys three things at once: responses stay fast because the request returns as soon as the job is recorded, traffic spikes stop being outages because the queue absorbs them and the workers drain at their own pace, and retries become free because a job that fails is simply still in the queue. The cost is that you now owe the user an answer about something that has not finished yet, which means a status they can see, and a plan for jobs that fail forever.\n\nA reporting endpoint built a PDF inside the request. It took eight seconds, which was tolerable until a customer clicked it four times and their browser gave up at thirty seconds while four PDFs were still being built. At month-end, forty customers did this at once and the web process ran out of memory, taking down the entire application — including login for everyone else. Moving PDF generation to a queue made the endpoint return in 40ms with a job id, kept the web tier at flat memory usage during month-end, and confined a genuinely slow operation to workers that could be scaled independently. The one new problem was jobs that failed on corrupt input and retried forever until someone added a dead-letter queue and stopped retrying after five attempts.\n\nAI-generated queue code usually forgets three things. It does not set a maximum retry count, so a permanently broken job retries until the end of time. It does not make the job idempotent, so a retry after a partial success sends the email twice. And it passes whole objects into the job instead of an id, so the worker processes a snapshot of data that was already stale when it was enqueued. Ask for a job that takes an id, re-reads current state, is safe to run twice, and gives up into a dead-letter queue — then check that someone will actually look at that queue.",
  "he": "תור מפריד בין קבלת עבודה לבין ביצוע שלה, וההפרדה האחת הזו קונה שלושה דברים בבת אחת: תגובות נשארות מהירות, כי הבקשה חוזרת ברגע שהמשימה נרשמה; קפיצות תעבורה מפסיקות להיות תקלות, כי התור בולע אותן והוורקרים מרוקנים אותו בקצב שלהם; וניסיונות חוזרים הופכים לחינם, כי משימה שנכשלה פשוט עדיין נמצאת בתור. המחיר הוא שאתה עכשיו חייב למשתמש תשובה על משהו שעוד לא הסתיים, כלומר סטטוס שהוא יכול לראות, ותוכנית למשימות שנכשלות לנצח.\n\nנקודת קצה של דוחות בנתה PDF בתוך הבקשה. זה לקח שמונה שניות, מה שהיה נסבל עד שלקוח לחץ ארבע פעמים והדפדפן שלו ויתר אחרי שלושים שניות בזמן שארבעה PDF עדיין נבנו. בסוף החודש ארבעים לקוחות עשו את זה בבת אחת ותהליך ה-web נגמר לו הזיכרון, והפיל את כל האפליקציה — כולל ההתחברות לכל השאר. העברת יצירת ה-PDF לתור גרמה לנקודת הקצה לחזור תוך 40ms עם מזהה משימה, שמרה על צריכת זיכרון שטוחה בשכבת ה-web בסוף החודש, ותחמה פעולה שהיא באמת איטית לוורקרים שאפשר לעשות להם סקייל בנפרד. הבעיה החדשה היחידה הייתה משימות שנכשלו על קלט פגום וניסו שוב לנצח, עד שמישהו הוסיף dead-letter queue והפסיק לנסות אחרי חמישה ניסיונות.\n\nקוד תורים שנוצר על ידי AI בדרך כלל שוכח שלושה דברים. הוא לא מגדיר מספר ניסיונות מקסימלי, אז משימה שבורה לצמיתות מנסה שוב עד סוף הזמן. הוא לא הופך את המשימה לאידמפוטנטית, אז ניסיון חוזר אחרי הצלחה חלקית שולח את המייל פעמיים. והוא מעביר אובייקטים שלמים לתוך המשימה במקום מזהה, אז הוורקר מעבד תמונת מצב של נתונים שכבר היו ישנים כשהם נכנסו לתור. תבקש משימה שמקבלת מזהה, קוראת מחדש את המצב הנוכחי, בטוחה להרצה כפולה, ומוותרת לתוך dead-letter queue — ואז תוודא שמישהו באמת יסתכל על התור הזה."
 },
 "Idempotency": {
  "en": "Distributed systems cannot distinguish between a request that failed and a response that got lost on the way back. From the caller's side those two situations look identical: silence. So the only safe assumption is that anything you expose may be delivered twice, or five times, and that the second delivery may arrive while the first is still running. Idempotency is how you make that assumption harmless. The operation carries a key, the server records the key with its result, and a repeat of the same key returns the stored result instead of doing the work again.\n\nA payment provider's webhook fired twice within four hundred milliseconds during one of their own retries — normal, documented behaviour. The receiving code created an order row on each call, so a customer got two shipments for one payment, and the discrepancy was not caught until a warehouse count three weeks later. The refund, the return shipping and the support time cost far more than the item. The fix was a unique constraint on the provider's event id plus an insert that ignores conflicts, which is about two lines, and it made the bug structurally impossible rather than merely unlikely. The same pattern applies inbound: a checkout button double-clicked on a slow connection is the same problem arriving from a browser instead of a server.\n\nThe mental test is simple. For every endpoint that writes, ask what happens if it runs twice with identical input. If the answer is \"one extra row\", \"one extra charge\" or \"one extra email\", it needs a key. Agents are good at writing the happy path and reliably omit this, because nothing in the specification mentions duplicates. Say explicitly: accept an Idempotency-Key header, store it with the response, and enforce uniqueness in the database rather than with a check-then-insert in application code — two concurrent requests will both pass that check, and only the database can settle the race.",
  "he": "מערכות מבוזרות לא יכולות להבחין בין בקשה שנכשלה לבין תשובה שאבדה בדרך חזרה. מצד הקורא שתי הסיטואציות נראות זהות: שקט. אז ההנחה הבטוחה היחידה היא שכל דבר שאתה חושף עלול להימסר פעמיים, או חמש פעמים, ושהמסירה השנייה עלולה להגיע בזמן שהראשונה עדיין רצה. אידמפוטנטיות היא איך שהופכים את ההנחה הזו לבלתי מזיקה. הפעולה נושאת מפתח, השרת רושם את המפתח יחד עם התוצאה, וחזרה על אותו מפתח מחזירה את התוצאה השמורה במקום לבצע את העבודה שוב.\n\nwebhook של ספק תשלומים ירה פעמיים בתוך ארבע מאות מילישניות באחד הניסיונות החוזרים שלו — התנהגות נורמלית ומתועדת. הקוד שקיבל אותו יצר שורת הזמנה בכל קריאה, אז לקוח קיבל שני משלוחים על תשלום אחד, והפער לא נתפס עד ספירת מלאי במחסן שלושה שבועות אחר כך. הזיכוי, משלוח ההחזרה וזמן התמיכה עלו הרבה יותר מהמוצר עצמו. התיקון היה אילוץ ייחודיות על מזהה האירוע של הספק ועוד הוספה שמתעלמת מהתנגשות, כלומר בערך שתי שורות, והוא הפך את הבאג לבלתי אפשרי מבנית ולא רק לא סביר. אותו דפוס תקף גם בכיוון הנכנס: כפתור צ׳קאאוט שנלחץ פעמיים בחיבור איטי הוא בדיוק אותה בעיה שמגיעה מדפדפן במקום משרת.\n\nהמבחן המחשבתי פשוט. לכל נקודת קצה שכותבת, תשאל מה קורה אם היא תרוץ פעמיים עם אותו קלט בדיוק. אם התשובה היא ״עוד שורה אחת״, ״עוד חיוב אחד״ או ״עוד מייל אחד״ — היא צריכה מפתח. סוכנים טובים בכתיבת המסלול המאושר ובאופן עקבי משמיטים את זה, כי שום דבר באפיון לא מזכיר כפילויות. תגיד במפורש: לקבל כותרת Idempotency-Key, לשמור אותה עם התשובה, ולאכוף ייחודיות במסד הנתונים ולא בבדיקה-ואז-הוספה בקוד האפליקציה — שתי בקשות מקבילות יעברו את הבדיקה הזו, ורק מסד הנתונים יכול להכריע את המרוץ."
 },
 "Monolith vs microservices": {
  "en": "Splitting a system does not reduce its complexity, it changes the currency the complexity is paid in. Function calls that could not fail become network calls that can. A single database transaction becomes a distributed one you must now reason about by hand. A stack trace that told you everything becomes four log files in three services that you have to correlate. In exchange you get independent deployment, independent scaling, and the ability for teams to work without coordinating. Those are real benefits, and they are almost entirely organisational: microservices solve a people problem, and they solve it by adding a technical one.\n\nA four-person startup split their product into nine services because they expected to grow. Adding a field to the user profile then touched three services and three deploys that had to happen in a specific order. Local development needed docker-compose with nine containers and about 6GB of memory, and onboarding a new developer took a week. After fourteen months they merged it back into one application and shipped features roughly three times faster with the same headcount. The opposite story also exists: a company with sixty engineers pushing one deployable had a release train where one team's bad merge blocked everyone else for two days, and splitting out the three highest-churn areas fixed it.\n\nThe honest signal for splitting is not scale, it is deploy contention — different parts of the system need to be released on different schedules by different people. Until that hurts, a modular monolith with clear internal boundaries gives you most of the benefit and none of the network. When an agent proposes a service-per-noun architecture for a project with one developer, ask which of these services will ever be deployed separately from the others. If the answer is none, you have just bought distributed-systems problems with no distributed-systems benefit.",
  "he": "פיצול מערכת לא מקטין את המורכבות שלה, הוא משנה את המטבע שבו משלמים עליה. קריאות פונקציה שלא יכלו להיכשל הופכות לקריאות רשת שכן. טרנזקציה אחת במסד נתונים הופכת לטרנזקציה מבוזרת שעכשיו אתה צריך לנתח ידנית. stack trace שסיפר לך הכל הופך לארבעה קבצי לוג בשלושה שירותים שצריך להצליב. בתמורה אתה מקבל דיפלוי עצמאי, סקייל עצמאי, ויכולת של צוותים לעבוד בלי לתאם. אלה יתרונות אמיתיים, והם כמעט לגמרי ארגוניים: מיקרו-סרוויסים פותרים בעיה של אנשים, והם פותרים אותה בהוספת בעיה טכנית.\n\nסטארטאפ של ארבעה אנשים פיצל את המוצר שלו לתשעה שירותים כי הם ציפו לגדול. הוספת שדה לפרופיל המשתמש אז נגעה בשלושה שירותים ובשלושה דיפלויים שהיו חייבים לקרות בסדר מסוים. פיתוח מקומי דרש docker-compose עם תשעה קונטיינרים ובערך 6GB זיכרון, וקליטת מפתח חדש לקחה שבוע. אחרי ארבעה עשר חודשים הם איחדו הכל בחזרה לאפליקציה אחת ושחררו פיצ׳רים בערך פי שלושה מהר יותר עם אותו מספר אנשים. גם הסיפור ההפוך קיים: בחברה עם שישים מפתחים שדוחפים ליחידת דיפלוי אחת היה רכבת שחרורים שבה מיזוג גרוע של צוות אחד חסם את כל השאר ליומיים, והוצאת שלושת האזורים עם הכי הרבה שינויים פתרה את זה.\n\nהסימן הכן לפיצול הוא לא סקייל, הוא תחרות על הדיפלוי — חלקים שונים של המערכת צריכים לצאת בלוחות זמנים שונים על ידי אנשים שונים. עד שזה כואב, מונוליט מודולרי עם גבולות פנימיים ברורים נותן לך את רוב התועלת ואפס רשת. כשסוכן AI מציע ארכיטקטורה של שירות לכל ישות בפרויקט עם מפתח אחד, תשאל איזה מהשירותים האלה אי פעם יעבור דיפלוי בנפרד מהאחרים. אם התשובה היא אף אחד, זה עתה קנית בעיות של מערכות מבוזרות בלי שום יתרון של מערכות מבוזרות."
 },
 "Rate limiting": {
  "en": "A rate limit is a statement about fairness and survival: no single caller may consume the capacity that belongs to everyone. It is usually framed as protection from attackers, but the most common thing a rate limit saves you from is a bug — a retry loop with no backoff, a cron that fires every second instead of every minute, a customer's integration that polls your API in a while-true. Your own code is the most frequent offender, because it has credentials and no reason to be suspicious of itself.\n\nA startup exposed a public search endpoint with no limit. A single scraper ran it at four hundred requests per second for six hours, which pushed their database to saturation and made the product unusable for every paying customer that night. The database autoscaled, so the technical symptom was mild and the financial one was not: the bill for that month was about nine hundred dollars above normal. A limit of sixty requests per minute per IP, which no real user ever approaches, would have turned the whole event into a line in a log. The same team had earlier burned through a third-party translation quota in a morning because a failed request retried instantly in a loop — two thousand dollars, spent by their own code in about ninety minutes.\n\nImplement it in a shared store, not in process memory, or each instance enforces its own private limit. Return 429 with a Retry-After header, because a client that is told when to come back will, and a client that is only rejected will hammer harder. Limit by user or API key where you can and by IP only as a fallback, since one office shares an address. And when an agent writes a client for someone else's API, check that its retry logic has exponential backoff and a ceiling — the fastest way to get your key banned is a well-meaning retry loop that treats 429 as a reason to try again immediately.",
  "he": "הגבלת קצב היא אמירה על הוגנות והישרדות: אף קורא בודד לא רשאי לצרוך את הקיבולת ששייכת לכולם. בדרך כלל מציגים אותה כהגנה מפני תוקפים, אבל הדבר הנפוץ ביותר שהגבלת קצב מצילה ממנו הוא באג — לולאת ניסיונות חוזרים בלי השהיה, cron שרץ כל שנייה במקום כל דקה, אינטגרציה של לקוח שעושה פולינג ל-API שלך בלולאה אינסופית. הקוד שלך עצמו הוא החשוד הכי תכוף, כי יש לו הרשאות ואין לו סיבה לחשוד בעצמו.\n\nסטארטאפ חשף נקודת קצה ציבורית לחיפוש בלי הגבלה. שואב נתונים אחד הריץ אותה בארבע מאות בקשות לשנייה במשך שש שעות, מה שהביא את מסד הנתונים לרוויה והפך את המוצר לבלתי שמיש לכל לקוח משלם באותו ערב. מסד הנתונים עשה סקייל אוטומטי, אז הסימפטום הטכני היה מתון והכספי לא: החשבון של אותו חודש היה בערך תשע מאות דולר מעל הרגיל. הגבלה של שישים בקשות לדקה לכל IP, שאף משתמש אמיתי לא מתקרב אליה, הייתה הופכת את כל האירוע לשורה בלוג. אותו צוות קודם לכן שרף מכסת תרגום של צד שלישי בבוקר אחד, כי בקשה שנכשלה ניסתה שוב מיד בלולאה — אלפיים דולר, שהקוד שלהם עצמו הוציא בערך בתשעים דקות.\n\nתממש את זה במאגר משותף, לא בזיכרון התהליך, אחרת כל אינסטנס אוכף מגבלה פרטית משלו. תחזיר 429 עם כותרת Retry-After, כי לקוח שאומרים לו מתי לחזור יחזור אז, ולקוח שרק נדחה ילחץ חזק יותר. תגביל לפי משתמש או מפתח API היכן שאפשר, ולפי IP רק כגיבוי, כי משרד שלם חולק כתובת אחת. וכשסוכן AI כותב לקוח ל-API של מישהו אחר, תבדוק שללוגיקת הניסיונות החוזרים יש השהיה מעריכה ותקרה — הדרך המהירה ביותר לקבל חסימה למפתח היא לולאת ניסיונות עם כוונות טובות שמתייחסת ל-429 כאל סיבה לנסות שוב מיד."
 },
 "Single point of failure": {
  "en": "Redundancy is neither free nor automatically correct. Two of everything doubles the cost and introduces the hardest problem in the field — keeping copies in agreement — and a badly built failover mechanism causes more outages than the failure it was meant to survive. So the mature version of this discipline is not eliminating every single point of failure. It is knowing where each one is, deciding on purpose which are acceptable, and making sure that when one does fail you find out from an alert rather than from a customer.\n\nA company ran a redundant web tier across three availability zones, load balanced, auto-scaled, thoroughly engineered. All of it talked to one Postgres instance in one zone with no replica, because that had been the temporary setup two years earlier. The instance's underlying host failed on a Tuesday morning and the product was completely down for two hours and forty minutes while a restore from the nightly backup ran — which also meant nine hours of data loss for anything written since the snapshot. The engineering around the web tier had been careful and entirely irrelevant. A managed database with automated failover would have cost about ninety dollars more per month.\n\nThe cheapest exercise here takes ten minutes and no code. List every component the request path touches: DNS, CDN, load balancer, app, database, cache, the auth provider, the payment provider, the email service. For each, answer what happens if it disappears right now, and how you would know. The results are usually uncomfortable and often cheap to fix — a read replica, a second region for DNS, a graceful degradation path when the cache is cold. An agent will never raise this, because nothing about it appears in the code it is looking at.",
  "he": "יתירות היא לא חינם ולא אוטומטית נכונה. שניים מכל דבר מכפילים את העלות ומכניסים את הבעיה הקשה ביותר בתחום — לשמור על עותקים שמסכימים ביניהם — ומנגנון גיבוי שבנוי גרוע גורם ליותר תקלות מהתקלה שהוא אמור לשרוד. אז הגרסה הבוגרת של התחום הזה היא לא לחסל כל נקודת כשל יחידה. היא לדעת איפה כל אחת מהן נמצאת, להחליט במכוון אילו מהן מקובלות, ולוודא שכשאחת באמת נופלת אתה מגלה את זה מהתראה ולא מלקוח.\n\nחברה הריצה שכבת web מיותרת בשלושה אזורי זמינות, מאחורי מאזן עומסים, עם סקייל אוטומטי, מהונדס לעילא. כל זה דיבר עם מופע Postgres אחד באזור אחד בלי שכפול, כי ככה זה הוגדר זמנית לפני שנתיים. השרת הפיזי שמתחת לאותו מופע נפל ביום שלישי בבוקר והמוצר היה מושבת לגמרי שעתיים וארבעים דקות בזמן ששחזור מהגיבוי הלילי רץ — מה שגם אמר תשע שעות של אובדן נתונים לכל מה שנכתב מאז התצלום. כל ההנדסה סביב שכבת ה-web הייתה זהירה ולגמרי לא רלוונטית. מסד נתונים מנוהל עם מעבר אוטומטי לגיבוי היה עולה בערך תשעים דולר יותר בחודש.\n\nהתרגיל הזול ביותר כאן לוקח עשר דקות ואפס קוד. תרשום כל רכיב שמסלול הבקשה נוגע בו: DNS, CDN, מאזן עומסים, האפליקציה, מסד הנתונים, הקאש, ספק ההזדהות, ספק התשלומים, שירות המיילים. לכל אחד, תענה מה קורה אם הוא נעלם עכשיו, ואיך היית יודע. התוצאות בדרך כלל לא נוחות ולעיתים קרובות זולות לתיקון — עותק קריאה, אזור שני ל-DNS, מסלול התדרדרות מבוקרת כשהקאש קר. סוכן AI לעולם לא יעלה את זה מעצמו, כי שום דבר מזה לא מופיע בקוד שהוא מסתכל עליו."
 },
 "Technical debt": {
  "en": "Debt is not bad code. It is a conscious decision to move fast now and pay later, which is frequently the correct decision, because a perfect system that ships in eighteen months earns nothing and teaches you nothing. The hardcoded value, the copy-pasted function, the missing test on a path you are about to replace anyway — all of these are reasonable trades. Debt becomes dangerous at the moment it stops being a decision and becomes the accumulated residue of decisions nobody remembers making. The interest is not paid in guilt; it is paid in the extra hours every future change costs, and that number compounds quietly.\n\nA team shipped a billing feature in four days by hardcoding three pricing tiers across eleven files. Two months later, adding a fourth tier meant finding all eleven — they found nine. Two customers were billed on the wrong tier for five weeks, which was found by a customer and not by them, and the cleanup took nine days. The original shortcut saved perhaps two days. Contrast that with a different shortcut by the same team: skipping an admin UI and editing a config file by hand for the first year. That debt cost nothing, because it was isolated in one place, touched nobody else's work, and was replaced in an afternoon when it finally mattered.\n\nAI changes the arithmetic. Generating two thousand lines of plausible code takes a minute and reading them takes an hour, so debt now accumulates faster than anyone's capacity to review it. The practical defence is to refuse to merge what you cannot read, and to notice the specific smell of agent debt: the same logic implemented three slightly different ways in three files, because each generation started fresh. Deleting code is still the only real repayment. Ask what can be removed before asking what should be added — the fastest way to pay down debt is to have less code to owe it on.",
  "he": "חוב טכני הוא לא קוד גרוע. הוא החלטה מודעת לזוז מהר עכשיו ולשלם אחר כך, וזו לעיתים קרובות ההחלטה הנכונה, כי מערכת מושלמת שיוצאת בעוד שמונה עשר חודשים לא מרוויחה כלום ולא מלמדת אותך כלום. הערך הקשיח בקוד, הפונקציה שהועתקה, הבדיקה החסרה על מסלול שאתה ממילא עומד להחליף — כל אלה עסקאות סבירות. החוב הופך למסוכן ברגע שהוא מפסיק להיות החלטה והופך למשקע מצטבר של החלטות שאף אחד לא זוכר שקיבל. הריבית לא משולמת באשמה; היא משולמת בשעות הנוספות שכל שינוי עתידי עולה, והמספר הזה מצטבר בשקט.\n\nצוות שחרר פיצ׳ר חיוב בארבעה ימים על ידי הטמעה קשיחה של שלוש רמות תמחור באחד עשר קבצים. חודשיים אחר כך, הוספת רמה רביעית דרשה למצוא את כל אחד עשר — הם מצאו תשעה. שני לקוחות חויבו ברמה הלא נכונה במשך חמישה שבועות, מה שהתגלה על ידי לקוח ולא על ידם, והניקוי לקח תשעה ימים. קיצור הדרך המקורי חסך אולי יומיים. תשווה את זה לקיצור דרך אחר של אותו צוות: לוותר על ממשק ניהול ולערוך קובץ קונפיגורציה ידנית בשנה הראשונה. החוב הזה לא עלה כלום, כי הוא היה מבודד במקום אחד, לא נגע בעבודה של אף אחד אחר, והוחלף תוך אחר צהריים כשזה סוף סוף היה חשוב.\n\nAI משנה את החשבון. לייצר אלפיים שורות של קוד משכנע לוקח דקה ולקרוא אותן לוקח שעה, אז חוב מצטבר עכשיו מהר יותר מהיכולת של מישהו לסקור אותו. ההגנה המעשית היא לסרב למזג מה שאתה לא מצליח לקרוא, ולזהות את הריח הספציפי של חוב מסוכן: אותה לוגיקה ממומשת בשלוש דרכים קצת שונות בשלושה קבצים, כי כל ייצור התחיל מאפס. מחיקת קוד היא עדיין הפירעון האמיתי היחיד. תשאל מה אפשר להוריד לפני שאתה שואל מה להוסיף — הדרך המהירה ביותר להחזיר חוב היא שיהיה פחות קוד שחייבים עליו."
 },
 "Pull request & code review": {
  "en": "A review is not quality control at the end, it is the moment a change stops being one person's private understanding. The comments are usually less valuable than the fact that a second person had to be able to follow it.\n\nWhat you look for is narrow and learnable: something deleted that nobody asked to delete, a new dependency, a changed default, a rule enforced in the wrong layer. Those four account for most of what slips through.",
  "he": "סקירה היא לא בקרת איכות בסוף, היא הרגע שבו שינוי מפסיק להיות ההבנה הפרטית של אדם אחד. ההערות בדרך כלל פחות בעלות ערך מהעובדה שאדם שני היה צריך להיות מסוגל לעקוב.\n\nמה שמחפשים הוא צר וניתן ללמידה: משהו שנמחק שאף אחד לא ביקש למחוק, תלות חדשה, ברירת מחדל שהשתנתה, וחוק שנאכף בשכבה הלא נכונה. ארבעת אלה אחראים לרוב מה שמחליק פנימה."
 },
 "Webhook": {
  "en": "A webhook inverts the usual direction, and inherits three problems as a result. The sender cannot be sure you received it, so it will retry — meaning you will get duplicates. Anyone can POST to a public URL, so you must verify a signature. And the sender will time out if you are slow, so you acknowledge immediately and do the work afterwards.\n\nAccept, verify, deduplicate by event id, return 200, then process. That order is the whole pattern, and it ties directly to idempotency in the Scale module.",
  "he": "Webhook הופך את הכיוון הרגיל, ויורש שלוש בעיות כתוצאה מכך. השולח לא יכול להיות בטוח שקיבלת, אז הוא ינסה שוב — כלומר תקבל כפילויות. כל אחד יכול לשלוח POST לכתובת ציבורית, אז אתה חייב לאמת חתימה. והשולח יעבור פסק זמן אם תהיה איטי, אז מאשרים מיד ועושים את העבודה אחר כך.\n\nלקבל, לאמת, לנכות כפילויות לפי מזהה אירוע, להחזיר 200, ואז לעבד. הסדר הזה הוא כל הדפוס, והוא מתחבר ישירות לאידמפוטנטיות במודול הסקייל."
 },
 "Time, text & money": {
  "en": "Each of these is a case where the obvious representation is wrong. A local timestamp is ambiguous twice a year and meaningless to a reader in another zone. Text stored in the wrong encoding turns into damaged characters that cannot be recovered later. And 0.1 + 0.2 is not 0.3 in binary floating point, which is fine for a temperature and unacceptable for an invoice.\n\nThe fixes are all boring and all decided once: UTC in storage with the zone applied at display time, UTF-8 everywhere end to end, and money as an integer count of the smallest unit. This matters doubly in Hebrew and other non-Latin contexts, where an encoding mistake is immediately visible.",
  "he": "כל אחד מאלה הוא מקרה שבו הייצוג המתבקש שגוי. חותמת זמן מקומית דו-משמעית פעמיים בשנה וחסרת משמעות לקורא באזור אחר. טקסט שנשמר בקידוד שגוי הופך לתווים פגומים שאי אפשר לשחזר. ו-0.1 ועוד 0.2 אינו 0.3 בנקודה צפה בינארית, וזה בסדר לטמפרטורה ובלתי מתקבל על הדעת לחשבונית.\n\nהתיקונים כולם משעממים וכולם מוחלטים פעם אחת: UTC באחסון עם האזור מוחל בתצוגה, UTF-8 בכל מקום מקצה לקצה, וכסף כמספר שלם של היחידה הקטנה ביותר. זה חשוב כפליים בעברית ובהקשרים לא-לטיניים אחרים, שם טעות קידוד נראית מיד."
 },
 "Semantic versioning": {
  "en": "Semantic versioning is a promise, not a mechanism. Nothing forces a maintainer to keep it, and a breaking change released as a patch is a regular occurrence — which is exactly why the lock file matters more than the range you declared.\n\nThe practical consequence for AI-assisted work is specific and measured: models tend to suggest the versions common in their training data, which are older and sometimes carry known vulnerabilities. Check what you were given against the current release and an audit tool before trusting it.",
  "he": "ניהול גרסאות סמנטי הוא הבטחה, לא מנגנון. שום דבר לא מכריח מתחזק לשמור עליה, ושינוי שובר שמשוחרר כ-patch הוא תופעה שגרתית — ובדיוק בגלל זה קובץ ה-lock חשוב יותר מהטווח שהצהרת.\n\nההשלכה המעשית לעבודה עם AI ספציפית ונמדדת: מודלים נוטים להציע את הגרסאות הנפוצות בנתוני האימון שלהם, שהן ישנות יותר ולעיתים נושאות פגיעויות ידועות. תבדוק את מה שקיבלת מול הגרסה הנוכחית ומול כלי ביקורת לפני שאתה סומך עליו."
 },
 "Data structures": {
  "en": "Big-O describes growth; data structures are what you actually change to alter it. Choosing the right shape is almost always cheaper than optimising the wrong one.\n\nFour cover nearly everything you will meet: an array when order matters and you mostly iterate; a map when you look things up by a key; a set when you only care whether something is present; a queue when order of processing matters. The single most common real-world fix is replacing a repeated search through a list with one lookup in a map.",
  "he": "Big-O מתאר גדילה; מבני נתונים הם מה שבאמת משנים כדי לשנות אותה. בחירת הצורה הנכונה כמעט תמיד זולה יותר מאופטימיזציה של הלא נכונה.\n\nארבעה מכסים כמעט כל מה שתפגוש: מערך כשהסדר חשוב ובעיקר עוברים על הכל; מפה כשמחפשים לפי מפתח; סט כשרק חשוב אם משהו קיים; תור כשסדר העיבוד חשוב. התיקון הנפוץ ביותר בעולם האמיתי הוא החלפת חיפוש חוזר ברשימה בחיפוש אחד במפה."
 },
 "XSS & CSRF": {
  "en": "Both are the injection idea again, aimed at the browser. XSS is data being treated as code: user content rendered into a page without escaping, so a script tag inside a username executes for every visitor. CSRF is a request being treated as intentional: because the browser attaches your cookies automatically, a form on another site can act as you.\n\nThe defences are unglamorous and largely automatic if you let the framework do them: render through templating that escapes by default rather than inserting raw HTML, set cookies SameSite, require a token on state-changing requests, and add the standard security headers including a content security policy. Research in 2026 measured AI-generated code failing XSS defences in the large majority of cases and shipping with no CSRF protection at all — so this is exactly the category to check by hand.",
  "he": "שניהם הם שוב רעיון ההזרקה, מכוון לדפדפן. XSS הוא נתונים שמטופלים כקוד: תוכן משתמש שמוצג בדף בלי בריחה, כך שתגית סקריפט בתוך שם משתמש מתבצעת לכל מבקר. CSRF הוא בקשה שמטופלת ככוונה: מכיוון שהדפדפן מצרף את העוגיות שלך אוטומטית, טופס באתר אחר יכול לפעול בשמך.\n\nההגנות לא זוהרות והן ברובן אוטומטיות אם נותנים לפריימוורק לעשות אותן: להציג דרך תבניות שבורחות כברירת מחדל ולא להכניס HTML גולמי, להגדיר עוגיות כ-SameSite, לדרוש טוקן בבקשות שמשנות מצב, ולהוסיף את כותרות האבטחה הסטנדרטיות כולל מדיניות אבטחת תוכן. מחקר ב-2026 מדד שקוד שנוצר על ידי AI נכשל בהגנות XSS ברוב המקרים ומשוחרר בלי שום הגנת CSRF — אז זו בדיוק הקטגוריה לבדוק ידנית."
 },
 "Vibe coding vs vibe engineering": {
  "en": "The distinction is about review, not about who typed the characters. A codebase where a model wrote every line but a person read, tested and understood all of it is an ordinary engineered system. A codebase with ten hand-written lines nobody checked is not.\n\nWhat follows from that is unglamorous, and it is what practitioners writing about this in 2025 and 2026 consistently report: the things that make an assistant effective are a real test suite, planning before generating, documentation a model can read, small disciplined commits, automated checks in CI, and a review habit. Prompting technique is a small part of it. Most of the work is making your project a place where an agent can be checked.",
  "he": "ההבחנה עוסקת בסקירה, לא במי הקליד את התווים. בסיס קוד שבו מודל כתב כל שורה אבל אדם קרא, בדק והבין את כולה הוא מערכת מהונדסת רגילה. בסיס קוד עם עשר שורות שנכתבו ביד ואף אחד לא בדק אינו.\n\nמה שנובע מזה לא זוהר, וזה מה שמי שכותב על הנושא ב-2025 וב-2026 מדווח בעקביות: הדברים שהופכים עוזר ליעיל הם חבילת בדיקות אמיתית, תכנון לפני ייצור, תיעוד שמודל יכול לקרוא, קומיטים קטנים ומשמעתיים, בדיקות אוטומטיות ב-CI, והרגל סקירה. טכניקת פרומפטים היא חלק קטן מזה. רוב העבודה היא להפוך את הפרויקט למקום שבו אפשר לבדוק סוכן."
 },
 "AGENTS.md": {
  "en": "Everything you find yourself repeating in a chat belongs in a file instead. A convention emerged in 2025 and 2026 around a plain Markdown file at the repo root, read automatically by most coding assistants, holding the context that never changes between sessions.\n\nThe sections that earn their place: what this project is in two sentences, the stack and versions, the exact commands to install, run and test, the code conventions you actually enforce, and an explicit list of things not to change. Keep it short enough that it is worth including in every request — it competes for the same context window as your actual question.",
  "he": "כל מה שאתה מוצא את עצמך חוזר עליו בצ׳אט שייך לקובץ במקום. מוסכמה התגבשה ב-2025 וב-2026 סביב קובץ Markdown פשוט בשורש הריפו, שנקרא אוטומטית על ידי רוב עוזרי הקוד, ומחזיק את ההקשר שלא משתנה בין שיחות.\n\nהסעיפים שמצדיקים את מקומם: מה הפרויקט הזה בשני משפטים, הסטאק והגרסאות, הפקודות המדויקות להתקנה, הרצה ובדיקה, מוסכמות הקוד שאתה באמת אוכף, ורשימה מפורשת של דברים שלא לשנות. שמור אותו קצר מספיק כדי שיהיה שווה לכלול בכל בקשה — הוא מתחרה על אותו חלון הקשר כמו השאלה עצמה."
 },
 "DevTools": {
  "en": "DevTools is the difference between guessing and knowing. It turns the browser from a black box that either works or does not into something you can inspect, pause and interrogate.\n\nFive panels cover almost everything. Elements is the live page structure and styles. Console shows errors and lets you run code. Network shows every request and its real headers and timing. Application shows cookies and storage. Sources lets you pause execution and look at variables mid-flight. Learning where those five live is an afternoon; not knowing them costs you years of guessing.",
  "he": "כלי הפיתוח הם ההבדל בין לנחש לבין לדעת. הם הופכים את הדפדפן מקופסה שחורה שעובדת או לא, למשהו שאפשר לבדוק, לעצור ולחקור.\n\nחמישה פאנלים מכסים כמעט הכל. Elements הוא מבנה הדף והסגנונות החיים. Console מציג שגיאות ומאפשר להריץ קוד. Network מציג כל בקשה עם הכותרות והתזמונים האמיתיים שלה. Application מציג עוגיות ואחסון. Sources מאפשר לעצור את הריצה ולהסתכל על משתנים באמצע. ללמוד איפה חמשת אלה יושבים זה צהריים אחד; לא להכיר אותם עולה לך שנים של ניחושים."
 },
 "The Network tab": {
  "en": "When a page misbehaves, the first question is always the same: did the request go out, and what came back. Network answers both, and it answers them with the truth rather than with what your code believes it sent.\n\nIt is also where a surprising amount of the rest of this course becomes visible at once. You can see the status code, the Authorization header that is or is not attached, the Cache-Control that explains why your change did nothing, the CORS failure, the payload that is empty because you sent it on a GET, and the 900ms that is all waiting rather than downloading.",
  "he": "כשדף מתנהג לא כשורה, השאלה הראשונה תמיד זהה: האם הבקשה יצאה, ומה חזר. Network עונה על שתיהן, והוא עונה עם האמת ולא עם מה שהקוד שלך מאמין ששלח.\n\nזה גם המקום שבו כמות מפתיעה משאר הקורס הופכת לנראית בבת אחת. אפשר לראות את קוד הסטטוס, את כותרת ה-Authorization שמצורפת או לא, את ה-Cache-Control שמסביר למה השינוי שלך לא עשה כלום, את כשל ה-CORS, את הגוף שריק כי שלחת אותו ב-GET, ואת 900 המילישניות שהן כולן המתנה ולא הורדה."
 },
 "Console & breakpoints": {
  "en": "The console is the fastest feedback loop that exists in web development: you can reach into the running page, call a function, inspect an object and try a fix without editing a file or reloading.\n\nBreakpoints are the step up from logging. Instead of deciding in advance which values you want printed, you stop time and look at all of them — including the call stack that shows you how execution arrived there. The one worth knowing beyond the basics is the conditional breakpoint: pause only when the id equals the one customer whose order is broken, rather than on all ten thousand.",
  "he": "הקונסול הוא לולאת המשוב המהירה ביותר שקיימת בפיתוח ווב: אפשר להושיט יד לדף הרץ, לקרוא לפונקציה, לבדוק אובייקט ולנסות תיקון בלי לערוך קובץ או לרענן.\n\nנקודות עצירה הן המדרגה מעל תיעוד. במקום להחליט מראש אילו ערכים אתה רוצה להדפיס, אתה עוצר את הזמן ומסתכל על כולם — כולל מחסנית הקריאות שמראה לך איך הריצה הגיעה לשם. זו ששווה להכיר מעבר לבסיס היא נקודת עצירה מותנית: לעצור רק כשהמזהה שווה ללקוח היחיד שההזמנה שלו שבורה, ולא בכל עשרת אלפים."
 },
 "Test": {
  "en": "A test is an executable claim about behaviour. Its value is not that it proves your code is correct — it cannot — but that it detects the moment the behaviour changes without your intent.\n\nThat makes tests a change-safety tool more than a correctness tool. The question to ask of a test is not does this check something, it is would this have caught the mistake I am most afraid of.",
  "he": "בדיקה היא טענה ברת-הרצה על התנהגות. הערך שלה הוא לא שהיא מוכיחה שהקוד נכון — היא לא יכולה — אלא שהיא מזהה את הרגע שבו ההתנהגות משתנה בלי כוונה שלך.\n\nזה הופך בדיקות לכלי בטיחות לשינויים יותר מאשר לכלי נכונות. השאלה שצריך לשאול על בדיקה היא לא האם היא בודקת משהו, אלא האם היא הייתה תופסת את הטעות שאני הכי חושש ממנה."
 },
 "Assertion": {
  "en": "The assertion is where all the meaning lives. Everything around it — setup, fixtures, helpers — exists only to make that one line possible.\n\nThe common weakness is asserting something trivially true: that a response arrived, that a list is an array, that no exception was thrown. Those pass whether or not the logic is right. Assert the thing you would actually be upset about.",
  "he": "הטענה היא המקום שבו כל המשמעות נמצאת. כל מה שסביבה — הכנה, נתוני פתיחה, פונקציות עזר — קיים רק כדי לאפשר את השורה האחת הזו.\n\nהחולשה הנפוצה היא לטעון משהו נכון טריוויאלית: שתגובה הגיעה, שרשימה היא מערך, שלא נזרקה שגיאה. אלה עוברות בין אם הלוגיקה נכונה ובין אם לא. תטען את הדבר שבאמת היית מתעצבן עליו."
 },
 "Unit / Integration / E2E": {
  "en": "There is a trade-off along the whole range: the more realistic a test is, the slower it runs and the vaguer its failure message. A unit test tells you exactly which function is wrong; an end-to-end test tells you the checkout is broken somewhere.\n\nSo the shape most teams converge on is many fast tests, some integration tests around the risky boundaries, and a small number of end-to-end tests covering only the paths that generate revenue or lose data.",
  "he": "יש התלבטות לאורך כל הטווח: ככל שבדיקה מציאותית יותר, כך היא רצה לאט יותר והודעת הכשל שלה מעורפלת יותר. בדיקת יחידה אומרת לך בדיוק איזו פונקציה שגויה; בדיקת קצה לקצה אומרת לך שהתשלום שבור איפשהו.\n\nאז הצורה שרוב הצוותים מתכנסים אליה היא הרבה בדיקות מהירות, כמה בדיקות אינטגרציה סביב הגבולות המסוכנים, ומספר קטן של בדיקות קצה לקצה שמכסות רק את המסלולים שמייצרים הכנסה או מאבדים נתונים."
 },
 "Mock / Fixture": {
  "en": "A mock replaces reality with your assumption about reality. When the assumption is right it saves enormous time; when it drifts from the real service, the suite goes green while production fails.\n\nThe rule of thumb: mock things you do not control and cannot run — payment providers, email, third-party APIs. Run the real thing for anything you own, especially the database, because most interesting bugs live exactly at that boundary.",
  "he": "מוק מחליף את המציאות בהנחה שלך לגבי המציאות. כשההנחה נכונה הוא חוסך זמן עצום; כשהיא נסחפת מהשירות האמיתי, חבילת הבדיקות ירוקה בזמן שהפרודקשן נכשל.\n\nכלל אצבע: תזייף דברים שאתה לא שולט בהם ולא יכול להריץ — ספקי תשלום, מייל, ממשקים חיצוניים. תריץ את האמיתי לכל מה שבבעלותך, במיוחד מסד הנתונים, כי רוב הבאגים המעניינים חיים בדיוק בגבול הזה."
 },
 "Regression": {
  "en": "Bugs cluster. The code that broke once is unusually likely to break again, because it is the code where the requirements were misunderstood in the first place.\n\nThat is why the fix-plus-test pattern compounds. Over time your suite becomes a precise record of everything your particular system has actually got wrong, which is far more valuable than a generic set of tests someone wrote from the specification.",
  "he": "באגים מתקבצים. קוד שנשבר פעם אחת נוטה במיוחד להישבר שוב, כי זה הקוד שבו הדרישות לא הובנו מלכתחילה.\n\nבגלל זה דפוס תיקון-ועוד-בדיקה מצטבר. עם הזמן חבילת הבדיקות שלך הופכת לתיעוד מדויק של כל מה שהמערכת הספציפית שלך באמת טעתה בו, וזה הרבה יותר בעל ערך מאוסף בדיקות גנרי שמישהו כתב מהמפרט."
 },
 "Coverage": {
  "en": "Coverage is a map of what your tests visited, and it is genuinely useful read that way: a critical file at zero percent is a real finding.\n\nIt becomes harmful the moment it becomes a target. A team required to hit a number will write tests that execute lines without checking anything, and end up with a slower suite that provides exactly as much safety as before.",
  "he": "כיסוי הוא מפה של מה שהבדיקות שלך ביקרו בו, ובקריאה הזו הוא באמת מועיל: קובץ קריטי באפס אחוז הוא ממצא אמיתי.\n\nהוא הופך למזיק ברגע שהוא הופך ליעד. צוות שמחויב להגיע למספר יכתוב בדיקות שמריצות שורות בלי לבדוק כלום, ויסיים עם חבילה איטית יותר שנותנת בדיוק את אותה בטיחות כמו קודם."
 },
 "Flaky test": {
  "en": "Flakiness is almost never randomness. It is an unstated dependency on time, on execution order, or on state left behind by another test — which means it is usually a real bug in disguise, one that will eventually appear in production as a race condition.\n\nThe damage is cultural as much as technical. Once people learn that red sometimes means nothing, red always means nothing, and the suite has stopped working even though it still runs.",
  "he": "הפכפכות היא כמעט אף פעם לא אקראיות. זו תלות לא מוצהרת בזמן, בסדר ההרצה, או במצב שבדיקה אחרת השאירה — כלומר בדרך כלל זה באג אמיתי בתחפושת, כזה שיופיע בסוף בפרודקשן כמצב מירוץ.\n\nהנזק תרבותי לא פחות מטכני. ברגע שאנשים לומדים שאדום לפעמים לא אומר כלום, אדום תמיד לא אומר כלום, והחבילה הפסיקה לעבוד למרות שהיא עדיין רצה."
 },
 "Test-first (TDD)": {
  "en": "Writing the test first forces you to state the problem before solving it, in terms of observable behaviour rather than implementation. That alone catches a surprising number of misunderstandings while they are still free to fix.\n\nWith a model in the loop it becomes something stronger. The failing test is an unambiguous specification you can hand over, and an objective check on what comes back — you are no longer judging generated code by whether it looks reasonable.",
  "he": "כתיבת הבדיקה קודם מכריחה אותך לנסח את הבעיה לפני שאתה פותר אותה, במונחי התנהגות נצפית ולא מימוש. זה לבדו תופס מספר מפתיע של אי-הבנות בזמן שעדיין חינם לתקן אותן.\n\nעם מודל בתמונה זה הופך למשהו חזק יותר. הבדיקה שנכשלת היא מפרט חד-משמעי שאפשר למסור, ובדיקה אובייקטיבית על מה שחוזר — אתה כבר לא שופט קוד שנוצר לפי האם הוא נראה סביר."
 },
 "Context window": {
  "en": "A model has no memory between messages other than what is placed in front of it. A long conversation is re-read from the start every single turn, and when it no longer fits, the oldest parts fall away silently.\n\nThis explains most mysterious behaviour. A rule you established twenty messages ago stops being followed not because the model changed its mind, but because that rule is no longer in the room. Restating the important constraints, or starting fresh with a tight summary, fixes more than rephrasing ever will.",
